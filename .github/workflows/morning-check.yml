name: 朝出勤確認 LINE通知

on:
  schedule:
    # JST 07:00 = UTC 22:00 (前日)
    - cron: "55 20 * * *"
  workflow_dispatch:
    inputs:
      testNotify:
        description: "テスト通知を強制送信する（チェックON = 未確認施設に関わらず通知）"
        required: false
        default: false
        type: boolean

jobs:
  morning-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run morning-check
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_ID: ${{ secrets.LINE_TO_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          TEST_NOTIFY: ${{ github.event.inputs.testNotify || 'false' }}
        run: node scripts/morning-check.js

name: 朝出勤確認 LINE通知

on:
  schedule:
    # JST 06:00 = UTC 21:00 (前日)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      testNotify:
        description: "テスト通知を強制送信する（Firebase スキップ）"
        required: false
        default: false
        type: boolean
      targetDate:
        description: "判定対象日 yyyy-mm-dd（空欄 = JST 今日）"
        required: false
        default: ""
        type: string
      dryRun:
        description: "dryRun=true にすると LINE 送信せず判定ログだけ出す"
        required: false
        default: false
        type: boolean

jobs:
  morning-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run morning-check
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_ID: ${{ secrets.LINE_TO_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          TEST_NOTIFY: ${{ github.event.inputs.testNotify || 'false' }}
          TARGET_DATE: ${{ github.event.inputs.targetDate || '' }}
          DRY_RUN: ${{ github.event.inputs.dryRun || 'false' }}
        run: node scripts/morning-check.js

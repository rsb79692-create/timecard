name: 通知確認 LINE通知

on:
  workflow_dispatch:
    inputs:
      testNotify:
        description: "テスト通知を強制送信する（Firebase スキップ）"
        required: false
        default: false
        type: boolean
      dryRun:
        description: "dryRun=true にすると LINE 送信せず判定ログだけ出す"
        required: false
        default: false
        type: boolean

jobs:
  notify-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run notify-check
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_ID: ${{ secrets.LINE_TO_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          TEST_NOTIFY: ${{ github.event.inputs.testNotify || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dryRun || 'false' }}
        run: node scripts/notify-check.js

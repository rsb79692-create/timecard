    }).map(function(s){
      var open=!!mileage.autoOpen[s.employeeId];
      // ★ 確定は止めないが不審な日（打刻の後編集・複数出勤・退勤漏れ）も絞り込みに含める。
      //   展開しないと気づけない位置にあると、確認したことにならない。
      var shown=s.rows.filter(function(r){return onlyIssues?(mileageAutoIsBlocking(r.status)||r.attention):true;});
      var dayHtml=open
        ?(shown.length?shown.map(function(r){
            var bl=mileageAutoIsBlocking(r.status);
            return '<div style="border-top:1px solid #e2e8f0;padding:6px 0;">'
              +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">'
              +'<span style="font-size:.8rem;font-weight:700;">'+esc(r.date)+'</span>'
              +(MILEAGE_AUTO_BADGE[r.status]||"")
              +'<span style="font-size:.8rem;font-weight:700;color:'+(bl?"#b91c1c":"#1e40af")+';margin-left:auto;">'+(bl?"—":(Number(r.km)+" km"))+'</span>'
              +'</div>'
              +(r.routeText?'<div style="font-size:.75rem;color:#475569;margin-top:2px;word-break:break-word;">'+esc(r.routeText)+'</div>':"")
              +((r.missingLegs||[]).length
                ?'<div style="font-size:.72rem;color:#b91c1c;margin-top:2px;">距離未登録の区間：'
                  +esc(r.missingLegs.map(function(l){return l.fromName+"→"+l.toName;}).join("、"))+'</div>':"")
              +((r.missingPlaces||[]).length
                ?'<div style="font-size:.72rem;color:#b91c1c;margin-top:2px;">地点マスタに未対応の施設：'+esc(r.missingPlaces.join("、"))+'</div>':"")
              +(bl&&MILEAGE_AUTO_HELP[r.status]?'<div style="font-size:.72rem;color:#92400e;margin-top:2px;">'+esc(MILEAGE_AUTO_HELP[r.status])+'</div>':"")
              +((r.notes||[]).indexOf("multi_shift")>=0?'<div style="font-size:.72rem;color:#64748b;margin-top:2px;">同じ日に出勤が2回以上あります（勤務ごとに起点へ戻して計算）</div>':"")
              +((r.notes||[]).indexOf("route_mismatch")>=0?'<div style="font-size:.72rem;color:#64748b;margin-top:2px;">施設変更の「変更前施設」が直前の施設と一致しません（打刻の後編集の可能性）</div>':"")
              +((r.notes||[]).indexOf("no_clockout")>=0?'<div style="font-size:.72rem;color:#64748b;margin-top:2px;">退勤打刻がありません（帰りの移動は業務ルールどおり起点へ戻して計算）</div>':"")
              +'</div>';
          }).join("")
          :'<div style="font-size:.76rem;color:#8496a7;padding:6px 0;">表示する日がありません</div>')
        :"";
      return '<div style="border:1px solid '+(s.blockers.length?"#fecaca":"#e2e8f0")+';border-radius:6px;padding:8px 10px;margin-bottom:6px;background:'+(s.blockers.length?"#fff7f7":"#fff")+';">'
        +'<div onclick="mileageAutoToggle(\''+escJs(s.employeeId)+'\')" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;">'
        +'<span style="font-size:.86rem;font-weight:700;color:#0f172a;">'+esc(s.staffName||"（氏名未解決）")+'<span style="font-size:.72rem;font-weight:400;color:#8496a7;margin-left:6px;">'+esc(s.employeeId)+'</span></span>'
        +(s.blockers.length?'<span style="background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:3px;">要確認 '+s.blockers.length+'日</span>':"")
        +(!s.autoTarget?'<span style="background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:3px;">自動集計OFF</span>':"")
        +'<span style="font-size:.82rem;font-weight:700;color:#1e40af;margin-left:auto;">'+s.totalKm+' km</span>'
        +'<span style="font-size:.75rem;color:#64748b;">'+(open?"▲":"▼")+'</span>'
        +'</div>'
        +(!s.nameResolved&&s.autoTarget
          ?'<div style="font-size:.72rem;color:#b91c1c;margin-top:3px;">氏名が登録されていないため打刻と突き合わせできません。「利用職員」タブで登録し直してください。</div>':"")
        +dayHtml+'</div>';
    }).join("");

    var chk=mileage.checkData;
    var chkFresh=chk&&chk.ym===mileage.adminYm;
    body='<div class="admin-card">'
      +'<div class="admin-title">自動集計（'+esc(mileageYmLabel(mileage.adminYm))+'）</div>'
      +'<div style="font-size:.76rem;color:#64748b;margin-bottom:8px;line-height:1.6;">'
      +'応援（施設変更）の打刻から、その日の起点施設 → 応援先（時系列） → 起点施設 の順で経路を作り、区間距離を合計しています。'
      +'職員の申請操作は不要です。<b>要確認</b>の日は距離も金額も確定しません。</div>'
      +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;">'
      +'<label style="font-size:.8rem;color:#475569;display:flex;align-items:center;gap:5px;cursor:pointer;">'
      +'<input type="checkbox" '+(onlyIssues?"checked ":"")+'onchange="mileageAutoSetOnlyIssues(this.checked)">要確認の日だけ表示</label>'
      +'<button onclick="mileageAutoCheckRun()" style="background:#f1f5f9;color:#1e40af;border:1px solid #cbd5e1;border-radius:2px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;">'
      +(mileage.checkLoading?"確認中…":"サーバで再集計して確認")+'</button>'
      +'</div>'
      +(!records.length
        ?'<div style="background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:4px;padding:8px 12px;font-size:.82rem;font-weight:700;margin-bottom:8px;">打刻データを読み込めていません。この画面の集計は正しくありません（画面を再読み込みしてください）。</div>':"")
      +(agg.unresolved
        ?'<div style="background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:4px;padding:8px 12px;font-size:.82rem;font-weight:700;margin-bottom:8px;">要確認が '+agg.unresolved+' 件あります。解消するまでこの月は確定できません。</div>'
        :'<div style="background:#dcfce7;color:#166534;border:1px solid #86efac;border-radius:4px;padding:8px 12px;font-size:.82rem;font-weight:700;margin-bottom:8px;">要確認はありません。</div>')
      +(agg.missingFacilities.length
        ?'<div style="background:#fef3c7;color:#92400e;border:1px solid #fde68a;border-radius:4px;padding:8px 12px;font-size:.8rem;margin-bottom:8px;">'
          +'地点マスタに対応づけられていない施設があります：<b>'+esc(agg.missingFacilities.join("、"))+'</b><br>'
          +'「地点・区間距離」タブで、その施設に対応する地点の<b>打刻の施設</b>を設定してください。</div>':"")
      +(chkFresh&&chk.punchUnavailable
        ?'<div style="background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:4px;padding:8px 12px;font-size:.82rem;font-weight:700;margin-bottom:8px;">サーバが打刻データを1件も読み取れませんでした。「移動が無い月」と区別できないため、この月は確定できません。</div>':"")
      +(chkFresh&&chk.closed&&(chk.drift||[]).length
        ?'<div style="background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:4px;padding:8px 12px;font-size:.8rem;margin-bottom:8px;">'
          +'<b>確定後差異あり</b>（確定したあとに打刻が変わっています。金額は自動では変わりません）<br>'
          +chk.drift.map(function(x){
            return esc(x.staffName||x.employeeId)+'：'+(x.unknown?'日別内訳の無い旧方式の確定のため判定できません'
              :(mileageRound1(x.beforeKm)+' km → '+mileageRound1(x.afterKm)+' km（'+esc((x.days||[]).map(function(y){return y.date;}).join("、"))+'）'));
          }).join("<br>")
          +'</div>':"")
      // ★ 再集計の結果は「差異あり」のときだけでなく、実行したら必ず出す。
      //   何も出ないと「押しても効かない」のか「確認できて差異が無い」のか区別できず、
      //   確定後差異の唯一の検知手段を、確認したつもりで見落とす経路になる。
      //   件数が残っているのに緑で出すと直上の赤バナーと矛盾するため、色も件数で切り替える。
      +(chkFresh&&!(chk.closed&&(chk.drift||[]).length)
        ?'<div style="font-size:.76rem;color:'+(Number(chk.unresolved)>0?"#b91c1c":"#166534")+';margin-bottom:8px;">'
          +'サーバ側の再集計：'+(chk.closed?'確定後の差異はありません。':'要確認 '+Number(chk.unresolved)+' 件')+'</div>':"")
      +(cards||'<div class="empty">対象の職員がいません</div>')
      +'</div>';
  }

  // ── 申請の承認 ──
  if(T==="requests"){
    var rows=(d&&d.byStaff||[]).map(function(st){
      var reqs=st.requests.map(function(r){
        var act=closed?'<span style="font-size:.72rem;color:#94a3b8;">確定済み</span>'
          :(r.status==="pending"
            ?'<span style="display:flex;gap:6px;">'
              +'<button onclick="mileageApprove(\''+escJs(st.employeeId)+'\',\''+escJs(r.id)+'\')" style="background:#dcfce7;color:#166534;border:1px solid #86efac;border-radius:2px;padding:4px 10px;font-size:.74rem;font-weight:700;cursor:pointer;font-family:inherit;">承認</button>'
              +'<button onclick="mileageReject(\''+escJs(st.employeeId)+'\',\''+escJs(r.id)+'\')" style="background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:2px;padding:4px 10px;font-size:.74rem;font-weight:700;cursor:pointer;font-family:inherit;">却下</button>'
              +'</span>'
            :'<button onclick="mileageReopenReq(\''+escJs(st.employeeId)+'\',\''+escJs(r.id)+'\')" style="background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;border-radius:2px;padding:4px 10px;font-size:.74rem;font-weight:700;cursor:pointer;font-family:inherit;">取消（未処理へ）</button>');
        return '<div style="border-top:1px solid #e2e8f0;padding:7px 0;">'
          +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">'
          +'<span style="font-size:.82rem;font-weight:700;">'+esc(r.date)+'</span>'
          +(MILEAGE_STATUS_BADGE[r.status]||"")
          +'<span style="font-size:.82rem;font-weight:700;color:#1e40af;margin-left:auto;">'+Number(r.totalKm)+' km</span>'
          +act+'</div>'
          +'<div style="font-size:.76rem;color:#475569;margin-top:2px;word-break:break-word;">'+esc(mileageRouteText(r))+'</div>'
          +(r.note?'<div style="font-size:.72rem;color:#8496a7;margin-top:2px;">備考：'+esc(r.note)+'</div>':"")
          +(r.status==="rejected"&&r.rejectReason?'<div style="font-size:.72rem;color:#b91c1c;margin-top:2px;">却下理由：'+esc(r.rejectReason)+'</div>':"")
          +'</div>';
      }).join("");
      return '<div class="admin-card" style="margin-bottom:10px;">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">'
        +'<span style="font-size:.92rem;font-weight:900;">'+esc(st.staffName||st.employeeId)+'<span style="font-size:.72rem;color:#8496a7;font-weight:400;margin-left:6px;">'+esc(st.employeeId)+'</span></span>'
        +'<span style="font-size:.8rem;color:#166534;font-weight:700;">承認済み '+st.approvedKm+' km</span>'
        +(st.pendingCount&&!closed
          ?'<button onclick="mileageApproveAll(\''+escJs(st.employeeId)+'\')" style="background:#1e40af;color:#fff;border:none;border-radius:2px;padding:5px 12px;font-size:.76rem;font-weight:700;cursor:pointer;font-family:inherit;">未処理'+st.pendingCount+'件をまとめて承認</button>'
          :'')
        +'</div>'+reqs+'</div>';
    }).join("");
    body=(mileage.adminLoading?'<div style="font-size:.85rem;color:#8496a7;padding:6px 2px;">読み込み中…</div>'
      :(rows||'<div class="admin-card"><div class="empty">この月の申請はありません</div></div>'));
  }

  // ── 地点・区間距離 ──
  if(T==="places"){
    // ★ 「打刻の施設」の表示は、集計が実際に使う対応表そのものから出す。
    //   表示側で条件を書き直すと必ずズレる（実際、地点名だけで判定していたため
    //   他地点が明示保持している施設名でも「（地点名が一致）」と出し続けていた）。
    var pmapNow=mileageAutoPlaceMap(mileage.places);
    var placeRows=mileage.places.length?mileage.places.map(function(p){
      return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #e2e8f0;">'
        +'<span style="font-size:.72rem;color:#94a3b8;width:32px;flex:0 0 auto;">'+(p.order||"")+'</span>'
        +'<span style="flex:1;font-size:.88rem;font-weight:700;min-width:0;word-break:break-word;">'+esc(p.name)
        // ★ 表示は判定（mileageAutoFacilitiesOf）と同じ根拠から出す。
        //   facilities が非空のときは地点名フォールバックが効かないため、
        //   「（地点名が一致）」を出すと嘘になる（対応していない施設を対応中と表示してしまう）。
        +(mileageAutoFacilitiesOf(p).length
          ?'<span style="display:block;font-size:.7rem;font-weight:400;color:#64748b;">打刻の施設：'+esc(p.facility||"—")+'</span>'
          // ★ 「地点名が一致」は、地点名が**打刻の施設名として実在し**、かつ対応表が
          //   実際にこの地点を指しているときだけ表示する。placeMap の imp には施設名でない
          //   地点名（本社など）も入るため、対応表だけで判定すると打刻施設でない地点にも出てしまう。
          :(masterLocs.indexOf(p.name)>=0
            ?(mileageAutoHas(pmapNow,p.name)&&pmapNow[p.name]===p.id
              ?'<span style="display:block;font-size:.7rem;font-weight:400;color:#64748b;">打刻の施設：'+esc(p.name)+'（地点名が一致）</span>'
              :'<span style="display:block;font-size:.7rem;font-weight:400;color:#b91c1c;">打刻の施設：対応なし（同じ名前を他の地点が使っています）</span>')
            :''))
        +((p.aliases&&p.aliases.length)?'<span style="display:block;font-size:.7rem;font-weight:400;color:#64748b;">旧施設名：'+esc(p.aliases.join("、"))+'</span>':'')
        +'</span>'
        +'<button onclick="mileageEditPlace(\''+escJs(p.id)+'\')" style="background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;border-radius:2px;padding:4px 10px;font-size:.74rem;font-weight:700;cursor:pointer;font-family:inherit;">編集</button>'
        +'<button onclick="mileageDeletePlace(\''+escJs(p.id)+'\')" style="background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:2px;padding:4px 10px;font-size:.74rem;font-weight:700;cursor:pointer;font-family:inherit;">削除</button>'
        +'</div>';
    }).join(""):'<div class="empty">地点が未登録です</div>';

    var placeOpts=mileage.places.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>';}).join("");
    // 施設マスタにあるが、まだどの地点にも対応づいていない施設（＝取り込み候補）と、
    // 複数の地点が同じ施設名を握っていて集計が未対応になっている施設（＝要修正）
    var linkSt=mileageFacilityLinkState();
    var unlinkedFac=linkSt.unlinked;
    var imp=mileage.importPlan;
    // 距離マトリクス（行=出発地／列=到着地）。方向別が正本なので上下三角を別々に表示する。
    var missingCount=0;
    var matrix="";
    if(mileage.places.length>=2){
      matrix='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">'
        +'<table style="border-collapse:collapse;font-size:.76rem;min-width:100%;">'
        +'<tr><th class="sticky-name-col" style="position:sticky;left:0;z-index:3;background:#f1f5f9;border:1px solid #cbd5e1;padding:7px 8px;white-space:nowrap;box-shadow:2px 0 5px rgba(0,0,0,.08);">出発＼到着</th>'
        +mileage.places.map(function(p){return '<th style="border:1px solid #cbd5e1;background:#f1f5f9;padding:5px 8px;white-space:nowrap;">'+esc(p.name)+'</th>';}).join("")
        +'</tr>'
        +mileage.places.map(function(pf){
          return '<tr><th class="sticky-name-col" style="position:sticky;left:0;z-index:1;background:#f8fafc;border:1px solid #cbd5e1;padding:7px 8px;white-space:nowrap;text-align:left;box-shadow:2px 0 5px rgba(0,0,0,.08);">'+esc(pf.name)+'</th>'
            +mileage.places.map(function(pt){
              if(pf.id===pt.id)return '<td style="border:1px solid #cbd5e1;background:#e2e8f0;padding:5px 8px;text-align:center;color:#94a3b8;">—</td>';
              var key=pf.id+"__"+pt.id;
              var has=Object.prototype.hasOwnProperty.call(mileage.legs,key);
              if(!has)missingCount++;
              return '<td onclick="mileageEditLeg(\''+escJs(pf.id)+'\',\''+escJs(pt.id)+'\')" onmouseover="this.style.outline=\'2px solid #93c5fd\';this.style.outlineOffset=\'-2px\'" onmouseout="this.style.outline=\'\'" style="border:1px solid #cbd5e1;padding:8px;text-align:right;cursor:pointer;white-space:nowrap;background:'+(has?"#fff":"#fef3c7")+';color:'+(has?"#0f172a":"#92400e")+';">'
                +(has?Number(mileage.legs[key]):'未登録')+'</td>';
            }).join("")+'</tr>';
        }).join("")
        +'</table></div>';
    }

    body='<div class="admin-card">'
      +'<div class="admin-title">地点マスタ</div>'
      +'<div style="font-size:.76rem;color:#64748b;margin-bottom:8px;">職員はここに登録された地点から選ぶだけです。地点数に上限はありません。</div>'
      +placeRows
      +'<div style="margin-top:12px;border-top:2px solid #e2e8f0;padding-top:10px;">'
      +'<input type="hidden" id="mlg-place-id" value="">'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">'
      +'<input id="mlg-place-name" type="text" maxlength="40" placeholder="地点名（例：本社）" style="flex:1;min-width:160px;padding:8px;border:1px solid #adb5bd;border-radius:2px;font-size:.88rem;font-family:inherit;">'
      +'<input id="mlg-place-order" type="number" placeholder="並び順" style="width:90px;padding:8px;border:1px solid #adb5bd;border-radius:2px;font-size:.88rem;font-family:inherit;">'
      +'<select id="mlg-place-facility" style="flex:1 1 160px;min-width:0;padding:8px;border:1px solid #adb5bd;border-radius:2px;font-size:.85rem;font-family:inherit;background:#fff;">'
      +'<option value="">打刻の施設と対応づけない</option>'
      +masterLocs.map(function(nm){return '<option value="'+esc(nm)+'">'+esc(nm)+'</option>';}).join("")
      // ★ 施設マスタから消えた・改名された施設名も選択肢に残す。
      //   選択肢に無いと編集時に値が黙って空になり、保存した瞬間に対応づけが消える。
      +mileage.places.map(function(p){return String(p.facility||"");})
        .filter(function(nm,i,arr){return nm&&masterLocs.indexOf(nm)<0&&arr.indexOf(nm)===i;})
        .map(function(nm){return '<option value="'+esc(nm)+'">'+esc(nm)+'（施設マスタに無い）</option>';}).join("")
      +'</select>'
      +'<button onclick="mileageSavePlaceFromForm()" style="background:#1e40af;color:#fff;border:none;border-radius:2px;padding:9px 18px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;">保存</button>'
      +'</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;">'
      +'<input id="mlg-place-aliases" type="text" maxlength="200" placeholder="旧施設名（改名前の名前。複数は「、」で区切る）" style="flex:1;min-width:220px;padding:8px;border:1px solid #adb5bd;border-radius:2px;font-size:.85rem;font-family:inherit;">'
      +'</div>'
      +'<div style="font-size:.74rem;color:#64748b;margin-top:5px;">「編集」を押すとこの欄に読み込まれます。新規登録するときは地点名だけ入れて保存してください。<br>'
      +'<b>打刻の施設</b>を選ぶと、応援（施設変更）打刻からの自動集計でこの地点として扱われます。地点名と施設名が完全に同じ場合は、選ばなくても自動で対応します。<br>'
      +'<b>旧施設名</b>は、施設名を変更したときに使います。過去の打刻には<b>変更前の施設名</b>が残るため（打刻は書き換えません）、ここに旧名を入れておくと過去の打刻も同じ地点として集計されます。</div>'
      +'</div>'
      +'<div style="margin-top:10px;border-top:1px dashed #cbd5e1;padding-top:10px;">'
      +(linkSt.conflict.length

async function mileageLoadReport(ym){
  var g=mileage.gen;
  mileage.viewLoading=true;mileage.viewTried=true;mileage.viewYm=ym||"";
  var res=await mileageApi("monthlyReport",{ym:ym||"",withDetail:true});
  if(mileageStale(g))return;
  if(mileage.viewYm!==(ym||""))return;   // 読み込み中に月が切り替わったら古い応答は捨てる
  mileage.viewLoading=false;
  if(res.ok&&res.data){
    mileage.viewData=res.data;
    if(Array.isArray(res.data.closedMonths))mileage.viewClosedMonths=res.data.closedMonths;
  }else{
    mileage.viewData=null;
    if(res.status!==0)showAlert(mileageErrText(res));
  }
  if(viewerMode)render();
}
function mileageViewSetYm(v){
  if(!/^\d{4}-\d{2}$/.test(v))return;
  mileage.viewData=null;mileage.viewTried=false;mileageLoadReport(v);
}

}

 *   bootstrap だけ叩き直しても匿名トークンのままなら結果は変わらない。
 */
function mileageViewerRetry(){
  mileage.booted=false;mileage.booting=false;mileage.bootFailed=false;
  mileage.viewTried=false;mileage.viewLoading=false;mileage.viewData=null;

}

  var retryBtn='<button onclick="mileageViewerRetry()" style="margin-top:8px;background:#1e40af;color:#fff;border:none;border-radius:2px;padding:8px 16px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;">再試行</button>';
  if(!mileage.booted)return mileageViewShell(loading);
  // ★ 閲覧用URLの確認（bootstrap）自体に失敗した場合。「未確定」とは明確に区別する。
  if(mileage.bootFailed){
    return mileageViewShell('<div style="font-size:.85rem;color:#b91c1c;font-weight:700;">移動距離のデータを表示できませんでした。</div>'
      +'<div style="font-size:.78rem;color:#64748b;margin-top:4px;">閲覧用URLの確認に失敗しました（通信状態、またはURLの有効期限をご確認ください）。</div>'
      +retryBtn);
  }
  // ★ 一度だけ取得する。失敗しても再スケジュールしない（render→取得→render の無限ループ防止）
  if(!mileage.viewTried&&!mileage.viewLoading){
    setTimeout(function(){mileageLoadReport(mileage.viewYm||"");},0);
    return mileageViewShell(loading);
  }
  if(mileage.viewLoading&&!mileage.viewData)return mileageViewShell(loading);
  if(!mileage.viewData){
    // ★ ここは「通信・権限の失敗」だけ。未確定はサーバが 200 で closed:false を返すため、ここへは来ない。
    return mileageViewShell('<div style="font-size:.85rem;color:#b91c1c;font-weight:700;">データを取得できませんでした。</div>'
      +'<div style="font-size:.78rem;color:#64748b;margin-top:4px;">通信状態をご確認のうえ、再試行してください。</div>'
      +retryBtn);
  }
  // 対象月の候補＝確定済みの月＋当月（当月が未確定でも選べるようにする）。
  // ★ 未確定の月を「選べない」のではなく「未確定と表示する」。取得失敗と区別できるようにするため。
  var closedMonths=mileage.viewClosedMonths||[];
  var months=closedMonths.slice();
  var curYm=mileageThisMonth();
  if(months.indexOf(curYm)<0)months.push(curYm);
  if(mileage.viewYm&&months.indexOf(mileage.viewYm)<0)months.push(mileage.viewYm);
  months.sort();months.reverse();
  if(!mileage.viewYm){
    mileage.viewYm=closedMonths.length?closedMonths[0]:curYm;
    setTimeout(function(){mileageLoadReport(mileage.viewYm);},0);
    return mileageViewShell(loading);
  }
  // ★ 応答が別の月のもの（初回の一覧取得直後など）の間は判定しない。
  //   確定済みの月を一瞬「未確定」と表示してしまうため。
  if(String(mileage.viewData.ym||"")!==mileage.viewYm)return mileageViewShell(loading);
  var rows=(mileage.viewData&&mileage.viewData.rows)||[];
  var sumKm=0,sumYen=0;
  rows.forEach(function(r){sumKm=mileageRound1(sumKm+Number(r.totalKm||0));sumYen+=Number(r.amount||0);});
  var monthSel='<select onchange="mileageViewSetYm(this.value)" style="padding:6px 10px;border:1px solid #adb5bd;border-radius:2px;font-size:.85rem;font-family:inherit;background:#fff;">'
    +months.map(function(m){
      var lbl=mileageYmLabel(m)+(closedMonths.indexOf(m)<0?"（未確定）":"");
      return '<option value="'+esc(m)+'"'+(m===mileage.viewYm?" selected":"")+'>'+esc(lbl)+'</option>';
    }).join("")
    +'</select>';
  var headRow='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;">'
    +'<div style="margin:0;font-size:1rem;font-weight:900;color:#0f172a;">🚗 移動距離（確定済みのみ）</div>'
    +'<div style="display:flex;align-items:center;gap:6px;"><span style="font-size:.78rem;color:#475569;font-weight:700;">対象月</span>'+monthSel+'</div>'
    +'</div>';
  // ★ 未確定の月。API取得は成功しているので「取得できませんでした」と混同させない。
  //   ダウンロードボタンも出さない（確定前の数値を給与データとして持ち出させない）。
  if(mileage.viewData.closed!==true){
    return '<div class="admin-card">'+headRow
      +'<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:12px;">'
      +'<div style="font-size:.9rem;font-weight:800;color:#9a3412;">'+esc(mileageYmLabel(mileage.viewYm))+'の移動距離は未確定です</div>'
      +'<div style="font-size:.78rem;color:#7c2d12;margin-top:6px;line-height:1.6;">管理者が月次確定すると、確定した内容がここに表示され、CSVをダウンロードできるようになります。<br>（未確定の月はダウンロードできません）</div>'
      +'</div></div>';
  }
  var tbl=rows.length
    ?'<div style="overflow-x:auto;border:1px solid #cbd5e1;border-radius:8px;"><table style="border-collapse:collapse;width:100%;font-size:.82rem;min-width:440px;">'
      +'<tr style="background:#f1f5f9;"><th style="border:1px solid #cbd5e1;padding:7px 8px;text-align:left;">社員番号</th><th style="border:1px solid #cbd5e1;padding:7px 8px;text-align:left;">氏名</th><th style="border:1px solid #cbd5e1;padding:7px 8px;text-align:right;">合計距離</th><th style="border:1px solid #cbd5e1;padding:7px 8px;text-align:right;">単価</th><th style="border:1px solid #cbd5e1;padding:7px 8px;text-align:right;">支給額</th></tr>'
      +rows.map(function(r){
        return '<tr><td style="border:1px solid #cbd5e1;padding:8px;">'+esc(r.employeeId)+'</td>'
          +'<td style="border:1px solid #cbd5e1;padding:8px;">'+esc(r.staffName)+'</td>'
          +'<td style="border:1px solid #cbd5e1;padding:8px;text-align:right;">'+mileageRound1(r.totalKm)+' km</td>'
          +'<td style="border:1px solid #cbd5e1;padding:8px;text-align:right;">'+Number(r.ratePerKm)+'</td>'
          +'<td style="border:1px solid #cbd5e1;padding:8px;text-align:right;font-weight:700;">'+Number(r.amount).toLocaleString()+'</td></tr>';
      }).join("")
      +'<tr style="background:#f8fafc;font-weight:700;"><td colspan="2" style="border:1px solid #cbd5e1;padding:8px;">合計</td>'
      +'<td style="border:1px solid #cbd5e1;padding:8px;text-align:right;">'+sumKm+' km</td><td style="border:1px solid #cbd5e1;padding:8px;"></td>'
      +'<td style="border:1px solid #cbd5e1;padding:8px;text-align:right;">'+sumYen.toLocaleString()+'</td></tr>'
      +'</table></div>'
    :(mileage.viewLoading?'<div style="font-size:.85rem;color:#8496a7;">読み込み中…</div>':'<div class="empty">この月のデータはありません</div>');

  return '<div class="admin-card">'+headRow
    +'<div style="font-size:.76rem;color:#64748b;margin-bottom:8px;">管理者が確定した月だけが表示されます。金額は確定時に保存された値で、あとから単価を変更しても変わりません。</div>'
    +tbl
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">'
    +'<button onclick="mileageDownloadCsv()" style="background:#1e40af;color:#fff;border:none;border-radius:2px;padding:9px 20px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;">📥 月次CSV</button>'
    +'<button onclick="mileageDownloadDetailCsv()" style="background:#1e40af;color:#fff;border:none;border-radius:2px;padding:9px 20px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;">📥 日別明細CSV</button>'
    +'</div></div>';
}

/**
 * モーダルを開いたときに現在のON/OFFを反映する。
 * ★ 値はサーバ（/mileage/enabled）が正本。tc5_staff には保存しない。
 *   tc5_staff は /honomi 配下で誰でも書けるため、そこに置くと職員が自分でONにできてしまう。
 */
function mileageFillStaffModal(s){
  var cb=document.getElementById("modal-mileage-enabled");
  var note=document.getElementById("modal-mileage-note");
  if(!cb)return;
  var eid=(s&&typeof s.employeeId==="string")?s.employeeId.trim():"";
  mileage.modalEid=eid;
  mileage.modalName=(s&&s.name)||"";
  mileage.modalWas=false;
  cb.checked=false;
  function apply(){
    var on=eid?(mileage.enabledMap[eid]===true):false;
    cb.checked=on;cb.disabled=false;mileage.modalWas=on;
    if(note){
      note.textContent=!eid
        ? "社員番号の入力が必要です。社員番号を入れて保存すると有効になります。"
        : (on?"この職員は移動距離申請を利用できます。":"OFFの職員には申請メニューが表示されず、サーバ側でも拒否されます。");
    }
  }
  if(mileage.booted&&mileage.role==="a"){apply();return;}
  cb.disabled=true;
  if(note)note.textContent="読み込み中…";
  mileage.booting=true;
  (async function(){
    if(_adminElevatePromise){try{await _adminElevatePromise;}catch(e){}}
    await mileageBoot();
    // モーダルが閉じた／別の職員に切り替わった後の遅延反映を防ぐ
    if(mileage.modalEid!==eid)return;
    if(mileage.role==="a"){apply();}
    else if(note){note.textContent="設定を読み込めませんでした。通信状態を確認してください。";}
  })().catch(function(){
    mileage.booting=false;
    if(note&&mileage.modalEid===eid)note.textContent="設定を読み込めませんでした。";
  });
}

/**
 * スタッフ保存時に、変更があったときだけサーバへ反映する。
 * ★ 既存のスタッフ保存（tc5_staff）とは独立。失敗しても既存項目の保存は成立させ、
 *   利用可否だけが未反映であることを利用者へ知らせる（黙って成功扱いにしない）。
 */
function mileageSaveStaffModal(newName){
  var cb=document.getElementById("modal-mileage-enabled");
  if(!cb||cb.disabled)return;
  var want=!!cb.checked;
  var oldEid=mileage.modalEid;
  var oldName=mileage.modalName;
  // ★ 社員番号も氏名もこのモーダルで変更されうる。保存対象は「保存される値」。
  var empEl=document.getElementById("modal-empid");
  var eid=((empEl&&empEl.value)||"").trim();
  var nm=String(newName||"").trim();
  if(!eid){
    if(want)showAlert("移動距離申請を有効にするには社員番号の登録が必要です。\n社員番号を入力してから、もう一度保存してください。");
    return;
  }
  if(!nm)return;
  var rebind=(oldEid&&oldEid!==eid)?oldEid:"";
  // ★ 移動距離を「今も使わない・以前も使っていない」職員には何も送らない。
  //   改名しただけで対応表の行が生えるのを防ぐ。
  if(!want&&!mileage.modalWas)return;
  var changed=!!rebind||(oldName&&oldName!==nm);
  // ★ 前回の送信が失敗していたら、差分が無くても必ず送り直す。
  //   失敗を放置すると tc5_staff（新氏名）とサーバの対応表（旧氏名）が食い違ったまま、
  //   モーダルを開き直しても「差分なし」で再送されず、当人が 403 のままになる。
  var mustResend=!!mileage.syncFailed[eid];
  if(!changed&&want===mileage.modalWas&&!mustResend)return;
  var g=mileage.gen;
  (async function(){
    // ★ 社員番号の付け替えは1回の呼び出しで完結させる。
    //   「旧番号をOFF → 新番号をON」の2段にすると、片方だけ成功したときに
    //   「OFFにはなったが新番号では有効化できない」復旧不能な状態が残る。
    var res=await mileageApi("setEnabled",{
      employeeId:eid,staffName:nm,enabled:want,rebindFrom:rebind||undefined
    });
    if(mileageStale(g))return;
    if(!res.ok){
      mileage.syncFailed[eid]=true;   // 次回の保存で必ず送り直す
      showAlert("移動距離申請の利用設定を保存できませんでした。\n"+mileageErrText(res)
        +"\n\n（そのほかのスタッフ情報は保存されています）");
      return;
    }
    delete mileage.syncFailed[eid];
    if(rebind)delete mileage.enabledMap[rebind];
    if(want)mileage.enabledMap[eid]=true;else delete mileage.enabledMap[eid];
    mileage.modalEid=eid;mileage.modalName=nm;mileage.modalWas=want;
    var d2=res.data||{};
    var msgs=[];
    if(d2.previousEmployeeId&&d2.previousEmployeeId!==eid){
      msgs.push("社員番号を "+d2.previousEmployeeId+" から "+eid+" へ付け替えました。\n"
        +"過去の申請・確定済みデータは旧番号のまま残ります。\n"
        +"旧番号は他の職員へ再利用できないようにしました。");
    }
    if(d2.reboundSubjects>0&&!d2.previousEmployeeId){
      msgs.push("以前の登録名に紐づいていた利用許可を "+d2.reboundSubjects+" 件外しました。");
    }
    // ★ 直前に登録されたPINは、第三者が氏名を細工して先にPINを取った可能性がある。
    //   管理者がその場で気づけるように、登録が新しいときだけ知らせる。
    if(want&&d2.created&&typeof d2.pinUpdatedAt==="number"&&d2.pinUpdatedAt>0){
      var ageH=(Date.now()-d2.pinUpdatedAt)/3600000;
      if(ageH<48){
        msgs.push("⚠ この職員のPINは "+isoToJSTDateTime(new Date(d2.pinUpdatedAt).toISOString())+" に登録されています。\n"
          +"心当たりがない場合は、本人が登録したものか確認してください。\n"
          +"（本人が最近PINを変更した場合や、久しぶりにログインした場合にも表示されます）");
      }
    }
    if(msgs.length)showAlert(msgs.join("\n\n"));
    if(screen==="admin"&&adminTab==="mileage")render();
  })().catch(function(){});
}

// ===== \u6709\u7D66\u7533\u8ACB\u30E6\u30FC\u30C6\u30A3\u30EA\u30C6\u30A3 =====

// JST \u306E\u5F53\u67081\u65E5\u30FB\u672B\u65E5\u3092 { first: "YYYY-MM-DD", last: "YYYY-MM-DD" } \u3067\u8FD4\u3059
function getJSTMonthRange(){
  var parts=new Intl.DateTimeFormat("ja-JP",{
    timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(new Date());
  var y=parseInt(parts.find(function(p){return p.type==="year";}).value,10);
  var m=parseInt(parts.find(function(p){return p.type==="month";}).value,10);
  var pad=function(n){return n<10?"0"+n:String(n);};
  var firstStr=y+"-"+pad(m)+"-01";
  // \u672B\u65E5: \u7FCC\u67081\u65E5\u306E\u524D\u65E5
  var lastDay=new Date(Date.UTC(y,m,0)).getUTCDate(); // Date.UTC(y,m,0) = \u5F53\u6708\u672B\u65E5 UTC
  var lastStr=y+"-"+pad(m)+"-"+pad(lastDay);
  return {first:firstStr,last:lastStr};
}

// JST \u306E\u4ECA\u65E5\u306E\u65E5\u4ED8\u3092 YYYY-MM-DD \u3067\u8FD4\u3059
function getTodayJSTStr(){
  var parts=new Intl.DateTimeFormat("ja-JP",{
    timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(new Date());
  var y=parts.find(function(p){return p.type==="year";}).value;
  var m=parts.find(function(p){return p.type==="month";}).value;
  var d=parts.find(function(p){return p.type==="day";}).value;
  return y+"-"+m+"-"+d;
}

// ISO\u6587\u5B57\u5217\u3092 JST \u306E YYYY-MM-DD \u306B\u5909\u63DB
function isoToJSTDate(isoStr){
  if(!isoStr)return "";
  var d=new Date(isoStr);
  if(isNaN(d.getTime()))return isoStr.slice(0,10)||"";
  var parts=new Intl.DateTimeFormat("ja-JP",{
    timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(d);
  var y=parts.find(function(p){return p.type==="year";}).value;
  var mo=parts.find(function(p){return p.type==="month";}).value;
  var da=parts.find(function(p){return p.type==="day";}).value;
  return y+"-"+mo+"-"+da;
}

// ISO\u6587\u5B57\u5217\u3092 JST \u306E YYYY/MM/DD HH:mm \u306B\u5909\u63DB
function isoToJSTDateTime(isoStr){
  if(!isoStr)return "";
  var d=new Date(isoStr);
  if(isNaN(d.getTime()))return isoStr;
  return new Intl.DateTimeFormat("ja-JP",{
    timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",hour12:false
  }).format(d);
}

// \u4ED8\u4E0E\u65E5\u304B\u3089\u6709\u52B9\u671F\u9650\u3092\u8A08\u7B97\u3059\u308B\uFF08\u4ED8\u4E0E\u65E5\u306E2\u5E74\u5F8C\u306E\u524D\u65E5\uFF09
// \u4F8B: 2026-04-01 \u2192 2028-03-31
function calcExpiresAt(grantDate){
  if(!grantDate)return "";
  var parts=grantDate.split("-");
  if(parts.length!==3)return "";
  var y=parseInt(parts[0],10),m=parseInt(parts[1],10),d=parseInt(parts[2],10);
  // 2\u5E74\u5F8C\u306E\u540C\u6708\u540C\u65E5\u306E\u524D\u65E5
  var expY=y+2,expM=m,expD=d-1;
  if(expD<=0){
    expM--;
    if(expM<=0){expM=12;expY--;}
    expD=new Date(expY,expM,0).getDate(); // \u6708\u672B\u65E5
  }
  // \u6708\u672B\u65E5\u8D85\u3048\u3092\u4E38\u3081\u308B\uFF08\u4F8B:2\u670829\u65E5\u4ED8\u4E0E\u21922\u5E74\u5F8C\u306E2\u670828\u65E5\u524D\u65E5=2\u670827\u65E5\u2026\u3067\u306F\u306A\u304FgetDate\u81EA\u52D5\u51E6\u7406\u6E08\u307F\uFF09
  var maxD=new Date(expY,expM,0).getDate();
  if(expD>maxD)expD=maxD;
  return expY+"-"+String(expM).padStart(2,"0")+"-"+String(expD).padStart(2,"0");
}

// ===== \u793E\u54E1\u756A\u53F7(staffId)\u89E3\u6C7A\u30D8\u30EB\u30D1\u30FC =====

// \u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u304B\u3089\u793E\u54E1\u756A\u53F7(staffId)\u3092\u53D6\u5F97\u3059\u308B
// staffName \u304B\u3089\u4E00\u610F\u306E employeeId \u3092\u8FD4\u3059\u3002\u7A7A\u30FB\u91CD\u8907\u30FB\u4E0D\u660E\u306E\u5834\u5408\u306F null
function resolveStaffId(staffName) {
  var matches = staffList.filter(function(s) {
    return s.name === staffName && (s.employeeId||"").trim() !== "";
  });
  if (matches.length === 1) return (matches[0].employeeId||"").trim();
  return null; // 0\u4EF6=\u793E\u54E1\u756A\u53F7\u672A\u8A2D\u5B9A\u30012\u4EF6\u4EE5\u4E0A=\u91CD\u8907
}

// resolveStaffId \u304C null \u306B\u306A\u3063\u305F\u7406\u7531\u3092\u8FD4\u3059\uFF08\u30A8\u30E9\u30FC\u30E1\u30C3\u30BB\u30FC\u30B8\u7528\uFF09
function resolveStaffIdError(staffName) {
  var all = staffList.filter(function(s) { return s.name === staffName; });
  if (all.length === 0) return "\u30B9\u30BF\u30C3\u30D5\u60C5\u5831\u304C\u898B\u3064\u304B\u308A\u307E\u305B\u3093\uFF08" + staffName + "\uFF09";
  var withId = all.filter(function(s) { return (s.employeeId||"").trim() !== ""; });
  if (withId.length === 0) return "\u793E\u54E1\u756A\u53F7\u304C\u672A\u8A2D\u5B9A\u306E\u305F\u3081\u3001\u6709\u7D66\u51E6\u7406\u3067\u304D\u307E\u305B\u3093\u3002\u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u3067\u793E\u54E1\u756A\u53F7\u3092\u8A2D\u5B9A\u3057\u3066\u304F\u3060\u3055\u3044\u3002";
  if (withId.length > 1) return "\u793E\u54E1\u756A\u53F7\u304C\u91CD\u8907\u3057\u3066\u3044\u308B\u305F\u3081\u3001\u6709\u7D66\u51E6\u7406\u3067\u304D\u307E\u305B\u3093\u3002\u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u3092\u78BA\u8A8D\u3057\u3066\u304F\u3060\u3055\u3044\u3002";
  return "\u30B9\u30BF\u30C3\u30D5\u60C5\u5831\u304C\u7279\u5B9A\u3067\u304D\u306A\u3044\u305F\u3081\u3001\u6709\u7D66\u51E6\u7406\u3092\u505C\u6B62\u3057\u307E\u3057\u305F\u3002";
}

// \u7533\u8ACB\u30C7\u30FC\u30BF\u304B\u3089 staffId \u3092\u78BA\u5B9A\u3059\u308B\u30D8\u30EB\u30D1\u30FC\uFF08\u65E7\u5F62\u5F0F\u4E92\u63DB\uFF09
// req.staffId \u304C\u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u306E employeeId \u3068\u4E00\u81F4\u3059\u308B\u306A\u3089\u305D\u306E\u307E\u307E\u4F7F\u3046
// \u4E00\u81F4\u3057\u306A\u3044\u5834\u5408\u306F staffName \u304B\u3089\u7167\u5408\uFF08\u65E7\u5F62\u5F0F: staffId=\u6C0F\u540D \u5BFE\u5FDC\uFF09
function getReqStaffId(req) {
  var sid = (req.staffId||"").trim();
  // staffId \u304C\u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u306E employeeId \u3068\u4E00\u81F4\u3059\u308B\u304B\u30C1\u30A7\u30C3\u30AF
  var byId = staffList.find(function(s) { return (s.employeeId||"").trim() === sid && sid !== ""; });
  if (byId) return sid; // \u793E\u54E1\u756A\u53F7\u3067\u4E00\u81F4 \u2192 \u305D\u306E\u307E\u307E\u4F7F\u3046
  // \u4E00\u81F4\u3057\u306A\u3044\u5834\u5408\u306F staffName \u304B\u3089\u7167\u5408\uFF08\u65E7\u5F62\u5F0F\u5BFE\u5FDC\uFF09
  return resolveStaffId(req.staffName || sid);
}

// ===== \u6709\u7D66\u6B8B\u65E5\u6570\u6B63\u898F\u5316 =====

// \u65E2\u5B58\u30C7\u30FC\u30BF\u3092\u6B63\u898F\u5316\uFF08expiresAt\u30FBid \u4E0D\u8DB3\u5206\u3092\u88DC\u5B8C\u3001Firebase\u4E0A\u66F8\u304D\u306A\u3057\uFF09
function normalizePaidLeaveBalance(b){
  var nb=Object.assign({},b);
  if(!nb.expiresAt&&nb.grantDate){nb.expiresAt=calcExpiresAt(nb.grantDate);}
  if(!nb.id){
    var ts=nb.createdAt?new Date(nb.createdAt).getTime():0;
    nb.id="plb_"+(nb.staffId||nb.staffName||"unknown")+"_"+(nb.grantDate||"")+"_"+ts;
  }
  // 旧形式互換: staffId が employeeId でなく氏名の場合、staffList から employeeId に変換する
  // b0634b1(staffId移行)以前に保存された付与行は staffId=氏名 のまま残っているため
  var _sid=(nb.staffId||"").trim();
  if(_sid&&staffList&&staffList.length>0){
    var _isEmpId=staffList.some(function(s){return (s.employeeId||"").trim()===_sid;});
    if(!_isEmpId){
      // staffId が employeeId として見つからない → 氏名として resolveStaffId を試みる
      var _resolved=resolveStaffId(_sid)||(nb.staffName?resolveStaffId((nb.staffName||"").trim()):null);
      if(_resolved)nb.staffId=_resolved;
    }
  }
  if(nb.staffName===undefined)nb.staffName=nb.staffId||"";
  if(nb.remainDays===undefined||nb.remainDays===null){
    nb.remainDays=Math.round(((nb.grantedDays||0)-(nb.usedDays||0))*10)/10;
  }
  return nb;
}

// \u4ECA\u65E5\u306E\u65E5\u4ED8\u6587\u5B57\u5217 (YYYY-MM-DD) \u3092\u8FD4\u3059
function todayDateStr(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

// 通知IDを「申請ID×通知種別」で決定的に生成（RTDBキー禁止文字 . # $ / [ ] は _ に置換）。

// FIFO\u6D88\u5316\u30ED\u30B8\u30C3\u30AF: \u627F\u8A8D\u6642\u306B\u53E4\u3044\u6709\u52B9\u671F\u9650\u5185\u4ED8\u4E0E\u884C\u304B\u3089\u6D88\u5316
// \u623B\u308A\u5024: Promise<{ok:boolean, consumed:Array<{id,usedBefore,usedAfter,remainBefore,remainAfter}>}>
// \u5F15\u6570 staffId: \u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u306E employeeId\uFF08\u793E\u54E1\u756A\u53F7\uFF09
// staffId \u304C null \u306E\u5834\u5408\u306F\u30A8\u30E9\u30FC\u3092\u8FD4\u3059\uFF08\u6C0F\u540D\u3067\u306F\u6D88\u5316\u3057\u306A\u3044\uFF09
function applyFifoConsumption(staffId,days){
  if(!staffId){
    return Promise.resolve({ok:false,error:"\u793E\u54E1\u756A\u53F7\u304C\u672A\u8A2D\u5B9A\u306E\u305F\u3081\u3001\u6709\u7D66\u51E6\u7406\u3067\u304D\u307E\u305B\u3093\u3002\u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u3067\u793E\u54E1\u756A\u53F7\u3092\u8A2D\u5B9A\u3057\u3066\u304F\u3060\u3055\u3044\u3002"});
  }
  var today=todayDateStr();
  // \u6709\u52B9\u671F\u9650\u5185\u30FB\u6B8B\u3042\u308A\u30FB\u53E4\u3044\u9806 \u3067\u4E26\u3079\u308B
  // staffId\uFF08\u793E\u54E1\u756A\u53F7\uFF09\u3067\u7167\u5408\u3002\u65E7\u5F62\u5F0F\uFF08staffId=\u6C0F\u540D\uFF09\u306F\u3053\u3053\u3067\u306F\u7167\u5408\u3057\u306A\u3044
  var eligible=paidLeaveBalances
    .map(function(b){return normalizePaidLeaveBalance(b);})
    .filter(function(b){
      return b.staffId===staffId
        &&(b.expiresAt>=today)
        &&(b.remainDays>0);
    })
    .sort(function(a,b){return (a.grantDate||"").localeCompare(b.grantDate||"");});

  var needed=days;
  var consumed=[];
  for(var i=0;i<eligible.length&&needed>0;i++){
    var bal=eligible[i];
    var take=Math.min(bal.remainDays,needed);
    take=Math.round(take*10)/10;
    consumed.push({id:bal.id,usedBefore:bal.usedDays,usedAfter:bal.usedDays+take,remainBefore:bal.remainDays,remainAfter:Math.round((bal.remainDays-take)*10)/10});
    needed=Math.round((needed-take)*10)/10;
  }
  if(needed>0){
    console.warn("[PaidLeave] FIFO: \u6B8B\u65E5\u6570\u4E0D\u8DB3 staffId="+staffId+" \u4E0D\u8DB3\u65E5\u6570:",needed);
    // \u6B8B\u65E5\u6570\u4E0D\u8DB3\u3067\u3082\u6D88\u5316\u306F\u884C\u3046\uFF08\u7533\u8ACB\u3092\u512A\u5148\uFF09
  }
  // \u30ED\u30FC\u30AB\u30EB\u66F4\u65B0 + Firebase PATCH
  var promises=[];
  consumed.forEach(function(c){
    var idx=paidLeaveBalances.findIndex(function(b){
      var nb=normalizePaidLeaveBalance(b);
      return nb.id===c.id;
    });
    if(idx>=0){
      paidLeaveBalances[idx]=normalizePaidLeaveBalance(paidLeaveBalances[idx]);
      paidLeaveBalances[idx].usedDays=c.usedAfter;
      paidLeaveBalances[idx].remainDays=c.remainAfter;
      promises.push(patchPaidLeaveBalance(c.id,{usedDays:c.usedAfter,remainDays:c.remainAfter}));
    }
  });
  return Promise.all(promises).then(function(){return {ok:true,consumed:consumed};});
}

// FIFO\u6D88\u5316\u53D6\u6D88\u30ED\u30B8\u30C3\u30AF: \u5374\u4E0B\u30FB\u5F15\u623B\u3057\u6642\u306B\u6D88\u5316\u3057\u305F\u5206\u3092\u623B\u3059
// consumedSnapshot: \u627F\u8A8D\u6642\u306B\u4FDD\u5B58\u3057\u305F\u6D88\u5316\u60C5\u5831\uFF08request\u30AA\u30D6\u30B8\u30A7\u30AF\u30C8\u306EconsumedSnapshot\u30D5\u30A3\u30FC\u30EB\u30C9\uFF09
function reverseFifoConsumption(consumedSnapshot){
  if(!consumedSnapshot||!consumedSnapshot.length)return Promise.resolve({ok:true});
  var promises=[];
  consumedSnapshot.forEach(function(c){
    var idx=paidLeaveBalances.findIndex(function(b){
      var nb=normalizePaidLeaveBalance(b);
      return nb.id===c.id;
    });
    if(idx>=0){
      paidLeaveBalances[idx]=normalizePaidLeaveBalance(paidLeaveBalances[idx]);
      // \u6D88\u5316\u524D\u306B\u623B\u3059\uFF08\u73FE\u5728\u5024\u304B\u3089\u5DEE\u5206\u3092\u623B\u3059\uFF09
      var diff=c.usedAfter-c.usedBefore;
      var newUsed=Math.max(0,Math.round((paidLeaveBalances[idx].usedDays-diff)*10)/10);
      var newRemain=Math.round((paidLeaveBalances[idx].remainDays+diff)*10)/10;
      paidLeaveBalances[idx].usedDays=newUsed;
      paidLeaveBalances[idx].remainDays=newRemain;
      promises.push(patchPaidLeaveBalance(c.id,{usedDays:newUsed,remainDays:newRemain}));
    }
  });
  return Promise.all(promises).then(function(){return {ok:true};});
}

// \u6709\u7D66\u7533\u8ACB\u306E\u53D6\u5F97\u65E5\u914D\u5217\u3092\u8FD4\u3059\uFF08\u65E7\u5F62\u5F0F date \u306E\u307F\u306E\u5834\u5408\u306F [date] \u3068\u3057\u3066\u6271\u3046\uFF09
function getLeaveDates(req){
  if(req.leaveDates&&Array.isArray(req.leaveDates)&&req.leaveDates.length>0)return req.leaveDates;
  if(req.date)return [req.date];
  return [];
}

// staffId\u57FA\u6E96\u306E\u6709\u52B9\u6B8B\u65E5\u6570\uFF08\u671F\u9650\u5185\u30FB\u6B8B>0\u306E\u4ED8\u4E0E\u884C\u306E\u307F\u5408\u8A08\uFF09
function getValidRemainDays(staffId){
  if(!staffId)return 0;
  var today=todayDateStr();
  return paidLeaveBalances
    .map(function(b){return normalizePaidLeaveBalance(b);})
    .filter(function(b){
      return b.staffId===staffId&&(b.expiresAt>=today)&&(b.remainDays>0);
    })
    .reduce(function(sum,b){return Math.round((sum+b.remainDays)*10)/10;},0);
}

// ===== 表示用残日数（JST基準・データは書き換えない） =====
// 正本(tc5_paid_leave_balances.remainDays)は「承認時」に取得日全部を差し引く実装のため、
// 未来日の取得予定まで消化済みとして引かれている。表示上は「今日以前の取得日だけを消化済み」
// とするため、承認済みのうちJSTで明日以降の取得日分を加算して戻す（表示のみ・PATCHしない）。
// 申請時の残数チェック・FIFO消化は従来どおり getValidRemainDays（＝申請可能残）を使う。
//
// 戻り値: {byLot:{付与行id:戻す日数}, bySid:{社員番号:戻す日数}}
// 「第N回」の表示にも使うため、どの付与行から引かれた分かを consumedSnapshot で特定して
// 付与行単位に割り当てる。これにより 各付与行の表示日数の合計 = 表示用残日数 が常に成立する。
function buildFutureApprovedLeaveMap(){
  var jstToday=getTodayJSTStr();  // 取得日の過去/未来判定はJST固定（端末TZに依存させない）
  var today=todayDateStr();       // 有効期限の判定は getValidRemainDays と同じ基準を使う
  // 期限内の付与行だけを戻し先にする。used が実際に引かれている量＝戻せる上限。
  var lots={},lotOrder={};
  (paidLeaveBalances||[]).map(function(b){return normalizePaidLeaveBalance(b);})
    .filter(function(b){return b.staffId&&b.id&&b.expiresAt>=today;})
    .sort(function(a,b){return (a.grantDate||"").localeCompare(b.grantDate||"");})
    .forEach(function(b){
      lots[b.id]={sid:b.staffId,used:b.usedDays||0,back:0};
      (lotOrder[b.staffId]=lotOrder[b.staffId]||[]).push(b.id);
    });
  // 付与行へ戻す。その付与行から実際に引かれている量（usedDays）を超えては戻さない。
  // 申請者本人の付与行以外へは戻さない（consumedSnapshot に他人の付与行idが入っていても混ざらない）。
  function give(sid,lotId,amt){
    var L=lots[lotId];
    if(!L||L.sid!==sid||!(amt>0))return 0;
    var v=Math.min(amt,Math.max(0,Math.round((L.used-L.back)*10)/10));
    if(v>0)L.back=Math.round((L.back+v)*10)/10;
    return v;
  }
  var entries=[];
  (paidLeaveRequests||[]).forEach(function(r){
    if(!r||r.status!=="approved")return;
    var sid=getReqStaffId(r);
    if(!sid)return;
    var dates=getLeaveDates(r);
    // 取得日ごとに個別判定。今日は消化済み扱い、明日以降のみ戻す
    var future=dates.filter(function(d){return typeof d==="string"&&d>jstToday;}).length;
    if(future<=0)return;
    entries.push({sid:sid,future:future,past:dates.length-future,
      snap:(r.consumedSnapshot&&Array.isArray(r.consumedSnapshot)&&r.consumedSnapshot.length)?r.consumedSnapshot:null});
  });
  function assign(e){
    var snap=e.snap;
    if(snap){
      // 承認時に実際に消化できた日数を上限にする。
      // 部分消化だった場合は過去日から先に消化されたものとみなし、未来分に残る量だけを戻す。
      var cap=0;
      snap.forEach(function(x){
        if(!x)return;
        var d=(Number(x.usedAfter)||0)-(Number(x.usedBefore)||0);
        if(d>0)cap+=d;
      });
      var rest=Math.max(0,Math.min(e.future,Math.round((cap-e.past)*10)/10));
      // 消化は付与日昇順（FIFO）で進むため、未来分は snapshot の末尾側に対応する
      for(var i=snap.length-1;i>=0&&rest>0;i--){
        if(!snap[i]||!snap[i].id)continue;
        var taken=(Number(snap[i].usedAfter)||0)-(Number(snap[i].usedBefore)||0);
        if(taken<=0)continue;
        rest=Math.round((rest-give(e.sid,snap[i].id,Math.min(rest,taken)))*10)/10;
      }
      // 戻しきれなかった分は付与行が失効・削除済み＝戻さない
    }else{
      // consumedSnapshot が空/欠落（RTDBは空配列を保存しないため承認後リロードで消える）。
      // どの付与行から引かれたか特定できないので、新しい付与行から順に usedDays の範囲で戻す。
      var ids=lotOrder[e.sid]||[],restF=e.future;
      for(var j=ids.length-1;j>=0&&restF>0;j--){
        restF=Math.round((restF-give(e.sid,ids[j],restF))*10)/10;
      }
    }
  }
  // consumedSnapshot がある申請を先に割り当てる。戻し先が確実なものを先に確定させ、
  // 推定で配る欠落分が本来の付与行の枠を先取りしないようにする（走査順への依存を排除）。
  entries.forEach(function(e){if(e.snap)assign(e);});
  entries.forEach(function(e){if(!e.snap)assign(e);});
  var byLot={},bySid={};
  Object.keys(lots).forEach(function(id){
    var L=lots[id];
    if(!(L.back>0))return;
    byLot[id]=L.back;
    bySid[L.sid]=Math.round(((bySid[L.sid]||0)+L.back)*10)/10;
  });
  return{byLot:byLot,bySid:bySid};
}

// 取得日の表示用フォーマット（表示のみ。leaveDates の保存形式・CSVは変更しない）
// JSTの今年と同じ年は年を省略して "9/19"、他年は "2025/9/19"。
// 1日1行の縦並びにして列幅を詰める。日付は省略せず全件出す。
// ※PC・スマホ共通の1実装にしている。CSSでは切り詰めた日付を戻せないため、
//   「PCは3日＋他N日／スマホは全件」を両立させると同じ内容を2通り持つことになり壊れやすい。
//   縦並びは列幅がむしろ狭くなり、PC側の不利益が無いため共通化した。
function formatLeaveDatesHtml(dates){
  var curY=getTodayJSTStr().substring(0,4);
  var list=(dates||[]).filter(function(d){return typeof d==="string"&&d;});
  if(list.length===0)return "";
  function one(d){
    var p=d.split("-");
    if(p.length<3)return esc(d);
    var mo=parseInt(p[1],10),da=parseInt(p[2],10);
    if(isNaN(mo)||isNaN(da))return esc(d);
    return esc(p[0]===curY?(mo+"/"+da):(p[0]+"/"+mo+"/"+da));
  }
  var html=list.map(function(d){
    return '<span style="display:block;white-space:nowrap;">'+one(d)+'</span>';
  }).join("");
  if(list.length>1){
    html+='<span style="display:block;white-space:nowrap;color:#475569;font-size:.72rem;">（'+list.length+'日）</span>';
  }
  return html;
}

// 有給申請一覧の申請日時表示用（年と秒を出さない "M/D HH:MM"）。
// isoToJSTDateTime は打刻画面の通知履歴・通知カードでも使うため変更しない。
function isoToJSTMonthDayTime(isoStr){
  if(!isoStr)return "";
  var d=new Date(isoStr);
  if(isNaN(d.getTime()))return isoStr;
  var parts=new Intl.DateTimeFormat("ja-JP",{
    timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",
    hour:"2-digit",minute:"2-digit",hour12:false
  }).formatToParts(d);
  var g=function(t){var v=parts.find(function(p){return p.type===t;});return v?v.value:"";};
  var mo=g("month"),da=g("day"),hh=g("hour"),mi=g("minute");
  if(!mo||!da||!hh||!mi)return isoToJSTDateTime(isoStr); // 想定外ロケール時は従来表示へ退避
  return mo+"/"+da+" "+hh+":"+mi;
}

// \u5BFE\u8C61\u6708\u306Erecords\u306B\u3044\u308B\u9000\u8077\u6E08\u307F\u30B9\u30BF\u30C3\u30D5\u3082\u542B\u3081\u305F\u30B9\u30BF\u30C3\u30D5\u4E00\u89A7\u3092\u8FD4\u3059\uFF08\u4EBA\u5225CSV\u7528\uFF09
function buildCsvStaffList(mR){
  var activeS=staffList.filter(function(s){return !s.status||s.status==="\u5728\u7C4D";});
  var recNms=new Set(mR.filter(function(r){return r.type==="clockIn";}).map(function(r){return r.staff;}));
  var activeNmSet=new Set(activeS.map(function(s){return s.name;}));
  var retiredWithRec=staffList.filter(function(s){return s.status==="\u9000\u8077"&&recNms.has(s.name)&&!activeNmSet.has(s.name);});
  var unknownStaff=[...recNms].filter(function(nm){return !staffList.find(function(s){return s.name===nm;});}).map(function(nm){return{name:nm,yomi:nm,location:"",status:""};});
  return activeS.concat(retiredWithRec).concat(unknownStaff).sort(function(a,b){return(a.yomi||a.name).localeCompare(b.yomi||b.name,"ja");});
}

// \u4EBA\u5225\u660E\u7D30CSV\uFF081\u4EBA1\u65E51\u884C\u30FB\u52B4\u52D9\u58EB\u5411\u3051\uFF09
function dlStaffDetailCSV(month,recs,staffArr,approvalsObj){
  var DAYS_S=["\u65E5","\u6708","\u706B","\u6C34","\u6728","\u91D1","\u571F"];
  var hdr="\u6C0F\u540D,\u6240\u5C5E\u65BD\u8A2D,\u52E4\u52D9\u65BD\u8A2D,\u65E5\u4ED8,\u66DC\u65E5,\u51FA\u52E4\u6642\u523B,\u9000\u52E4\u6642\u523B,\u4F11\u61A9\u6642\u9593,\u5B9F\u50CD\u6642\u9593,\u6B8B\u696D\u6642\u9593,\u627F\u8A8D\u72B6\u614B,\u6253\u523B\u6F0F\u308C,\u5099\u8003";
  var rows=[];
  // \u627F\u8A8D\u6E08\u307F\u6709\u7D66\u65E5\u30DE\u30C3\u30D7\uFF08staffName__date \u2192 type label\uFF09
  var plMap={};
  paidLeaveRequests.filter(function(r){return r.status==="approved";}).forEach(function(r){
    plMap[r.staffName+"__"+r.date]="\u6709\u7D66";
  });
  staffArr.forEach(function(s){
    var nm=s.name;
    var sr=recs.filter(function(r){return r.staff===nm;});
    var dates=[...new Set(sr.map(function(r){return r.date;}))].sort();
    // \u627F\u8A8D\u6E08\u307F\u6709\u7D66\u3067record\u306A\u3057\u65E5\u3082\u8FFD\u52A0
    var plDates=Object.keys(plMap).filter(function(k){return k.startsWith(nm+"__");}).map(function(k){return k.slice((nm+"__").length);});
    var allDates=[...new Set(dates.concat(plDates))].sort();
    allDates.forEach(function(dk){
      var plLabel=plMap[nm+"__"+dk]||"";
      var dr=sr.filter(function(r){return r.date===dk;}).sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
      if(plLabel&&!dr.length){
        // \u6253\u523B\u306A\u3057\u6709\u7D66\u65E5\uFF08\u5168\u4F11\u306A\u3069\uFF09
        rows.push([nm,(s.location||""),"",dk,DAYS_S[new Date(dk).getDay()],
          "","","","","","\u6709\u7D66","",plLabel].join(","));
        return;
      }
      var cin=dr.find(function(r){return r.type==="clockIn";});
      var cout=dr.find(function(r){return r.type==="clockOut";});
      var brkMs=sumBreakMs(getBreakPairs(dr));
      var netMs=calcMs(dr);
      var otMs=Math.max(0,netMs-8*3600000);
      var approved=approvalsObj[dk+"__"+nm];
      var missing=(!cin||!cout)?"\u6709":"";
      var v=validateAttendanceRecord(nm,dk,dr);
      var remark=plLabel?plLabel:(!v.valid&&v.reason&&v.reason!=="OK")?v.reason:"";
      var workFac=(cin&&cin.workFacility)||"";
      rows.push([nm,(s.location||""),workFac,dk,DAYS_S[new Date(dk).getDay()],
        cin?cin.time:"",cout?cout.time:"",
        brkMs>0?toHM(brkMs):"",netMs>0?toHM(netMs):"",
        otMs>0?toHM(otMs):"",plLabel?"\u6709\u7D66":(approved?"\u627F\u8A8D\u6E08":"\u672A\u627F\u8A8D"),missing,remark].join(","));
    });
  });
  dlCSV(hdr+"\n"+rows.join("\n"),"\u7A42\u4E43\u5473_\u4EBA\u5225\u660E\u7D30_"+month+".csv");
}

// ===== Firebase 起動時データ取得（個別パス・root bulk read 廃止 - Phase 2-A）=====
async function initFirebase() {
  try {
    // 認証トークンを1回取得してキャッシュ（Promise.all内の19並列fetchが個別にsignInして
    // Firebase匿名authレート制限に当たるのを防ぐ）
    // ★ 取得できなくても起動処理は続ける。個別の取得は失敗を null として扱うため、
    //   端末キャッシュ（localStorage）だけでスタッフ選択・打刻画面まで表示できる。
    //   ここで throw すると通信断のたびに「通信エラーです」画面になり、打刻自体ができない。
    try{await getAuthToken();}catch(_e){console.warn("[initFirebase] auth token unavailable (offline?)");}

    // ── スタッフテスト画面の直接共有URL（?staffDemo=）──
    // 本番業務データは一切取得しない。表示条件に必要なスタッフ属性と拠点マスターのみ読む。
    if(staffDemoUrlUsed){
      // 端末のlocalStorageに残っている本番キャッシュをサンドボックスへ持ち込まない（トークンの正否に関わらず先に消す）
      records=[];approvals={};correctionRequests=[];
      paidLeaveRequests=[];paidLeaveBalances=[];
      mealsData={};mealConfData={};staffNotifications={};monthlyDaysImport={};reviewStatus={};
      staffPins={};
      var sdRec=isSafeTokenStr(staffDemoParam)?await fetchJson(FB_URL+"/staffDemoTokens/"+encodeURIComponent(staffDemoParam)+".json"):null;
      var sdToday=getTodayJSTStr();
      if(!sdRec||typeof sdRec!=="object"||sdRec.enabled===false){staffDemoInvalid=true;}
      else if(!sdRec.expiresAt||String(sdRec.expiresAt)<sdToday){staffDemoExpired=true;}
      else{
        // 表示条件に必要な最小限（スタッフ属性・拠点マスター）だけを取得する
        var sdRes=await Promise.all([
          fetchJson(FB_URL+"/tc5_staff.json"),
          fetchJson(FB_URL+"/master/locations.json")
        ]);
        if(sdRes[0]){staffList=Array.isArray(sdRes[0])?sdRes[0]:Object.values(sdRes[0]);}
        if(sdRes[1]){
          masterFacilities=Array.isArray(sdRes[1])?sdRes[1]:Object.values(sdRes[1]);
          VALID_TOKENS=buildValidTokens();
          masterLocs=masterFacilities.map(function(f){return f.name;});
        }
        elevateShareSession("sandbox",staffDemoParam);
        screen="staffDemoPick";
      }
      staffDemoPending=false;
      firebaseReady=true;firebaseError=false;
      render();
      return; // listenFirebase() も起動しない
    }

    // 端末に残っている未送信の打刻を読み戻す。読み書きは端末内だけで通信に依存しないが、
    // 起動を遅くしないためサーバ取得と並列に走らせ、records を差し替える直前で待ち合わせる。
    var _outboxReady=punchOutboxLoad();
    punchOutboxInstallTriggers();

    // ===== 起動時の取得を「操作可能に必要なもの」と「そうでないもの」に分ける =====
    //
    // 変更前は 16 本すべてを1つの Promise.all で待ち、その完了で firebaseReady=true にしていた。
    // その中に tc5_records（本番実測 1,008KB・単独で 700〜830ms）が含まれるため、
    // スタッフ選択ボタンは実際には 11KB あれば描けるのに、1MB の到着まで disabled のままだった。
    //
    // ここでは3段に分ける。取得の総量を減らし、かつ待ち順を実際の必要順に合わせる。
    //   第1段（await する）: スタッフ選択画面を操作可能にするのに要るものだけ … 約11KB
    //   第2段（待たない）  : 打刻状態の判定に要る tc5_records … 打刻ボタンだけを recordsReady で守る
    //   第3段（取得しない）: 打刻画面・スタッフ選択画面が一切読まないもの
    //                        → 管理/労務士画面を開いたとき(ensureAdminData)と
    //                          スタッフがログインしたとき(ensureStaffScopedData)に取得する
    //
    // ★ 「先に描いて速く見せる」ための変更ではない。打刻の可否判定は従来どおり
    //   サーバの最新 tc5_records で行い、届くまで打刻ボタンは押せない（recordsReady）。
    var _recordsPromise=loadPunchRecords();
    var results=await Promise.all([
      fetchJson(FB_URL+"/tc5_staff.json"),
      Promise.resolve(null), // tc5_records は第2段（_recordsPromise）へ移動。添字維持用
      Promise.resolve(null), // tc5_approvals は第3段（ensureAdminData）へ移動。添字維持用
      authFetch(FB_URL+"/tc5_pins.json")
        .then(function(r){if(!r.ok)throw new Error("pins HTTP "+r.status);return r.json();})
        .then(function(j){staffPinsLoaded=true;return j;}).catch(function(){return null;}),
      fetchJson(FB_URL+"/tc_master_depts.json"),
      // 施設マスタだけは「取得に成功したか」を別途記録する。
      // fetchJson は通信失敗も null を返すため、null だけでは「ノード不在」と区別できず、
      // 取得失敗時に管理者が施設を登録すると本番の施設マスタを全件消してしまう（saveFacilities 参照）。
      // r.ok を必ず確認する。401/403 は JSON ボディ（{"error":"Permission denied"}）を返すため、
      // これを検査しないと取得成功とみなしてしまい、その値が施設マスタとして扱われる。
      authFetch(FB_URL+"/master/locations.json")
        .then(function(r){if(!r.ok)throw new Error("locations HTTP "+r.status);return r.json();})
        .then(function(j){facilitiesLoaded=true;return j;}).catch(function(){return null;}),
      // ★ 管理者PINは読み込まない。照合はサーバのみで、クライアントは判定材料を持たない。
      //   （Promise.all の添字を保つためプレースホルダを置く）
      Promise.resolve(null),
      Promise.resolve(null),
      // ★ 管理者トークンの「設定状態」は管理画面（マスタ設定タブ）でしか表示しない。
      //   3リクエストを要するため起動時には読まず、ensureAdminData() で読む。
      Promise.resolve(null), // 添字維持用
      Promise.resolve(null), // 旧 config/adminToken は loadAdminTokenState 内で読む（添字維持用）
      (viewerPending&&viewerParam)?fetchJson(FB_URL+"/viewerTokens/"+viewerParam+".json"):Promise.resolve(null),
      // デモトークンは「トークンをキーに単一ノードを引く」方式。デモURL以外では取得しない。
      (demoUrlUsed&&demoParam)?fetchJson(FB_URL+"/demoTokens/"+encodeURIComponent(demoParam)+".json"):Promise.resolve(null),
      // ↓ 以下はスタッフ選択画面が一切読まない。第3段へ移動（添字は維持する）
      Promise.resolve(null), // tc5_paid_leave_requests   → ensureStaffScopedData
      Promise.resolve(null), // tc5_paid_leave_balances   → ensureStaffScopedData
      Promise.resolve(null), // tc5_monthly_days_import   → ensureAdminData
      Promise.resolve(null), // tc5_staff_notifications   → ensureStaffScopedData（本人の枝だけ）
      Promise.resolve(null), // tc5_meals                 → ensureStaffScopedData / ensureAdminData
      Promise.resolve(null), // tc5_meal_confirmations    → ensureStaffScopedData / ensureAdminData
      Promise.resolve(null), // tc5_monthly_review_status → ensureAdminData
    ]);
    var fbStaff=results[0],fbPins=results[3];
    var fbDepts=results[4],fbLocations=results[5];
    // results[6] / results[7] は管理者PIN用の未使用プレースホルダ（読み込みを廃止）
    // results[8] / results[9] は管理者トークン状態用の未使用プレースホルダ（ensureAdminData へ移動）
    var fbViewerTokenData=results[10],fbDemoTokenRec=results[11];
    // results[1]/[2]/[12]〜[18] は第2段・第3段へ移した分の未使用プレースホルダ

    // 端末に残っている未送信の打刻は、サーバ取得を待たずに先に画面へ戻す。
    await _outboxReady;
    punchOutboxMergeInto(records);
    // tc5_records（1MB）の到着は待たない。届いた時点で差し替え、recordsReady を立てる。
    _recordsPromise.then(function(fbRecords){
      applyPunchRecords(fbRecords);
      render();
    }).catch(function(){render();});
    if(fbStaff){staffList=Array.isArray(fbStaff)?fbStaff:Object.values(fbStaff);localStorage.setItem("tc5_staff",JSON.stringify(staffList));}
    if(fbPins){staffPins=fbPins;}
    if(fbDepts){masterDepts=Array.isArray(fbDepts)?fbDepts:Object.values(fbDepts);localStorage.setItem("tc_master_depts",JSON.stringify(masterDepts));}
    if(fbLocations){
      var locs=Array.isArray(fbLocations)?fbLocations:Object.values(fbLocations);
      masterFacilities=locs;
      localStorage.setItem("tc_master_facilities",JSON.stringify(masterFacilities));
      masterLocs=masterFacilities.map(function(f){return f.name;});
      VALID_TOKENS=buildValidTokens();
      tokenValid=isAllToken||Object.prototype.hasOwnProperty.call(VALID_TOKENS,effectiveToken);
      facilityName=VALID_TOKENS[effectiveToken]||"";
      if(urlToken&&tokenValid&&!isAllToken){localStorage.setItem("facilityToken",urlToken);}
    } else if(writePolicy==="full"&&facilitiesLoaded&&masterFacilities.length){
      // ★ facilitiesLoaded を条件に含める。取得が「成功して不在」だったときだけ書き戻す。
      //   取得が拒否（403）や通信失敗で null になった場合に書き戻すと、
      //   ローカルキャッシュの古い施設マスタで本番を上書きしてしまう。
      // 既定値の自動書き込みは通常モードのみ（デモ／テスト画面で起動直後に遮断通知が出るのを防ぐ）
      // ★ masterFacilities が空のときは絶対に書き込まない。
      //   fetchJson は通信失敗も null を返すため（"ノード不在" と区別できない）、
      //   空配列を PUT すると RTDB 上で null 扱いとなり本番の施設マスタを削除してしまう。
      authFetch(FB_URL+"/master/locations.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(masterFacilities)}).catch(function(e){console.error("[initFirebase] master/locations save error:", e);});
    }
    // 管理者PINはクライアントへ読み込まない（照合はサーバのみ）。
    //
    // 以下は起動時に取得しない（それぞれの画面へ入ったときに取得する）:
    //   管理者トークンの設定状態 / 承認 / 月別出勤日数 / 精査完了フラグ / 賄い
    //     → ensureAdminData()        （render() の isAdminScreen 判定から呼ぶ）
    //   有給（申請・残日数）/ 本人向け通知 / 賄い
    //     → ensureStaffScopedData()  （render() の打刻画面判定から呼ぶ）
    // 管理者URLトークン認証。
    // ★ 照合はサーバ（/api/auth/admin）だけで行う。
    //   以前は公開領域の config/adminTokenHash とクライアント側で突き合わせていたが、
    //   あのハッシュは非ソルトSHA-256で誰でも読めるため、総当たりで平文へ戻せる。
    //   復元されたトークンはサーバ認証にもそのまま通るため、公開領域に照合材料を置かない。
    // ★ 管理者PIN認証と同じく、この経路だけはサーバ応答を待つ（打刻経路は従来どおり非ブロッキング）。
    if(adminUrlUsed){
      var _ar=await establishSessionEx("admin",{adminToken:adminParam||""},12000);
      if(_ar&&_ar.ok){
        adminTokenValid=true;adminTokenInvalid=false;isAdminAuthenticated=true;
        screen="admin";adminTab="records";initFcmForAdmin();
        // establishSessionEx が既に admin ロールを確立済み。
        // 後続の管理系API（PIN変更・トークン変更）が待てるようにしておく。
        _adminElevatePromise=Promise.resolve(true);
      } else {
        adminTokenValid=false;adminTokenInvalid=true;
        // ★ 失敗理由を区別する。通信障害・準備中・過負荷を「トークンが違う」と
        //   表示すると、管理者が復旧不能と誤認して不要な再設定を始めてしまう。
        var _as=_ar&&_ar.status;
        adminTokenErrMsg=(_as===401||_as===403)?"管理者トークンが正しくありません"
          :(_as===429)?"試行が多すぎます。しばらく待ってから再度お試しください"
          :(_as===503)?"認証の準備が完了していません。管理者にお問い合わせください"
          :"認証サーバに接続できません。通信状態を確認して再読み込みするか、管理者PINでお入りください";
      }
    }
    // 閲覧専用トークン認証（viewerTokens/{token} 方式）
    if(viewerPending){
      var _vtd=fbViewerTokenData;
      var _todayIso=getTodayJSTStr(); // JST基準に統一
      if(!_vtd||!_vtd.enabled){viewerMode=false;viewerInvalid=true;}
      else if(_vtd.expiresAt&&String(_vtd.expiresAt)<_todayIso){viewerMode=false;viewerExpired=true;}
      else{viewerMode=true;viewerInvalid=false;}
      // デモ画面から発行された閲覧用URLは、発行元デモトークンが失効した時点で利用不可にする。
      // さらに、そのセッションは完全な読み取り専用にする（資料の論理削除など書き込みを一切許可しない）。
      if(viewerMode&&_vtd&&_vtd.issuedByDemoTokenId){
        if(!isSafeTokenStr(_vtd.issuedByDemoTokenId)){viewerMode=false;viewerInvalid=true;}
        else{
          var _srcDemo=await fetchJson(FB_URL+"/demoTokens/"+encodeURIComponent(_vtd.issuedByDemoTokenId)+".json");
          if(!_srcDemo||typeof _srcDemo!=="object"||_srcDemo.enabled===false){viewerMode=false;viewerInvalid=true;}
          else if(!_srcDemo.expiresAt||String(_srcDemo.expiresAt)<_todayIso){viewerMode=false;viewerExpired=true;}
        }
        if(viewerMode){
          viewerIsDemoIssued=true;
          // demoTokenKey は空のままなので許可リストは全件 false ＝ 完全な読み取り専用
          writePolicy="readonlyWithAllowList";
        }
      }
      if(viewerMode){uiMode="viewer";elevateShareSession("viewer",viewerParam);}
      viewerPending=false;
    }
    // 管理者デモ認証（demoTokens/{token} 方式）。
    // isAdminAuthenticated は立てない（通常管理者と権限を同一にしない）／FCM登録も行わない。
    if(demoUrlUsed){
      var dToday=getTodayJSTStr(); // JST基準に統一（端末TZによる期限判定のズレを解消）
      var dRec=(fbDemoTokenRec&&typeof fbDemoTokenRec==="object")?fbDemoTokenRec:null;
      if(!isSafeTokenStr(demoParam)){demoInvalid=true;}
      else if(dRec){
        if(dRec.enabled===false){demoInvalid=true;}
        else if(!dRec.expiresAt||String(dRec.expiresAt)<dToday){demoExpired=true;}
        else{
          demoTokenRec=dRec;demoTokenKey=demoParam;demoTokenExpiresAt=String(dRec.expiresAt);
          demoMode=true;screen="admin";adminTab="records";
          elevateShareSession("demo",demoParam);
        }
      } else {
        // 移行期間フォールバック：旧 config/demoAccess（デモURLでアクセスされた場合のみ読む）
        var legacy=await fetchJson(FB_URL+"/config/demoAccess.json");
        if(legacy&&legacy.token&&demoParam===legacy.token){
          demoAccessConfig=legacy;
          // expireDate 欠落はフェイルクローズ（新方式と同じ規則）
          if(!legacy.expireDate||dToday.replace(/-/g,"")>String(legacy.expireDate)){demoExpired=true;}
          else{demoLegacyAuth=true;demoMode=true;screen="admin";adminTab="records";}
        } else {
          demoInvalid=true;
        }
      }
    }
    if(KANA_ROWS.concat(["すべて"]).indexOf(yomiTab)<0){yomiTab="すべて";}
    firebaseReady=true;
    firebaseError=false;
    listenFirebase();
    punchOutboxFlush("startup");
    render();
  } catch(e) {
    console.error("FB init error:",e);
    firebaseReady=false;
    firebaseError=true;
    render();
  }
}

// ===== 有給付与登録モーダル（body直下固定管理 — render()再描画から完全分離） =====
var _plGrantModalData={};
// モーダルDOMをbody直下に1度だけ生成し、以後は再利用する。
// renderPaidLeaveTab()のinnerHTML再描画でDOMが破壊されない。
function ensurePaidLeaveGrantModal(){
  var wrap=document.getElementById("pl-grant-modal-wrap");
  if(wrap)return wrap; // 既存なら再利用
  wrap=document.createElement("div");
  wrap.id="pl-grant-modal-wrap";
  wrap.style.cssText="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px 80px;";
  wrap.innerHTML=''
    +'<div style="background:#fff;width:100%;max-width:480px;border-radius:2px;border:1px solid #adb5bd;">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #e4e8ed;">'
    +'<span id="pl-grant-modal-title" style="font-size:14px;font-weight:700;color:#1a2332;">有給付与登録</span>'
    +'<button onclick="closePaidLeaveGrantModal()" style="background:#dde1e7;border:1px solid #adb5bd;width:28px;height:28px;border-radius:2px;font-size:14px;color:#475569;cursor:pointer;font-family:inherit;line-height:1;">×</button>'
    +'</div>'
    +'<div style="padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;">'
    +'<div style="grid-column:1/-1;background:#f1f5f9;border-radius:4px;padding:8px 10px;font-size:.78rem;"><span id="pl-grant-modal-info"></span></div>'
    +'<div><label style="display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:3px;">付与日</label>'
    +'<input type="date" id="pl-grant-date" style="width:100%;font-size:12px;padding:6px 8px;border:1px solid #adb5bd;border-radius:2px;background:#fff;font-family:monospace;outline:none;box-sizing:border-box;"></div>'
    +'<div><label style="display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:3px;">失効予定日</label>'
    +'<input type="date" id="pl-grant-expires" style="width:100%;font-size:12px;padding:6px 8px;border:1px solid #adb5bd;border-radius:2px;background:#fff;font-family:monospace;outline:none;box-sizing:border-box;"></div>'
    +'<div><label style="display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:3px;">付与日数</label>'
    +'<input type="number" id="pl-grant-days" min="0" max="40" step="0.5" style="width:100%;font-size:12px;padding:6px 8px;border:1px solid #adb5bd;border-radius:2px;background:#fff;font-family:inherit;outline:none;box-sizing:border-box;" placeholder="例：10"></div>'
    +'<div id="pl-grant-remain-wrap"><label style="display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:3px;">残日数</label>'
    +'<input type="number" id="pl-grant-remain" min="0" max="40" step="0.5" style="width:100%;font-size:12px;padding:6px 8px;border:1px solid #adb5bd;border-radius:2px;background:#fff;font-family:inherit;outline:none;box-sizing:border-box;" placeholder="例：10"></div>'
    +'<div id="pl-grant-consumed-note" style="grid-column:1/-1;display:none;background:#fef9c3;border:1px solid #fde047;border-radius:4px;padding:7px 10px;font-size:.72rem;color:#713f12;">'
    +'消化済みとして登録します。使用日数＝付与日数、残日数は自動で 0 になります。'
    +'</div>'
    +'</div>'
    +'<div style="display:flex;gap:8px;padding:12px 18px;border-top:1px solid #f3f4f6;">'
    +'<button id="btn-pl-grant-save" style="flex:1;background:#1e40af;color:#fff;border:none;padding:10px;border-radius:2px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">保存する</button>'
    +'<button onclick="closePaidLeaveGrantModal()" style="flex:1;background:#dde1e7;color:#475569;border:1px solid #adb5bd;padding:10px;border-radius:2px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">キャンセル</button>'
    +'</div></div>';
  document.body.appendChild(wrap);
  return wrap;
}
function openPaidLeaveGrantModal(idx,consumed){
  var g=_paidLeaveGrantsCache[idx];
  if(!g)return;
  _plGrantModalData={staffId:g.staffId,staffName:g.staffName,grantNum:g.grantNum,consumed:!!consumed};
  _plGrantModalOpen=true;
  var wrap=ensurePaidLeaveGrantModal(); // body直下に生成 or 再利用
  var titleEl=document.getElementById("pl-grant-modal-title");
  if(titleEl)titleEl.textContent=consumed?"有給付与登録（消化済み）":"有給付与登録";
  var infoEl=document.getElementById("pl-grant-modal-info");
  if(infoEl){
    infoEl.textContent='';
    var b=document.createElement('b');b.textContent=g.staffDisplayName;
    infoEl.appendChild(b);
    infoEl.appendChild(document.createTextNode('（社員番号：'+g.staffId+'）　第'+g.grantNum+'回'));
    // 出勤日数からの自動算出の根拠を表示（管理者が確認できるように）
    if(g.auto){
      var a=g.auto;
      var basis=document.createElement('div');
      basis.style.cssText='margin-top:5px;font-size:.72rem;color:#475569;';
      var detail=(a.autoGrantDays!=null)
        ?('判定期間 '+a.from+'〜'+a.to+' / 勤務 '+a.workDays+'日 → 年換算 '+a.annualDays+'日 → 週'+a.weeklyEquiv+'日相当 → 自動算出 '+a.autoGrantDays+'日')
        :('判定期間 '+a.from+'〜'+a.to+' / 勤務 '+a.workDays+'日 → 年換算 '+a.annualDays+'日 → '+a.note+'（手入力してください）');
      basis.textContent='自動算出：'+detail;
      infoEl.appendChild(basis);
      if(g.mismatch){
        var mm=document.createElement('div');
        mm.style.cssText='margin-top:3px;font-size:.72rem;color:#dc2626;font-weight:700;';
        mm.textContent='⚠ 要確認：手動の週所定労働日数では '+g.grantDays+'日 です（自動算出と相違）';
        infoEl.appendChild(mm);
      }
    }
  }
  var gdEl=document.getElementById("pl-grant-date");if(gdEl)gdEl.value=g.grantDate;
  var eaEl=document.getElementById("pl-grant-expires");if(eaEl)eaEl.value=g.expiresAt;
  // 付与日数の初期値：出勤日数からの自動算出を最優先。判定不可/要確認(47日以下)は空欄にして手入力を促す。
  // 自動算出が無い場合のみ手動週所定由来へフォールバック。weeklyWorkDaysは上書きしない（読み取りのみ）。
  var _autoDays;
  if(g.auto&&g.auto.autoGrantDays!=null){_autoDays=String(g.auto.autoGrantDays);}
  else if(g.auto&&(g.auto.dataShort||g.auto.weeklyEquiv==null)){_autoDays="";} // 判定不可/要確認 → 空欄
  else{_autoDays=(g.grantDays!=null)?String(g.grantDays):"";}
  var gDays=document.getElementById("pl-grant-days");if(gDays)gDays.value=_autoDays;
  var rDays=document.getElementById("pl-grant-remain");if(rDays){rDays.value=consumed?"":_autoDays;rDays.disabled=!!consumed;}
  var noteEl=document.getElementById("pl-grant-consumed-note");if(noteEl)noteEl.style.display=consumed?"block":"none";
  wrap.style.display="flex";
  var btn=document.getElementById("btn-pl-grant-save");
  if(btn){
    btn.onclick=function(){
      var sid=_plGrantModalData.staffId;
      var sname=_plGrantModalData.staffName;
      var gn=_plGrantModalData.grantNum;
      var cons=_plGrantModalData.consumed;
      var grantDateVal=(document.getElementById("pl-grant-date")||{}).value||"";
      var expiresAtVal=(document.getElementById("pl-grant-expires")||{}).value||"";
      var grantedDaysRaw=(document.getElementById("pl-grant-days")||{}).value||"";
      var remainDaysRaw=cons?"0":((document.getElementById("pl-grant-remain")||{}).value||"");
      if(!grantDateVal||!expiresAtVal){showAlert("付与日・失効予定日を入力してください");return;}
      var grantedDaysVal=parseFloat(grantedDaysRaw);
      var remainDaysVal=cons?0:parseFloat(remainDaysRaw);
      if(isNaN(grantedDaysVal)||grantedDaysVal<0){showAlert("付与日数を正しく入力してください（0以上の数値）");return;}
      if(!cons&&(isNaN(remainDaysVal)||remainDaysVal<0)){showAlert("残日数を正しく入力してください（0以上の数値）");return;}
      if(!cons&&remainDaysVal>grantedDaysVal){showAlert("残日数は付与日数以下にしてください");return;}
      var usedDays=cons?grantedDaysVal:0;
      var dup=paidLeaveBalances.some(function(b){
        var nb=normalizePaidLeaveBalance(b);return nb.staffId===sid&&nb.grantDate===grantDateVal;
      });
      if(dup){showAlert("同じ社員番号・付与日の有給残がすでに登録されています");return;}
      var confirmMsg=(cons?"消化済みとして":"通常付与として")+"登録します。\n\n"
        +"社員番号："+sid+"\n氏名："+sname+"\n付与回：第"+gn+"回\n"
        +"付与日："+grantDateVal+"\n付与日数："+grantedDaysVal+"日\n"
        +"残日数："+remainDaysVal+"日\n\n保存しますか？";
      if(!confirm(confirmMsg))return;
      savePaidLeaveGrantRecord(sid,sname,gn,grantDateVal,expiresAtVal,grantedDaysVal,usedDays,remainDaysVal);
    };
  }
}

// ===== 有給「付与日数の修正」モーダル（body直下固定 — render()再描画から完全分離） =====
// 誤って登録した付与日数だけを後から訂正する。
// 変更するのは対象付与行の grantedDays と remainDays のみで、
// 付与日・有効期限・消化済み日数(usedDays)・他の付与行・取得申請・承認状態・FIFOの消化順は変更しない。
//
// ★ 残日数の再計算に「grantedDays - usedDays」を使ってはならない（2026-08-14 修正）。
//   remainDays が正本であり、usedDays は「このシステムで承認して消化した累計」でしかない。
//   有給付与登録モーダルは残日数を付与日数と別に入力できる（付与7日・残5日 のように、
//   運用開始前にすでに取得済みの分を残日数だけ減らして登録する）。この登録時点の消化分は
//   usedDays に入らないため、その付与行では常に
//       grantedDays - usedDays - remainDays = 登録時点ですでに消化していた日数（carryIn）
//   という差が残る。実データ（2026-08-14 実測）でも 40行中 14行がこの状態である。
//   ここで remainDays = grantedDays - usedDays と再計算すると、その carryIn 日数が
//   残日数として復活し、取得済みの有給が戻ってしまう。
//
// したがって再計算は「現在の残日数に、付与日数の増減分だけを加減する」:
//   remainDays(新) = remainDays(現) + ( grantedDays(新) - grantedDays(現) )
//   消化済み合計   = grantedDays(現) - remainDays(現)   （= usedDays + carryIn。これは変えない）
//   付与日数は消化済み合計を下回れない（下回ると残日数が負になる）。
//
// usedDays は変更しない。画面の残表示（未来分を戻す buildFutureApprovedLeaveMap）は usedDays を
// 上限に戻す実装なので、戻し量が変化せず、表示・合計・取得予定の整合は保たれる。

// 一覧と同じ「第N回」を求める（一覧は同一表示名の付与行を付与日昇順で番号付けしている）。
// 一覧側の _grantNo は描画用コピーにのみ付くため、モーダルでは同じ規則で計算して表示を一致させる。
function _plGrantNoOfBal(bal){
  var nm=bal.staffName||bal.staffId||"";
  var list=(paidLeaveBalances||[]).map(function(b){return normalizePaidLeaveBalance(b);})
    .filter(function(b){return (b.staffName||b.staffId||"")===nm;})
    .sort(function(a,b){return (a.grantDate||"").localeCompare(b.grantDate||"");});
  for(var i=0;i<list.length;i++){if(list[i].id===bal.id)return i+1;}
  return bal.grantNum||"";
}

        +"付与日数を修正しても、この "+carryIn+"日 を残日数として復活させません。");
    }
    if(carryIn<0){
      // remainDays と usedDays の整合が崩れている（通常の操作では起きない）。黙って計算を進めない。

          +"（消化済み合計 "+consumedTotal+"日 は変更しません）"

    // 0.5の倍数へ切り上げる（スピナーが 4.7 / 5.2 のような保存できない値を出さないようにする）。
    inp.min=String(_plBalEditMinGranted(consumedTotal));

    inp.oninput=renderPreview;
    inp.onchange=renderPreview;

  if(btn)btn.onclick=function(){savePaidLeaveBalGrantedDays();};
  renderPreview();
  wrap.style.display="flex";

  if(notesShown){
    var card=document.getElementById("pl-bal-edit-card");
    if(card){try{card.focus();}catch(e){}}
  }else if(inp){
    try{inp.focus();inp.select();}catch(e){}
  }
}

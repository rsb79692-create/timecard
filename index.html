function _showFcmStatus(msg){
  var el=document.createElement('div');
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);'
    +'background:rgba(25,118,210,0.92);color:#fff;padding:9px 20px;border-radius:8px;'
    +'font-size:13px;z-index:99999;pointer-events:none;white-space:nowrap;';
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},4000);
}
function initFcmForAdmin(){
  // デモ／スタッフテスト画面では通知許可ダイアログもトークン登録も行わない
  if(uiMode!=="normal"){console.log('[FCM] skip (uiMode='+uiMode+')');return;}
  console.log('[FCM] initFcmForAdmin() 開始');
  _showFcmStatus('通知設定確認中...');
  if(!('Notification' in window)){
    console.warn('[FCM] Notification API 非対応');
    _showFcmStatus('通知: このブラウザは非対応');
    return;
  }
  console.log('[FCM] Notification.permission =',Notification.permission);
  if(Notification.permission==='denied'){
    console.warn('[FCM] 通知が拒否済み（ブラウザ設定から許可してください）');
    _showFcmStatus('通知: ブラウザで拒否済み — 設定から許可してください');
    return;
  }
  if(FCM_VAPID_KEY.startsWith('REPLACE')){
    console.warn('[FCM] VAPID KEY 未設定');
    return;
  }
  if(!('serviceWorker' in navigator)){
    console.warn('[FCM] ServiceWorker 非対応');
    return;
  }
  // _swRegistration を待たず navigator.serviceWorker.ready で確実に取得
  navigator.serviceWorker.ready.then(function(reg){
    console.log('[FCM] SW ready:', reg.scope);
    window._swRegistration=reg;
    var app;
    try{app=firebase.app();}catch(e){
      try{
        app=firebase.initializeApp({
          apiKey:FB_API_KEY,
          projectId:"honomi-timecard",
          messagingSenderId:FCM_MESSAGING_SENDER_ID,
          appId:FCM_APP_ID
        });
        console.log('[FCM] firebase.initializeApp 完了');
      }catch(e2){
        console.error('[FCM] firebase.initializeApp エラー',e2);
        _showFcmStatus('通知: Firebase 初期化失敗');
        return;
      }
    }
    var msg;
    try{msg=firebase.messaging(app);}catch(e){
      console.error('[FCM] firebase.messaging エラー',e);
      _showFcmStatus('通知: Messaging 初期化失敗');
      return;
    }
    console.log('[FCM] Notification.requestPermission() 呼び出し');
    Notification.requestPermission().then(function(perm){
      console.log('[FCM] permission 結果:',perm);
      if(perm!=='granted'){
        _showFcmStatus('通知: 許可されませんでした');
        return;
      }
      _showFcmStatus('通知設定中...');
      msg.getToken({vapidKey:FCM_VAPID_KEY,serviceWorkerRegistration:reg})
        .then(function(token){
          if(token){
            console.log('[FCM] token 取得成功');
            _saveFcmToken(token);
            _showFcmStatus('通知設定完了');
          }else{
            console.warn('[FCM] token が空 — FCM 設定を確認してください');
            _showFcmStatus('通知: トークン取得失敗');
          }
        })
        .catch(function(e){
          console.error('[FCM] getToken エラー',e);
          _showFcmStatus('通知: トークン取得エラー — '+e.message);
        });
    }).catch(function(e){
      console.error('[FCM] requestPermission エラー',e);
    });
  }).catch(function(e){
    console.error('[FCM] serviceWorker.ready エラー',e);
    _showFcmStatus('通知: SW 準備失敗');
  });
}
function _saveFcmToken(token){
  var key=token.replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);
  // 生fetchを廃止し authFetch へ統一（書き込み一元遮断の対象に含めるため）
  authFetch(FB_URL+"/tc5_fcm_tokens/"+key+".json",{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({token:token,savedAt:new Date().toISOString()})
  }).then(function(){
    console.log('[FCM] token 保存完了');
  }).catch(function(e){console.error("[FCM] token save エラー",e);});
}

          var mdFuture = mdYear>mdCurY || (mdYear===mdCurY && mo>mdNowMo);

                       : 'background:#fff;color:#0f172a;';

            tds+='<td style="'+_mtd+'right;'+_mcol+'padding:4px 4px;">'

          } else {

                  : cell.src==="override" ? 'color:#1e40af;background:#eff6ff;font-weight:700;'

            tds+='<td style="'+_mtd+'right;'+_mcol+cs+'"'+(cell.src==="override"?' title="テスト打刻を手入力値で上書き表示中"':cell.src==="punch"?' title="出勤打刻データ（勤怠一覧で修正）"':cell.src==="import"?' title="過去取込データ（打刻なし）"':'')+'>'+(cell.src==="none"?'':cell.val)+'</td>';
          }

        return'<tr style="border-bottom:1px solid #e5e7eb;background:'+rowBg+';">'

    if(adminTab==="leavePlan"){
      // ===== 有給取得計画（管理者専用・read-only・スタッフ側非表示・通知なし・申請データ作成なし） =====
      // 既存の有給データ（tc5_paid_leave_balances=期限別残数 / tc5_paid_leave_requests=消化）から
      // 期限切れ前に消化を促すための「目安」を表示するのみ。tc5_* への書き込みは一切行わない。
      var lpToday=todayDateStr();
      var _lpNow=new Date();
      var lpCurIdx=_lpNow.getFullYear()*12+_lpNow.getMonth(); // 当月の通し月インデックス
      function lpIdxToYm(idx){var y=Math.floor(idx/12),m=idx%12;return{idx:idx,y:y,m:m,key:y+"-"+pad(m+1),label:y+"年"+(m+1)+"月"};}
      function lpExpToIdx(exp){if(!exp||exp.length<7)return -1;var ey=parseInt(exp.substring(0,4),10),em=parseInt(exp.substring(5,7),10);if(isNaN(ey)||isNaN(em))return -1;return ey*12+(em-1);}
      function lpRound(x){return Math.round(x*2)/2;} // 0.5日単位に丸める（目安表示）
      function lpFmtDays(v){return v%1===0?String(v):v.toFixed(1);}
      // 対象: 正社員 かつ 在籍（退職以外）。雇用形態未設定（""）は対象外（ユーザー確定仕様）
      var lpStaff=staffList.filter(function(s){return (s.employmentType||"")==="正社員"&&s.status!=="退職";})
        .sort(function(a,b){return (a.yomi||"").localeCompare(b.yomi||"","ja");});
      // 雇用形態未設定（在籍）の人数（除外中である旨の注意表示用）
      var lpUnsetCount=staffList.filter(function(s){return s.status!=="退職"&&(s.employmentType||"")==="";}).length;
      // 残数を正規化（expiresAt/staffId補完。Firebaseへは書き戻さない）
      var lpNorm=paidLeaveBalances.map(function(b){return normalizePaidLeaveBalance(b);});
      // 承認済み取得日数（月別・参考表示用）: staffId(employeeId) -> "YYYY-MM" -> 日数
      // ※残数・推奨は employeeId 基準のため、実績も getReqStaffId で employeeId に解決して同基準で集計（同姓同名の誤集計を防止）
      var lpTaken={};
      paidLeaveRequests.forEach(function(r){
        if(r.status!=="approved")return;
        var rsid=getReqStaffId(r);if(!rsid)return; // 解決不可（重複/空氏名）は参考実績から除外
        getLeaveDates(r).forEach(function(d){
          var mk=monthKey(d);if(!mk)return;
          if(!lpTaken[rsid])lpTaken[rsid]={};
          lpTaken[rsid][mk]=(lpTaken[rsid][mk]||0)+1;
        });
      });
      // 各社員の有効残（期限内・残>0）を期限昇順で取得し、残合計・直近失効を算出
      var lpMaxExpIdx=lpCurIdx;
      // 未来日の承認済み有給（＝まだ消化していない取得予定）を1回の走査で全員分算出
      var lpFutureMap=buildFutureApprovedLeaveMap();
      var lpData=lpStaff.map(function(s){
        var sid=(s.employeeId||"").trim();
        var bals=sid?lpNorm.filter(function(b){return b.staffId===sid&&b.expiresAt>=lpToday&&b.remainDays>0;}):[];
        bals.sort(function(a,b){return (a.expiresAt||"").localeCompare(b.expiresAt||"");});
        var remain=bals.reduce(function(sum,b){return Math.round((sum+b.remainDays)*10)/10;},0);
        bals.forEach(function(b){var ei=lpExpToIdx(b.expiresAt);if(ei>lpMaxExpIdx)lpMaxExpIdx=ei;});
        // 月別推奨は remain（正本＝承認済みを全て差し引いた値）のままで算出する。
        // 表示する「現在の残日数」だけ、JST基準で明日以降の承認済み取得日を戻した値にする。
        var fut=sid?(lpFutureMap.bySid[sid]||0):0;
        // 直近失効分の日数も、有給管理タブの「第N回」と同じく取得予定を差し引かない値で出す
        var nextDays=bals.length?Math.round((bals[0].remainDays+(lpFutureMap.byLot[bals[0].id]||0))*10)/10:0;
        return{s:s,sid:sid,bals:bals,remain:remain,future:fut,
          remainDisp:Math.round((remain+fut)*10)/10,noId:!sid,
          nextExp:bals.length?bals[0].expiresAt:"",nextExpDays:nextDays};
      });
      // 表示月の範囲: 当月 ～ 対象社員の最遅失効月（最大12ヶ月）。超過分は省略注記。
      var lpFullSpan=lpMaxExpIdx-lpCurIdx+1;
      var lpSpan=Math.max(1,Math.min(lpFullSpan,12));
      var lpTruncated=lpFullSpan>12;
      var lpMonths=[];for(var lpk=0;lpk<lpSpan;lpk++){lpMonths.push(lpIdxToYm(lpCurIdx+lpk));}
      // 月別推奨日数: 各付与の残日数を「当月～その付与の失効月」に均等配分し合算（FIFO/期限別の残数ベース）
      // ※残数(remainDays)は消化済みを既に差し引いた値のため、推奨日数は実績消化を考慮済み（純増分）
      lpData.forEach(function(d){
        var plan={};
        d.bals.forEach(function(b){
          var ei=lpExpToIdx(b.expiresAt);
          var n=ei-lpCurIdx+1;if(n<1)n=1;
          var per=b.remainDays/n;
          for(var mi=lpCurIdx;mi<=ei;mi++){plan[mi]=(plan[mi]||0)+per;}
        });
        d.plan=plan;
      });
      // スタイル（有給申請一覧と同一値に統一：th padding 7px 8px / td padding 8px 8px / font-size .82rem）
      var _lpTh='padding:7px 8px;font-weight:700;font-size:.82rem;color:#334155;white-space:nowrap;background:#e8edf3;border-bottom:2px solid #94a3b8;';
      var _lpTd='padding:8px 8px;font-size:.82rem;';
      var _lpName='padding:8px 8px;font-size:.82rem;font-weight:400;white-space:nowrap;min-width:110px;'; // 氏名は太字にしない（有給申請一覧の _plName と同じ）
      var lpSticky='position:sticky;left:0;z-index:1;border-right:2px solid #cbd5e1;box-shadow:2px 0 3px -1px rgba(0,0,0,.08);';
      var lpStickyHead='position:sticky;left:0;z-index:2;background:#e8edf3;border-right:2px solid #94a3b8;';
      var lpMonthTotals={};
      lpMonths.forEach(function(mo){var t=0;lpData.forEach(function(d){t+=(d.plan[mo.idx]||0);});lpMonthTotals[mo.idx]=t;});
      var lpRows=lpData.length?lpData.map(function(d,ri){
        var s=d.s;
        var rowBg=ri%2===1?'#f8fafc':'#ffffff';
        var noIdTag=d.noId?' <span style="font-size:.66rem;color:#fff;background:#f59e0b;border-radius:8px;padding:1px 7px;vertical-align:middle;">社員番号未設定</span>':'';
        var expCell;
        if(d.nextExp){
          var urgent=(lpExpToIdx(d.nextExp)-lpCurIdx)<=2; // 3ヶ月以内の失効は強調
          expCell='<span style="'+(urgent?'color:#b91c1c;font-weight:800;':'color:#0f172a;')+'">'+esc(d.nextExp)+'</span>'
            +'<span style="font-size:.72rem;color:#64748b;"> ('+lpFmtDays(lpRound(d.nextExpDays))+'日)</span>';
        }else{
          expCell='<span style="color:#94a3b8;">—</span>';
        }
        var tds='';
        lpMonths.forEach(function(mo){
          var rec=lpRound(d.plan[mo.idx]||0);
          var took=(d.sid&&lpTaken[d.sid]&&lpTaken[d.sid][mo.key])?lpTaken[d.sid][mo.key]:0;
          var disp='';
          if(rec>0)disp='<span style="font-weight:700;color:#0f172a;">'+lpFmtDays(rec)+'</span>';
          if(took>0)disp+='<div style="font-size:.66rem;line-height:1.25;color:#16a34a;">済'+took+'</div>';
          tds+='<td style="'+_lpTd+'text-align:right;min-width:56px;">'+(disp||'')+'</td>';
        });
        return '<tr style="border-bottom:1px solid #e5e7eb;background:'+rowBg+';">'
          +'<td style="'+_lpName+lpSticky+'background:'+rowBg+';color:#0f172a;">'+esc(s.name)+noIdTag+'</td>'
          +'<td'+(d.future>0?' title="括弧内は承認済みかつ明日以降の取得予定日数（残日数の内数）。"':'')+' style="'+_lpTd+'text-align:right;font-weight:800;color:#1e3a8a;white-space:nowrap;">'+lpFmtDays(lpRound(d.remainDisp))+'日'
            +(d.future>0?'<span style="color:#92400e;">（'+lpFmtDays(lpRound(d.future))+'）</span>':'')
            +'</td>'
          +'<td style="'+_lpTd+'white-space:nowrap;">'+expCell+'</td>'
          +tds
          +'</tr>';
      }).join(""):'';
      var lpMonthHead=lpMonths.map(function(mo){return '<th style="'+_lpTh+'text-align:right;min-width:56px;">'+mo.label+'</th>';}).join("");
      var lpFootCells=lpMonths.map(function(mo){var t=lpRound(lpMonthTotals[mo.idx]||0);return '<td style="'+_lpTd+'text-align:right;font-weight:700;color:#334155;background:#eef1f5;border-top:2px solid #94a3b8;">'+(t>0?lpFmtDays(t):'')+'</td>';}).join("");
      var lpMinW=330+lpSpan*62; // 文字サイズ縮小に合わせて下限も縮小（実内容がこれより広ければ自然幅で横スクロールする）
      var lpTableHtml=lpData.length
        ?'<div style="overflow-x:auto;border:1px solid #cbd5e1;border-radius:8px;">'
          +'<table style="width:100%;border-collapse:collapse;min-width:'+lpMinW+'px;">'
          +'<thead><tr>'
          +'<th style="'+_lpTh+'text-align:left;'+lpStickyHead+'">氏名</th>'
          +'<th style="'+_lpTh+'text-align:right;white-space:nowrap;">現在の残日数</th>'
          +'<th style="'+_lpTh+'text-align:left;white-space:nowrap;">直近の失効予定</th>'
          +lpMonthHead
          +'</tr></thead>'
          +'<tbody>'+lpRows+'</tbody>'
          +'<tfoot><tr>'
          +'<td style="'+_lpName+lpSticky+'background:#eef1f5;border-top:2px solid #94a3b8;color:#334155;">月別推奨計</td>'
          +'<td style="'+_lpTd+'background:#eef1f5;border-top:2px solid #94a3b8;"></td>'
          +'<td style="'+_lpTd+'background:#eef1f5;border-top:2px solid #94a3b8;"></td>'
          +lpFootCells
          +'</tr></tfoot>'
          +'</table></div>'
        :'<div class="empty" style="padding:24px 0;text-align:center;color:#8496a7;">対象の社員（正社員・在籍）がいません</div>';
      tc='<div class="admin-card admin-wrap">'
        +'<div class="admin-title">🌴 有給取得計画（社員）</div>'
        // 文字色・サイズは可読性（白背景でのコントラスト）を優先して従来値を維持し、余白と文言だけ詰める
        +'<div style="font-size:.82rem;color:#64748b;margin-bottom:8px;line-height:1.6;">'
        +'<b>正社員（在籍）</b>のみ。各月の数字は失効月までに使い切るための<b>取得推奨日数の目安</b>（0.5日単位・表示のみ／申請作成・通知なし）。'
        +'<br>残日数＝<b>今日（JST）以前の取得のみ消化済み</b>。月別推奨は（n）を除いた残数から算出。'
        // 凡例は項目単位で折り返す（スマホで項目の途中改行が起きると区切りが読めなくなるため）
        +'<br><span style="display:inline-block;white-space:nowrap;margin-right:12px;"><span style="color:#92400e;font-weight:700;">（n）</span>取得予定（残日数の内数）</span>'

        +'<span style="display:inline-block;margin-right:12px;"><span style="white-space:nowrap;"><span style="color:#16a34a;font-weight:700;">済n</span> 承認済みの取得</span><span style="white-space:nowrap;">（当月以降は予定を含む）</span></span>'

        +(lpTruncated?'<br><span style="color:#92400e;">※表示は当月から12ヶ月分（残日数列は全期間分）。</span>':'')
        +'</div>'
        +lpTableHtml

      if(!hv||!mv)return;
      var newTime=hv+":"+mv;

      }

function filterCsvPreview(){
  var fid=(document.getElementById("csv-f-id")||{value:""}).value||"";
  var fnm=(document.getElementById("csv-f-name")||{value:""}).value||"";
  var floc=(document.getElementById("csv-f-loc")||{value:""}).value||"";
  var ftype=(document.getElementById("csv-f-type")||{value:""}).value||"";
  var tbody=document.getElementById("csv-prev-tbody");
  if(!tbody)return;
  var rows=tbody.querySelectorAll("tr.csv-prev-row");
  var visible=0;
  rows.forEach(function(tr){
    var show=(!fid||(tr.dataset.empid||"").includes(fid))
      &&(!fnm||(tr.dataset.nm||"").includes(fnm))
      &&(!floc||tr.dataset.loc===floc)
      &&(!ftype||tr.dataset.etype===ftype);
    tr.style.display=show?"":"none";
    if(show)visible++;
  });
  var cnt=document.getElementById("csv-prev-count");
  if(cnt)cnt.textContent="全"+rows.length+"件"+(visible<rows.length?" / 表示"+visible+"件":"");
}
function openStaffDetail(nm,from,orderList){selStaffDetail=nm;staffDetailFrom=from||"csvPreview";staffDetailOrder=(orderList&&orderList.length)?orderList.slice():null;screen="staffDetail";render();}
// 個人勤怠詳細ヘッダーの氏名クリック→職員一覧から切替（月・戻り先はopenStaffDetailで維持）
function showStaffPicker(list,current,from){
  var ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;";
  var card=document.createElement("div");
  card.style.cssText="background:#fff;border-radius:2px;padding:16px;max-width:340px;width:100%;max-height:74vh;display:flex;flex-direction:column;border:1px solid #adb5bd;";
  var ttl=document.createElement("div");ttl.style.cssText="font-size:1rem;font-weight:900;color:#0f172a;margin-bottom:12px;";ttl.textContent="職員を選択";card.appendChild(ttl);
  var listWrap=document.createElement("div");listWrap.style.cssText="overflow-y:auto;display:flex;flex-direction:column;gap:6px;";
  function close(){if(ov.parentNode)document.body.removeChild(ov);}
  (list||[]).forEach(function(name){
    var b=document.createElement("button");
    b.textContent=name;
    var isCur=name===current;
    b.style.cssText="text-align:left;padding:10px 12px;border-radius:2px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid "+(isCur?"#1e40af":"#adb5bd")+";background:"+(isCur?"#1e40af":"#fff")+";color:"+(isCur?"#fff":"#0f172a")+";";
    b.onclick=function(){close();if(name!==current)openStaffDetail(name,from,staffDetailOrder);};
    listWrap.appendChild(b);
  });
  card.appendChild(listWrap);
  var cancel=document.createElement("button");cancel.textContent="キャンセル";cancel.style.cssText="margin-top:12px;background:#dde1e7;color:#475569;border:1px solid #adb5bd;padding:11px;border-radius:2px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;";cancel.onclick=close;card.appendChild(cancel);
  ov.appendChild(card);
  ov.onclick=function(e){if(e.target===ov)close();};
  document.body.appendChild(ov);
}
function openHrmEdit(nm){
  var s=nm?staffList.find(function(x){return x.name===nm;}):null;
  var modal=document.getElementById("hrm-modal");
  if(!modal)return;
  document.getElementById("hrm-modal-title").textContent=s?"スタッフ編集":"スタッフ追加";
  document.getElementById("hrm-modal-orig").value=nm||"";
  document.getElementById("modal-lname").value=s?(s.lastName||s.name):"";
  document.getElementById("modal-fname").value=s?(s.firstName||""):"";
  document.getElementById("modal-lname-yomi").value=s?(s.yomiLast!==undefined?s.yomiLast:s.yomi):"";
  document.getElementById("modal-fname-yomi").value=s?(s.yomiFirst||""):"";
  document.getElementById("modal-empid").value=s?(s.employeeId||""):"";
  document.getElementById("modal-hiredate").value=s&&s.hireDate?s.hireDate.replace(/\//g,"-"):"";  // yyyy/mm/dd or yyyy-mm-dd → yyyy-mm-dd (input type=date)
  document.getElementById("modal-location").value=s?(s.location||""):"";
  document.getElementById("modal-dept").value=s?(s.dept||""):"";
  document.getElementById("modal-emptype").value=s?(s.employmentType||"パート"):"パート";
  var wwdEl=document.getElementById("modal-weekdays");
  if(wwdEl)wwdEl.value=s&&s.weeklyWorkDays!=null?String(s.weeklyWorkDays):"";
  document.getElementById("modal-role").value=s?(s.role||"一般"):"一般";
  document.getElementById("modal-status").value=s?(s.status||"在籍"):"在籍";
  var cswEl=document.getElementById("modal-can-support");
  if(cswEl)cswEl.checked=!!(s&&s.canSupportWork);
  var mrEl=document.getElementById("modal-meal-required");
  if(mrEl)mrEl.checked=!!(s&&s.mealRequired); // 既存スタッフ（mealRequired未設定）は初期値=不要
  mileageFillStaffModal(s); // 移動距離申請の利用可否（サーバの値を反映）
  var pinDiv=document.getElementById("modal-pin-area");
  if(pinDiv){
    var _msp=nm?getStoredPin(nm):{hash:null,plain:null};
    var _pinStatus=!_msp.hash?"未設定":(_msp.plain?"確認可":"設定済み");
    pinDiv.innerHTML='<span style="color:#8496a7;font-size:13px;">PIN</span><strong style="margin:0 8px;font-family:monospace;">'+_pinStatus+'</strong>';
    if(nm&&_msp.hash&&_msp.plain){
      var pv=document.createElement("button");
      pv.textContent="PIN確認";
      pv.style.cssText="background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-right:6px;";
      pv.onclick=function(){adminViewPin(nm);};
      pinDiv.appendChild(pv);
    }
    if(nm){
      var pc=document.createElement("button");
      pc.textContent=_msp.hash?"PIN変更":"PIN設定";
      pc.style.cssText="background:#fef3c7;color:#92400e;border:1px solid #fcd34d;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;";
      pc.onclick=function(){showAdminPinSetModal(nm,function(pin){adminSavePin(nm,pin);});};
      pinDiv.appendChild(pc);
    }
  }
  modal.style.display="flex";
}

// 打刻の実行。呼び出し側は戻り値（Promise）を待たない（従来どおり即座に制御を返す）。
// ★ 端末保存（IndexedDB）の成功を確認してから画面を打刻済みにする。
//   保存できなかった場合は打刻失敗として扱い、records にも積まない。
var _punchSaving=false; // 端末保存中の再入防止（保存完了までの数ミリ秒の連打を弾く）
async function _execPunch(type,d){
  if(viewerMode){console.warn("[viewerMode] write blocked");return;}
  if(_punchSaving)return;
  var _so=staffList.find(function(s){return s.name===staffName;})||{};
  var _hf=(_so.location)||"";
  var _fn=facilityName||"";
  // facilityName: 1)URLトークン施設 → 2)スタッフ所属施設 の順で補完
  var _effFn=_fn||_hf;
  var nr={id:generateRecordId(),staff:staffName,type:type,date:fmtDateKey(d),time:fmtTime(d),timestamp:d.toISOString()};
  // eventId は打刻イベントの一意キー。RTDB の保存先ノード名と同一で、再送しても増殖しない。
  // timestamp（実打刻時刻）はこの時点で確定させ、送信時刻では上書きしない。
  nr.eventId=nr.id;
  if(_effFn)nr.facilityName=_effFn;
  if(type==="clockIn"){
    // workFacility優先順位: 1)応援先選択 2)URLトークン施設 3)スタッフ所属施設
    var _wf=(_so.canSupportWork&&selectedWorkFacility)?selectedWorkFacility:(_fn||_hf);
    nr.homeFacility=_hf||_fn||_wf;nr.workFacility=_wf;nr.isSupportWork=!!(_wf&&nr.homeFacility&&_wf!==nr.homeFacility);nr.wageType=nr.isSupportWork?"support_zero":"normal";
  } else if(type==="breakEnd"){
    // 休憩終了時に打刻した施設を「以降の勤務施設」として記録（施設をまたいだ休憩終了に対応）
    // ※フェーズ1ではデータ記録のみ。施設別の時間按分は行わない（既存集計・既存データの結果を変えないため）
    if(_effFn)nr.workFacility=_effFn;
  } else if(type==="facilityChange"){
    // 施設変更：この時刻を境界に、以降の勤務時間を workFacility へ計上する
    // fromFacility＝変更前施設（移動時間はこちらへ計上される）
    // 認可は書き込みパス側で強制する（UIの非表示だけを認可として扱わない・フェイルクローズ）
    var _from=getCurrentWorkFacility(staffName,nr.date)||"";
    var _to=facilityChangeTo||"";
    facilityChangeTo=null; // 使い切りにして、以降の打刻へ持ち越さない
    if(!_so.canSupportWork||!_from||!_to||masterLocs.indexOf(_to)<0||_from===_to){
      console.warn("[facilityChange] blocked");
      showAlert("施設変更を記録できません。\n\n管理者に連絡してください。");
      return;
    }
    nr.fromFacility=_from;
    nr.workFacility=_to;
    nr.homeFacility=_hf||_fn||"";
    nr.isSupportWork=!!(nr.homeFacility&&_to!==nr.homeFacility);
    nr.wageType=nr.isSupportWork?"support_zero":"normal";
  }
  // ① 端末（IndexedDB）へ保存する。サーバ応答は待たない。
  //    スタッフテスト画面・管理者デモ・閲覧用URLではキューを使わず従来経路へ委譲する。
  if(punchOutboxEnabled()){
    _punchSaving=true;
    var _saved=false;
    try{_saved=await punchOutboxCommit(nr);}catch(e){_saved=false;}
    _punchSaving=false;
    if(!_saved){
      // ★ 端末に残っていないものを「打刻済み」と見せてはならない。
      //    localStorage やサーバ直送へフォールバックせず、打刻失敗として再操作できる状態を保つ。
      console.error("[punch] local persist failed", type);
      showAlert("打刻を保存できませんでした。\n\nもう一度押してください。\n繰り返す場合は管理者に連絡してください。");
      render();
      return;
    }
  } else {
    saveRecord(nr);
  }
  // ② ここから先は「端末に保存済み」。画面を即座に打刻済みにする。
  records.push(nr);
  _lsSet("tc5_records",JSON.stringify(records));
  punchMsg=TYPE_LABEL[type]+"　"+fmtTimeSec(d);
  if(punchTimer)clearTimeout(punchTimer);
  punchTimer=setTimeout(function(){
    punchMsg=null;staffName=null;selectedWorkFacility=null;facilityChangeTo=null;
    // サンドボックス中はホームではなくスタッフ選択画面へ戻す
    screen=staffDemoMode?"staffDemoPick":"home";
    render();
  },1500);
  render();
  // ③ サーバ送信は非同期。結果を待たない。
  punchOutboxFlush("punch");
}
function doPunch(type){
  // A. 既存チェック
  if(!tokenValid)return;
  // ★ サーバの当日打刻を受け取る前は打刻させない（二重打刻防止。ボタンの disabled と二重化）
  if(!recordsReady&&writePolicy==="full"){
    showAlert("本日の打刻状態を確認しています。\n\n数秒お待ちのうえ、もう一度押してください。");
    return;
  }
  if(_punchSaving)return; // 端末保存の完了前に同じボタンを連打させない
  // 打刻ボタンから来る4種以外は受け付けない（施設変更は doFacilityChange 経由のみ）
  if(["clockIn","clockOut","breakStart","breakEnd"].indexOf(type)<0)return;
  var d=new Date();
  console.log("[doPunch start]", staffName, type, fmtDateKey(d));
  // B. 当日・当該スタッフ・未削除レコード取得（同一施設でフィルタ）
  var _today=fmtDateKey(d);
  var _so2=staffList.find(function(s){return s.name===staffName;})||{};
  var _fn2=facilityName||"";
  var _dr=records.filter(function(r){return r.staff===staffName&&r.date===_today&&!r.deleted&&(!r.facilityName||!_fn2||r.facilityName===_fn2);});
  var _dCin=_dr.find(function(r){return r.type==="clockIn";});
  var _dCout=_dr.find(function(r){return r.type==="clockOut";});
  // C. 二重打刻・出勤なし退勤チェック
  if(type==="clockIn"&&_dCin){
    showAlert("本日の出勤はすでに打刻済みです。\n\n出勤 "+_dCin.time+"\n\n修正が必要な場合は管理者へ連絡してください。");
    return;
  }
  if(type==="clockIn"&&!_dCin){
    var _anyCinOpen=findOpenClockInAcrossFacilities(staffName,_today);
    if(_anyCinOpen){
      showAlert("他施設で出勤中です。\n\n出勤中："+(_anyCinOpen.facilityName||"")+" "+_anyCinOpen.time+"\n\n退勤を押してください。");
      return;
    }
  }
  var _anyDout=records.find(function(r){return r.staff===staffName&&r.date===_today&&!r.deleted&&r.type==="clockOut";});
  if(type==="clockOut"&&_anyDout){
    showAlert("本日の退勤はすでに打刻済みです。\n\n退勤 "+_anyDout.time+"\n\n修正が必要な場合は管理者へ連絡してください。");
    return;
  }
  if(type==="clockOut"&&!_dCin){
    var _crossCin=findOpenClockInAcrossFacilities(staffName,_today);
    if(!_crossCin){
      showAlert("本日の出勤打刻がありません。\n\n先に出勤を打刻してください。");
      return;
    }
  }
  // C2. 休憩3回目以上チェック（施設をまたいだ休憩も1回として数えるため全施設横断でカウント）
  if(type==="breakStart"){
    var _allDr=records.filter(function(r){return r.staff===staffName&&r.date===_today&&!r.deleted;});
    var _bpairs=getBreakPairs(_allDr);
    var _completedBreaks=_bpairs.filter(function(p){return p.end!=null;}).length;
    if(_completedBreaks>=2){
      showAlert("休憩は2回まで記録できます。\n追加休憩が必要な場合は管理者に連絡してください。");
      return;
    }
  }
  // D. 出勤→退勤の短時間警告チェック
  if(type==="clockOut"){
    var _sr=_dr.slice().sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
    var _lr=_sr[_sr.length-1];
    if(!_lr){var _crossCinD=findOpenClockInAcrossFacilities(staffName,_today);if(_crossCinD)_lr=_crossCinD;}
    if(_lr&&_lr.type==="clockIn"){
      var _em=Math.floor((d-new Date(_lr.timestamp))/60000);
      var _im="前回：出勤 "+_lr.time+"\n現在：退勤 "+fmtTime(d)+"\n経過："+_em+"分";
      if(_em<5){
        showModal({title:"打刻内容を確認してください",message:_im+"\n\n誤って退勤していませんか？",alertOnly:false,okLabel:"退勤する",onOK:function(){_execPunch(type,d);},onCancel:function(){}});
        return;
      }
      if(_em<10){
        showAlert("打刻内容を確認してください\n\n"+_im,function(){_execPunch(type,d);});
        return;
      }
    }
  }
  // E. clockIn時の施設確定チェック（施設不明のまま保存させない）
  if(type==="clockIn"){
    var _so3=staffList.find(function(s){return s.name===staffName;})||{};
    var _wfCheck=(_so3.canSupportWork&&selectedWorkFacility)?selectedWorkFacility:(facilityName||_so3.location||"");
    if(!_wfCheck){
      showAlert("施設が確定できません。\nスタッフの所属施設が未登録です。\n管理者に連絡してください。");
      return;
    }
  }
  // F. 通常保存処理
  _execPunch(type,d);
}

function doFacilityChange(toFac){
  if(!tokenValid)return;
  if(viewerMode){console.warn("[viewerMode] write blocked");return;}
  // ★ 打刻と同じ理由でサーバの当日打刻を受け取る前は実行しない（経路＝支給額に直結する）
  if(!recordsReady&&writePolicy==="full"){
    showAlert("本日の打刻状態を確認しています。\n\n数秒お待ちのうえ、もう一度お試しください。");
    return;
  }
  if(!toFac)return;
  var _fso2=staffList.find(function(s){return s.name===staffName;})||{};
  if(!_fso2.canSupportWork){console.warn("[facilityChange] not permitted");return;}
  var d=new Date(),dk=fmtDateKey(d);
  // 再チェック（モーダル表示中に状態が変わった場合の保険）
  var _dr=records.filter(function(r){return r.staff===staffName&&r.date===dk&&!r.deleted;})
    .sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
  var _cin=_dr.find(function(r){return r.type==="clockIn";});
  var _cout=_dr.find(function(r){return r.type==="clockOut";});
  var _lastAny=_dr.length?_dr[_dr.length-1].type:null;
  if(!_cin||_cout||_lastAny==="breakStart"){showAlert("打刻状態が変わりました。\n画面を確認してもう一度操作してください。");render();return;}
  var cur=getCurrentWorkFacility(staffName,dk);
  if(cur&&cur===toFac){showAlert("すでに「"+toFac+"」で勤務中です。");return;}
  facilityChangeTo=toFac;
  _execPunch("facilityChange",d);
}

function generateViewerToken(){
  var chars='abcdefghijklmnopqrstuvwxyz0123456789';
  var arr=new Uint8Array(24);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(function(b){return chars[b%chars.length];}).join('');
}
// トークンの伏せ字表示（先頭4文字＋末尾2文字のみ）
function maskToken(t){
  t=String(t||"");

  return t.slice(0,4)+"••••••••"+t.slice(-2);
}

async function hashPin(pin){
  var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("honomi_pin_v1:"+pin));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
function isLegacyPin(val){return /^\d{4}$/.test(val);}
// adminPinReady は廃止。PINの有無はクライアントから判定しない（サーバが判定する）。
// staffPins の値は string（hash or legacy 4桁）または {hash,plain} オブジェクトの混在を吸収
function getStoredPin(name){
  var v=staffPins[name];
  if(!v)return{hash:null,plain:null};
  if(typeof v==="object")return{hash:v.hash||null,plain:v.plain||null};
  return{hash:v,plain:null};
}

/**
 * 管理者PIN認証。★ 照合はサーバ（/api/auth/admin）だけで行う。
 *   公開領域の config/adminPinHash（非ソルトSHA-256・8桁固定）は一切参照しない。
 *   認証成功と同時に admin ロールのセッションが確立する（別途の昇格呼び出しは不要）。
 * UI は従来どおり8桁入力→自動判定。応答待ちの間だけ既存のメッセージ行に「確認中…」を出す。
 */
async function pinOk(){
  if(pinChecking)return;
  // ★ 桁数でクライアントが弾いてよいのは「サーバが構造的に受理しない」範囲だけ。
  //   8桁で弾くと、サーバが受理する4〜7桁のPIN（--allow-short-admin-pin 経由で
  //   /authz に載りうる）を UI から一度も送信できなくなり、
  //   さらに「→」ボタンと Enter が無反応になって現行の操作感が変わる。
  //   4桁未満だけは admin.js の形式ゲートで確実に落ちるので、
  //   従来と同じ表示をローカルで返し、無駄な往復とレート枠の消費を避ける。
  if(pinInput.length<4){
    pinInput="";pinError=true;pinErrorMsg="";render();
    if(pinTimer)clearTimeout(pinTimer);
    pinTimer=setTimeout(function(){pinError=false;pinErrorMsg="";render();},1800);
    return;
  }
  var inputStr=pinInput;
  // ★ render() も try の内側に入れる。ここで例外が出ると pinChecking が true のまま残り、
  //   pinTap も pinOk も即 return するため PIN 画面がリロードまで無反応になる。
  // ★ 管理者PIN照合はサーバ応答を待つ唯一の経路。
  //   コールドスタート＋レート遅延で既定5秒を超え得るため、この経路だけ余裕を持たせる。
  var res;
  try{
    pinChecking=true;pinError=false;pinErrorMsg="";
    if(pinTimer)clearTimeout(pinTimer);
    render();
    res=await establishSessionEx("admin",{pin:inputStr},12000);
  }finally{
    // ★ 例外時も必ず解除する。true のまま残ると pinTap も pinOk も即 return し、
    //   PIN画面がリロードするまで無反応になる。
    pinChecking=false;
  }
  if(res&&res.ok){
    isAdminAuthenticated=true;screen="admin";adminTab="records";pinInput="";pinError=false;pinErrorMsg="";
    render();initFcmForAdmin();
    return;
  }
  pinInput="";pinError=true;
  // 「PINが違う」と「サーバへ届かない」を区別する。同じ文言にすると復旧手段を誤る。
  var hold=1800;
  var st=res&&res.status;
  if(st===401||st===403){pinErrorMsg="PINが違います";}
  else if(st===429){pinErrorMsg="試行が多すぎます。しばらく待って再度お試しください";hold=3000;}
  else if(st===503){pinErrorMsg="認証の準備が完了していません。管理者にお問い合わせください";hold=3000;}
  else{pinErrorMsg="認証サーバに接続できません。通信状態を確認してください";hold=3000;}
  render();
  pinTimer=setTimeout(function(){pinError=false;pinErrorMsg="";render();},hold);
}

function uploadDocument(){
  // デモ／テスト画面ではアップロード不可（機能復活時にも有効なよう、無効化returnより前に置く）
  if(writePolicy!=="full"){demoWriteBlocked();return;}
  // CAMERA_UPLOAD_DISABLED
  return;
  var f=selectedDocFile;
  if(!f){showAlert('ファイルを選択してください');return;}
  var title=(document.getElementById('doc-title')||{value:''}).value.trim();
  if(!title){showAlert('タイトルを入力してください');return;}
  var memo=(document.getElementById('doc-memo')||{value:''}).value.trim();
  var ext=(f.name.split('.').pop()||'').toLowerCase();
  var docId=generateRecordId();
  var storagePath='documents/'+docId+'_'+f.name;
  var encodedPath=encodeURIComponent(storagePath);
  var uploadUrl=STORAGE_BASE+'?uploadType=media&name='+encodedPath;
  var btn=document.getElementById('btn-doc-upload');
  var progressWrap=document.getElementById('doc-progress-wrap');
  var progressBar=document.getElementById('doc-progress-bar');
  var progressText=document.getElementById('doc-progress-text');
  if(btn){btn.disabled=true;btn.textContent='アップロード中...';}
  if(progressWrap)progressWrap.style.display='block';
  getAuthToken().then(function(tok){
    var xhr=new XMLHttpRequest();
    xhr.open('POST',uploadUrl);
    xhr.setRequestHeader('Content-Type',f.type||'application/octet-stream');
    xhr.setRequestHeader('Authorization','Bearer '+tok);
    xhr.upload.onprogress=function(e){
      if(e.lengthComputable){
        var pct=Math.round(e.loaded/e.total*100);
        if(progressBar)progressBar.style.width=pct+'%';
        if(progressText)progressText.textContent=pct+'%';
      }
    };
    xhr.onload=function(){
      if(xhr.status===200){
        var resp=JSON.parse(xhr.responseText);
        var token=resp.downloadTokens||'';
        var downloadURL=STORAGE_BASE+'/'+encodedPath+'?alt=media'+(token?'&token='+token:'');
        var metadata={
          title:title,fileName:f.name,fileType:ext,fileSize:f.size,
          storageRef:storagePath,downloadURL:downloadURL,
          uploadedAt:new Date().toISOString(),uploadedBy:'admin',memo:memo,isActive:true
        };
        authFetch(DB_DOCS+'/'+docId+'.json',{
          method:'PUT',headers:{'Content-Type':'application/json'},
          body:JSON.stringify(metadata)
        }).then(function(){
          selectedDocFile=null;
          showAlert('アップロードしました',function(){setTab('documents');});
        }).catch(function(){
          showAlert('メタデータの保存に失敗しました');
          if(btn){btn.disabled=false;btn.textContent='アップロード';}
          if(progressWrap)progressWrap.style.display='none';
        });
      } else {
        var msg='アップロードに失敗しました（'+xhr.status+'）';
        if(xhr.status===403||xhr.status===401)msg+='\nFirebase Storage のルールを確認してください';
        showAlert(msg);
        if(btn){btn.disabled=false;btn.textContent='アップロード';}
        if(progressWrap)progressWrap.style.display='none';
      }
    };
    xhr.onerror=function(){
      showAlert('アップロードに失敗しました\nネットワーク接続を確認してください');
      if(btn){btn.disabled=false;btn.textContent='アップロード';}
      if(progressWrap)progressWrap.style.display='none';
    };
    xhr.send(f);
  }).catch(function(){
    showAlert('認証トークンの取得に失敗しました');
    if(btn){btn.disabled=false;btn.textContent='アップロード';}
    if(progressWrap)progressWrap.style.display='none';
  });
}

    var tok=await getAuthToken().catch(function(){return "";});
    if(!tok)return {ok:false,status:0,data:null};
    var payload=Object.assign({idToken:tok,action:action},params||{});
    var r=await fetch(MILEAGE_API,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined
    });
    var d=null;try{d=await r.json();}catch(e){d=null;}
    return {ok:r.ok,status:r.status,data:d};
  }catch(e){return {ok:false,status:0,data:null};}
  finally{if(timer)clearTimeout(timer);}
}

function mileageSleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

/**
 * 世代番号。スタッフ切替のたびに増やす。
 * ★ 進行中の非同期処理は「開始時の世代」と一致するときだけ状態へ反映する。
 *   これをしないと、切替直前に投げた取得が切替後に着弾し、
 *   前のスタッフの申請一覧が次のスタッフの画面に残る（共有端末で必ず起きる）。
 */
function mileageStale(g){return g!==mileage.gen;}

/** bootstrap を叩いて応答を返す（状態は書き換えない）。 */
async function mileageBootFetch(){
  return await mileageApi("bootstrap",{},10000);
}

/** bootstrap の応答を状態へ反映する。 */
function mileageBootApply(res){
  mileage.booting=false;
  mileage.booted=true;
  mileage.bootStatus=res.status;
  if(!res.ok||!res.data){
    mileage.bootFailed=true;mileage.enabled=false;
    return;
  }
  var d=res.data;
  mileage.bootFailed=false;
  mileage.role=d.role||"";
  mileage.enabled=d.enabled===true;
  mileage.employeeId=d.employeeId||"";
  mileage.staffName=d.staffName||"";
  if(d.settings)mileage.settings={
    ratePerKm:Number(d.settings.ratePerKm)||0,
    roundMode:d.settings.roundMode||"round",
    configured:d.settings.configured===true   // 管理者が一度も単価を保存していないと false
  };
  if(Array.isArray(d.places))mileage.places=d.places;
  if(d.legs&&typeof d.legs==="object")mileage.legs=d.legs;
  if(d.enabledMap&&typeof d.enabledMap==="object")mileage.enabledMap=d.enabledMap;   // 管理者のみ返る
}

/** 管理者・労務士の再取得用（画面から明示的に呼ぶ）。 */
async function mileageBoot(){
  var g=mileage.gen;
  mileage.booting=true;
  var res=await mileageBootFetch();
  if(mileageStale(g))return;
  mileageBootApply(res);
}

 * スタッフ切替・打刻画面終了時に呼ぶ。

 */

/**
 * 打刻画面から呼ぶ。取得できたら1回だけ再描画する（起動をブロックしない）。
 *
 * ★ スタッフ役割トークンの確立（elevateStaffSession）を待つ。待たずに呼ぶと
 *   匿名トークンで bootstrap して 403 になり、利用ONの職員にもメニューが出ない。
 * ★★ さらに「サーバが解決した本人」と「いま画面に出ているスタッフ」の一致を必ず確認する。★★
 *   共有端末では、前のスタッフAの役割トークンがまだ生きている間に次のスタッフBの
 *   打刻画面が描かれうる（PIN新規登録経路では昇格の開始自体が render より遅い。
 *   昇格が失敗した場合も既存セッションは意図的に維持される仕様）。
 *   一致を見ないと、Bの画面にAの申請一覧が出て、Bの操作がA名義で保存される。
 */
function mileageBootForStaff(){
  if(mileage.booted||mileage.booting)return;
  var g=mileage.gen,who=staffName;
  mileage.booting=true;
  (async function(){
    var p0=_elevatePromise;
    for(var attempt=0;attempt<6;attempt++){
      // 役割トークンの確立を待つ（最大約4秒×試行）。確立しなくても必ず1回は問い合わせる。
      for(var i=0;i<20;i++){
        if(_elevatePromise){try{await _elevatePromise;}catch(e){}}
        if(mileageStale(g))return;
        if(_authRole!=="anon"||screen!=="punch")break;
        await mileageSleep(200);
      }
      if(mileageStale(g))return;
      var res=await mileageBootFetch();
      if(mileageStale(g))return;
      // 失敗（通信断・403）はその場で確定させる（無限に粘らない）。
      // ★ ただし「未許可の職員は 403」なので、共有端末で前の職員の 403 を
      //   次の職員の結論にしてしまうことがある。boot 開始後に別のスタッフ昇格が
      //   始まっていた場合だけ、1回だけ取り直す（全員が6回叩くことはしない）。
      if(!res.ok||!res.data){
        if(res.status===403&&who&&_elevatePromise!==p0&&attempt===0){
          p0=_elevatePromise;await mileageSleep(400);
          if(mileageStale(g))return;
          continue;
        }
        mileageBootApply(res);return;
      }
      var got=res.data.staffName||"";
      // ★ who があるのに氏名が返らない場合は「未解決」として扱い、一致扱いにしない。
      //   一致扱いにすると、前の職員の未許可応答をそのまま採用して
      //   次の職員のカードが出なくなる（再読込みまで直らない）。
      if(!who||(res.data.role!=="s")||got===who){mileageBootApply(res);break;}
      // 別スタッフのトークンだった → 少し待って取り直す
      if(attempt===5){mileage.booting=false;mileage.booted=true;mileage.enabled=false;return;}
      await mileageSleep(400);
      if(mileageStale(g))return;
    }
    if(mileageStale(g))return;
    if(mileage.enabled&&screen==="punch")render();
  })().catch(function(){mileage.booting=false;mileage.booted=true;});
}

/** 管理画面から呼ぶ。管理者役割トークンの確立を待つ。 */

/**
 * 労務士（閲覧用URL）画面から呼ぶ。
 *
 * ★ 閲覧用URLの役割トークン（r:"v"）の確立を必ず待つ。elevateShareSession は
 *   起動時に走り始めるだけで、その完了を待たずに render() が閲覧画面を描く。

 */
function mileageBootForViewer(){

// ==== SHARED-AUTO-BEGIN ====
// ★★ このブロックは api/_lib/mileage-auto.js（サーバ）と index.html（クライアント）の
//    両方に同一内容で存在する。表示と確定が食い違わないよう、片方だけ変更してはならない。★★
//    （scripts/test-mileage.js の「共有ブロックのソース一致」テストが FAIL する）

/** 距離は 0.1km 刻み。浮動小数の誤差（6.2+4.4=10.600000000000001）を持ち回らない。 */
function mileageAutoRound1(v){var n=Number(v);return isFinite(n)?Math.round(n*10)/10:0;}

/**
 * キーが外部データ（氏名・日付・施設名）由来の索引を作るときは、必ずこれを使う。
 * ★ 素の {} を使うと、キーが "__proto__" のデータを1件書かれるだけで Object.prototype を
 *   汚染できる。/honomi は匿名認証で書けるため、打刻や修正申請に "__proto__" という
 *   氏名を1件混ぜるだけで、管理画面の集計が全職員分おかしくなる（月次確定の妨害になる）。
 */
function mileageAutoDict(){return Object.create(null);}
/** 索引に安全に使えるキーか（プロトタイプを触りにいく特殊キーを弾く）。 */
function mileageAutoSafeKey(k){
  return typeof k==="string"&&k!==""&&k!=="__proto__"&&k!=="prototype"&&k!=="constructor";
}
function mileageAutoHas(o,k){return !!o&&Object.prototype.hasOwnProperty.call(o,k);}

/**
 * 出勤打刻が示す「その日の起点施設」。
 * workFacility（応援先を選んで出勤した場合は応援先）を正とし、
 * 未記録の旧データだけ facilityName（打刻した端末の施設）で補う。
 */
function mileageAutoFacilityOf(r){
  return String((r&&(r.workFacility||r.facilityName))||"");
}

/**
 * 施設変更打刻が示す「移動先」。
 * ★ facilityName へフォールバックしてはならない。facilityName は打刻した端末の施設＝
 *   移動元であり、移動先ではない。補うと実際と逆の経路を作ってしまう。
 *   移動先が記録されていない打刻は、経路を推測せずその打刻だけ使わない。
 */
function mileageAutoDestOf(r){
  return String((r&&r.workFacility)||"");
}

/** 移動距離の判定に使う打刻種別だけを残す（休憩は経路に影響しない）。 */
function mileageAutoIsRouteType(t){
  return t==="clockIn"||t==="clockOut"||t==="facilityChange";
}

/**
 * 同一スタッフ・同一日の打刻から、施設の移動経路（施設名の並び）を組み立てる。
 *
 * ・出勤(clockIn)で区間を開始し、その施設をその日の「起点」とする
 * ・施設変更(facilityChange)ごとに移動先を追加する
 * ・退勤(clockOut)で区間を閉じる
 * ・★ 最後は必ず起点施設へ戻す。実際の退勤打刻が応援先であっても、
 *   帰りの移動は必ず発生しているため（業務ルール）。
 *
 * 戻り値 { routes:[[施設名,...],...], hasMove, noOrigin, notes:[...] }
 */
function mileageAutoBuildNodes(dayRecords){
  var rs=[],i;
  for(i=0;i<dayRecords.length;i++){
    var r0=dayRecords[i];
    if(!r0||r0.deleted)continue;
    if(!mileageAutoIsRouteType(String(r0.type||"")))continue;
    var t=Date.parse(r0.timestamp);
    if(!isFinite(t))continue;   // 時刻が壊れているレコードは順序を決められないので使わない
    rs.push({t:t,i:i,r:r0});
  }
  // ★ 同時刻（管理者の手動追加は秒が 0 になる）でも順序が決まるようにする。
  //   配列順だけに頼ると、サーバとクライアントで並びが変わり結果が食い違う。
  rs.sort(function(a,b){
    if(a.t!==b.t)return a.t-b.t;
    var ai=String(a.r.id||""),bi=String(b.r.id||"");
    if(ai!==bi)return ai<bi?-1:1;
    return a.i-b.i;
  });

  var segs=[],noteMap={},cur=null;
  function note(k){noteMap[k]=true;}
  for(i=0;i<rs.length;i++){
    var rec=rs[i].r,ty=String(rec.type||"");
    if(ty==="clockIn"){
      // 退勤が無いまま次の出勤が来た場合も、前の勤務は前の勤務として閉じる
      if(cur){segs.push(cur);note("multi_shift");}
      cur={origin:mileageAutoFacilityOf(rec),nodes:[mileageAutoFacilityOf(rec)]};
    }else if(ty==="facilityChange"){
      // ★ 出勤打刻が無い状態の施設変更から起点を推測してはならない（打刻忘れの可能性）
      if(!cur){note("orphan_change");continue;}
      var to=mileageAutoDestOf(rec);
      if(!to){note("empty_facility");continue;}
      var from=String(rec.fromFacility||"");
      var last=cur.nodes[cur.nodes.length-1];
      if(from&&last&&from!==last)note("route_mismatch");
      if(to!==last)cur.nodes.push(to);
    }else if(ty==="clockOut"){
      if(cur){segs.push(cur);cur=null;}
    }
  }
  if(cur){note("no_clockout");segs.push(cur);}

  var routes=[],hasMove=false,noOrigin=false;
  // ★ 移動先が記録されていない施設変更があった日は、経路が1区間欠けたまま「正常」に見えてしまう。
  //   欠けた区間を推測せず、確定できない日として扱う（管理者が打刻を直す／削除する）。
  var brokenPunch=!!noteMap.empty_facility;
  for(i=0;i<segs.length;i++){
    var s=segs[i];
    if(s.nodes.length<2)continue;            // 施設間の移動が無い日
    hasMove=true;
    if(!s.origin){noOrigin=true;continue;}   // 起点施設が記録されていない
    var nodes=s.nodes.slice();
    if(nodes[nodes.length-1]!==s.origin)nodes.push(s.origin);   // 最後は必ず起点へ戻す
    routes.push(nodes);
  }
  if(noteMap.orphan_change){hasMove=true;noOrigin=true;}
  if(brokenPunch)hasMove=true;

  var notes=[];
  for(var k in noteMap)if(Object.prototype.hasOwnProperty.call(noteMap,k))notes.push(k);
  notes.sort();
  return {routes:routes,hasMove:hasMove,noOrigin:noOrigin,brokenPunch:brokenPunch,notes:notes};
}

/**
 * この地点に対応づけられた打刻施設名の一覧（現在の名前 ＋ 旧施設名）。
 * ★ 施設マスタ（master/locations）には改名機能が無く、改名は「削除＋追加」になる。
 *   そのため改名しても過去の tc5_records.workFacility は**旧名のまま残る**。
 *   旧名を aliases に入れておくと、過去打刻と新規打刻が同じ地点として集計される。
 *   （過去の打刻は書き換えない。打刻はその時点の事実として保持する。）
 * facilities が配列で入っていればそれを正とする（サーバの loadPlaces が組み立てる）。
 */
function mileageAutoFacilitiesOf(p){
  var src=[],out=[],i,v;
  if(p&&Array.isArray(p.facilities))src=p.facilities;
  else{
    if(p&&p.facility)src.push(p.facility);
    if(p&&Array.isArray(p.aliases))src=src.concat(p.aliases);
  }
  for(i=0;i<src.length;i++){
    v=String(src[i]||"").trim();
    // ★ 同じ地点の中で名前が重複していると「2つの地点が同名」と誤判定して
    //   その施設が丸ごと未対応になるため、必ず取り除く。
    if(v&&out.indexOf(v)<0)out.push(v);
  }
  return out;
}

/**
 * 地点マスタから「施設名 → 地点ID」の対応表を作る。
 * ・places[].facility / aliases（管理画面で明示的に対応づけた施設名）を優先する
 * ・未設定の地点は、地点名と施設名が完全一致する場合だけ対応づける
 * ★ 同じ施設名に複数の地点が対応する場合は、どちらか一方を推測せず「未対応」とする。
 */
function mileageAutoPlaceMap(places){
  var exp=mileageAutoDict(),imp=mileageAutoDict(),i,j,p,key,fl;
  for(i=0;i<(places||[]).length;i++){
    p=places[i];
    if(!p||!p.id||p.active===false)continue;
    fl=mileageAutoFacilitiesOf(p);
    if(fl.length){
      for(j=0;j<fl.length;j++){key=fl[j];(exp[key]=exp[key]||[]).push(p.id);}
      continue;
    }
    key=String(p.name||"").trim();
    if(key)(imp[key]=imp[key]||[]).push(p.id);
  }
  var map=mileageAutoDict();
  for(key in exp)if(exp[key].length===1)map[key]=exp[key][0];
  for(key in imp){
    if(mileageAutoHas(exp,key))continue;   // 明示指定が優先
    if(imp[key].length===1)map[key]=imp[key][0];
  }
  return map;
}

/**
 * 1日分の打刻 → 経路・区間距離・合計距離。
 * ctx = { placeByFacility:{施設名:地点ID}, legs:{"fromId__toId":km} }
 *
 * ★ 未登録区間・未対応施設を 0km として扱ってはならない。status で区別し、
 *   どの区間・どの施設が未登録かを返す。
 */
function mileageAutoDayRoute(dayRecords,ctx){
  var b=mileageAutoBuildNodes(dayRecords);
  var out={status:"none",totalKm:0,legs:[],routes:b.routes,notes:b.notes,
           sig:"",missingPlaces:[],missingLegs:[],
           // attention＝確定は止めないが管理者に見せる不審点（打刻の後編集・複数出勤・退勤漏れ）
           attention:(b.notes.indexOf("route_mismatch")>=0||b.notes.indexOf("multi_shift")>=0
                      ||b.notes.indexOf("no_clockout")>=0)};
  if(!b.hasMove)return out;
  var i,j;
  var sigParts=[];
  for(i=0;i<b.routes.length;i++)sigParts.push(b.routes[i].join(">"));
  out.sig=sigParts.join("|");
  if(b.brokenPunch){out.status="broken_punch";return out;}
  if(b.noOrigin){out.status="no_origin";return out;}

  var total=0,legs=[],missP=[],missPSeen=mileageAutoDict(),missL=[];
  var legMap=(ctx&&ctx.legs)||{},pmap=(ctx&&ctx.placeByFacility)||{};
  for(i=0;i<b.routes.length;i++){
    var nodes=b.routes[i];
    for(j=0;j+1<nodes.length;j++){
      var fN=nodes[j],tN=nodes[j+1];
      var fId=mileageAutoHas(pmap,fN)?pmap[fN]:"";
      var tId=mileageAutoHas(pmap,tN)?pmap[tN]:"";
      if(!fId&&!missPSeen[fN]){missPSeen[fN]=true;missP.push(fN);}
      if(!tId&&!missPSeen[tN]){missPSeen[tN]=true;missP.push(tN);}
      var km=null;
      if(fId&&tId){
        var key=fId+"__"+tId;
        km=mileageAutoHas(legMap,key)?legMap[key]:null;
        if(km==null)missL.push({fromName:fN,toName:tN});
      }
      legs.push({fromName:fN,toName:tN,km:km});
      if(km!=null)total=mileageAutoRound1(total+km);
    }
  }
  out.legs=legs;
  out.missingPlaces=missP;
  out.missingLegs=missL;
  out.totalKm=mileageAutoRound1(total);
  out.status=(missP.length||missL.length)?"missing_leg":"auto";
  return out;
}

/** 経路の表示文字列（"ナナイロ → ハルイロ → ナナイロ"）。複数勤務の日は「／」で区切る。 */
function mileageAutoRouteText(routes){
  var out=[];
  for(var i=0;i<(routes||[]).length;i++)out.push(routes[i].join(" → "));
  return out.join(" ／ ");
}

/**
 * 1人・1か月分の自動集計。recs は対象スタッフの打刻レコード（他スタッフを含んでいてもよいが、
 * 呼び出し側で staff 一致を必ず絞ること）。
 * 戻り値 { days:{ "YYYY-MM-DD": dayRoute }, dates:[...] }
 */
function mileageAutoMonth(recs,ym,ctx){
  var byDate=mileageAutoDict(),i;
  for(i=0;i<(recs||[]).length;i++){
    var r=recs[i];
    if(!r||r.deleted)continue;
    var d=String(r.date||"");
    if(d.slice(0,7)!==ym)continue;
    if(!mileageAutoSafeKey(d))continue;
    if(!mileageAutoIsRouteType(String(r.type||"")))continue;
    (byDate[d]=byDate[d]||[]).push(r);
  }
  var dates=[];
  for(var k in byDate)dates.push(k);
  dates.sort();
  var days=mileageAutoDict(),keep=[];
  for(i=0;i<dates.length;i++){
    var res=mileageAutoDayRoute(byDate[dates[i]],ctx);
    if(res.status==="none")continue;
    days[dates[i]]=res;keep.push(dates[i]);
  }
  return {days:days,dates:keep};
}

/**
 * 自動集計と、例外の手入力申請・打刻修正申請の状態を突き合わせて、月の確定対象行を作る。
 *
 * ・承認済みの手入力申請がある日は、その日の自動集計より手入力を優先する（例外運用の趣旨）
 * ・未処理の手入力申請がある日は確定できない（pending_request）
 * ・移動がある日に未処理の打刻修正申請があると確定できない（pending_correction）
 * ・却下された手入力申請は無効。自動集計の値へ戻す
 *
 * 戻り値 { rows:[...], totalKm, blockers:[{date,status}] }
 *   rows[].status: "auto"|"manual"|"no_origin"|"missing_leg"|"pending_correction"|"pending_request"
 */
function mileageAutoMerge(autoDays,manualByDate,pendingCorrectionDates){
  var seen=mileageAutoDict(),list=[],k;
  for(k in autoDays)if(!seen[k]){seen[k]=1;list.push(k);}
  for(k in manualByDate)if(mileageAutoSafeKey(k)&&!seen[k]){seen[k]=1;list.push(k);}
  list.sort();
  var rows=[],totalKm=0,blockers=[];
  for(var i=0;i<list.length;i++){
    var d=list[i];
    var a=mileageAutoHas(autoDays,d)?autoDays[d]:null;
    var m=mileageAutoHas(manualByDate,d)?manualByDate[d]:null;
    var mSt=m?String(m.status||""):"";
    var row={date:d,source:"auto",status:"none",km:0,sig:a?a.sig:"",
             autoKm:a?a.totalKm:0,autoStatus:a?a.status:"none",
             routeText:a?mileageAutoRouteText(a.routes):"",
             notes:a?a.notes:[],missingPlaces:a?a.missingPlaces:[],missingLegs:a?a.missingLegs:[],
             attention:!!(a&&a.attention)};
    if(m&&mSt==="pending"){
      row.source="manual";row.status="pending_request";row.km=mileageAutoRound1(m.totalKm);
      row.routeText=String(m.routeText||row.routeText);
    }else if(m&&mSt==="approved"){
      row.source="manual";row.status="manual";row.km=mileageAutoRound1(m.totalKm);
      row.routeText=String(m.routeText||row.routeText);
    }else{
      if(m&&mSt==="rejected")row.manualRejected=true;
      if(!a||a.status==="none")continue;
      row.status=(pendingCorrectionDates&&mileageAutoHas(pendingCorrectionDates,d))?"pending_correction":a.status;
      row.km=(row.status==="auto")?a.totalKm:0;
    }
    if(row.status==="auto"||row.status==="manual")totalKm=mileageAutoRound1(totalKm+row.km);
    else blockers.push({date:d,status:row.status});
    rows.push(row);
  }
  return {rows:rows,totalKm:mileageAutoRound1(totalKm),blockers:blockers};
}

/**
 * 確定済みスナップショットと現在の集計を突き合わせ、確定後に生じた差異を返す。
 * ★ 自動で書き換えない。管理者へ「確定後差異あり」として提示するためだけに使う。
 *   経路（施設の並び）と距離が同じなら差異としない（時刻だけの打刻修正は支給額に影響しないため）。
 */
function mileageAutoDiff(snapDays,curRows){
  var snap=mileageAutoDict(),cur=mileageAutoDict(),i,k,d;
  for(i=0;i<(snapDays||[]).length;i++){
    d=String(snapDays[i].date||"");
    if(mileageAutoSafeKey(d))snap[d]={km:mileageAutoRound1(snapDays[i].km),sig:String(snapDays[i].sig||""),source:String(snapDays[i].source||"")};
  }
  for(i=0;i<(curRows||[]).length;i++){
    d=String(curRows[i].date||"");
    if(mileageAutoSafeKey(d))cur[d]={km:mileageAutoRound1(curRows[i].km),sig:String(curRows[i].sig||""),
                 source:String(curRows[i].source||""),status:String(curRows[i].status||"")};
  }
  var seen=mileageAutoDict(),dates=[];
  for(k in snap)if(!seen[k]){seen[k]=1;dates.push(k);}
  for(k in cur)if(!seen[k]){seen[k]=1;dates.push(k);}
  dates.sort();
  var diffs=[];
  for(i=0;i<dates.length;i++){
    d=dates[i];
    var s=snap[d]||null,c=cur[d]||null;
    if(s&&c&&s.km===c.km&&s.sig===c.sig)continue;
    // ★ 確定時は要確認が0件でなければ確定できないので、スナップショットに無い日が
    //   要確認として現れたなら「確定後に新しく発生した」ということ。必ず報告する。
    //   除外してよいのは、そもそも集計対象にならない日（移動なし）だけ。
    if(!s&&c&&c.status==="none")continue;
    diffs.push({date:d,
      beforeKm:s?s.km:0,afterKm:c?c.km:0,
      beforeSig:s?s.sig:"",afterSig:c?c.sig:"",
      status:c?c.status:"removed"});
  }
  return diffs;
}
// ==== SHARED-AUTO-END ====

// ---- 自動集計のクライアント側の入口（表示用。確定の正本はサーバの closeMonth）----
// ★ 打刻（tc5_records）は起動時に全件取得済みなので、表示のたびにサーバへ取りに行かない。
//   サーバは月次確定・要確認チェックのときだけ打刻を読み、同じ共有ロジックで計算し直す。
var MILEAGE_AUTO_BADGE={
  auto:'<span style="background:#dcfce7;color:#166534;border:1px solid #86efac;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:3px;">自動計算済</span>',

  //   解消せず、1人1日の解消不能な要確認で月全体の確定が止まる。実際に効く復旧経路は手入力（例外）だけ。
  no_origin:"その日の出勤打刻（起点施設）が確認できません。応援打刻から起点を推測せず、距離も金額も確定しません。※打刻修正申請を承認しても解消しません（承認で作られる出勤打刻には施設が記録されないため）。職員に「打刻に無い移動の手入力（例外）」で登録してもらい、このタブの「手入力の承認」で承認してください。",

function mileageAutoIsBlocking(st){
  return st==="no_origin"||st==="missing_leg"||st==="pending_correction"
    ||st==="pending_request"||st==="broken_punch";
}
/** 地点マスタから「施設名→地点ID」の対応表と区間距離を束ねる。 */
function mileageAutoCtx(){
  return {placeByFacility:mileageAutoPlaceMap(mileage.places||[]),legs:mileage.legs||{}};
}
/** 対象スタッフ・対象月の打刻だけを取り出す。 */
function mileageAutoRecordsOf(staffNm,ym){
  var out=[];
  if(!mileageAutoSafeKey(staffNm)||!ym)return out;
  for(var i=0;i<records.length;i++){
    var r=records[i];
    if(!r||r.deleted)continue;
    if(r.staff!==staffNm)continue;
    if(String(r.date||"").slice(0,7)!==ym)continue;
    if(!mileageAutoIsRouteType(String(r.type||"")))continue;
    out.push(r);
  }
  return out;
}
/** 未処理の打刻修正申請 → {日付:true} */
function mileageAutoPendingCorr(staffNm,ym){
  var out=mileageAutoDict();
  if(!staffNm||!ym)return out;
  for(var i=0;i<correctionRequests.length;i++){
    var c=correctionRequests[i];
    if(!c||c.staff!==staffNm)continue;
    if(String(c.status||"")!=="pending")continue;
    var d=String(c.date||"");
    if(d.slice(0,7)!==ym||!mileageAutoSafeKey(d))continue;
    out[d]=true;
  }
  return out;
}
/** 手入力の申請 → {日付:{status,totalKm,routeText}}（サーバの manualByDateOf と同じ優先順位）。 */
function mileageAutoManualOf(list){
  var out=mileageAutoDict(),rank=function(s){return s==="approved"?3:s==="pending"?2:1;};
  (list||[]).forEach(function(r){
    if(!r||!mileageAutoSafeKey(r.date))return;
    var prev=out[r.date];
    if(prev&&rank(prev.status)>=rank(r.status))return;
    out[r.date]={status:r.status,totalKm:mileageAutoRound1(r.totalKm),routeText:mileageRouteText(r)};
  });
  return out;
}
/**
 * 1人・1か月分の集計（自動＋手入力）。isAutoTarget=false（利用OFF）なら手入力だけ。
 * recs を渡すと打刻の走査を省略する（管理画面は全職員分を1回の走査で用意する）。
 */
function mileageAutoCompute(staffNm,ym,manualList,isAutoTarget,recs,ctx,corrIdx){
  ctx=ctx||mileageAutoCtx();
  var auto=(isAutoTarget&&staffNm)
    ?mileageAutoMonth(recs||mileageAutoRecordsOf(staffNm,ym),ym,ctx)
    :{days:{},dates:[]};
  var corr=corrIdx?(corrIdx[staffNm]||{}):mileageAutoPendingCorr(staffNm,ym);
  return mileageAutoMerge(auto.days,mileageAutoManualOf(manualList),corr);
}
/**
 * 対象月の打刻を「氏名 → レコード」で1回だけ索引化する。
 * ★ 職員ごとに records を走査すると（人数×全打刻件数）になり、10秒ごとの再描画で効いてくる。
 */
function mileageAutoIndexRecords(ym,nameSet){
  var idx=mileageAutoDict();
  if(!ym)return idx;
  for(var i=0;i<records.length;i++){
    var r=records[i];
    if(!r||r.deleted)continue;
    var nm=r.staff;
    if(!mileageAutoSafeKey(nm)||!Object.prototype.hasOwnProperty.call(nameSet,nm))continue;
    if(String(r.date||"").slice(0,7)!==ym)continue;
    if(!mileageAutoIsRouteType(String(r.type||"")))continue;
    (idx[nm]=idx[nm]||[]).push(r);
  }
  return idx;
}
/** 対象月の未処理の打刻修正申請を「氏名 → {日付:true}」で索引化する。 */
function mileageAutoIndexCorrections(ym){
  var idx=mileageAutoDict();
  if(!ym)return idx;
  for(var i=0;i<correctionRequests.length;i++){
    var c=correctionRequests[i];
    if(!c||String(c.status||"")!=="pending")continue;
    var d=String(c.date||"");
    if(d.slice(0,7)!==ym)continue;
    var nm=c.staff;
    // ★ 氏名・日付は誰でも書ける /honomi 由来。"__proto__" を1件混ぜられるだけで
    //   全職員の集計が壊れる（月次確定の妨害になる）ため、キーを必ず検査する。
    if(!mileageAutoSafeKey(nm)||!mileageAutoSafeKey(d))continue;
    (idx[nm]=idx[nm]||mileageAutoDict())[d]=true;
  }
  return idx;
}
/** 打刻に出てくるのに地点マスタへ対応づけられていない施設名（管理者向けの警告用）。 */
function mileageAutoMissingFacilities(rows){
  var seen={},out=[];
  (rows||[]).forEach(function(r){
    (r.missingPlaces||[]).forEach(function(f){if(f&&!seen[f]){seen[f]=true;out.push(f);}});
  });
  return out;
}

// ---- 計算（表示用。金額の正本はサーバのスナップショット）----
function mileageRound1(v){var n=Number(v);return isFinite(n)?Math.round(n*10)/10:0;}
function mileageApplyRound(v,mode){
  var n=Number(v);if(!isFinite(n))return 0;
  if(mode==="floor")return Math.floor(n);
  if(mode==="ceil")return Math.ceil(n);
  if(mode==="none")return mileageRound1(n);
  return Math.round(n);
}
function mileageAmount(km,rate,mode){return mileageApplyRound(mileageRound1(km)*Number(rate||0),mode);}
function mileagePlaceName(id){
  for(var i=0;i<mileage.places.length;i++)if(mileage.places[i].id===id)return mileage.places[i].name;
  return "";
}
/** 地点IDの並びから区間と距離を組み立てる。未登録区間は km=null（0km にしない）。 */
function mileageBuildRoute(ids){
  var legs=[],total=0,missing=[];
  for(var i=0;i+1<ids.length;i++){
    var k=ids[i]+"__"+ids[i+1];
    var km=Object.prototype.hasOwnProperty.call(mileage.legs,k)?mileage.legs[k]:null;
    legs.push({from:ids[i],to:ids[i+1],km:km});
    if(km==null)missing.push(i);else total=mileageRound1(total+km);
  }
  return {legs:legs,totalKm:mileageRound1(total),missing:missing};
}
/** 職員がよく使う地点（自分の申請履歴から算出）。選択肢の上位に出す。 */
function mileageFrequentPlaceIds(){
  var cnt={};
  mileage.myRequests.forEach(function(r){
    (r.placeIds||[]).forEach(function(id){cnt[id]=(cnt[id]||0)+1;});
  });
  return Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
}
function mileagePlaceOptions(selected){
  var freq=mileageFrequentPlaceIds();
  var byId={};mileage.places.forEach(function(p){byId[p.id]=p;});
  var top=[],rest=[];
  freq.forEach(function(id){if(byId[id])top.push(byId[id]);});
  mileage.places.forEach(function(p){if(freq.indexOf(p.id)<0)rest.push(p);});
  function opt(p){return '<option value="'+esc(p.id)+'"'+(p.id===selected?" selected":"")+'>'+esc(p.name)+'</option>';}
  var html='<option value=""'+(selected?"":" selected")+'>選択してください</option>';
  if(top.length){
    html+='<optgroup label="よく使う地点">'+top.map(opt).join("")+'</optgroup>';
    if(rest.length)html+='<optgroup label="そのほか">'+rest.map(opt).join("")+'</optgroup>';
  }else{
    html+=mileage.places.map(opt).join("");
  }
  return html;
}

// ---- 職員側 ----

function mileageThisMonth(){var t=getTodayJSTStr();return t.slice(0,7);}
/** "2026-08" → "2026年8月"（既存の月セレクトと同じくゼロ埋めを外す）。 */
function mileageYmLabel(m){
  var p=String(m||"").split("-");
  return p.length===2?(p[0]+"年"+parseInt(p[1],10)+"月"):String(m||"");
}
function mileageMonthOptions(sel,months){
  return months.map(function(m){
    return '<option value="'+esc(m)+'"'+(m===sel?" selected":"")+'>'+esc(mileageYmLabel(m))+'</option>';
  }).join("");
}
/** 翌月＋直近12か月の選択肢（新しい順）。サーバが受け付ける範囲と合わせる。 */
function mileageRecentMonths(){
  var out=[],t=getTodayJSTStr(),y=parseInt(t.slice(0,4),10),m=parseInt(t.slice(5,7),10);
  var ny=y,nm=m+1;if(nm>12){nm=1;ny++;}
  out.push(ny+"-"+pad(nm));   // 翌月（サーバは翌月末まで申請を受け付ける）
  for(var i=0;i<12;i++){
    out.push(y+"-"+pad(m));
    m--;if(m<1){m=12;y--;}
  }
  return out;
}

async function mileageLoadMy(ym){
  var g=mileage.gen;
  mileage.myLoading=true;mileage.myMonth=ym;mileage.myError=false;
  var res=await mileageApi("myMonth",{ym:ym});
  // ★ スタッフが切り替わった後に着弾した応答は捨てる（前の人の一覧を残さない）
  if(mileageStale(g))return;
  // ★ 表示中の月が変わっていたら、この応答は古い（月切替の取りこぼし防止）
  if(mileage.myMonth!==ym)return;
  mileage.myLoading=false;
  if(res.ok&&res.data){
    mileage.myRequests=Array.isArray(res.data.requests)?res.data.requests:[];
    mileage.myClosed=res.data.closed===true;
    // 確定済みの月は、現在の打刻からの再計算ではなく確定額を表示する
    mileage.mySnapshot=(res.data.snapshot&&typeof res.data.snapshot==="object")?res.data.snapshot:null;
  }else{
    // ★ 取得失敗を「0件」として見せない（申請したのに消えたように見える）
    mileage.myRequests=[];mileage.myClosed=false;mileage.myError=true;mileage.mySnapshot=null;
  }
  if(screen==="punch")render();
}
function mileageSetMyMonth(v){
  if(!/^\d{4}-\d{2}$/.test(v))return;
  if(v===mileage.myMonth&&!mileage.myError)return;
  mileage.myRequests=[];mileage.myError=false;
  mileageLoadMy(v);
}

function mileageOpenForm(reqId){
  mileage.formOpen=true;
  var r=reqId?mileage.myRequests.find(function(x){return x.id===reqId;}):null;
  if(r){
    mileage.draft={date:r.date,placeIds:(r.placeIds||[]).slice(),note:r.note||"",editingId:r.id};
  }else{
    mileage.draft={date:getTodayJSTStr(),placeIds:["",""],note:"",editingId:""};
  }
  render();
}
function mileageCancelForm(){
  mileage.formOpen=false;
  mileage.draft={date:"",placeIds:[],note:"",editingId:""};

}
function mileageSetDate(v){mileage.draft.date=v;render();}
function mileageSetNote(v){mileage.draft.note=v;}   // 再描画しない（入力を妨げない）
function mileageSetPlace(i,v){mileage.draft.placeIds[i]=v;render();}
function mileageAddPlace(){
  if(mileage.draft.placeIds.length>=20){showAlert("1日に登録できる地点は20か所までです");return;}
  mileage.draft.placeIds.push("");render();

/** 直近の申請ルートをそのままコピーする（同じ移動が多いので再入力させない）。 */
function mileageCopyLastRoute(){
  var list=mileage.myRequests.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  if(!list.length){showAlert("コピーできる過去の申請がありません");return;}
  mileage.draft.placeIds=(list[0].placeIds||[]).slice();
  render();
}

async function mileageSubmit(){
  if(mileage.busy)return;
  var d=mileage.draft;
  if(!d.date){showAlert("日付を選んでください");return;}
  var ids=d.placeIds.filter(function(v){return !!v;});
  if(ids.length!==d.placeIds.length){showAlert("すべての地点を選んでください");return;}
  if(ids.length<2){showAlert("地点を2つ以上選んでください");return;}
  var route=mileageBuildRoute(ids);
  if(route.missing.length){
    showAlert("この区間の距離が登録されていません。\n\n"
      +route.missing.map(function(i){return "・"+mileagePlaceName(ids[i])+" → "+mileagePlaceName(ids[i+1]);}).join("\n")
      +"\n\n管理者が距離を登録すると申請できます。");
    return;
  }
  var g=mileage.gen;
  mileage.busy=true;render();
  var res=await mileageApi("saveRequest",{date:d.date,placeIds:ids,note:d.note||""});
  if(mileageStale(g))return;   // スタッフが切り替わっていたら結果を反映しない
  mileage.busy=false;
  if(!res.ok){
    if(res.data&&res.data.error==="missing_leg"&&Array.isArray(res.data.missing)){
      showAlert("この区間の距離が登録されていません。\n\n"
        +res.data.missing.map(function(m){return "・"+(m.fromName||"?")+" → "+(m.toName||"?");}).join("\n")
        +"\n\n管理者が距離を登録すると申請できます。");
      // マスタがずれている可能性があるので取り直す
      mileageBoot();
    }else{
      showAlert(mileageErrText(res));
    }
    render();return;
  }
  mileage.formOpen=false;
  mileage.draft={date:"",placeIds:[],note:"",editingId:""};
  var ym=d.date.slice(0,7);
  await mileageLoadMy(ym);
  showAlert("申請しました");
}

function mileageDeleteReq(id){
  var r=mileage.myRequests.find(function(x){return x.id===id;});
  if(!r)return;
  showConfirm(r.date+" の移動距離申請を取り消しますか？",function(){
    (async function(){
      if(mileage.busy)return;
      var g=mileage.gen;
      mileage.busy=true;
      var res=await mileageApi("deleteRequest",{ym:mileage.myMonth,requestId:id});
      if(mileageStale(g))return;
      mileage.busy=false;
      if(!res.ok){showAlert(mileageErrText(res));render();return;}
      await mileageLoadMy(mileage.myMonth);
    })();
  });
}

/** 経路の表示文字列（ナナイロ → ハルイロ → 本社）。名称はスナップショット優先。 */
function mileageRouteText(r){
  if(Array.isArray(r.legs)&&r.legs.length){
    var names=r.legs.map(function(l){return l.fromName||mileagePlaceName(l.from);});
    names.push(r.legs[r.legs.length-1].toName||mileagePlaceName(r.legs[r.legs.length-1].to));

              +'<button onclick="mileageDeleteReq(\''+escJs(r.id)+'\')" style="background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:2px;padding:4px 10px;font-size:.74rem;font-weight:700;cursor:pointer;font-family:inherit;">取消</button>'
              +'</span>'
            :'')

          +(r.status==="approved"?'<div style="font-size:.72rem;color:#3730a3;margin-top:3px;">上の集計に反映済みです</div>':"")
          +(r.note?'<div style="font-size:.72rem;color:#8496a7;margin-top:3px;">'+esc(r.note)+'</div>':"")
          +(r.status==="rejected"&&r.rejectReason?'<div style="font-size:.72rem;color:#b91c1c;margin-top:3px;">却下理由：'+esc(r.rejectReason)+'</div>':"")
          +'</div>';
      }).join("")
      :'<div style="font-size:.78rem;color:#8496a7;padding:6px 2px;">手入力した移動はありません</div>');

  var blockCount=autoRes.blockers.length;
  // ★ 手入力分（myRequests）が未取得・取得失敗のときは、集計結果を確定値として見せない。

  var manualReady=!mileage.myLoading&&!mileage.myError;

  var snap=(mileage.myClosed&&mileage.mySnapshot)?mileage.mySnapshot:null;
  var totalTxt=snap?(mileageRound1(snap.totalKm)+' km'):(manualReady?(totalKm+' km'):'—');

    :(manualReady?(mileageAmount(totalKm,rate,mode).toLocaleString()+' 円'):'—');

    // ★ 打刻を読めていないときに 0km を「移動なし」として見せない（未取得と 0 を区別する）
    +(!records.length?'<div style="font-size:.74rem;color:#b91c1c;background:#fee2e2;border:1px solid #fecaca;border-radius:4px;padding:6px 9px;margin-bottom:8px;">打刻データを読み込めていないため、自動集計を表示できません。通信状態を確認して画面を再読み込みしてください。</div>':"")

      +(snap?'<br>下の金額は確定時のものです（日別の内訳は現在の打刻から表示しています）。'
            :'<br>確定内容を取得できませんでした。下の金額は参考値です。')+'</div>':"")
    +(!manualReady
      ?'<div style="font-size:.74rem;color:'+(mileage.myError?"#b91c1c":"#92400e")+';background:'+(mileage.myError?"#fee2e2":"#fef3c7")+';border:1px solid '+(mileage.myError?"#fecaca":"#fde68a")+';border-radius:4px;padding:6px 9px;margin-bottom:8px;">'
        +(mileage.myError?'手入力した移動を読み込めませんでした。下の集計には手入力分が反映されていません。':'読み込み中です。集計はまだ確定していません。')
        +'</div>':"")
    +(blockCount?'<div style="font-size:.74rem;color:#b91c1c;background:#fee2e2;border:1px solid #fecaca;border-radius:4px;padding:6px 9px;margin-bottom:8px;font-weight:700;">要確認が '+blockCount+' 日あります（下の色付きの日）。管理者へ連絡してください。</div>':"")
    +autoHtml
    +'<div style="border-top:1px solid #e2e8f0;margin-top:8px;padding-top:8px;">'
    +'<div style="display:flex;justify-content:space-between;font-size:.8rem;color:#475569;"><span>月合計距離（確定対象）</span><span style="font-weight:700;">'+totalTxt+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:.8rem;color:#475569;margin-top:2px;"><span>適用単価</span><span style="font-weight:700;">'+rateTxt+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:.86rem;color:#0f172a;margin-top:4px;"><span style="font-weight:700;">支給見込額</span><span style="font-weight:900;color:#1e40af;">'+amountTxt+'</span></div>'
    +'<div style="font-size:.72rem;color:#64748b;margin-top:4px;">'
    +(snap?'この月は確定済みです。':'金額は管理者の月次確定で確定します。要確認の日は含みません。')+'</div>'
    +'</div>'
    +'<div style="border-top:1px solid #e2e8f0;margin-top:10px;padding-top:8px;">'
    +'<div style="font-size:.78rem;font-weight:700;color:#475569;margin-bottom:6px;">打刻に無い移動の手入力（例外）</div>'

    +(!mileage.formOpen&&!mileage.myClosed
      ?'<button onclick="mileageOpenForm(\'\')" style="width:100%;background:#f8fafc;color:#475569;border:1px solid #cbd5e1;border-radius:2px;padding:9px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px;">＋ 手入力で追加する</button>'
      :"")
    +listHtml
    +'</div></div>';
}

// ---- CSV ----
/**
 * CSV 1セル。カンマ・引用符・改行を安全に扱い、CSVインジェクション（=,+,-,@ 始まり）も無効化する。
 * ★ dlCSV が BOM を付けるので Windows 版 Excel でそのまま開いても日本語は化けない。
 */
function mileageCsvCell(v){
  var s=String(v==null?"":v);
  if(/^[=+\-@]/.test(s))s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}
function mileageCsvRows(rows){
  return rows.map(function(r){return r.map(mileageCsvCell).join(",");}).join("\r\n");
}

function mileageAdminSetTab(t){mileage.adminTab=t;render();}

async function mileageLoadAdmin(ym){
  var g=mileage.gen;
  mileage.adminLoading=true;mileage.adminYm=ym;
  var res=await mileageApi("adminMonth",{ym:ym});
  if(mileageStale(g))return;
  if(mileage.adminYm!==ym)return;   // 読み込み中に月が切り替わったら古い応答は捨てる
  mileage.adminLoading=false;

    mileage.adminData=res.data;
    if(res.data.enabledMap&&typeof res.data.enabledMap==="object")mileage.enabledMap=res.data.enabledMap;
  }

}
function mileageAdminSetYm(v){
  if(!/^\d{4}-\d{2}$/.test(v))return;
  mileage.adminData=null;mileage.checkData=null;mileage.checkYm="";mileageLoadAdmin(v);
}

/** 管理者操作の共通処理。実行 → 結果表示 → 当月データ再取得。 */
async function mileageAdminDo(action,params,okMsg,reloadMaster,timeoutMs){
  if(mileage.busy)return false;
  // 地点・区間を変更したら、取得済みの取り込み差分は取得時点の情報なので捨てる。
  // 残すと、解消済みの「地点が未対応」警告や古い「新規 N 件」を出し続ける。
  if(action==="savePlace"||action==="deletePlace"||action==="saveLeg"||action==="deleteLeg")mileage.importPlan=null;
  var g=mileage.gen;
  mileage.busy=true;render();
  var res=await mileageApi(action,params,timeoutMs);
  if(mileageStale(g))return false;
  mileage.busy=false;
  if(!res.ok){
    showAlert(mileageErrText(res));
    // ★ 中断（タイムアウト）はサーバ側で完了している可能性がある。画面の状態を鵜呑みにせず取り直す。
    if(res.status===0&&mileage.adminYm)await mileageLoadAdmin(mileage.adminYm);
    else render();
    return false;
  }
  if(reloadMaster)await mileageBoot();
  if(mileage.adminYm)await mileageLoadAdmin(mileage.adminYm);
  else render();
  if(okMsg)showAlert(okMsg);
  return true;
}

  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10050;display:flex;align-items:center;justify-content:center;padding:20px;";

    +'<div style="display:flex;gap:10px;">'

/**
 * 施設マスタ（master/locations）のうち、まだどの地点にも対応づいていない施設名を返す。
 * ★ 判定規則は mileageAutoPlaceMap と必ず同じにする。ここだけ違うと
 *   「取り込み済みと表示されるのに集計では未対応」というズレが起きる。
 */
function mileageFacilityLinkState(){
  // ★ 判定規則は mileageAutoPlaceMap と厳密に同じにする（明示指定が優先／同名が複数なら未対応）。
  //   ここだけ違うと「取り込み済みと表示されるのに集計では未対応」という行き止まりになる。
  var exp=mileageAutoDict(),imp=mileageAutoDict();
  mileage.places.forEach(function(p){
    if(!p||!p.id||p.active===false)return;
    var fl=mileageAutoFacilitiesOf(p);
    if(fl.length){fl.forEach(function(nm){(exp[nm]=exp[nm]||[]).push(p.id);});return;}
    var nm2=String(p.name||"").trim();
    if(nm2)(imp[nm2]=imp[nm2]||[]).push(p.id);   // 地点名一致のフォールバック
  });
  var unlinked=[],conflict=[],seenName=mileageAutoDict();
  masterLocs.forEach(function(nm){
    if(!nm)return;
    if(mileageAutoHas(seenName,nm))return;   // 施設マスタ側の重複で同じ名前を2回作りにいかない
    seenName[nm]=true;
    var ids=mileageAutoHas(exp,nm)?exp[nm]:(mileageAutoHas(imp,nm)?imp[nm]:null);
    if(!ids)unlinked.push(nm);
    // 複数の地点が同じ施設名を持つと placeMap はどちらか推測せず未対応にする。
    // これを「取り込み済み」と表示すると、取り込みボタンを押しても何も起きない行き止まりになる。
    else if(ids.length!==1)conflict.push(nm);
  });
  return {unlinked:unlinked,conflict:conflict};
}
/**
 * 施設マスタの施設を mileage 地点として取り込む。
 * ★ サーバから /honomi/master/locations を読む方式にはしない。ただし理由を取り違えないこと。
 *   masterFacilities も同じ /honomi/master/locations から読んでおり、そこは匿名認証で誰でも書ける。
 *   **入力の信頼度は同じで、「クライアント経由だから安全」ではない。**
 *   実際に効いている防御は (1) 管理者が確認ダイアログで全件見て承認する
 *   (2) savePlace がサーバ側で normText / duplicate_name / duplicate_facility を再検査する、の2つ。
 *   サーバが自動取り込みする方式にすると (1) が消える。それが避けたい差分である。
 */
var MILEAGE_IMPORT_MAX=50;   // 1回に取り込める施設数の上限（下記の理由で必須）
async function mileageImportFacilities(){
  if(mileage.busy)return;
  // ★ 施設マスタを取得できていない状態を「未登録なし」と断定しない。
  //   キャッシュの無い端末では取得前に masterLocs が空になり、事実と違う案内を出してしまう。
  if(!facilitiesLoaded){showAlert("施設マスタを取得できていません。\n画面を再読み込みしてからお試しください。");return;}
  var st=mileageFacilityLinkState();
  var todo=st.unlinked;
  if(st.conflict.length){
    showAlert("次の施設は、複数の地点が同じ名前を持っているため対応づけできません。\n\n"+st.conflict.join("\n")
      +"\n\n上の地点一覧で、どちらか一方の「打刻の施設」または「旧施設名」を外してください。");
    return;
  }
  if(!todo.length){showAlert("取り込む施設はありません。\n施設マスタの施設は、すべて地点として登録済みです。");return;}
  // ★ todo の件数は /honomi/master/locations 由来＝匿名認証で誰でも書ける。上限が無いと、
  //   大量注入された施設名をそのまま特権書込（savePlace）の回数に変換でき、管理者の書込枠
  //   （10分300回）を枯渇させて承認・月次確定まで止められる。
  if(todo.length>MILEAGE_IMPORT_MAX){
    showAlert("取り込み対象が "+todo.length+" 件と多すぎます（上限 "+MILEAGE_IMPORT_MAX+" 件）。\n\n"
      +"施設マスタに身に覚えのない施設が登録されていないか確認してください。");
    return;
  }
  showConfirm("次の施設を地点として登録します。\n\n"+todo.join("\n")
    +"\n\n※見覚えのない施設名が混ざっていないか確認してください。\n"
    +"※登録済みの施設は対象外です。\n※区間距離は登録されません。続けて「標準区間距離を取り込む」を実行してください。",
    async function(){
      if(mileage.busy)return;
      var g=mileage.gen;
      mileage.busy=true;render();
      var okCount=0,ng=[],base=mileage.places.length,stopped="";
      for(var i=0;i<todo.length;i++){
        // ★ 逐次で呼ぶこと。並列にすると savePlace の重複検査（loadPlaces のスナップショットに対する
        //   read-modify-write）を複数が同時に通過し、同名地点が2件できる。そうなると placeMap が
        //   「同名の地点が複数」としてその施設を丸ごと未対応にする＝集計が黙って壊れる。
        //   初期設定で1回だけの操作なので、待ち時間より整合性を優先する。
        var res=await mileageApi("savePlace",{name:todo[i],facility:todo[i],order:base+i+1,active:true});
        if(mileageStale(g))return;
        if(res.ok)okCount++;
        else{
          ng.push(todo[i]+"："+mileageErrText(res));
          // 回数制限に当たったら残りを叩き続けない（枠をさらに消費しても成功しないため）
          if(res.status===429){stopped="\n\n回数制限に達したため中断しました。10分ほどおいてから残りを取り込んでください。";break;}
        }
      }
      mileage.busy=false;
      mileage.importPlan=null;   // 地点が変わったので、取得済みの取り込み差分は古い
      await mileageBoot();
      if(mileage.adminYm)await mileageLoadAdmin(mileage.adminYm);else render();
      showAlert(okCount+" 件の地点を登録しました。"+(ng.length?"\n\n登録できなかった施設：\n"+ng.join("\n"):"")+stopped);
    });
}

/** 差分を確認したうえで、未登録の区間だけを登録する。 */
async function mileageImportLegsApply(){
  var plan=mileage.importPlan;
  if(!plan||!plan.counts)return;
  if(!plan.counts.new){showAlert("新規に登録する区間はありません。");return;}
  showConfirm("未登録の "+plan.counts.new+" 区間を登録します。\n\n"

 *   確認から確定までの間に打刻が変わっていればサーバが 409 stale_confirmation を返す。

async function mileageCloseMonth(){
  var d=mileage.adminData;if(!d)return;
  if(mileage.busy)return;
  var ym=mileage.adminYm;
  mileage.busy=true;render();
  var res=await mileageApi("autoCheck",{ym:ym},30000);
  mileage.busy=false;
  if(!res.ok||!res.data){showAlert("確定前の確認に失敗しました。\n\n"+mileageErrText(res));render();return;}
  var chk=res.data;
  mileage.checkData=chk;mileage.checkYm=ym;
  if(chk.punchUnavailable){showAlert("打刻データを取得できなかったため確定できません。時間をおいてやり直してください。");render();return;}
  if(chk.unresolved){
    showAlert("要確認が "+chk.unresolved+" 件あるため確定できません。\n\n「自動集計」タブで内容を確認し、区間距離の登録・手入力の承認を済ませてください。\n\n※「起点未確定」は打刻修正の承認では解消しません。手入力（例外）で登録して承認してください。");
    render();return;
  }
  var lines=(chk.staff||[]).filter(function(x){return x.totalKm>0;})
    .map(function(x){return "・"+(x.staffName||x.employeeId)+"　"+mileageRound1(x.totalKm)+" km";});
  var att=(chk.staff||[]).reduce(function(a,x){return a+(Number(x.attentionDays)||0);},0);
  var msg=ym+" の移動距離を、次の内容で確定しますか？\n\n"
    +(lines.length?lines.slice(0,20).join("\n")+(lines.length>20?"\n…ほか "+(lines.length-20)+" 名":"")
                  :"（対象者なし）")
    +"\n合計 "+mileageRound1(chk.totalKm)+" km\n\n"
    +(att?"⚠ 打刻の後編集・複数出勤・退勤漏れがある日が "+att+" 件あります。内容を確認してください。\n\n":"")
    +"・この内容は、いまサーバが打刻から集計し直したものです\n"
    +"・確定後は職員も管理者も内容を変更できません\n"
    +"・確定時点の単価と金額が保存され、あとで単価を変えても金額は変わりません";
  render();
  showConfirm(msg,function(){
    mileageAdminDo("closeMonth",{ym:ym,confirmToken:chk.confirmToken},ym+" を確定しました",false,30000);
  });
}

/** 管理者タブ「移動距離」の中身。 */
/**
 * 管理画面用：対象月の全職員分を手元で集計する。
 * ★ 表示のためだけの計算。確定（closeMonth）はサーバが打刻を読み直して同じ共有ロジックで
 *   計算するため、画面の数値をそのまま確定させることはない。
 */
function mileageAutoAdminRows(){
  var d=mileage.adminData;
  var names=(d&&d.names)||{};
  var enMap=(d&&d.enabledMap)||mileage.enabledMap||{};
  var reqByEid={};
  ((d&&d.byStaff)||[]).forEach(function(st){reqByEid[st.employeeId]=st.requests||[];});
  var seen={},eids=[];
  Object.keys(enMap).forEach(function(e){if(!seen[e]){seen[e]=1;eids.push(e);}});
  Object.keys(reqByEid).forEach(function(e){if(!seen[e]){seen[e]=1;eids.push(e);}});
  eids.sort(function(a,b){return String(a).localeCompare(String(b),"ja");});
  // ★ 打刻の走査は全職員分をまとめて1回だけ行う（人数×全打刻件数の走査を避ける）
  var nameSet={};
  eids.forEach(function(e){if(enMap[e]===true&&names[e])nameSet[names[e]]=true;});
  var recIdx=mileageAutoIndexRecords(mileage.adminYm,nameSet);
  var corrIdx=mileageAutoIndexCorrections(mileage.adminYm);
  var ctx=mileageAutoCtx();
  var out=[],miss={},unresolved=0;
  eids.forEach(function(eid){
    var nm=names[eid]||"";
    var isAuto=enMap[eid]===true;
    var res=mileageAutoCompute(nm,mileage.adminYm,reqByEid[eid]||[],isAuto,recIdx[nm]||[],ctx,corrIdx);
    mileageAutoMissingFacilities(res.rows).forEach(function(f){miss[f]=true;});
    // ★ サーバの computeAutoMonth と判定を揃える。利用ONなのに氏名が無い職員は
    //   打刻と突き合わせできず 0km になるため、要確認として数える（黙って支給漏れにしない）。
    if(isAuto&&!nm)res.blockers.push({date:"",status:"name_unresolved"});
    unresolved+=res.blockers.length;
    out.push({employeeId:eid,staffName:nm,autoTarget:isAuto,nameResolved:!!nm,
              rows:res.rows,totalKm:res.totalKm,blockers:res.blockers});
  });
  return {staff:out,unresolved:unresolved,missingFacilities:Object.keys(miss)};
}

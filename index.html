// Firebase Console > プロジェクトの設定 > 全般 > ウェブ API キー を設定してください

// ===== FCM Push通知設定（Firebase Console > プロジェクトの設定 で確認）=====

var FCM_VAPID_KEY="BFMW2J95vc3NZcS_7Y8biP9ysFhi3s5gOpeQOZQAIj3ZHd3xIOWhjKeqeeh421VkNKrzSPxDWtu1I_gF6WyV2tY";           // Cloud Messaging > ウェブ設定 > ウェブプッシュ証明書
var _fbIdToken="";
var _fbRefreshToken="";
var _fbTokenExpiry=0;

async function getAuthToken(){
  if(_fbIdToken&&Date.now()<_fbTokenExpiry-60000)return _fbIdToken;
  if(_fbRefreshToken){
    try{
      var r=await fetch("https://securetoken.googleapis.com/v1/token?key="+FB_API_KEY,{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"grant_type=refresh_token&refresh_token="+_fbRefreshToken
      });
      var d=await r.json();
      if(d.id_token){
        _fbIdToken=d.id_token;
        _fbRefreshToken=d.refresh_token;
        _fbTokenExpiry=Date.now()+parseInt(d.expires_in)*1000;
        return _fbIdToken;
      }
    }catch(e){console.warn("token refresh failed, re-signing in",e);}
  }
  var r2=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+FB_API_KEY,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({returnSecureToken:true})
  });
  var d2=await r2.json();
  if(!d2.idToken)throw new Error("Anonymous sign-in failed: "+(d2.error&&d2.error.message||"unknown"));
  _fbIdToken=d2.idToken;
  _fbRefreshToken=d2.refreshToken;
  _fbTokenExpiry=Date.now()+parseInt(d2.expiresIn)*1000;
  return _fbIdToken;
}

// ===== 画面モードと書き込みポリシー（フェイルクローズ）=====
// uiMode      : normal | adminDemo | staffDemo | viewer
// writePolicy : full | readonlyWithAllowList | sandbox
// URLパラメータを見た時点で最も制限の強い側へ倒す。認証成功後も権限を昇格させない。
var uiMode="normal";
var writePolicy="full";
(function(){
  var _q=new URLSearchParams(location.search);
  if(_q.get("staffDemo")!==null){uiMode="staffDemo";writePolicy="sandbox";}
  else if(_q.get("demo")!==null){uiMode="adminDemo";writePolicy="readonlyWithAllowList";}
})();
var demoTokenKey="";        // 新方式 demoTokens/{token} における自分のトークン
var demoTokenExpiresAt="";  // 発行元デモトークンの有効期限（発行する閲覧用トークンの上限）
var demoLegacyAuth=false;   // 旧 config/demoAccess で認証したか（移行期間のみ true）
// このデモセッションで発行した閲覧用トークンだけを記録する。
// 値 "pending" = 本体PUTを1回だけ許可 / true = 発行済み（以後は無効化のみ）
var _demoIssuedVt={};
function _demoOwnsVt(t){return Object.prototype.hasOwnProperty.call(_demoIssuedVt,t);}
// トークン文字列の形式検証（キー・パス組み立ての安全性を担保）
function isSafeTokenStr(t){return typeof t==="string"&&/^[A-Za-z0-9_-]{1,64}$/.test(t);}
// デモから発行する閲覧用トークンの内容検証（発行元IDの一致・期限必須・デモ期限以内・有効状態）
function _isValidDemoIssuedVtBody(body){
  if(typeof body!=="string")return false;
  var o;try{o=JSON.parse(body);}catch(e){return false;}
  if(!o||typeof o!=="object"||Array.isArray(o))return false;
  if(o.issuedByDemoTokenId!==demoTokenKey)return false;
  if(o.enabled!==true)return false;
  if(typeof o.expiresAt!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(o.expiresAt))return false;
  if(!demoTokenExpiresAt||o.expiresAt>demoTokenExpiresAt)return false;
  if(o.expiresAt<getTodayJSTStr())return false;
  return true;
}
// 管理者デモで例外的に許可する書き込み。前方一致の乱用を避け、パスを厳密に判定する。
// /config/ の前方一致は絶対に使わない（adminPinHash 等が同じ配下にあるため）。
function _isDemoAllowedWrite(url,method,opts){
  if(typeof url!=="string")return false;
  var base=FB_URL+"/";
  if(url.indexOf(base)!==0)return false;
  var path=url.slice(base.length);
  var qi=path.indexOf("?");if(qi>=0)path=path.slice(0,qi);
  var isFalseBody=(typeof opts==="object"&&opts&&typeof opts.body==="string"&&opts.body==="false");
  // ① 自分のデモトークンの「無効化」だけ許可（再有効化・期限延長・変更・新規発行は不可）
  if(demoTokenKey&&path==="demoTokens/"+demoTokenKey+"/enabled.json"){
    return method==="PUT"&&isFalseBody;
  }
  // ② 閲覧用トークン: このデモセッションで発行したものだけ
  var vm=path.match(/^viewerTokens\/([A-Za-z0-9_-]+)(\/enabled)?\.json$/);
  if(vm){
    if(!demoTokenKey||!_demoOwnsVt(vm[1]))return false;
    if(vm[2])return method==="PUT"&&isFalseBody;          // 無効化のみ（再有効化不可）
    if(method!=="PUT"||_demoIssuedVt[vm[1]]!=="pending")return false; // 新規発行の1回のみ
    // 発行内容も検証する（発行UIを迂回されても、期限超過や発行元欠落のレコードは書かせない）
    return _isValidDemoIssuedVtBody(opts&&opts.body);
  }
  // ③ 発行インデックス（発行元デモトークンIDで絞った自分の枝のみ）
  if(demoTokenKey){
    var idxPrefix="demoIssuedViewerTokens/"+demoTokenKey+"/";
    if(path.indexOf(idxPrefix)===0){
      var im=path.slice(idxPrefix.length).match(/^([A-Za-z0-9_-]+)(\/enabled)?\.json$/);
      if(!im||!_demoOwnsVt(im[1]))return false;
      if(im[2])return method==="PUT"&&isFalseBody;
      return method==="PUT";
    }
  }
  // ④ 旧方式（移行期間）: デモアクセスの無効化のみ
  if(demoLegacyAuth&&path==="config/demoAccess.json")return method==="DELETE";
  return false;
}
function _writeAllowed(url,method,opts){
  if(writePolicy==="full")return true;
  if(writePolicy==="sandbox")return false;
  return _isDemoAllowedWrite(url,method,opts);
}
// X-HTTP-Method-Override 等でGETを装った書き込みを弾く（RTDB RESTはこのヘッダを解釈する）
function _hasMethodOverride(opts){
  var h=opts&&opts.headers;
  if(!h)return false;
  try{
    // Headers / Map など get() を持つものはダックタイピングで判定（cross-realm対策）
    if(typeof h.get==="function"){
      return !!(h.get("x-http-method-override")||h.get("X-HTTP-Method-Override")||h.get("x-method-override"));
    }
    if(Array.isArray(h)){
      for(var i=0;i<h.length;i++){if(/^x-(http-)?method-override$/i.test(String(h[i]&&h[i][0])))return true;}
      return false;
    }
    if(typeof h!=="object")return true; // 判定不能はフェイルクローズ
    for(var k in h){if(/^x-(http-)?method-override$/i.test(k))return true;}
  }catch(e){return true;} // 判定不能はフェイルクローズ
  return false;
}
// ログにトークン等の秘密値を出さないためのパス伏せ字
var _MASK_KNOWN_NODES=["viewerTokens","demoTokens","staffDemoTokens","demoIssuedViewerTokens",
  "tc5_records","tc5_staff","tc5_pins","tc5_approvals","tc5_correction_requests",
  "tc5_paid_leave_requests","tc5_paid_leave_balances","tc5_monthly_days_import",
  "tc5_staff_notifications","tc5_meals","tc5_meal_confirmations","tc5_monthly_review_status",
  "tc5_fcm_tokens","tc_master_depts","config","master","locations","documents","enabled","staff_uploads"];
// ログにトークン等の秘密値を出さないためのパス伏せ字（ノード名は残し、キー部分だけ伏せる）
function _maskPath(u){
  var p=String(u||"").split("?")[0];
  if(p.indexOf(FB_URL)===0)p=p.slice(FB_URL.length);
  return p.split("/").map(function(seg){
    if(!seg)return seg;
    var bare=seg.replace(/\.json$/,"");
    if(_MASK_KNOWN_NODES.indexOf(bare)>=0)return seg;
    return seg.length>=8?"***":seg;
  }).join("/");
}
var _demoBlockNoticeAt=0;
function _demoBlockNotice(){
  var t=Date.now();
  if(t-_demoBlockNoticeAt<1500)return;
  _demoBlockNoticeAt=t;
  if(typeof showAlert==="function")showAlert("この画面では変更できません");
}
// 遮断時の戻り値。reject すると savingCount 等の減算（.then）が走らず同期が停止するため、
// Response 互換オブジェクトを返して既存チェーンを無傷で通す。
function _blockedResponse(ok){
  return {ok:!!ok,status:ok?200:403,
    json:function(){return Promise.resolve(null);},
    text:function(){return Promise.resolve("");}};
}
// 書き込み系ヘルパーの前段ガード。管理者デモでのみ真を返し、メモリ／localStorage を
// 汚す前に停止させる（「保存できたように見えて10秒後に巻き戻る」挙動の防止）。
// サンドボックスは false を返す＝既存処理をそのまま通し、_lsSet と authFetch 側で止める。
function demoWriteBlocked(){
  if(writePolicy!=="readonlyWithAllowList")return false;
  _demoBlockNotice();
  return true;
}
// サンドボックス中は本番用 localStorage キーへ書かない
function _lsSet(k,v){
  if(writePolicy==="sandbox")return;
  try{localStorage.setItem(k,v);}catch(e){}
}
async function authFetch(url,opts){
  var _m=String((opts&&opts.method)||"GET").toUpperCase();
  // 非GETに加え、メソッド偽装ヘッダ・GETへのbody添付も「書き込み」として扱う
  var _isWrite=(_m!=="GET")||_hasMethodOverride(opts)||!!(opts&&opts.body!=null)
               ||/method-override/i.test(String(url).split("?")[1]||"");
  if(_isWrite&&writePolicy!=="full"&&!_writeAllowed(url,_m,opts)){
    console.warn("[write blocked]",writePolicy,_m,_maskPath(url));
    if(writePolicy!=="sandbox")_demoBlockNotice();
    // sandbox は成功を装う（画面上のテスト操作を成立させるため）／デモは失敗を返す
    return _blockedResponse(writePolicy==="sandbox");
  }
  var tok=await getAuthToken();
  var authUrl=url+(url.indexOf('?')>=0?'&':'?')+'auth='+tok;
  return fetch(authUrl,opts||{});
}

function saveToFirebase(key, val) {
  if(demoWriteBlocked())return;
  authFetch(FB_URL + "/" + key + ".json", {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(val)
  }).then(function(res){
    if(!res.ok){
      res.text().then(function(t){
        console.error("[saveToFirebase] HTTP", res.status, key, t);
        showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");
      });
    }
  }).catch(function(e){
    console.error("[saveToFirebase] network error:", key, e);
    showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");
  });
}

// ===== 月別出勤日数: 過去月セルの手入力保存 =====
// tc5_monthly_days_import に staffId(=社員番号=employeeId) 単位で書き込む。
// 既存の有給計算（付与日数・勤続・残日数・申請・消化）はこのデータを参照しないため影響なし。
function mdSaveCell(inputEl, eid, ym){
  if(demoWriteBlocked()){render();return;}
  monthlyDaysEditing=false;
  eid=String(eid||"").trim();
  if(!eid){showAlert("社員番号が未設定のため保存できません");render();return;}
  // 社員番号は英数字・ハイフン・アンダースコアのみ許可（XSS防止＋Firebaseキー健全性）
  if(!/^[A-Za-z0-9_-]+$/.test(eid)){showAlert("社員番号に使用できない文字が含まれています");render();return;}
  var raw=String(inputEl&&inputEl.value!=null?inputEl.value:"").trim();
  var val=null; // null=未入力に戻す
  if(raw!==""){
    var n=parseInt(raw,10);
    if(isNaN(n)||n<0||n>31){showAlert("出勤日数は0〜31の範囲で入力してください");render();return;}
    val=n;
  }
  // 社員番号から氏名を解決（新規エントリ作成時のラベル用）
  var staffName="";
  for(var i=0;i<staffList.length;i++){if((staffList[i].employeeId||"").trim()===eid){staffName=staffList[i].name||"";break;}}
  if(!monthlyDaysImport[eid]||typeof monthlyDaysImport[eid]!=="object"){
    monthlyDaysImport[eid]={staffId:eid,staffName:staffName,source:"manual_edit",months:{}};
  }
  if(!monthlyDaysImport[eid].months||typeof monthlyDaysImport[eid].months!=="object"){
    monthlyDaysImport[eid].months={};
  }
  if(val===null){delete monthlyDaysImport[eid].months[ym];}
  else{monthlyDaysImport[eid].months[ym]=val;}
  render(); // 即時反映（合計も再計算）
  // staffId単位でFirebaseへ書込（他スタッフ・他keyに影響させない）
  authFetch(FB_URL+"/tc5_monthly_days_import/"+encodeURIComponent(eid)+".json",{
    method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(monthlyDaysImport[eid])
  }).then(function(res){
    if(!res.ok){res.text().then(function(t){console.error("[mdSaveCell] HTTP",res.status,eid,t);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});}
  }).catch(function(e){console.error("[mdSaveCell] network error:",eid,e);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});
}

// ===== 賄い（まかない）取得記録ヘルパー =====
// 編集可否判定（将来の月次締め機能に備えて関数化）。現状は未来月のみ入力不可、過去月・当月は編集可。
// 締め機能を追加する場合は本関数1か所だけ改修すれば全画面（打刻画面・管理画面）に反映される。
function mealEditable(ym /* "YYYY-MM" */){
  if(!ym||ym.length<7)return false;
  var curYm=getTodayJSTStr().substring(0,7); // JST基準（端末TZに依存しない）
  if(ym>curYm)return false; // 未来月は入力不可
  // TODO(将来): 締め済み月は false を返す（例: if(mealClosedMonths&&mealClosedMonths[ym])return false;）
  return true; // 過去月・当月は編集可
}
// 社員番号から氏名を解決（賄いエントリのラベル用・出勤日判定用）
function mealStaffNameById(eid){
  eid=String(eid||"").trim();
  for(var i=0;i<staffList.length;i++){if((staffList[i].employeeId||"").trim()===eid)return staffList[i].name||"";}
  return "";
}
// employeeId 単位で tc5_meals/{eid} を全量PUT（他スタッフ・他keyに影響させない）
function mealSaveEntry(eid){
  if(demoWriteBlocked())return;
  eid=String(eid||"").trim();
  if(!eid||!/^[A-Za-z0-9_-]+$/.test(eid))return;
  if(!mealsData[eid])return;
  authFetch(FB_URL+"/tc5_meals/"+encodeURIComponent(eid)+".json",{
    method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(mealsData[eid])
  }).then(function(res){
    if(!res.ok){res.text().then(function(t){console.error("[mealSaveEntry] HTTP",res.status,eid,t);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});}
  }).catch(function(e){console.error("[mealSaveEntry] network error:",eid,e);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});
}
// スタッフのある月の出勤日(打刻clockIn・論理削除以外)の日付Set。recordsはstaff=氏名で識別。
function mealAttendanceDates(staffName,ym){
  var set={};
  records.forEach(function(r){
    if(r.type!=="clockIn"||r.deleted||!r.date||r.staff!==staffName)return;
    if(r.date.substring(0,7)!==ym)return;
    set[r.date]=true;
  });
  return set;
}
// 1日分の賄い取得をトグル（打刻画面・本人操作）。eid単位でcache更新→即PUT。
function mealToggleDate(eid,ym,ds){
  if(viewerMode){console.warn("[viewerMode] meal write blocked");return;}
  eid=String(eid||"").trim();
  if(!eid){showAlert("社員番号が未設定のため保存できません");return;}
  if(!/^[A-Za-z0-9_-]+$/.test(eid)){showAlert("社員番号に使用できない文字が含まれています");return;}
  if(!mealEditable(ym)){showAlert("未来の月は入力できません");return;}
  var nm=mealStaffNameById(eid);
  if(!mealsData[eid]||typeof mealsData[eid]!=="object")mealsData[eid]={staffId:eid,staffName:nm,dates:{}};
  if(!mealsData[eid].dates||typeof mealsData[eid].dates!=="object")mealsData[eid].dates={};
  var cur=mealsData[eid].dates[ds];
  if(cur&&cur.taken){delete mealsData[eid].dates[ds];} // 取得あり→なし（キー削除）
  else{mealsData[eid].dates[ds]={taken:true,updatedAt:new Date().toISOString()};} // なし→取得あり
  if(nm)mealsData[eid].staffName=nm;
  render(); // 即時反映
  mealSaveEntry(eid);
}
// 出勤日を全選択（その月の出勤打刻がある日をすべて賄い取得ON。既存ONは維持・非出勤日は変更しない）
function mealSelectAttendance(eid,ym){
  if(viewerMode){console.warn("[viewerMode] meal write blocked");return;}
  eid=String(eid||"").trim();
  if(!eid){showAlert("社員番号が未設定のため保存できません");return;}
  if(!/^[A-Za-z0-9_-]+$/.test(eid)){showAlert("社員番号に使用できない文字が含まれています");return;}
  if(!mealEditable(ym)){showAlert("未来の月は入力できません");return;}
  var nm=mealStaffNameById(eid);
  var att=mealAttendanceDates(nm,ym);
  var dates=Object.keys(att);
  if(dates.length===0){showAlert("この月の出勤打刻が見つかりません");return;}
  if(!mealsData[eid]||typeof mealsData[eid]!=="object")mealsData[eid]={staffId:eid,staffName:nm,dates:{}};
  if(!mealsData[eid].dates||typeof mealsData[eid].dates!=="object")mealsData[eid].dates={};
  var nowIso=new Date().toISOString();var added=0;
  dates.forEach(function(ds){
    if(!(mealsData[eid].dates[ds]&&mealsData[eid].dates[ds].taken)){mealsData[eid].dates[ds]={taken:true,updatedAt:nowIso};added++;}
  });
  if(nm)mealsData[eid].staffName=nm;
  render();
  if(added>0)mealSaveEntry(eid);
  showAlert("出勤日 "+dates.length+"日のうち "+added+"日を賄いONにしました（既にONの日はそのまま）");
}
// 打刻画面の賄いフォーム開閉トグル（開閉状態は端末に保存し、次回も同じ状態を維持）
function toggleMealForm(){
  mealFormOpen=!mealFormOpen;
  _lsSet("tc5_meal_form_open",mealFormOpen?"1":"0");
  render();
}
// 打刻画面「今月の打刻状況」カードの開閉トグル（開閉状態は端末に保存）
function toggleMonthPunch(){

// 賄い月初確認の回答を保存（done=済み / pending=まだ）。
// tc5_meal_confirmations/{eid}/{ym} 単位の個別PUT（他月・他スタッフのノードに触れず、同一スタッフ・同一対象月は必ず上書き＝重複なし・回答変更可）。
function mealConfSave(eid,ym,status){
  if(viewerMode){console.warn("[viewerMode] meal-conf write blocked");return;}
  if(demoWriteBlocked())return;
  eid=String(eid||"").trim();
  if(!eid){showAlert("社員番号が未設定のため保存できません");return;}
  if(!/^[A-Za-z0-9_-]+$/.test(eid)){showAlert("社員番号に使用できない文字が含まれています");return;}
  if(!ym||ym.length<7){return;}
  if(status!=="done"&&status!=="pending"){return;}
  var nm=mealStaffNameById(eid);
  if(!mealConfData[eid]||typeof mealConfData[eid]!=="object")mealConfData[eid]={};
  mealConfData[eid][ym]={staffId:eid,staffName:nm,targetMonth:ym,status:status,updatedAt:new Date().toISOString()};
  render(); // 即時反映
  authFetch(FB_URL+"/tc5_meal_confirmations/"+encodeURIComponent(eid)+"/"+encodeURIComponent(ym)+".json",{
    method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(mealConfData[eid][ym])
  }).then(function(res){
    if(!res.ok){res.text().then(function(t){console.error("[mealConfSave] HTTP",res.status,eid,ym,t);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});}
  }).catch(function(e){console.error("[mealConfSave] network error:",eid,ym,e);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});
}
// 賄い月初確認の状態取得（"done"|"pending"|"none"）
function mealConfStatusOf(eid,ym){
  eid=String(eid||"").trim();
  var c=mealConfData[eid]&&mealConfData[eid][ym];
  return (c&&c.status==="done")?"done":(c&&c.status==="pending")?"pending":"none";
}
// ===== 月次精査完了フラグ（労務士CSVゲート） =====
// 対象月(ym)が精査完了済みか。reviewed===true のときのみ true。
function monthReviewed(ym){var r=reviewStatus&&reviewStatus[ym];return !!(r&&r.reviewed===true);}
// 締め対象月（＝当月の前月）を "YYYY-MM" で返す単一の真実源。CSVゲート判定・精査完了操作はすべてこれを基準にする。
// 例: 2026-07-01→"2026-06" / 2026-07-31→"2026-06" / 2027-01-01→"2026-12"。今日基準（today/pad を再利用）。
function reviewTargetMonth(){var d=new Date(today.getFullYear(),today.getMonth()-1,1);return d.getFullYear()+"-"+pad(d.getMonth()+1);}
// JST基準で当日が「その月の実際の最終日」のときだけ当月を "YYYY-MM" で返す（月末前・翌月1日は ""）。
// 端末TZ/UTCで日付がずれないよう getTodayJSTStr() を使用。最終日は Date.UTC(y,m,0) で月ごとに算出（1/31・2/28・閏年2/29・4/30 等に対応）。
// 例: 2026-07-30→"" / 2026-07-31→"2026-07" / 2026-08-01→""。締め対象月セレクタの選択肢追加にのみ使用する。
function reviewCurrentMonthIfMonthEnd(){
  var t=getTodayJSTStr(); // "YYYY-MM-DD"（JST）
  var y=parseInt(t.slice(0,4),10),m=parseInt(t.slice(5,7),10),d=parseInt(t.slice(8,10),10);
  if(!y||!m||!d)return "";
  var lastDay=new Date(Date.UTC(y,m,0)).getUTCDate(); // 当月の実際の最終日
  return d===lastDay?(y+"-"+pad(m)):"";
}
// 精査完了/解除を保存。tc5_monthly_review_status/{ym} 単位の個別PUT（他月のノードに触れない）。
// 解除も削除APIを使わず reviewed:false へ上書き（データ破壊を避ける）。管理者操作時のみ（viewerModeガード必須）。
function reviewStatusSave(ym,reviewed){
  if(viewerMode){console.warn("[viewerMode] review-status write blocked");return;}
  if(demoWriteBlocked())return;
  if(!ym||ym.length<7){return;}
  var entry={reviewed:!!reviewed,reviewedAt:new Date().toISOString(),reviewedBy:"admin"};
  reviewStatus[ym]=entry;
  render(); // 即時反映
  authFetch(FB_URL+"/tc5_monthly_review_status/"+encodeURIComponent(ym)+".json",{
    method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(entry)
  }).then(function(res){
    if(!res.ok){res.text().then(function(t){console.error("[reviewStatusSave] HTTP",res.status,ym,t);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});}
  }).catch(function(e){console.error("[reviewStatusSave] network error:",ym,e);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});
}
// 「まだ」→先月の賄い入力へ移動（先月を表示しフォームを開く。回答はpendingで保存）
function mealConfGoPrev(eid,ym){
  mealConfSave(eid,ym,"pending");
  mealFormMonth=ym;        // 先月へ切替

}

// 個別パス取得ヘルパー（root bulk read 廃止 - Phase 2-A）
function fetchJson(url) {
  return authFetch(url).then(function(r){return r.json();}).catch(function(){return null;});
}
function listenFirebase() {
  // 10秒ごとにポーリングして同期
  setInterval(function(){
    // サンドボックス（スタッフテスト画面）中は本番値でメモリ上のテストデータを上書きしない
    if(writePolicy==="sandbox")return;
    // tc5_pins は画面を問わず常時同期（スタッフ選択画面でも反映されるよう）
    authFetch(FB_URL + "/tc5_pins.json")
      .then(function(r){return r.json();})
      .then(function(val){if(writePolicy==="sandbox")return;
        if(val && JSON.stringify(val)!==JSON.stringify(staffPins)){
          staffPins=val;
          if(!document.querySelector('.time-edit-wrap')&&!showPaidLeaveForm&&!_paidLeaveRenderGuard) render();
        }
      }).catch(function(){});
    // 精査完了フラグ(tc5_monthly_review_status)を画面を問わず常時同期。
    // 管理者の「精査完了」押下を、開きっぱなしの労務士(viewer)/管理者/スタッフ画面へ最大10秒で反映し、
    // CSVダウンロード制限を解除する。読み取り専用の反映のため再描画は安全（入力状態には触れない）。
    authFetch(FB_URL + "/tc5_monthly_review_status.json")
      .then(function(r){return r.json();})
      .then(function(val){if(writePolicy==="sandbox")return;
        if(val && typeof val==="object" && JSON.stringify(val)!==JSON.stringify(reviewStatus)){
          reviewStatus=val;
          if(!document.querySelector('.time-edit-wrap')&&!showPaidLeaveForm&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
        }
      }).catch(function(){});
    // 打刻画面でも修正申請を同期（管理者の承認/却下で pending から外れた申請を「申請中の修正」表示から即時に消す。
    // 早期 return より前に置くことで punch 画面でも反映される。管理者の履歴タブ操作には依存しない）。
    if(screen==="punch" && staffName){
      authFetch(FB_URL + "/tc5_correction_requests.json")
        .then(function(r){return r.json();})
        .then(function(val){if(writePolicy==="sandbox")return;
          if(val && savingCount===0){
            var arr=typeof val==="object"&&!Array.isArray(val)?Object.values(val):val;
            var newReqs=(arr||[]).filter(Boolean);
            if(JSON.stringify(newReqs)!==JSON.stringify(correctionRequests)){
              correctionRequests=newReqs;
              _lsSet("tc5_correction_requests",JSON.stringify(correctionRequests));
              // 修正申請フォーム・有給フォーム入力中は再描画しない（入力状態のリセット防止）
              if(!document.querySelector('.time-edit-wrap')&&!showPaidLeaveForm&&!_paidLeaveRenderGuard) render();
            }
          }
        }).catch(function(){});
      // 本人向けアプリ内通知（有給の付与・承認・却下）を同期。開いたままの打刻画面へ承認/却下結果を反映する。
      // 読み取りは本人の社員番号配下のみ（他スタッフの通知は取得しない）。
      var _snPollSid=resolveStaffId(staffName);
      if(_snPollSid){
        authFetch(FB_URL+"/tc5_staff_notifications/"+encodeURIComponent(_snPollSid)+".json")
          .then(function(r){return r.json();})
          .then(function(val){if(writePolicy==="sandbox")return;
            if(!val||typeof val!=="object")return;
            var cur=staffNotifications[_snPollSid]||{};
            // 既読フラグはローカル（既読化PUT済み）を優先し、反映遅延による未読への巻き戻しを防ぐ
            Object.keys(val).forEach(function(k){if(val[k]&&cur[k]&&cur[k].read===true)val[k].read=true;});
            if(JSON.stringify(val)!==JSON.stringify(cur)){
              // ローカル生成済みで未伝播の通知は保持（承認直後の管理者端末などで消えないように）
              Object.keys(cur).forEach(function(k){if(!val[k])val[k]=cur[k];});
              staffNotifications[_snPollSid]=val;
              // 他 polling と同じガード（打刻保存中・修正入力中・有給フォーム入力中は再描画しない）
              if(savingCount===0&&!document.querySelector('.time-edit-wrap')&&!showPaidLeaveForm&&!_paidLeaveRenderGuard) render();
            }
          }).catch(function(){});
      }
    }
    if(screen!=="admin" && screen!=="staffDetail" && !viewerMode) return;
    authFetch(FB_URL + "/tc5_records.json")
      .then(function(r){return r.json();})
      .then(function(val){
        if(val && savingCount===0){
          var arr=Array.isArray(val)?val:Object.values(val);
          if(JSON.stringify(arr)!==JSON.stringify(records)){
            records=arr;
            _lsSet("tc5_records",JSON.stringify(records));
            if(!document.querySelector('.time-edit-wrap')&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
          }
        }
      }).catch(function(){});
    authFetch(FB_URL + "/tc5_approvals.json")
      .then(function(r){return r.json();})
      .then(function(val){
        if(val && savingCount===0 && JSON.stringify(val)!==JSON.stringify(approvals)){
          approvals=val;
          _lsSet("tc5_approvals",JSON.stringify(approvals));
          if(!document.querySelector('.time-edit-wrap')&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
        }
      }).catch(function(){});
    authFetch(FB_URL + "/tc5_correction_requests.json")
      .then(function(r){return r.json();})
      .then(function(val){
        if(val){
          var arr=typeof val==="object"&&!Array.isArray(val)?Object.values(val):val;
          var newReqs=(arr||[]).filter(Boolean);
          if(JSON.stringify(newReqs)!==JSON.stringify(correctionRequests)){
            correctionRequests=newReqs;
            _lsSet("tc5_correction_requests",JSON.stringify(correctionRequests));
            if(!document.querySelector('.time-edit-wrap')&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
          }
        }
      }).catch(function(){});
    // 有給申請(正本)は管理者画面表示中は常時同期。有給管理タブ以外でも未対応件数バッジを最新化するため（読み取りのみ・書き込みなし）
    if(screen==="admin"){
      authFetch(FB_URL+"/tc5_paid_leave_requests.json")
        .then(function(r){return r.json();})
        .then(function(val){
          if(val){
            var arr=typeof val==="object"&&!Array.isArray(val)?Object.values(val):val;
            var next=(arr||[]).filter(Boolean);
            // 他 polling と同様に差分時のみ反映・再描画（定常再描画による入力欄・モーダル状態のリセット防止）
            if(JSON.stringify(next)!==JSON.stringify(paidLeaveRequests)){
              paidLeaveRequests=next;
              // 残日数入力フォーム編集中・タブ閲覧中・月別出勤日数入力中はrenderをスキップ（UI状態リセット防止）
              if(!document.querySelector('.time-edit-wrap')&&!paidLeaveBalanceDirty&&!paidLeaveBalanceSaving&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
            }
          }
        }).catch(function(){});
    }
    if(screen==="admin"&&adminTab==="paidleave"){
      // 残日数も polling で同期（承認処理中・フォーム編集中はスキップ）
      if(!paidLeaveBalanceSaving&&!paidLeaveBalanceDirty){
        authFetch(FB_URL+"/tc5_paid_leave_balances.json")
          .then(function(r){return r.json();})
          .then(function(val){
            if(val&&!paidLeaveBalanceDirty&&!paidLeaveBalanceSaving){
              var arr=typeof val==="object"&&!Array.isArray(val)?Object.values(val):val;
              paidLeaveBalances=(arr||[]).filter(Boolean).map(function(x){return normalizePaidLeaveBalance(x);});
              if(!document.querySelector('.time-edit-wrap')&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
            }
          }).catch(function(){});
      }
    }
    // 賄い一覧タブ表示中は tc5_meals を同期（スタッフ本人の打刻画面で入力された分を反映。read-only表示のため再描画は安全）
    if(screen==="admin"&&adminTab==="meals"){
      authFetch(FB_URL+"/tc5_meals.json")
        .then(function(r){return r.json();})
        .then(function(val){
          if(val&&typeof val==="object"&&JSON.stringify(val)!==JSON.stringify(mealsData)){
            mealsData=val;
            if(!document.querySelector('.time-edit-wrap')&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
          }
        }).catch(function(){});
      // 月初確認状況もスタッフ本人の回答を反映（read-only表示のため再描画は安全）
      authFetch(FB_URL+"/tc5_meal_confirmations.json")
        .then(function(r){return r.json();})
        .then(function(val){
          if(val&&typeof val==="object"&&JSON.stringify(val)!==JSON.stringify(mealConfData)){
            mealConfData=val;
            if(!document.querySelector('.time-edit-wrap')&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
          }
        }).catch(function(){});
    }
  }, 10000);
}

// ===== ファイル表示名整形 =====
// 方針: 巨大ID・epochタイムスタンプを除去/変換し、「名前_書類名_YYYY-MM-DD.ext」順に整理
// uploadedAt: Firebaseのメタデータ日時文字列。巨大IDを日付に置換する際に使用（任意）
function getDisplayFileName(name,uploadedAt){
  if(!name)return '';
  var lastDot=name.lastIndexOf('.');
  var ext=lastDot>=0?name.slice(lastDot):'';
  var stem=lastDot>=0?name.slice(0,lastDot):name;
  var parts=stem.split('_');
  var textParts=[];
  var dateParts=[];
  var hasDate=false;
  var prevWasDate=false;
  var hugeRemoved=false;
  function toDateStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if(!p){prevWasDate=false;continue;}
    // YYYY-MM-DD → 日付として末尾へ
    if(/^\d{4}-\d{2}-\d{2}$/.test(p)){
      var pd=new Date(p);
      if(!isNaN(pd)){dateParts.push(p);hasDate=true;prevWasDate=true;continue;}
    }
    // 日付直後の4桁 (HHMM) → 時刻なので削除
    if(prevWasDate&&/^\d{4}$/.test(p)){prevWasDate=false;continue;}
    prevWasDate=false;
    // 15桁以上 → 巨大ID・UUID系 → 削除(uploadedAtで代替)
    if(/^\d{15,}$/.test(p)){hugeRemoved=true;continue;}
    // 14桁 → YYYYMMDDHHmmss → YYYY-MM-DDに変換
    if(/^\d{14}$/.test(p)){
      var y=p.slice(0,4),mo=p.slice(4,6),dy=p.slice(6,8);
      var pd2=new Date(y+'-'+mo+'-'+dy);
      if(!isNaN(pd2)&&parseInt(y,10)>=2000){dateParts.push(y+'-'+mo+'-'+dy);hasDate=true;continue;}
    }
    // 10〜13桁 → epochタイムスタンプ(ms/s) → YYYY-MM-DDに変換
    if(/^\d{10,13}$/.test(p)){
      var ts=parseInt(p,10);
      var tsMs=p.length<=10?ts*1000:ts;
      var td=new Date(tsMs);
      if(td.getFullYear()>=2000&&td.getFullYear()<=2100){dateParts.push(toDateStr(td));hasDate=true;continue;}
    }
    // 8桁 → YYYYMMDD → YYYY-MM-DDに変換
    if(/^\d{8}$/.test(p)){
      var y2=p.slice(0,4),mo2=p.slice(4,6),dy2=p.slice(6,8);
      var pd3=new Date(y2+'-'+mo2+'-'+dy2);
      if(!isNaN(pd3)&&parseInt(y2,10)>=2000){dateParts.push(y2+'-'+mo2+'-'+dy2);hasDate=true;continue;}
    }
    textParts.push(p);
  }
  // 巨大IDを除去した場合のみ、uploadedAtの日付を代替として末尾に追加
  if(hugeRemoved&&!hasDate&&uploadedAt){
    var ud=new Date(uploadedAt);
    if(!isNaN(ud))dateParts.push(toDateStr(ud));
  }
  // 名前_書類名_日付.ext の順で結合
  return textParts.concat(dateParts).join('_')+ext;
}

// ===== ユーティリティ =====
function pad(n){return String(n).padStart(2,"0");}
// 衝突耐性のあるID生成（新規レコード・書類用）
function generateRecordId(){
  if(window.crypto&&typeof window.crypto.randomUUID==="function"){return window.crypto.randomUUID();}

function fmtDate(d){return d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate());}
function fmtDateKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fmtTime(d){return pad(d.getHours())+":"+pad(d.getMinutes());}
function fmtTimeSec(d){return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());}
// "YYYY-MM-DD" → "YYYY年M月D日"（有給通知の対象日表示用。不正値はそのまま返す）
function fmtJPDate(ymd){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd||""));
  if(!m)return String(ymd||"");
  return m[1]+"年"+parseInt(m[2],10)+"月"+parseInt(m[3],10)+"日";
}
function monthKey(iso){return iso?iso.substring(0,7):"";}
// JST 明示で date+time から Date を生成（UTC解釈ズレを防ぐ）
function parseJstDateTime(date,time){
  if(!date||!time)return null;

}
function toHM(ms){if(ms<=0)return"";return Math.floor(ms/3600000)+":"+pad(Math.floor((ms%3600000)/60000));}
function calcTenure(hireDateStr){
  if(!hireDateStr)return"";
  var h=new Date(hireDateStr),n=new Date();
  var y=n.getFullYear()-h.getFullYear(),m=n.getMonth()-h.getMonth();
  if(m<0){y--;m+=12;}
  if(y<0)return"入社前";
  if(y===0)return m+"ヶ月";
  return y+"年"+(m>0?m+"ヶ月":"");
}
// ===== 有給付与スケジュール計算 =====
function parsePaidLeaveHireDate(dateStr){
  if(!dateStr)return null;
  var s=String(dateStr).replace(/\//g,'-').replace(/\./g,'-');
  if(/^\d{8}$/.test(s))s=s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
  var d=new Date(s);return isNaN(d.getTime())?null:d;
}
function calcPaidLeaveSchedule(hireDateStr){
  var hd=parsePaidLeaveHireDate(hireDateStr);if(!hd)return[];
  var todayStr=fmtDateKey(new Date());var result=[];
  for(var n=1;n<=30;n++){
    var offsetM=6+(n-1)*12;
    var gd=new Date(hd.getFullYear(),hd.getMonth()+offsetM,hd.getDate());
    var gdStr=fmtDateKey(gd);if(gdStr>todayStr)break;
    var exp=new Date(gd.getFullYear(),gd.getMonth()+24,gd.getDate());
    exp.setDate(exp.getDate()-1);
    result.push({grantNum:n,grantDate:gdStr,expiresAt:fmtDateKey(exp)});
  }
  return result;
}
// 週所定労働日数（5日以上=5,4,3,2,1 / 未設定=null）と勤続回数(grantIndex,1始まり)から
// 法定の比例付与日数を算出する。未設定や不正値は null（＝要確認）を返し、勝手に週5扱いしない。
function calculatePaidLeaveGrantDays(grantIndex,weeklyWorkDays){
  var w=parseInt(weeklyWorkDays,10);
  if(!w||w<1)return null; // 未設定 → 要確認（自動算出しない）
  if(w>5)w=5;             // 5日以上はすべて週5扱い
  var gi=parseInt(grantIndex,10);
  if(!gi||gi<1)return null;
  if(gi>7)gi=7;           // 6年6か月以降は第7回以降と同一
  // grantIndex(1=6か月,2=1年6か月,…,7=6年6か月以降) × 週所定労働日数(5,4,3,2,1)
  var table={
    1:{5:10,4:7,3:5,2:3,1:1},
    2:{5:11,4:8,3:6,2:4,1:2},
    3:{5:12,4:9,3:6,2:4,1:2},
    4:{5:14,4:10,3:8,2:5,1:2},
    5:{5:16,4:12,3:9,2:6,1:3},
    6:{5:18,4:13,3:10,2:6,1:3},
    7:{5:20,4:15,3:11,2:7,1:3}
  };
  var row=table[gi];
  return(row&&row[w]!=null)?row[w]:null;
}
// 週所定労働日数の表示ラベル（未設定は空文字）
function weeklyWorkDaysLabel(w){
  var n=parseInt(w,10);
  if(!n||n<1)return"";
  if(n>=5)return"週5日以上";
  return"週"+n+"日";
}
// ===== 年間勤務日数区分による付与日数の自動算出 =====
// 労務士資料の区分: 年間換算勤務日数 → 週相当日数（5/4/3/2/1）。47日以下はnull（判定不可/要確認）。
function judgeWeeklyEquivByAnnualDays(annual){
  if(annual==null||isNaN(annual))return null;
  if(annual>=217)return 5;
  if(annual>=169)return 4;
  if(annual>=121)return 3;
  if(annual>=73)return 2;
  if(annual>=48)return 1;
  return null; // 47日以下 → 判定不可/要確認
}
// 指定月(YYYY-MM)の出勤日数を返す。月別出勤日数画面と同一優先順位（override→打刻→取込→なし）。read-onlyの集計のみ。
function getAttendanceDaysForMonth(staffName,eid,ym,punchMap){
  var imp=monthlyDaysImport[(eid||"").trim()];
  var impVal=(imp&&imp.months&&imp.months[ym]!=null&&imp.months[ym]!=="")?(parseInt(imp.months[ym],10)||0):null;
  if(MD_OVERRIDE_MONTHS[ym]&&impVal!=null)return{days:impVal,src:"override"};
  var pm=punchMap&&punchMap[staffName]&&punchMap[staffName][ym];
  var cnt=pm?Object.keys(pm).length:0;
  if(cnt>0)return{days:cnt,src:"punch"};
  if(impVal!=null)return{days:impVal,src:"import"};
  return{days:0,src:"none"};
}
// "YYYY-MM" に nか月加算した "YYYY-MM" を返す
function addYm(ym,n){
  var p=ym.split("-");var t=(parseInt(p[0],10)*12+(parseInt(p[1],10)-1))+n;
  return Math.floor(t/12)+"-"+pad(t%12+1);
}
// 付与1件分の自動算出（初回=入社月から6か月×2、2回目以降=付与月の前12か月）。recordsから作ったpunchMapを使う。
function calcAutoGrantFromAttendance(staffName,eid,grantNum,hireDateStr,grantDateStr,punchMap){
  var months=[];
  if(grantNum===1){
    var hd=parsePaidLeaveHireDate(hireDateStr);if(!hd)return null;
    var hym=hd.getFullYear()+"-"+pad(hd.getMonth()+1);
    for(var i=0;i<6;i++)months.push(addYm(hym,i)); // 入社月から6か月
  }else{
    if(!grantDateStr)return null;
    var gp=grantDateStr.split("-");var gym=gp[0]+"-"+pad(parseInt(gp[1],10));
    for(var j=1;j<=12;j++)months.push(addYm(gym,-j)); // 付与月の前12か月
  }
  var sum=0,dataShort=false;
  months.forEach(function(m){var c=getAttendanceDaysForMonth(staffName,eid,m,punchMap);if(c.src==="none")dataShort=true;sum+=c.days;});
  var annual=(grantNum===1)?sum*2:sum;
  var weeklyEquiv=dataShort?null:judgeWeeklyEquivByAnnualDays(annual);
  var autoGrantDays=(weeklyEquiv!=null)?calculatePaidLeaveGrantDays(grantNum,weeklyEquiv):null;
  return{
    from:months[0],to:months[months.length-1],
    workDays:sum,annualDays:annual,
    weeklyEquiv:weeklyEquiv,autoGrantDays:autoGrantDays,
    dataShort:dataShort,
    note:dataShort?"判定不可（データ不足）":(weeklyEquiv==null?"要確認（47日以下）":null)
  };
}
function getPaidLeaveUnregistered(){
  var idCounts={};
  staffList.forEach(function(s){if(s.employeeId&&String(s.employeeId).trim()){var k=String(s.employeeId).trim();idCounts[k]=(idCounts[k]||0)+1;}});
  var dupIds=Object.keys(idCounts).filter(function(k){return idCounts[k]>1;});
  var noIdList=staffList.filter(function(s){return s.status!=="退職"&&(!s.employeeId||!String(s.employeeId).trim());});
  // 出勤日数の自動算出用に records(clockIn) を staff名→年月→日付Set のマップへ1回だけ集計（read-only）
  var punchMap={};

    var ym=r.date.substring(0,7);

  });
  var grants=[];

    if(!s.employeeId||!String(s.employeeId).trim())return;

        var wwd=s.weeklyWorkDays;

        // 出勤日数からの自動算出（weeklyWorkDaysは上書きしない）
        var auto=calcAutoGrantFromAttendance(s.name,sid,item.grantNum,s.hireDate,item.grantDate,punchMap);
        // 自動算出値と手動由来が両方あり食い違う場合のフラグ
        var mismatch=(auto&&auto.autoGrantDays!=null&&gdays!=null&&auto.autoGrantDays!==gdays);
        grants.push({staffId:sid,staffName:s.name,staffDisplayName:dn,hireDate:s.hireDate,grantNum:item.grantNum,grantDate:item.grantDate,expiresAt:item.expiresAt,weeklyWorkDays:wwd,grantDays:gdays,auto:auto,mismatch:mismatch});
      }
    });
  });
  return{grants:grants,dupIds:dupIds,noIdList:noIdList};
}
function calcMs(rs){
  var s=rs.slice().sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
  var tot=0,brk=0,cin=null,bsin=null;
  for(var i=0;i<s.length;i++){
    var r=s[i];
    if(r.type==="clockIn")cin=new Date(r.timestamp);
    if(r.type==="clockOut"&&cin){tot+=new Date(r.timestamp)-cin;cin=null;}
    if(r.type==="breakStart")bsin=new Date(r.timestamp);
    if(r.type==="breakEnd"&&bsin){brk+=new Date(r.timestamp)-bsin;bsin=null;}
  }
  return Math.max(0,tot-brk);
}
// 休憩ペア配列を取得（{start:rec, end:rec|null}）。endがnullは休憩中
function getBreakPairs(dr){
  var sorted=dr.slice().sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
  var pairs=[],bsin=null;
  for(var i=0;i<sorted.length;i++){
    var r=sorted[i];
    if(r.type==="breakStart"){bsin=r;}
    else if(r.type==="breakEnd"){if(bsin){pairs.push({start:bsin,end:r});bsin=null;}}
  }
  if(bsin)pairs.push({start:bsin,end:null});
  return pairs;
}
function sumBreakMs(pairs){
  var brk=0;
  pairs.forEach(function(p){if(p.start&&p.end)brk+=new Date(p.end.timestamp)-new Date(p.start.timestamp);});
  return brk;
}
function isPastDate(dateStr){

function validateAttendanceRecord(nm,date,sr){
  if(!nm||!date)return{valid:false,reason:"データ不足"};
  var cin=sr.find(function(r){return r.type==="clockIn";});
  var cout=sr.find(function(r){return r.type==="clockOut";});
  if(cin&&!cin.time)return{valid:false,reason:"データ不足"};
  if(cout&&!cout.time)return{valid:false,reason:"データ不足"};
  if(cin&&!cout)return{valid:false,reason:"退勤漏れ"};
  if(!cin&&cout)return{valid:false,reason:"出勤漏れ"};
  if(cin&&cout&&new Date(cout.timestamp)-new Date(cin.timestamp)<=0)return{valid:false,reason:"勤務時間異常"};
  return{valid:true};
}

function getKanaRow(s){
  var str=(s.yomi||s.name||"").replace(/[\s　]/g,"");
  if(!str)return "その他";
  var c=str.charAt(0);
  var code=c.charCodeAt(0);
  if(code>=0x30A1&&code<=0x30F6)c=String.fromCharCode(code-0x60);
  var map={"あ行":"あいうえお","か行":"かきくけこ","さ行":"さしすせそ","た行":"たちつてと",
            "な行":"なにぬねの","は行":"はひふへほ","ま行":"まみむめも","や行":"やゆよ",
            "ら行":"らりるれろ","わ行":"わをん"};
  for(var r in map){if(map[r].indexOf(c)>=0)return r;}
  return "その他";
}

// ===== 時刻セル インライン編集ハンドラー（勤怠一覧・個人別共通） =====
function attachTimeCellHandlers(){
  document.querySelectorAll(".time-cell").forEach(function(el){
    el.onclick=function(){
      var id=el.dataset.id,snm=el.dataset.nm,type=el.dataset.type,date=el.dataset.date;
      var cur=el.textContent.trim();
      if(cur==="--:--"||cur==="−")cur="";
      if(el.querySelector("input"))return;
      var origText=el.textContent,origStyle=el.getAttribute("style")||"";
      var typeName=TYPE_LABEL[type]||type;
      // saveAllowed=true にした直後の save() 呼び出しだけが保存を実行する
      // Enter / 設定ボタン以外では saveAllowed を true にしない
      var saveAllowed=false;
      var wrap=document.createElement("div");
      wrap.className="time-edit-wrap";
      var inp=document.createElement("input");
      inp.type="time";inp.value=cur;inp.className="time-edit-input";
      var btnOk=document.createElement("button");
      btnOk.textContent="設定";btnOk.title="保存";btnOk.className="time-edit-ok";
      var btnCnl=document.createElement("button");
      btnCnl.textContent="✕";btnCnl.title="キャンセル";btnCnl.className="time-edit-cancel";
      wrap.appendChild(inp);wrap.appendChild(btnOk);wrap.appendChild(btnCnl);
      el.textContent="";el.style.borderBottom="none";el.style.cursor="default";
      el.appendChild(wrap);
      inp.focus();inp.select();
      function cancel(){el.setAttribute("style",origStyle);el.textContent=origText;}
      function save(){
        if(!saveAllowed){return;}  // ガード：Enter / 設定ボタン以外は通さない
        saveAllowed=false;          // 即リセットして二重保存を防ぐ
        var val=inp.value.trim();
        if(!val&&!id){cancel();return;}
        var parts=val?val.split(":"):[null,null];
        var hh=val?parseInt(parts[0]):NaN,mm=val?parseInt(parts[1]):NaN;
        if(val&&(isNaN(hh)||isNaN(mm)||hh>23||mm>59)){showAlert("時刻が正しくありません（例：08:30）");inp.focus();return;}
        var newTime=val?pad(hh)+":"+pad(mm):"";
        var oldTime=cur||"（未打刻）";
        if(newTime===""&&id){
          showConfirm(snm+"さんの "+typeName+"（"+date+"）を削除します。\nよろしいですか？",function(){
            var rec=records.find(function(r){return r.id===id;});
            if(rec){console.log("[管理者修正] 削除:",snm,date,typeName,"元時刻:",rec.time);rec.deleted=true;softDeleteRecord(rec.id);}
            render();
          },function(){cancel();});
        } else if(newTime){
          var _newTime2=newTime,_hh2=hh,_mm2=mm;
          showAdjustReasonModal(function(adj){
            var d2=parseJstDateTime(date,pad(_hh2)+":"+pad(_mm2));
            var nowIso=new Date().toISOString();
            var _origCin="",_origCout="";
            var _cins=records.filter(function(r){return r.staff===snm&&r.date===date&&r.type==="clockIn"&&!r.deleted;});
            var _couts=records.filter(function(r){return r.staff===snm&&r.date===date&&r.type==="clockOut"&&!r.deleted;});
            if(_cins.length)_origCin=_cins[0].time;
            if(_couts.length)_origCout=_couts[0].time;
            var _corrCin=type==="clockIn"?_newTime2:_origCin;
            var _corrCout=type==="clockOut"?_newTime2:_origCout;
            if(id){
              var rec=records.find(function(r){return r.id===id;});
              if(rec){if(!rec.editHistory)rec.editHistory=[];rec.editHistory.push({time:rec.time,editedAt:nowIso});if(!rec.editedFrom)rec.editedFrom=rec.time;rec.time=_newTime2;rec.timestamp=d2.toISOString();rec.editedByAdmin=true;rec.editedAt=nowIso;if(!rec.editedFields)rec.editedFields={};rec.editedFields[type]=true;rec.adjustReason=adj.reason;rec.adjustReasonLabel=adj.label;rec.adjustComment=adj.comment;rec.adjustedAt=nowIso;rec.adjustedBy="管理者";rec.originalClockIn=_origCin;rec.originalClockOut=_origCout;rec.correctedClockIn=_corrCin;rec.correctedClockOut=_corrCout;console.log("[管理者修正]",snm,date,typeName,":",oldTime,"→",_newTime2,"理由:",adj.label);saveRecord(rec);}
            } else {
              var exist=records.find(function(r){return r.staff===snm&&r.type===type&&r.date===date&&!r.deleted;});
              if(exist){if(!exist.editHistory)exist.editHistory=[];exist.editHistory.push({time:exist.time,editedAt:nowIso});if(!exist.editedFrom)exist.editedFrom=exist.time;exist.time=_newTime2;exist.timestamp=d2.toISOString();exist.editedByAdmin=true;exist.editedAt=nowIso;if(!exist.editedFields)exist.editedFields={};exist.editedFields[type]=true;exist.adjustReason=adj.reason;exist.adjustReasonLabel=adj.label;exist.adjustComment=adj.comment;exist.adjustedAt=nowIso;exist.adjustedBy="管理者";exist.originalClockIn=_origCin;exist.originalClockOut=_origCout;exist.correctedClockIn=_corrCin;exist.correctedClockOut=_corrCout;console.log("[管理者修正] 既存更新:",snm,date,typeName,":",oldTime,"→",_newTime2,"理由:",adj.label);saveRecord(exist);}
              else{var nr={id:generateRecordId(),staff:snm,type:type,date:date,time:_newTime2,timestamp:d2.toISOString(),manualAdd:true,editedByAdmin:true,editedAt:nowIso,editedFields:{},adjustReason:adj.reason,adjustReasonLabel:adj.label,adjustComment:adj.comment,adjustedAt:nowIso,adjustedBy:"管理者",originalClockIn:_origCin,originalClockOut:_origCout,correctedClockIn:_corrCin,correctedClockOut:_corrCout};nr.editedFields[type]=true;records.push(nr);console.log("[管理者修正] 新規追加:",snm,date,typeName,_newTime2,"理由:",adj.label);saveRecord(nr);}
            }
            render();
          },function(){cancel();});
        } else {
          cancel();
        }
      }
      // mousedown で preventDefault → ボタンクリック時に input のフォーカスを維持
      btnOk.addEventListener("mousedown",function(e){e.preventDefault();});
      btnCnl.addEventListener("mousedown",function(e){e.preventDefault();});
      // 設定ボタン：saveAllowed を true にしてから save()
      btnOk.addEventListener("click",function(e){e.stopPropagation();saveAllowed=true;save();});
      // ×ボタン：cancel のみ
      btnCnl.addEventListener("click",function(e){e.stopPropagation();cancel();});
      // Enter：saveAllowed を true にしてから save()
      // Escape：cancel のみ
      // それ以外のキー・blur・change・枠外クリックでは一切何もしない
      inp.addEventListener("keydown",function(e){
        if(e.key==="Enter"){e.preventDefault();saveAllowed=true;save();}
        if(e.key==="Escape"){e.preventDefault();cancel();}
      });
    };
  });
}

// ===== 承認漏れサマリー =====
function getUnapprovedSummary(){
  var seen={},byFacility={},total=0,peopleSet={};
  records.filter(function(r){return !r.deleted&&isPastDate(r.date);}).forEach(function(r){
    var key=r.date+"__"+r.staff;
    if(seen[key])return;
    seen[key]=true;
    if(approvals[key])return;
    total++;
    peopleSet[r.staff]=true;
    var fac=r.workFacility||r.facilityName||"施設不明";
    byFacility[fac]=(byFacility[fac]||0)+1;
  });
  return{total:total,people:Object.keys(peopleSet).length,byFacility:byFacility};
}

// ===== 通知件数集計 =====
function getNotificationCounts(){
  var unapproved=getUnapprovedSummary().total;
  var cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
  var cutoffStr=fmtDateKey(cutoff);
  var todayStr=fmtDateKey(new Date());
  var missingList=[];var seenMissing={};
  records.filter(function(r){return !r.deleted&&r.date<todayStr&&r.date>=cutoffStr;}).forEach(function(r){
    var key=r.date+"__"+r.staff;
    if(seenMissing[key])return;seenMissing[key]=true;
    if(approvals[key])return;
    var sr=records.filter(function(rx){return rx.staff===r.staff&&rx.date===r.date&&!rx.deleted;});
    var v=validateAttendanceRecord(r.staff,r.date,sr);
    if(!v.valid)missingList.push({date:r.date,staff:r.staff,reason:v.reason});
  });
  var mp=missingList.length;
  // 重複排除：unapproved / missingPunch を同一ID方式で集約
  var notifyIds={};
  var _seenU={};
  records.filter(function(r){return !r.deleted&&isPastDate(r.date);}).forEach(function(r){
    var key=r.date+"__"+r.staff;
    if(_seenU[key])return;_seenU[key]=true;
    if(!approvals[key])notifyIds[key+"__unapproved"]=true;
  });
  // 打刻漏れ(missingPunch)は管理者通知合計から除外。スタッフ本人の打刻画面に移管。
  var pendingCrq=correctionRequests.filter(function(r){return r.status==="pending";}).length;
  // 有給申請の未対応件数は正本(tc5_paid_leave_requests)の status==="pending" のみから算出。
  // 承認/却下/取消(canceled)は自動的に対象外になるため、通知レコードを別途持たない（二重通知・件数ズレが起きない）。
  var pendingPl=paidLeaveRequests.filter(function(r){return r&&r.status==="pending";}).length;
  var total=Object.keys(notifyIds).length+pendingCrq+pendingPl;
  return{unapproved:unapproved,missingPunch:mp,total:total,pendingCorrectionRequests:pendingCrq,pendingPaidLeave:pendingPl,_missingList:missingList};
}

function _showFcmStatus(msg){

    +'background:rgba(25,118,210,0.92);color:#fff;padding:9px 20px;border-radius:8px;'

function initFcmForAdmin(){
  // デモ／スタッフテスト画面では通知許可ダイアログもトークン登録も行わない
  if(uiMode!=="normal"){console.log('[FCM] skip (uiMode='+uiMode+')');return;}
  console.log('[FCM] initFcmForAdmin() 開始');
  _showFcmStatus('通知設定確認中...');
  if(!('Notification' in window)){
    console.warn('[FCM] Notification API 非対応');
    _showFcmStatus('通知: このブラウザは非対応');
    return;
  }
  console.log('[FCM] Notification.permission =',Notification.permission);
  if(Notification.permission==='denied'){
    console.warn('[FCM] 通知が拒否済み（ブラウザ設定から許可してください）');
    _showFcmStatus('通知: ブラウザで拒否済み — 設定から許可してください');
    return;
  }
  if(FCM_VAPID_KEY.startsWith('REPLACE')){
    console.warn('[FCM] VAPID KEY 未設定');
    return;
  }
  if(!('serviceWorker' in navigator)){
    console.warn('[FCM] ServiceWorker 非対応');
    return;
  }
  // _swRegistration を待たず navigator.serviceWorker.ready で確実に取得
  navigator.serviceWorker.ready.then(function(reg){
    console.log('[FCM] SW ready:', reg.scope);
    window._swRegistration=reg;
    var app;
    try{app=firebase.app();}catch(e){
      try{
        app=firebase.initializeApp({
          apiKey:FB_API_KEY,
          projectId:"honomi-timecard",
          messagingSenderId:FCM_MESSAGING_SENDER_ID,
          appId:FCM_APP_ID
        });
        console.log('[FCM] firebase.initializeApp 完了');
      }catch(e2){
        console.error('[FCM] firebase.initializeApp エラー',e2);
        _showFcmStatus('通知: Firebase 初期化失敗');
        return;
      }
    }
    var msg;
    try{msg=firebase.messaging(app);}catch(e){
      console.error('[FCM] firebase.messaging エラー',e);
      _showFcmStatus('通知: Messaging 初期化失敗');
      return;
    }
    console.log('[FCM] Notification.requestPermission() 呼び出し');
    Notification.requestPermission().then(function(perm){
      console.log('[FCM] permission 結果:',perm);
      if(perm!=='granted'){
        _showFcmStatus('通知: 許可されませんでした');
        return;
      }
      _showFcmStatus('通知設定中...');
      msg.getToken({vapidKey:FCM_VAPID_KEY,serviceWorkerRegistration:reg})
        .then(function(token){
          if(token){
            console.log('[FCM] token 取得成功');
            _saveFcmToken(token);
            _showFcmStatus('通知設定完了');
          }else{
            console.warn('[FCM] token が空 — FCM 設定を確認してください');
            _showFcmStatus('通知: トークン取得失敗');
          }
        })
        .catch(function(e){
          console.error('[FCM] getToken エラー',e);
          _showFcmStatus('通知: トークン取得エラー — '+e.message);
        });
    }).catch(function(e){
      console.error('[FCM] requestPermission エラー',e);
    });
  }).catch(function(e){
    console.error('[FCM] serviceWorker.ready エラー',e);
    _showFcmStatus('通知: SW 準備失敗');
  });
}
function _saveFcmToken(token){
  var key=token.replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);
  // 生fetchを廃止し authFetch へ統一（書き込み一元遮断の対象に含めるため）
  authFetch(FB_URL+"/tc5_fcm_tokens/"+key+".json",{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({token:token,savedAt:new Date().toISOString()})
  }).then(function(){
    console.log('[FCM] token 保存完了');
  }).catch(function(e){console.error("[FCM] token save エラー",e);});
}

// 固定バナー（常時表示）。body の padding と admin-sticky-bar の top をCSS変数で追従させる。
function _applyModeBanner(){
  var el=document.getElementById("mode-banner");
  var show=null;
  if(staffDemoMode){
    show={cls:"mode-banner-sandbox",t:"スタッフテスト画面",s:"この画面の操作は本番データへ保存されません。",
      actions:'<div style="margin-top:5px;display:flex;gap:6px;justify-content:center;">'
        +'<button onclick="sandboxReset()" style="background:#ede9fe;color:#4c1d95;border:1px solid #c4b5fd;padding:3px 12px;border-radius:2px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:inherit;">リセット</button>'
        +'<button onclick="openStaffDemoPicker()" style="background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.5);padding:3px 12px;border-radius:2px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:inherit;">スタッフ選択へ</button>'
        +'</div>'};
  }else if(demoMode){
    show={cls:"mode-banner-demo",t:"デモモード",s:"本番データを表示しています。変更操作は保存できません。"};
  }
  if(!show){
    if(el&&el.parentNode)el.parentNode.removeChild(el);
    document.body.classList.remove("has-mode-banner");
    document.body.style.removeProperty("--mode-banner-h");
    return;
  }
  if(!el){el=document.createElement("div");el.id="mode-banner";document.body.appendChild(el);}
  el.className="mode-banner "+show.cls;
  el.innerHTML='<div class="mb-t">'+esc(show.t)+'</div><div class="mb-s">'+esc(show.s)+'</div>'+(show.actions||"");
  document.body.classList.add("has-mode-banner");
  document.body.style.setProperty("--mode-banner-h",el.offsetHeight+"px");
}
function _modeBannerH(){
  var el=document.getElementById("mode-banner");
  return el?el.offsetHeight:0;

var DEMO_WRITE_FN_RE=/\b(saveRecord|patchRecord|softDeleteRecord|saveApprovals|saveCorrectionRequestFb|patchCorrectionRequestFb|savePaidLeaveRequest|patchPaidLeaveRequest|savePaidLeaveBalance|patchPaidLeaveBalance|deletePaidLeaveBalance|saveData|saveToFirebase|mealSaveEntry|mealToggleDate|mealSelectAttendance|mealConfSave|mealConfGoPrev|reviewStatusSave|mdSaveCell|deleteDocument|bulkDeleteDocuments|bulkDeleteStaffDocs|uploadDocument|uploadStaffDocument|saveFacilities|adminSavePin|showAdminPinSetModal|delStaff|viewerDownloadAndDelete|submitProxyLeaveRequest|savePaidLeaveGrantRecord|openPaidLeaveGrantModal|openProxyLeaveModal|adminViewPin|staffNotifReadAndOpen)\s*\(/;
function _applyDemoUiLock(){
  if(writePolicy!=="readonlyWithAllowList")return;
  var app=document.getElementById("app");
  if(!app)return;
  var lock=function(el){
    if(!el||el.hasAttribute("data-demo-allow"))return;
    el.disabled=true;
    el.style.cursor="not-allowed";
    el.style.opacity="0.55";
    el.title="デモ画面では変更できません";
  };
  var blocked=app.querySelectorAll(DEMO_BLOCK_SELECTORS);
  for(var i=0;i<blocked.length;i++)lock(blocked[i]);
  var cand=app.querySelectorAll("button,input,select,textarea");
  for(var j=0;j<cand.length;j++){
    var el=cand[j];
    if(el.disabled||el.hasAttribute("data-demo-allow"))continue;
    var h=(el.getAttribute("onclick")||"")+" "+(el.getAttribute("onchange")||"")
         +" "+(el.getAttribute("oninput")||"")+" "+(el.getAttribute("onblur")||"");
    if(DEMO_WRITE_FN_RE.test(h))lock(el);
  }
  // 勤怠一覧のインライン時刻編集（クリック→セレクト変更で即保存）を封じる
  var cells=app.querySelectorAll(".time-cell");
  for(var k=0;k<cells.length;k++){cells[k].style.pointerEvents="none";cells[k].style.opacity="0.8";}
  var edits=app.querySelectorAll(".time-edit-wrap select,.time-edit-wrap input,.time-edit-wrap button");
  for(var m=0;m<edits.length;m++)lock(edits[m]);
}

function _execPunch(type,d){
  if(viewerMode){console.warn("[viewerMode] write blocked");return;}
  var _so=staffList.find(function(s){return s.name===staffName;})||{};
  var _hf=(_so.location)||"";
  var _fn=facilityName||"";
  // facilityName: 1)URLトークン施設 → 2)スタッフ所属施設 の順で補完
  var _effFn=_fn||_hf;
  var nr={id:generateRecordId(),staff:staffName,type:type,date:fmtDateKey(d),time:fmtTime(d),timestamp:d.toISOString()};
  if(_effFn)nr.facilityName=_effFn;
  if(type==="clockIn"){
    // workFacility優先順位: 1)応援先選択 2)URLトークン施設 3)スタッフ所属施設
    var _wf=(_so.canSupportWork&&selectedWorkFacility)?selectedWorkFacility:(_fn||_hf);
    nr.homeFacility=_hf||_fn||_wf;nr.workFacility=_wf;nr.isSupportWork=!!(_wf&&nr.homeFacility&&_wf!==nr.homeFacility);nr.wageType=nr.isSupportWork?"support_zero":"normal";
  } else if(type==="breakEnd"){
    // 休憩終了時に打刻した施設を「以降の勤務施設」として記録（施設をまたいだ休憩終了に対応）
    // ※フェーズ1ではデータ記録のみ。施設別の時間按分集計は将来対応（既存集計は clockIn.workFacility 基準のまま）
    if(_effFn)nr.workFacility=_effFn;
  }
  records.push(nr);saveRecord(nr);
  punchMsg=TYPE_LABEL[type]+"　"+fmtTimeSec(d);
  if(punchTimer)clearTimeout(punchTimer);
  punchTimer=setTimeout(function(){
    punchMsg=null;staffName=null;selectedWorkFacility=null;
    // サンドボックス中はホームではなくスタッフ選択画面へ戻す
    screen=staffDemoMode?"staffDemoPick":"home";
    render();
  },1500);
  render();
}
function doPunch(type){
  // A. 既存チェック
  if(!tokenValid)return;
  var d=new Date();
  console.log("[doPunch start]", staffName, type, fmtDateKey(d));
  // B. 当日・当該スタッフ・未削除レコード取得（同一施設でフィルタ）
  var _today=fmtDateKey(d);
  var _so2=staffList.find(function(s){return s.name===staffName;})||{};
  var _fn2=facilityName||"";
  var _dr=records.filter(function(r){return r.staff===staffName&&r.date===_today&&!r.deleted&&(!r.facilityName||!_fn2||r.facilityName===_fn2);});
  var _dCin=_dr.find(function(r){return r.type==="clockIn";});
  var _dCout=_dr.find(function(r){return r.type==="clockOut";});
  // C. 二重打刻・出勤なし退勤チェック
  if(type==="clockIn"&&_dCin){
    showAlert("本日の出勤はすでに打刻済みです。\n\n出勤 "+_dCin.time+"\n\n修正が必要な場合は管理者へ連絡してください。");
    return;
  }
  if(type==="clockIn"&&!_dCin){
    var _anyCinOpen=findOpenClockInAcrossFacilities(staffName,_today);
    if(_anyCinOpen){
      showAlert("他施設で出勤中です。\n\n出勤中："+(_anyCinOpen.facilityName||"")+" "+_anyCinOpen.time+"\n\n退勤を押してください。");
      return;
    }
  }
  var _anyDout=records.find(function(r){return r.staff===staffName&&r.date===_today&&!r.deleted&&r.type==="clockOut";});
  if(type==="clockOut"&&_anyDout){
    showAlert("本日の退勤はすでに打刻済みです。\n\n退勤 "+_anyDout.time+"\n\n修正が必要な場合は管理者へ連絡してください。");
    return;
  }
  if(type==="clockOut"&&!_dCin){
    var _crossCin=findOpenClockInAcrossFacilities(staffName,_today);
    if(!_crossCin){
      showAlert("本日の出勤打刻がありません。\n\n先に出勤を打刻してください。");
      return;
    }
  }
  // C2. 休憩3回目以上チェック（施設をまたいだ休憩も1回として数えるため全施設横断でカウント）
  if(type==="breakStart"){
    var _allDr=records.filter(function(r){return r.staff===staffName&&r.date===_today&&!r.deleted;});
    var _bpairs=getBreakPairs(_allDr);
    var _completedBreaks=_bpairs.filter(function(p){return p.end!=null;}).length;
    if(_completedBreaks>=2){
      showAlert("休憩は2回まで記録できます。\n追加休憩が必要な場合は管理者に連絡してください。");
      return;
    }
  }
  // D. 出勤→退勤の短時間警告チェック
  if(type==="clockOut"){
    var _sr=_dr.slice().sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
    var _lr=_sr[_sr.length-1];
    if(!_lr){var _crossCinD=findOpenClockInAcrossFacilities(staffName,_today);if(_crossCinD)_lr=_crossCinD;}
    if(_lr&&_lr.type==="clockIn"){
      var _em=Math.floor((d-new Date(_lr.timestamp))/60000);
      var _im="前回：出勤 "+_lr.time+"\n現在：退勤 "+fmtTime(d)+"\n経過："+_em+"分";
      if(_em<5){
        showModal({title:"打刻内容を確認してください",message:_im+"\n\n誤って退勤していませんか？",alertOnly:false,okLabel:"退勤する",onOK:function(){_execPunch(type,d);},onCancel:function(){}});
        return;
      }
      if(_em<10){
        showAlert("打刻内容を確認してください\n\n"+_im,function(){_execPunch(type,d);});
        return;
      }
    }
  }
  // E. clockIn時の施設確定チェック（施設不明のまま保存させない）
  if(type==="clockIn"){
    var _so3=staffList.find(function(s){return s.name===staffName;})||{};
    var _wfCheck=(_so3.canSupportWork&&selectedWorkFacility)?selectedWorkFacility:(facilityName||_so3.location||"");
    if(!_wfCheck){
      showAlert("施設が確定できません。\nスタッフの所属施設が未登録です。\n管理者に連絡してください。");
      return;
    }
  }
  // F. 通常保存処理
  _execPunch(type,d);
}

// ===== 閲覧用トークン生成 =====
function generateViewerToken(){
  var chars='abcdefghijklmnopqrstuvwxyz0123456789';
  var arr=new Uint8Array(24);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(function(b){return chars[b%chars.length];}).join('');
}
// トークンの伏せ字表示（先頭4文字＋末尾2文字のみ）
function maskToken(t){
  t=String(t||"");
  if(t.length<=8)return t.replace(/./g,"•");
  return t.slice(0,4)+"••••••••"+t.slice(-2);
}

// ===== スタッフテスト画面（サンドボックス）=====
// 既存の render()/打刻処理/申請処理/賄い処理をそのまま使い、データソースと保存先だけを
// メモリ上のコピーへ差し替える。本番業務データへは一切書き込まない（_lsSet と authFetch が遮断）。
function _sbCopy(v){try{return JSON.parse(JSON.stringify(v));}catch(e){return v;}}
function _sandboxSnapshotTake(){

    records:records,correctionRequests:correctionRequests,

  };
}
// 対象スタッフ分だけを深いコピーで積み込む（他スタッフのデータはサンドボックスに載せない）
function _sandboxLoad(name){
  var s=_sandboxSnapshot||{};
  var sid=resolveStaffId(name);
  records=_sbCopy((s.records||[]).filter(function(r){return r&&r.staff===name;}));
  correctionRequests=_sbCopy((s.correctionRequests||[]).filter(function(r){return r&&r.staff===name;}));
  paidLeaveRequests=_sbCopy((s.paidLeaveRequests||[]).filter(function(r){return r&&(r.staffName===name||(sid&&r.staffId===sid));}));
  paidLeaveBalances=_sbCopy((s.paidLeaveBalances||[]).filter(function(b){return b&&sid&&(b.staffId===sid||b.employeeId===sid);}));
  mealsData={};
  if(sid&&s.mealsData&&s.mealsData[sid])mealsData[sid]=_sbCopy(s.mealsData[sid]);
  mealConfData={};
  if(sid&&s.mealConfData&&s.mealConfData[sid])mealConfData[sid]=_sbCopy(s.mealConfData[sid]);
  staffNotifications={};
  if(sid&&s.staffNotifications&&s.staffNotifications[sid])staffNotifications[sid]=_sbCopy(s.staffNotifications[sid]);
}

async function hashPin(pin){
  var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("honomi_pin_v1:"+pin));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
function isLegacyPin(val){return /^\d{4}$/.test(val);}
function adminPinReady(){return !!(ADMIN_PIN_HASH||ADMIN_PIN);}
// staffPins の値は string（hash or legacy 4桁）または {hash,plain} オブジェクトの混在を吸収
function getStoredPin(name){
  var v=staffPins[name];
  if(!v)return{hash:null,plain:null};
  if(typeof v==="object")return{hash:v.hash||null,plain:v.plain||null};
  return{hash:v,plain:null};
}

async function sOk(){
  var sp=getStoredPin(staffName);
  if(!sp.hash){staffPinError=true;staffPinInput="";render();return;}
  var inputStr=String(staffPinInput);
  var match=false;
  if(isLegacyPin(sp.hash)){
    // 旧形式（4桁平文）: 照合後に {hash,plain} 形式へ自動移行
    match=(sp.hash===inputStr);
    if(match){var h=await hashPin(inputStr);staffPins[staffName]={hash:h,plain:inputStr};saveData("tc5_pins",staffPins);}
  } else {
    match=((await hashPin(inputStr))===sp.hash);
  }
  if(match){staffPinError=false;screen="punch";render();}
  else{staffPinError=true;staffPinInput="";render();}
}

  if(staffPinStep===1){
    if(v==="C")staffPinInput=staffPinInput.slice(0,-1);

  } else {
    if(v==="C")staffPinConfirm=staffPinConfirm.slice(0,-1);

async function sNewOk(){
  if(staffPinStep===1){

    render();

  }
  var inputStr=pinInput;
  var match=false;
  if(ADMIN_PIN_HASH){
    match=((await hashPin(inputStr))===ADMIN_PIN_HASH);
  } else if(ADMIN_PIN){

function uploadDocument(){
  // デモ／テスト画面ではアップロード不可（機能復活時にも有効なよう、無効化returnより前に置く）
  if(writePolicy!=="full"){demoWriteBlocked();return;}

  if(!f){showAlert('ファイルを選択してください');return;}

  if(!title){showAlert('タイトルを入力してください');return;}
  var memo=(document.getElementById('doc-memo')||{value:''}).value.trim();
  var ext=(f.name.split('.').pop()||'').toLowerCase();
  var docId=generateRecordId();
  var storagePath='documents/'+docId+'_'+f.name;
  var encodedPath=encodeURIComponent(storagePath);
  var uploadUrl=STORAGE_BASE+'?uploadType=media&name='+encodedPath;
  var btn=document.getElementById('btn-doc-upload');
  var progressWrap=document.getElementById('doc-progress-wrap');
  var progressBar=document.getElementById('doc-progress-bar');
  var progressText=document.getElementById('doc-progress-text');
  if(btn){btn.disabled=true;btn.textContent='アップロード中...';}
  if(progressWrap)progressWrap.style.display='block';
  getAuthToken().then(function(tok){
    var xhr=new XMLHttpRequest();
    xhr.open('POST',uploadUrl);
    xhr.setRequestHeader('Content-Type',f.type||'application/octet-stream');
    xhr.setRequestHeader('Authorization','Bearer '+tok);
    xhr.upload.onprogress=function(e){
      if(e.lengthComputable){
        var pct=Math.round(e.loaded/e.total*100);
        if(progressBar)progressBar.style.width=pct+'%';
        if(progressText)progressText.textContent=pct+'%';
      }
    };
    xhr.onload=function(){
      if(xhr.status===200){
        var resp=JSON.parse(xhr.responseText);
        var token=resp.downloadTokens||'';
        var downloadURL=STORAGE_BASE+'/'+encodedPath+'?alt=media'+(token?'&token='+token:'');
        var metadata={
          title:title,fileName:f.name,fileType:ext,fileSize:f.size,
          storageRef:storagePath,downloadURL:downloadURL,
          uploadedAt:new Date().toISOString(),uploadedBy:'admin',memo:memo,isActive:true
        };
        authFetch(DB_DOCS+'/'+docId+'.json',{
          method:'PUT',headers:{'Content-Type':'application/json'},
          body:JSON.stringify(metadata)
        }).then(function(){
          selectedDocFile=null;
          showAlert('アップロードしました',function(){setTab('documents');});
        }).catch(function(){
          showAlert('メタデータの保存に失敗しました');
          if(btn){btn.disabled=false;btn.textContent='アップロード';}
          if(progressWrap)progressWrap.style.display='none';
        });
      } else {
        var msg='アップロードに失敗しました（'+xhr.status+'）';
        if(xhr.status===403||xhr.status===401)msg+='\nFirebase Storage のルールを確認してください';
        showAlert(msg);
        if(btn){btn.disabled=false;btn.textContent='アップロード';}
        if(progressWrap)progressWrap.style.display='none';
      }
    };
    xhr.onerror=function(){
      showAlert('アップロードに失敗しました\nネットワーク接続を確認してください');
      if(btn){btn.disabled=false;btn.textContent='アップロード';}
      if(progressWrap)progressWrap.style.display='none';
    };
    xhr.send(f);

// ===== \u6709\u7D66\u7533\u8ACB\u30E6\u30FC\u30C6\u30A3\u30EA\u30C6\u30A3 =====

// JST \u306E\u5F53\u67081\u65E5\u30FB\u672B\u65E5\u3092 { first: "YYYY-MM-DD", last: "YYYY-MM-DD" } \u3067\u8FD4\u3059
function getJSTMonthRange(){
  var parts=new Intl.DateTimeFormat("ja-JP",{
    timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(new Date());
  var y=parseInt(parts.find(function(p){return p.type==="year";}).value,10);
  var m=parseInt(parts.find(function(p){return p.type==="month";}).value,10);
  var pad=function(n){return n<10?"0"+n:String(n);};
  var firstStr=y+"-"+pad(m)+"-01";
  // \u672B\u65E5: \u7FCC\u67081\u65E5\u306E\u524D\u65E5
  var lastDay=new Date(Date.UTC(y,m,0)).getUTCDate(); // Date.UTC(y,m,0) = \u5F53\u6708\u672B\u65E5 UTC
  var lastStr=y+"-"+pad(m)+"-"+pad(lastDay);
  return {first:firstStr,last:lastStr};
}

// JST \u306E\u4ECA\u65E5\u306E\u65E5\u4ED8\u3092 YYYY-MM-DD \u3067\u8FD4\u3059
function getTodayJSTStr(){
  var parts=new Intl.DateTimeFormat("ja-JP",{
    timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(new Date());
  var y=parts.find(function(p){return p.type==="year";}).value;
  var m=parts.find(function(p){return p.type==="month";}).value;
  var d=parts.find(function(p){return p.type==="day";}).value;
  return y+"-"+m+"-"+d;
}

// ISO\u6587\u5B57\u5217\u3092 JST \u306E YYYY-MM-DD \u306B\u5909\u63DB
function isoToJSTDate(isoStr){
  if(!isoStr)return "";
  var d=new Date(isoStr);
  if(isNaN(d.getTime()))return isoStr.slice(0,10)||"";
  var parts=new Intl.DateTimeFormat("ja-JP",{
    timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(d);
  var y=parts.find(function(p){return p.type==="year";}).value;
  var mo=parts.find(function(p){return p.type==="month";}).value;
  var da=parts.find(function(p){return p.type==="day";}).value;
  return y+"-"+mo+"-"+da;
}

// ISO\u6587\u5B57\u5217\u3092 JST \u306E YYYY/MM/DD HH:mm \u306B\u5909\u63DB
function isoToJSTDateTime(isoStr){
  if(!isoStr)return "";
  var d=new Date(isoStr);
  if(isNaN(d.getTime()))return isoStr;
  return new Intl.DateTimeFormat("ja-JP",{
    timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",hour12:false
  }).format(d);
}

// \u2500\u2500 \u6709\u7D66\u4ED8\u4E0E\u884C \u30D8\u30EB\u30D1\u30FC\u95A2\u6570\u7FA4 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

// \u4ED8\u4E0E\u65E5\u304B\u3089\u6709\u52B9\u671F\u9650\u3092\u8A08\u7B97\u3059\u308B\uFF08\u4ED8\u4E0E\u65E5\u306E2\u5E74\u5F8C\u306E\u524D\u65E5\uFF09
// \u4F8B: 2026-04-01 \u2192 2028-03-31
function calcExpiresAt(grantDate){
  if(!grantDate)return "";
  var parts=grantDate.split("-");
  if(parts.length!==3)return "";
  var y=parseInt(parts[0],10),m=parseInt(parts[1],10),d=parseInt(parts[2],10);
  // 2\u5E74\u5F8C\u306E\u540C\u6708\u540C\u65E5\u306E\u524D\u65E5
  var expY=y+2,expM=m,expD=d-1;
  if(expD<=0){
    expM--;
    if(expM<=0){expM=12;expY--;}
    expD=new Date(expY,expM,0).getDate(); // \u6708\u672B\u65E5
  }
  // \u6708\u672B\u65E5\u8D85\u3048\u3092\u4E38\u3081\u308B\uFF08\u4F8B:2\u670829\u65E5\u4ED8\u4E0E\u21922\u5E74\u5F8C\u306E2\u670828\u65E5\u524D\u65E5=2\u670827\u65E5\u2026\u3067\u306F\u306A\u304FgetDate\u81EA\u52D5\u51E6\u7406\u6E08\u307F\uFF09
  var maxD=new Date(expY,expM,0).getDate();
  if(expD>maxD)expD=maxD;
  return expY+"-"+String(expM).padStart(2,"0")+"-"+String(expD).padStart(2,"0");
}

// ===== \u793E\u54E1\u756A\u53F7(staffId)\u89E3\u6C7A\u30D8\u30EB\u30D1\u30FC =====

// \u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u304B\u3089\u793E\u54E1\u756A\u53F7(staffId)\u3092\u53D6\u5F97\u3059\u308B
// staffName \u304B\u3089\u4E00\u610F\u306E employeeId \u3092\u8FD4\u3059\u3002\u7A7A\u30FB\u91CD\u8907\u30FB\u4E0D\u660E\u306E\u5834\u5408\u306F null
function resolveStaffId(staffName) {
  var matches = staffList.filter(function(s) {
    return s.name === staffName && (s.employeeId||"").trim() !== "";
  });
  if (matches.length === 1) return (matches[0].employeeId||"").trim();
  return null; // 0\u4EF6=\u793E\u54E1\u756A\u53F7\u672A\u8A2D\u5B9A\u30012\u4EF6\u4EE5\u4E0A=\u91CD\u8907
}

// resolveStaffId \u304C null \u306B\u306A\u3063\u305F\u7406\u7531\u3092\u8FD4\u3059\uFF08\u30A8\u30E9\u30FC\u30E1\u30C3\u30BB\u30FC\u30B8\u7528\uFF09
function resolveStaffIdError(staffName) {
  var all = staffList.filter(function(s) { return s.name === staffName; });
  if (all.length === 0) return "\u30B9\u30BF\u30C3\u30D5\u60C5\u5831\u304C\u898B\u3064\u304B\u308A\u307E\u305B\u3093\uFF08" + staffName + "\uFF09";
  var withId = all.filter(function(s) { return (s.employeeId||"").trim() !== ""; });
  if (withId.length === 0) return "\u793E\u54E1\u756A\u53F7\u304C\u672A\u8A2D\u5B9A\u306E\u305F\u3081\u3001\u6709\u7D66\u51E6\u7406\u3067\u304D\u307E\u305B\u3093\u3002\u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u3067\u793E\u54E1\u756A\u53F7\u3092\u8A2D\u5B9A\u3057\u3066\u304F\u3060\u3055\u3044\u3002";
  if (withId.length > 1) return "\u793E\u54E1\u756A\u53F7\u304C\u91CD\u8907\u3057\u3066\u3044\u308B\u305F\u3081\u3001\u6709\u7D66\u51E6\u7406\u3067\u304D\u307E\u305B\u3093\u3002\u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u3092\u78BA\u8A8D\u3057\u3066\u304F\u3060\u3055\u3044\u3002";
  return "\u30B9\u30BF\u30C3\u30D5\u60C5\u5831\u304C\u7279\u5B9A\u3067\u304D\u306A\u3044\u305F\u3081\u3001\u6709\u7D66\u51E6\u7406\u3092\u505C\u6B62\u3057\u307E\u3057\u305F\u3002";

// \u7533\u8ACB\u30C7\u30FC\u30BF\u304B\u3089 staffId \u3092\u78BA\u5B9A\u3059\u308B\u30D8\u30EB\u30D1\u30FC\uFF08\u65E7\u5F62\u5F0F\u4E92\u63DB\uFF09
// req.staffId \u304C\u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u306E employeeId \u3068\u4E00\u81F4\u3059\u308B\u306A\u3089\u305D\u306E\u307E\u307E\u4F7F\u3046
// \u4E00\u81F4\u3057\u306A\u3044\u5834\u5408\u306F staffName \u304B\u3089\u7167\u5408\uFF08\u65E7\u5F62\u5F0F: staffId=\u6C0F\u540D \u5BFE\u5FDC\uFF09
function getReqStaffId(req) {
  var sid = (req.staffId||"").trim();
  // staffId \u304C\u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u306E employeeId \u3068\u4E00\u81F4\u3059\u308B\u304B\u30C1\u30A7\u30C3\u30AF
  var byId = staffList.find(function(s) { return (s.employeeId||"").trim() === sid && sid !== ""; });
  if (byId) return sid; // \u793E\u54E1\u756A\u53F7\u3067\u4E00\u81F4 \u2192 \u305D\u306E\u307E\u307E\u4F7F\u3046
  // \u4E00\u81F4\u3057\u306A\u3044\u5834\u5408\u306F staffName \u304B\u3089\u7167\u5408\uFF08\u65E7\u5F62\u5F0F\u5BFE\u5FDC\uFF09
  return resolveStaffId(req.staffName || sid);
}

// ===== \u6709\u7D66\u6B8B\u65E5\u6570\u6B63\u898F\u5316 =====

// \u65E2\u5B58\u30C7\u30FC\u30BF\u3092\u6B63\u898F\u5316\uFF08expiresAt\u30FBid \u4E0D\u8DB3\u5206\u3092\u88DC\u5B8C\u3001Firebase\u4E0A\u66F8\u304D\u306A\u3057\uFF09
function normalizePaidLeaveBalance(b){
  var nb=Object.assign({},b);
  if(!nb.expiresAt&&nb.grantDate){nb.expiresAt=calcExpiresAt(nb.grantDate);}
  if(!nb.id){
    var ts=nb.createdAt?new Date(nb.createdAt).getTime():0;
    nb.id="plb_"+(nb.staffId||nb.staffName||"unknown")+"_"+(nb.grantDate||"")+"_"+ts;
  }
  // 旧形式互換: staffId が employeeId でなく氏名の場合、staffList から employeeId に変換する
  // b0634b1(staffId移行)以前に保存された付与行は staffId=氏名 のまま残っているため
  var _sid=(nb.staffId||"").trim();
  if(_sid&&staffList&&staffList.length>0){
    var _isEmpId=staffList.some(function(s){return (s.employeeId||"").trim()===_sid;});
    if(!_isEmpId){
      // staffId が employeeId として見つからない → 氏名として resolveStaffId を試みる
      var _resolved=resolveStaffId(_sid)||(nb.staffName?resolveStaffId((nb.staffName||"").trim()):null);
      if(_resolved)nb.staffId=_resolved;
    }
  }
  if(nb.staffName===undefined)nb.staffName=nb.staffId||"";
  if(nb.remainDays===undefined||nb.remainDays===null){
    nb.remainDays=Math.round(((nb.grantedDays||0)-(nb.usedDays||0))*10)/10;
  }
  return nb;
}

// \u4ECA\u65E5\u306E\u65E5\u4ED8\u6587\u5B57\u5217 (YYYY-MM-DD) \u3092\u8FD4\u3059
function todayDateStr(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

// FIFO\u6D88\u5316\u30ED\u30B8\u30C3\u30AF: \u627F\u8A8D\u6642\u306B\u53E4\u3044\u6709\u52B9\u671F\u9650\u5185\u4ED8\u4E0E\u884C\u304B\u3089\u6D88\u5316
// \u623B\u308A\u5024: Promise<{ok:boolean, consumed:Array<{id,usedBefore,usedAfter,remainBefore,remainAfter}>}>
// \u5F15\u6570 staffId: \u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u306E employeeId\uFF08\u793E\u54E1\u756A\u53F7\uFF09
// staffId \u304C null \u306E\u5834\u5408\u306F\u30A8\u30E9\u30FC\u3092\u8FD4\u3059\uFF08\u6C0F\u540D\u3067\u306F\u6D88\u5316\u3057\u306A\u3044\uFF09
function applyFifoConsumption(staffId,days){
  if(!staffId){
    return Promise.resolve({ok:false,error:"\u793E\u54E1\u756A\u53F7\u304C\u672A\u8A2D\u5B9A\u306E\u305F\u3081\u3001\u6709\u7D66\u51E6\u7406\u3067\u304D\u307E\u305B\u3093\u3002\u30B9\u30BF\u30C3\u30D5\u30DE\u30B9\u30BF\u3067\u793E\u54E1\u756A\u53F7\u3092\u8A2D\u5B9A\u3057\u3066\u304F\u3060\u3055\u3044\u3002"});
  }
  var today=todayDateStr();
  // \u6709\u52B9\u671F\u9650\u5185\u30FB\u6B8B\u3042\u308A\u30FB\u53E4\u3044\u9806 \u3067\u4E26\u3079\u308B
  // staffId\uFF08\u793E\u54E1\u756A\u53F7\uFF09\u3067\u7167\u5408\u3002\u65E7\u5F62\u5F0F\uFF08staffId=\u6C0F\u540D\uFF09\u306F\u3053\u3053\u3067\u306F\u7167\u5408\u3057\u306A\u3044
  var eligible=paidLeaveBalances
    .map(function(b){return normalizePaidLeaveBalance(b);})
    .filter(function(b){
      return b.staffId===staffId
        &&(b.expiresAt>=today)
        &&(b.remainDays>0);
    })
    .sort(function(a,b){return (a.grantDate||"").localeCompare(b.grantDate||"");});

  var needed=days;
  var consumed=[];
  for(var i=0;i<eligible.length&&needed>0;i++){
    var bal=eligible[i];
    var take=Math.min(bal.remainDays,needed);
    take=Math.round(take*10)/10;
    consumed.push({id:bal.id,usedBefore:bal.usedDays,usedAfter:bal.usedDays+take,remainBefore:bal.remainDays,remainAfter:Math.round((bal.remainDays-take)*10)/10});
    needed=Math.round((needed-take)*10)/10;
  }
  if(needed>0){
    console.warn("[PaidLeave] FIFO: \u6B8B\u65E5\u6570\u4E0D\u8DB3 staffId="+staffId+" \u4E0D\u8DB3\u65E5\u6570:",needed);
    // \u6B8B\u65E5\u6570\u4E0D\u8DB3\u3067\u3082\u6D88\u5316\u306F\u884C\u3046\uFF08\u7533\u8ACB\u3092\u512A\u5148\uFF09
  }
  // \u30ED\u30FC\u30AB\u30EB\u66F4\u65B0 + Firebase PATCH
  var promises=[];
  consumed.forEach(function(c){
    var idx=paidLeaveBalances.findIndex(function(b){
      var nb=normalizePaidLeaveBalance(b);
      return nb.id===c.id;
    });
    if(idx>=0){
      paidLeaveBalances[idx]=normalizePaidLeaveBalance(paidLeaveBalances[idx]);
      paidLeaveBalances[idx].usedDays=c.usedAfter;
      paidLeaveBalances[idx].remainDays=c.remainAfter;
      promises.push(patchPaidLeaveBalance(c.id,{usedDays:c.usedAfter,remainDays:c.remainAfter}));
    }
  });
  return Promise.all(promises).then(function(){return {ok:true,consumed:consumed};});
}

// FIFO\u6D88\u5316\u53D6\u6D88\u30ED\u30B8\u30C3\u30AF: \u5374\u4E0B\u30FB\u5F15\u623B\u3057\u6642\u306B\u6D88\u5316\u3057\u305F\u5206\u3092\u623B\u3059
// consumedSnapshot: \u627F\u8A8D\u6642\u306B\u4FDD\u5B58\u3057\u305F\u6D88\u5316\u60C5\u5831\uFF08request\u30AA\u30D6\u30B8\u30A7\u30AF\u30C8\u306EconsumedSnapshot\u30D5\u30A3\u30FC\u30EB\u30C9\uFF09
function reverseFifoConsumption(consumedSnapshot){
  if(!consumedSnapshot||!consumedSnapshot.length)return Promise.resolve({ok:true});
  var promises=[];
  consumedSnapshot.forEach(function(c){
    var idx=paidLeaveBalances.findIndex(function(b){
      var nb=normalizePaidLeaveBalance(b);
      return nb.id===c.id;
    });
    if(idx>=0){
      paidLeaveBalances[idx]=normalizePaidLeaveBalance(paidLeaveBalances[idx]);
      // \u6D88\u5316\u524D\u306B\u623B\u3059\uFF08\u73FE\u5728\u5024\u304B\u3089\u5DEE\u5206\u3092\u623B\u3059\uFF09
      var diff=c.usedAfter-c.usedBefore;
      var newUsed=Math.max(0,Math.round((paidLeaveBalances[idx].usedDays-diff)*10)/10);
      var newRemain=Math.round((paidLeaveBalances[idx].remainDays+diff)*10)/10;
      paidLeaveBalances[idx].usedDays=newUsed;
      paidLeaveBalances[idx].remainDays=newRemain;
      promises.push(patchPaidLeaveBalance(c.id,{usedDays:newUsed,remainDays:newRemain}));
    }
  });
  return Promise.all(promises).then(function(){return {ok:true};});
}

// \u6709\u7D66\u7533\u8ACB\u306E\u53D6\u5F97\u65E5\u914D\u5217\u3092\u8FD4\u3059\uFF08\u65E7\u5F62\u5F0F date \u306E\u307F\u306E\u5834\u5408\u306F [date] \u3068\u3057\u3066\u6271\u3046\uFF09
function getLeaveDates(req){
  if(req.leaveDates&&Array.isArray(req.leaveDates)&&req.leaveDates.length>0)return req.leaveDates;
  if(req.date)return [req.date];
  return [];
}

// staffId\u57FA\u6E96\u306E\u6709\u52B9\u6B8B\u65E5\u6570\uFF08\u671F\u9650\u5185\u30FB\u6B8B>0\u306E\u4ED8\u4E0E\u884C\u306E\u307F\u5408\u8A08\uFF09
function getValidRemainDays(staffId){
  if(!staffId)return 0;
  var today=todayDateStr();
  return paidLeaveBalances
    .map(function(b){return normalizePaidLeaveBalance(b);})
    .filter(function(b){
      return b.staffId===staffId&&(b.expiresAt>=today)&&(b.remainDays>0);
    })
    .reduce(function(sum,b){return Math.round((sum+b.remainDays)*10)/10;},0);
}

// \u5BFE\u8C61\u6708\u306Erecords\u306B\u3044\u308B\u9000\u8077\u6E08\u307F\u30B9\u30BF\u30C3\u30D5\u3082\u542B\u3081\u305F\u30B9\u30BF\u30C3\u30D5\u4E00\u89A7\u3092\u8FD4\u3059\uFF08\u4EBA\u5225CSV\u7528\uFF09
function buildCsvStaffList(mR){
  var activeS=staffList.filter(function(s){return !s.status||s.status==="\u5728\u7C4D";});
  var recNms=new Set(mR.filter(function(r){return r.type==="clockIn";}).map(function(r){return r.staff;}));
  var activeNmSet=new Set(activeS.map(function(s){return s.name;}));
  var retiredWithRec=staffList.filter(function(s){return s.status==="\u9000\u8077"&&recNms.has(s.name)&&!activeNmSet.has(s.name);});
  var unknownStaff=[...recNms].filter(function(nm){return !staffList.find(function(s){return s.name===nm;});}).map(function(nm){return{name:nm,yomi:nm,location:"",status:""};});
  return activeS.concat(retiredWithRec).concat(unknownStaff).sort(function(a,b){return(a.yomi||a.name).localeCompare(b.yomi||b.name,"ja");});
}

// \u4EBA\u5225\u660E\u7D30CSV\uFF081\u4EBA1\u65E51\u884C\u30FB\u52B4\u52D9\u58EB\u5411\u3051\uFF09
function dlStaffDetailCSV(month,recs,staffArr,approvalsObj){
  var DAYS_S=["\u65E5","\u6708","\u706B","\u6C34","\u6728","\u91D1","\u571F"];
  var hdr="\u6C0F\u540D,\u6240\u5C5E\u65BD\u8A2D,\u52E4\u52D9\u65BD\u8A2D,\u65E5\u4ED8,\u66DC\u65E5,\u51FA\u52E4\u6642\u523B,\u9000\u52E4\u6642\u523B,\u4F11\u61A9\u6642\u9593,\u5B9F\u50CD\u6642\u9593,\u6B8B\u696D\u6642\u9593,\u627F\u8A8D\u72B6\u614B,\u6253\u523B\u6F0F\u308C,\u5099\u8003";
  var rows=[];
  // \u627F\u8A8D\u6E08\u307F\u6709\u7D66\u65E5\u30DE\u30C3\u30D7\uFF08staffName__date \u2192 type label\uFF09
  var plMap={};
  paidLeaveRequests.filter(function(r){return r.status==="approved";}).forEach(function(r){
    plMap[r.staffName+"__"+r.date]="\u6709\u7D66";
  });
  staffArr.forEach(function(s){
    var nm=s.name;
    var sr=recs.filter(function(r){return r.staff===nm;});
    var dates=[...new Set(sr.map(function(r){return r.date;}))].sort();
    // \u627F\u8A8D\u6E08\u307F\u6709\u7D66\u3067record\u306A\u3057\u65E5\u3082\u8FFD\u52A0
    var plDates=Object.keys(plMap).filter(function(k){return k.startsWith(nm+"__");}).map(function(k){return k.slice((nm+"__").length);});
    var allDates=[...new Set(dates.concat(plDates))].sort();
    allDates.forEach(function(dk){
      var plLabel=plMap[nm+"__"+dk]||"";
      var dr=sr.filter(function(r){return r.date===dk;}).sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
      if(plLabel&&!dr.length){
        // \u6253\u523B\u306A\u3057\u6709\u7D66\u65E5\uFF08\u5168\u4F11\u306A\u3069\uFF09
        rows.push([nm,(s.location||""),"",dk,DAYS_S[new Date(dk).getDay()],
          "","","","","","\u6709\u7D66","",plLabel].join(","));
        return;
      }
      var cin=dr.find(function(r){return r.type==="clockIn";});
      var cout=dr.find(function(r){return r.type==="clockOut";});
      var brkMs=sumBreakMs(getBreakPairs(dr));
      var netMs=calcMs(dr);
      var otMs=Math.max(0,netMs-8*3600000);
      var approved=approvalsObj[dk+"__"+nm];
      var missing=(!cin||!cout)?"\u6709":"";
      var v=validateAttendanceRecord(nm,dk,dr);
      var remark=plLabel?plLabel:(!v.valid&&v.reason&&v.reason!=="OK")?v.reason:"";
      var workFac=(cin&&cin.workFacility)||"";
      rows.push([nm,(s.location||""),workFac,dk,DAYS_S[new Date(dk).getDay()],
        cin?cin.time:"",cout?cout.time:"",
        brkMs>0?toHM(brkMs):"",netMs>0?toHM(netMs):"",
        otMs>0?toHM(otMs):"",plLabel?"\u6709\u7D66":(approved?"\u627F\u8A8D\u6E08":"\u672A\u627F\u8A8D"),missing,remark].join(","));
    });
  });
  dlCSV(hdr+"\n"+rows.join("\n"),"\u7A42\u4E43\u5473_\u4EBA\u5225\u660E\u7D30_"+month+".csv");
}

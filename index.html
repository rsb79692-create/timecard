// ===== Firebase REST API設定 =====
var FB_URL = "https://honomi-timecard-default-rtdb.asia-southeast1.firebasedatabase.app/honomi";
// Firebase Storage（バケット名は Firebase コンソールで確認・変更してください）

// ===== 画像アップロード通知設定 =====
// Vercel 本番固定ドメイン（デプロイごとに変わらない）

// ===== Phase 3-A: Anonymous Auth (REST API) =====
// Firebase Console > プロジェクトの設定 > 全般 > ウェブ API キー を設定してください
var FB_API_KEY="AIzaSyDkYQ5d8mskHo94WIysaFYP8VT2bIZ9Vtc";
// ===== FCM Push通知設定（Firebase Console > プロジェクトの設定 で確認）=====
var FCM_MESSAGING_SENDER_ID="972990519633"; // 送信者 ID（数値）
var FCM_APP_ID="1:972990519633:web:68913a33250e5be920db70";                 // アプリ ID（1:xxxx:web:xxxx）
var FCM_VAPID_KEY="BFMW2J95vc3NZcS_7Y8biP9ysFhi3s5gOpeQOZQAIj3ZHd3xIOWhjKeqeeh421VkNKrzSPxDWtu1I_gF6WyV2tY";           // Cloud Messaging > ウェブ設定 > ウェブプッシュ証明書
var _fbIdToken="";
var _fbRefreshToken="";
var _fbTokenExpiry=0;
// 現在のセッションの役割。"anon"=起動時の匿名セッション（現行どおり）
// / "s"=staff / "a"=admin / "v"=viewer / "d"=demo / "x"=staffDemo
//
// ★ 起動経路ではサーバ認証APIを一切呼ばない。
//   起動時の認証は現行と同じ「Google への匿名サインイン1本」だけで、施設URL・QRコード・
//   端末設定は一切変わらない。体感速度も現行と同一（single-flight 化で通信本数はむしろ減る）。
//   役割つきセッションへの昇格は、PIN入力・共有URL認証など
//   「元々待ちが発生する場面」でだけ、画面遷移をブロックせずに行う。
var _authRole="anon";
var _authClaims=null;
// ★ セッションの世代。役割トークンを確立するたびに進める。
//   進行中の匿名サインインが後から解決したとき、確立済みの役割トークンを
//   上書きして anon へ降格させないための番兵。
var _authEpoch=0;      // セッション世代（役割トークン確立ごとに進む）

function loadRaw(k,d){try{var v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
function saveRaw(k,v){try{localStorage.setItem(k,v);}catch(e){}}

// 端末識別子。異常な大量PIN試行を検知するためだけの裏側の値。
// ★ 利用者には表示せず、設定もさせない。無ければ自動生成して保存するだけなので、
//   既存端末に再登録・再設定の作業は一切発生しない。
var _authDeviceId=(function(){
  var v=loadRaw("tc_device_id","");
  if(v)return v;
  try{
    if(window.crypto&&crypto.randomUUID){v=crypto.randomUUID().replace(/-/g,"");}
    else{var a=new Uint8Array(16);crypto.getRandomValues(a);
         v=Array.prototype.map.call(a,function(b){return b.toString(16).padStart(2,"0");}).join("");}
  }catch(e){v="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);}
  saveRaw("tc_device_id",v);
  return v;
})();

// 認証APIのベースURL。Vercel の Functions を使う（GitHub Pages からはクロスオリジンPOST）。
var AUTH_API_BASE="https://timecard-rho.vercel.app/api/auth";

/**
 * サーバ認証API を呼ぶ。失敗時も例外を投げず {ok:false} を返す。
 * ★ 起動経路からは呼ばない。呼ぶのは PIN 入力後・共有URL認証など、
 *   もともと待ちが発生する場面だけ。
 */
async function callAuthApi(path,payload,timeoutMs){
  // ★ 必ずタイムアウトを付ける。認証APIの応答遅延で操作が固まってはならない。
  var ctl=(typeof AbortController!=="undefined")?new AbortController():null;
  var timer=ctl?setTimeout(function(){ctl.abort();},timeoutMs||5000):null;
  try{
    var r=await fetch(AUTH_API_BASE+"/"+path,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload||{}),
      signal:ctl?ctl.signal:undefined
    });
    var d=null;
    try{d=await r.json();}catch(e){d=null;}
    if(!r.ok)return {ok:false,status:r.status,data:d};
    return {ok:true,status:r.status,data:d||{}};
  }catch(e){return {ok:false,status:0,data:null};}
  finally{if(timer)clearTimeout(timer);}
}

/** Custom Token を IDトークンへ交換する。 */
async function exchangeCustomToken(customToken,timeoutMs){
  // ★ 進行中の匿名サインインがあれば先に決着させる。
  //   待たないと、後から解決した匿名トークンが役割トークンを上書きし、
  //   _authRole だけ "s"/"a" のまま _fbIdToken が匿名に戻る不整合が起きる。
  // ★ 待ち時間に上限を設ける。_authInFlight はタイムアウトを持たないため、
  //   回線ハング時にここで無限に待つと PIN 画面が無反応のまま固まる。
  if(_authInFlight){
    try{
      await Promise.race([_authInFlight,new Promise(function(r){setTimeout(r,3000);})]);
    }catch(e){}
  }
  // ★ タイムアウトを付ける（callAuthApi と同じ考え方。ハングで永久 pending にしない）
  // ★ clearTimeout は本文読み取り(json)の後で行う。fetch だけを包むと、
  //   ヘッダだけ返して本文を止める上流に当たったとき永久 pending になる。
  // ★ 既定は 5000ms。3000ms に縮めると、唯一のブロッキング経路（管理者PIN認証）が
  //   低速回線で「正しいPINなのに接続できません」になる確率が上がる。
  //   呼び出し側が残り時間を渡せるようにして、総待ち時間は呼び出し側の予算で抑える。
  var ctl=(typeof AbortController!=="undefined")?new AbortController():null;
  var timer=ctl?setTimeout(function(){ctl.abort();},timeoutMs||5000):null;
  var d;
  try{
    var r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key="+FB_API_KEY,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:customToken,returnSecureToken:true}),
      signal:ctl?ctl.signal:undefined
    });
    d=await r.json();
  }finally{if(timer)clearTimeout(timer);}
  if(!d||!d.idToken)throw new Error("custom token exchange failed");
  _fbIdToken=d.idToken;
  _fbRefreshToken=d.refreshToken;
  _fbTokenExpiry=Date.now()+parseInt(d.expiresIn)*1000;
  // ★ 世代を進める。3秒のレースを超えて後から解決した匿名サインインが
  //   この役割トークンを上書きして anon へ降格させるのを防ぐ。
  _authEpoch++;
  return _fbIdToken;
}

/** 匿名サインイン。起動時の唯一の認証経路（現行と同一。Vercel は経由しない）。 */
async function anonymousSignIn(){
  var r2=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+FB_API_KEY,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({returnSecureToken:true})
  });
  var d2=await r2.json();
  if(!d2.idToken)throw new Error("Anonymous sign-in failed: "+(d2.error&&d2.error.message||"unknown"));
  // ★ ここでは代入しない。呼び出し側（getAuthToken）が世代を確認してから反映する。
  return {idToken:d2.idToken,refreshToken:d2.refreshToken,expiresIn:parseInt(d2.expiresIn)};
}

var _ROLE_OF_KIND={staff:"s",admin:"a",share:"v"};

/**
 * 役割つきセッションへ昇格する。成功で true。
 * ★ 失敗しても既存セッションをそのまま残す。認証APIが落ちていても
 *   打刻・画面表示は現行どおり動き続ける（可用性を落とさない）。
 */
async function establishSession(kind,payload,timeoutMs){
  var r=await establishSessionEx(kind,payload,timeoutMs);
  return r.ok;
}

/** establishSession の詳細版。HTTPステータスまで返す（認証失敗と通信障害を区別するため）。 */
async function establishSessionEx(kind,payload,timeoutMs){
  // ★ API 呼び出しに予算を割り当て、交換側には残り時間（最低 5000ms）を渡す。
  //   最低値の床があるため、総待ち時間は最悪 budget + 5000ms（さらに
  //   exchangeCustomToken 冒頭の _authInFlight レース最大 3000ms が加わり得る）。
  //   低速回線での取りこぼしを避けることを優先した意図的な設計。
  var budget=timeoutMs||5000,t0=Date.now();
  var res=await callAuthApi(kind,payload,budget);
  if(!res.ok||!res.data||!res.data.customToken)return {ok:false,status:res.status};
  var pT=_fbIdToken,pR=_fbRefreshToken,pE=_fbTokenExpiry;
  try{
    await exchangeCustomToken(res.data.customToken,Math.max(5000,budget-(Date.now()-t0)));
  }catch(e){_fbIdToken=pT;_fbRefreshToken=pR;_fbTokenExpiry=pE;return {ok:false,status:0};}
  _authRole=res.data.role||_ROLE_OF_KIND[kind]||_authRole;
  // ★ customToken（ベアラ資格情報）は保持しない。必要な表示用の値だけ残す。
  _authClaims={role:_authRole,expiresAt:res.data.expiresAt||null,sessionExpiresAt:res.data.sessionExpiresAt||null};
  return {ok:true,status:res.status};
}

/**
 * スタッフ役割へ昇格する。★ 画面遷移をブロックしない。
 * PIN照合そのものは現行どおりローカルで即時に判定して画面を切り替え、
 * サーバ側の役割トークン取得だけを裏で並行実行する。よって体感速度は現行と同一。
 * 実際の書き込み（打刻）は利用者が出勤/退勤を押した後なので、通常はそれまでに完了する。
 */
var _elevatePromise=null;
function elevateStaffSession(name,pin){
  _elevatePromise=(async function(){
    var tok=await getAuthToken().catch(function(){return "";});
    // 背景処理なので長めに待ってよい（サーバ側のスロットル上限4秒を吸収する）
    var ok=await establishSession("staff",{idToken:tok,staffName:name,pin:pin,deviceId:_authDeviceId},12000);
    if(!ok)console.warn("[TC] staff role token unavailable（現行セッションを継続）");
    return ok;
  })().catch(function(){return false;}); // 未処理のPromise拒否を出さない
  return _elevatePromise;
}

/**
 * 管理系の同期APIが「セッション失効」で失敗したことを利用者へ知らせる。
 *
 * ★ 無言で握り潰してはならない。管理者PIN・管理者URLを変更すると、別端末や
 *   別タブで開いたままの管理画面は失効する。しかし RTDB Rules は /honomi を
 *   匿名に開放しているため、その画面は今までどおり操作でき、失効の手がかりが無い。
 *   そこでスタッフPINを変更すると、tc5_pins（従来側）だけが更新され
 *   /authz 側は 403 で更新されず、当該スタッフがサーバ認証を通らなくなる。
 *   ＝この一連の修正が排除しようとしている「片方だけ更新される」状態そのもの。
 */
var _sessionRevokedNotified=false;
function notifyIfSessionRevoked(res,what){
  if(!(res&&res.status===403&&res.data&&res.data.error==="session_revoked"))return false;
  // 連続操作で何度も出さない（1回の失効につき1回だけ知らせる）
  if(_sessionRevokedNotified)return true;
  _sessionRevokedNotified=true;
  showAlert("この管理画面のセッションは無効化されています。\n"
    +"（管理者PINまたは管理者URLが変更されたため）\n\n"
    +what+"は保存されていません。\n"
    +"新しい管理者PIN、または新しい管理者URLで入り直してから、もう一度操作してください。");
  return true;
}

/**
 * 新認証側（/authz）へPINを反映する。
 * ★ 現行の tc5_pins 保存は従来どおり行ったうえで即時同期するため、
 *   PIN変更・新規登録の直後から新PINで打刻できる。
 *   失敗しても現行の動作・画面は一切変わらない（裏側だけの同期）。
 */
function syncPinToAuthz(name,pin,currentPin){
  return (async function(){
    var tok=await getAuthToken().catch(function(){return "";});
    var res=await callAuthApi("pin-set",{
      idToken:tok,staffName:name,pin:pin,
      currentPin:currentPin||"",deviceId:_authDeviceId
    });
    if(!res.ok){console.warn("[TC] pin sync failed",res.status);notifyIfSessionRevoked(res,"PINの同期");}
    return res.ok;
  })().catch(function(){return false;});
}

/**
 * 改名時に新認証側の登録名を付け替える（現行の tc5_pins キー付け替えと同じ挙動）。
 * ★ 削除ではなくレコードの移送。削除だけだと、平文を保持していないスタッフの
 *   PINが新名で作り直されず /authz から消えてしまう。
 */
function renamePinInAuthz(oldName,newName){
  return (async function(){
    // 管理者ロールの確立を待つ（改名は管理者のみ許可されるため）。
    if(_adminElevatePromise){try{await _adminElevatePromise;}catch(e){}}
    var tok=await getAuthToken().catch(function(){return "";});
    var res=await callAuthApi("pin-set",{idToken:tok,staffName:oldName,renameTo:newName,deviceId:_authDeviceId});
    if(!res.ok){console.warn("[TC] pin rename failed",res.status);notifyIfSessionRevoked(res,"登録名の付け替え");}
    return res.ok;
  })().catch(function(){return false;});
}

/**
 * 管理者役割へ昇格する。★ 画面遷移をブロックしない（現行どおり即座に管理画面を表示する）。
 * 管理者PIN／管理者URLトークンは現行のものをそのまま使う。
 */
var _adminElevatePromise=null;
function elevateAdminSession(payload){
  _adminElevatePromise=(async function(){
    var ok=await establishSession("admin",payload,12000);
    if(!ok)console.warn("[TC] admin role token unavailable（現行セッションを継続）");
    return ok;
  })().catch(function(){return false;});
  return _adminElevatePromise;
}

/**
 * 共有URL（閲覧用 / 管理者デモ / スタッフテスト）の役割へ昇格する。
 * ★ 有効・期限の判定と画面表示は現行のクライアント側ロジックのまま。
 *   ここでは同じ結果になる役割トークンを裏で取得するだけで、
 *   期限を12時間・24時間などに固定し直すことはしない。
 */
// ★ 進行中の昇格を Promise で公開する（staff の _elevatePromise・admin の _adminElevatePromise と同じ扱い）。
//   公開しないと、役割トークンを必要とする呼び出し（/api/mileage）が確立を待てず、
//   匿名トークンのまま問い合わせて 403 になる。
var _shareElevatePromise=null;
function elevateShareSession(kind,token){
  _shareElevatePromise=(async function(){
    var ok=await establishSession("share",{kind:kind,token:token||""});
    if(!ok)console.warn("[TC] share role token unavailable（現行セッションを継続）");
    return ok;
  })().catch(function(){return false;});
  return _shareElevatePromise;
}

// ===== 匿名セッションの端末保存（起動時の認証待ちをなくす）=====
// 従来はページを開くたびに accounts:signUp を呼び、そのつど新しい匿名ユーザーを作っていた。
// 本番実測で 1回あたり 531ms（中央値・n=5）かかり、しかも initFirebase は
// この完了を待ってから全データ取得を始めるため、「操作可能になるまで」の先頭に
// 必ずこの時間が積まれていた。
//
// ★ 保存するのは匿名トークンだけ。staff / admin / viewer の役割トークンは保存しない。
//   匿名トークンは公開APIキー（このHTMLに元から書かれている）で誰でもその場で発行でき、
//   このアプリ自身が毎回そうしている。したがって端末へ置いても得られる権限は増えない。
//   一方、役割トークンは特権なので端末へ残さない。
// ★ PIN照合材料（tc5_pins）は従来どおり保存しない。ここで保存するのは認証トークンだけ。
var _ANON_SESS_KEY="tc_anon_session";
var _anonSessRestored=false; // 端末に保存された匿名トークンをそのまま使っているか
function _saveAnonSession(){
  if(_authRole!=="anon")return;                    // 役割トークンは保存しない
  if(!_fbIdToken||!_fbRefreshToken)return;
  saveRaw(_ANON_SESS_KEY,JSON.stringify({v:1,t:_fbIdToken,r:_fbRefreshToken,e:_fbTokenExpiry}));
}
function _clearAnonSession(){_anonSessRestored=false;try{localStorage.removeItem(_ANON_SESS_KEY);}catch(e){}}
(function _restoreAnonSession(){
  var raw=loadRaw(_ANON_SESS_KEY,"");
  if(!raw)return;
  var o=null;try{o=JSON.parse(raw);}catch(e){o=null;}
  if(!o||o.v!==1||typeof o.t!=="string"||typeof o.r!=="string"){_clearAnonSession();return;}
  _fbIdToken=o.t;_fbRefreshToken=o.r;_fbTokenExpiry=Number(o.e)||0;
  _anonSessRestored=true;
})();

// ★ single-flight。起動時の一括読込は authFetch を20本以上同時に呼ぶため、
//   従来は「同じサインイン」が20本以上並列発射されていた（＝毎ロード20個以上の匿名ユーザー生成）。
//   進行中の取得を共有して1本に集約する。通信本数が減るので現行より速くなる方向にしか働かない。
var _authInFlight=null;
async function getAuthToken(){
  if(_fbIdToken&&Date.now()<_fbTokenExpiry-60000)return _fbIdToken;
  if(_authInFlight)return _authInFlight;
  var _epoch=_authEpoch;
  _authInFlight=(async function(){
    try{
      if(_fbRefreshToken){
        try{
          var r=await fetch("https://securetoken.googleapis.com/v1/token?key="+FB_API_KEY,{
            method:"POST",
            headers:{"Content-Type":"application/x-www-form-urlencoded"},
            body:"grant_type=refresh_token&refresh_token="+_fbRefreshToken
          });
          var d=await r.json();
          if(d.id_token){
            // ★ 待っている間に役割トークンが確立していたら上書きしない（降格を防ぐ）
            if(_epoch!==_authEpoch)return _fbIdToken;
            _fbIdToken=d.id_token;
            _fbRefreshToken=d.refresh_token;
            _fbTokenExpiry=Date.now()+parseInt(d.expires_in)*1000;
            _anonSessRestored=false; // 自分で取り直した＝復元トークンではない
            _saveAnonSession();
            return _fbIdToken;
          }
        }catch(e){console.warn("token refresh failed, re-signing in",e);}
      }
      var a=await anonymousSignIn();
      // ★ 同上。後着の匿名トークンで役割トークンを潰さない。
      if(_epoch!==_authEpoch)return _fbIdToken;
      _fbIdToken=a.idToken;
      _fbRefreshToken=a.refreshToken;
      _fbTokenExpiry=Date.now()+a.expiresIn*1000;
      _authRole="anon";
      _anonSessRestored=false;
      _saveAnonSession();
      return _fbIdToken;
    }finally{_authInFlight=null;}
  })();
  return _authInFlight;
}

// ===== 画面モードと書き込みポリシー（フェイルクローズ）=====
// uiMode      : normal | adminDemo | staffDemo | viewer
// writePolicy : full | readonlyWithAllowList | sandbox
// URLパラメータを見た時点で最も制限の強い側へ倒す。認証成功後も権限を昇格させない。
var uiMode="normal";
var writePolicy="full";
(function(){
  var _q=new URLSearchParams(location.search);
  if(_q.get("staffDemo")!==null){uiMode="staffDemo";writePolicy="sandbox";}
  else if(_q.get("demo")!==null){uiMode="adminDemo";writePolicy="readonlyWithAllowList";}
})();
var demoTokenKey="";        // 新方式 demoTokens/{token} における自分のトークン
var demoTokenExpiresAt="";  // 発行元デモトークンの有効期限（発行する閲覧用トークンの上限）
var demoLegacyAuth=false;   // 旧 config/demoAccess で認証したか（移行期間のみ true）
// このデモセッションで発行した閲覧用トークンだけを記録する。
// 値 "pending" = 本体PUTを1回だけ許可 / true = 発行済み（以後は無効化のみ）
var _demoIssuedVt={};
function _demoOwnsVt(t){return Object.prototype.hasOwnProperty.call(_demoIssuedVt,t);}
// トークン文字列の形式検証（キー・パス組み立ての安全性を担保）
function isSafeTokenStr(t){return typeof t==="string"&&/^[A-Za-z0-9_-]{1,64}$/.test(t);}
// デモから発行する閲覧用トークンの内容検証（発行元IDの一致・期限必須・デモ期限以内・有効状態）
function _isValidDemoIssuedVtBody(body){
  if(typeof body!=="string")return false;
  var o;try{o=JSON.parse(body);}catch(e){return false;}
  if(!o||typeof o!=="object"||Array.isArray(o))return false;
  if(o.issuedByDemoTokenId!==demoTokenKey)return false;
  if(o.enabled!==true)return false;
  if(typeof o.expiresAt!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(o.expiresAt))return false;
  if(!demoTokenExpiresAt||o.expiresAt>demoTokenExpiresAt)return false;
  if(o.expiresAt<getTodayJSTStr())return false;
  return true;
}
// 管理者デモで例外的に許可する書き込み。前方一致の乱用を避け、パスを厳密に判定する。
// /config/ の前方一致は絶対に使わない（adminPinHash 等が同じ配下にあるため）。
function _isDemoAllowedWrite(url,method,opts){
  if(typeof url!=="string")return false;
  var base=FB_URL+"/";
  if(url.indexOf(base)!==0)return false;
  var path=url.slice(base.length);
  var qi=path.indexOf("?");if(qi>=0)path=path.slice(0,qi);
  var isFalseBody=(typeof opts==="object"&&opts&&typeof opts.body==="string"&&opts.body==="false");
  // ① 自分のデモトークンの「無効化」だけ許可（再有効化・期限延長・変更・新規発行は不可）
  if(demoTokenKey&&path==="demoTokens/"+demoTokenKey+"/enabled.json"){
    return method==="PUT"&&isFalseBody;
  }
  // ② 閲覧用トークン: このデモセッションで発行したものだけ
  var vm=path.match(/^viewerTokens\/([A-Za-z0-9_-]+)(\/enabled)?\.json$/);
  if(vm){
    if(!demoTokenKey||!_demoOwnsVt(vm[1]))return false;
    if(vm[2])return method==="PUT"&&isFalseBody;          // 無効化のみ（再有効化不可）
    if(method!=="PUT"||_demoIssuedVt[vm[1]]!=="pending")return false; // 新規発行の1回のみ
    // 発行内容も検証する（発行UIを迂回されても、期限超過や発行元欠落のレコードは書かせない）
    return _isValidDemoIssuedVtBody(opts&&opts.body);
  }
  // ③ 発行インデックス（発行元デモトークンIDで絞った自分の枝のみ）
  if(demoTokenKey){
    var idxPrefix="demoIssuedViewerTokens/"+demoTokenKey+"/";
    if(path.indexOf(idxPrefix)===0){
      var im=path.slice(idxPrefix.length).match(/^([A-Za-z0-9_-]+)(\/enabled)?\.json$/);
      if(!im||!_demoOwnsVt(im[1]))return false;
      if(im[2])return method==="PUT"&&isFalseBody;
      return method==="PUT";
    }
  }
  // ④ 旧方式（移行期間）: デモアクセスの無効化のみ
  if(demoLegacyAuth&&path==="config/demoAccess.json")return method==="DELETE";
  return false;
}
function _writeAllowed(url,method,opts){
  if(writePolicy==="full")return true;
  if(writePolicy==="sandbox")return false;
  return _isDemoAllowedWrite(url,method,opts);
}
// X-HTTP-Method-Override 等でGETを装った書き込みを弾く（RTDB RESTはこのヘッダを解釈する）
function _hasMethodOverride(opts){
  var h=opts&&opts.headers;
  if(!h)return false;
  try{
    // Headers / Map など get() を持つものはダックタイピングで判定（cross-realm対策）
    if(typeof h.get==="function"){
      return !!(h.get("x-http-method-override")||h.get("X-HTTP-Method-Override")||h.get("x-method-override"));
    }
    if(Array.isArray(h)){
      for(var i=0;i<h.length;i++){if(/^x-(http-)?method-override$/i.test(String(h[i]&&h[i][0])))return true;}
      return false;
    }
    if(typeof h!=="object")return true; // 判定不能はフェイルクローズ
    for(var k in h){if(/^x-(http-)?method-override$/i.test(k))return true;}
  }catch(e){return true;} // 判定不能はフェイルクローズ
  return false;
}
// ログにトークン等の秘密値を出さないためのパス伏せ字
var _MASK_KNOWN_NODES=["viewerTokens","demoTokens","staffDemoTokens","demoIssuedViewerTokens",
  "tc5_records","tc5_staff","tc5_pins","tc5_approvals","tc5_correction_requests",
  "tc5_paid_leave_requests","tc5_paid_leave_balances","tc5_monthly_days_import",
  "tc5_staff_notifications","tc5_meals","tc5_meal_confirmations","tc5_monthly_review_status",
  "tc5_fcm_tokens","tc_master_depts","config","master","locations","documents","enabled","staff_uploads"];
// ログにトークン等の秘密値を出さないためのパス伏せ字（ノード名は残し、キー部分だけ伏せる）
function _maskPath(u){
  var p=String(u||"").split("?")[0];
  if(p.indexOf(FB_URL)===0)p=p.slice(FB_URL.length);
  return p.split("/").map(function(seg){
    if(!seg)return seg;
    var bare=seg.replace(/\.json$/,"");
    if(_MASK_KNOWN_NODES.indexOf(bare)>=0)return seg;
    return seg.length>=8?"***":seg;
  }).join("/");
}
var _demoBlockNoticeAt=0;
function _demoBlockNotice(){
  var t=Date.now();
  if(t-_demoBlockNoticeAt<1500)return;
  _demoBlockNoticeAt=t;
  if(typeof showAlert==="function")showAlert("この画面では変更できません");
}
// 遮断時の戻り値。reject すると savingCount 等の減算（.then）が走らず同期が停止するため、
// Response 互換オブジェクトを返して既存チェーンを無傷で通す。
function _blockedResponse(ok){
  return {ok:!!ok,status:ok?200:403,
    json:function(){return Promise.resolve(null);},
    text:function(){return Promise.resolve("");}};
}
// 書き込み系ヘルパーの前段ガード。管理者デモでのみ真を返し、メモリ／localStorage を
// 汚す前に停止させる（「保存できたように見えて10秒後に巻き戻る」挙動の防止）。
// サンドボックスは false を返す＝既存処理をそのまま通し、_lsSet と authFetch 側で止める。
function demoWriteBlocked(){
  if(writePolicy!=="readonlyWithAllowList")return false;
  _demoBlockNotice();
  return true;
}
// サンドボックス中は本番用 localStorage キーへ書かない
function _lsSet(k,v){
  if(writePolicy==="sandbox")return;
  try{localStorage.setItem(k,v);}catch(e){}
}
async function authFetch(url,opts){
  var _m=String((opts&&opts.method)||"GET").toUpperCase();
  // 非GETに加え、メソッド偽装ヘッダ・GETへのbody添付も「書き込み」として扱う
  var _isWrite=(_m!=="GET")||_hasMethodOverride(opts)||!!(opts&&opts.body!=null)
               ||/method-override/i.test(String(url).split("?")[1]||"");
  if(_isWrite&&writePolicy!=="full"&&!_writeAllowed(url,_m,opts)){
    console.warn("[write blocked]",writePolicy,_m,_maskPath(url));
    if(writePolicy!=="sandbox")_demoBlockNotice();
    // sandbox は成功を装う（画面上のテスト操作を成立させるため）／デモは失敗を返す
    return _blockedResponse(writePolicy==="sandbox");
  }
  var tok=await getAuthToken();
  // このリクエストが「端末に保存していたトークン」を使ったかを、送信前に確定させる。
  // 起動時は5本が同時に飛ぶため、応答時点のフラグを見ると先着1本しか復帰できない。
  var _usedRestored=_anonSessRestored;
  var authUrl=url+(url.indexOf('?')>=0?'&':'?')+'auth='+tok;
  var res=await fetch(authUrl,opts||{});
  // ★ 端末に保存していた匿名トークンをサーバが拒否した場合だけ、1回だけ取り直して再試行する。
  //   （期限内に見えても Firebase 側で匿名ユーザーが消されていれば 401 になる。通常は起きない）
  //   これが無いと、壊れた保存トークンを持つ端末が「読み込み中…」から復帰できなくなる。
  //   書き込みは全て eventId 等をキーにした PUT/PATCH で冪等なため、再試行しても二重登録しない。
  if(res&&res.status===401&&_usedRestored&&_authRole==="anon"){
    // 破棄するのは「今回失敗したトークンがまだ現役のとき」だけ。
    // 並列の別リクエストが既に取り直していた場合、その新しいトークンを消さない。
    if(_fbIdToken===tok){
      _clearAnonSession();
      _fbIdToken="";_fbRefreshToken="";_fbTokenExpiry=0;
    }
    var tok2=await getAuthToken(); // single-flight なので同時に走っても取得は1回
    if(tok2&&tok2!==tok){
      return fetch(url+(url.indexOf('?')>=0?'&':'?')+'auth='+tok2,opts||{});
    }
  }
  return res;
}

function saveToFirebase(key, val) {
  if(demoWriteBlocked())return;
  authFetch(FB_URL + "/" + key + ".json", {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(val)
  }).then(function(res){
    if(!res.ok){
      res.text().then(function(t){
        console.error("[saveToFirebase] HTTP", res.status, key, t);
        showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");
      });
    }
  }).catch(function(e){
    console.error("[saveToFirebase] network error:", key, e);
    showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");
  });
}

// ===== 月別出勤日数: 過去月セルの手入力保存 =====
// tc5_monthly_days_import に staffId(=社員番号=employeeId) 単位で書き込む。
// 既存の有給計算（付与日数・勤続・残日数・申請・消化）はこのデータを参照しないため影響なし。
function mdSaveCell(inputEl, eid, ym){
  if(demoWriteBlocked()){render();return;}
  // ★ このスタッフの既存の月データを読み込めていない状態で保存すると、
  //   入力した1か月だけを持つエントリで上書きし、他の月を消す（フェイルクローズ）。
  if(!monthlyDaysLoaded){
    console.warn("[mdSaveCell] blocked: monthlyDaysImport not loaded");
    showAlert("月別出勤日数を読み込めていないため保存できません。\n\n通信状態を確認して画面を再読み込みしてください。");
    render();return;
  }
  monthlyDaysEditing=false;
  eid=String(eid||"").trim();
  if(!eid){showAlert("社員番号が未設定のため保存できません");render();return;}
  // 社員番号は英数字・ハイフン・アンダースコアのみ許可（XSS防止＋Firebaseキー健全性）
  if(!/^[A-Za-z0-9_-]+$/.test(eid)){showAlert("社員番号に使用できない文字が含まれています");render();return;}
  var raw=String(inputEl&&inputEl.value!=null?inputEl.value:"").trim();
  var val=null; // null=未入力に戻す
  if(raw!==""){
    var n=parseInt(raw,10);
    if(isNaN(n)||n<0||n>31){showAlert("出勤日数は0〜31の範囲で入力してください");render();return;}
    val=n;
  }
  // 社員番号から氏名を解決（新規エントリ作成時のラベル用）
  var staffName="";
  for(var i=0;i<staffList.length;i++){if((staffList[i].employeeId||"").trim()===eid){staffName=staffList[i].name||"";break;}}
  if(!monthlyDaysImport[eid]||typeof monthlyDaysImport[eid]!=="object"){
    monthlyDaysImport[eid]={staffId:eid,staffName:staffName,source:"manual_edit",months:{}};
  }
  if(!monthlyDaysImport[eid].months||typeof monthlyDaysImport[eid].months!=="object"){
    monthlyDaysImport[eid].months={};
  }
  if(val===null){delete monthlyDaysImport[eid].months[ym];}
  else{monthlyDaysImport[eid].months[ym]=val;}
  render(); // 即時反映（合計も再計算）
  // staffId単位でFirebaseへ書込（他スタッフ・他keyに影響させない）
  authFetch(FB_URL+"/tc5_monthly_days_import/"+encodeURIComponent(eid)+".json",{
    method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(monthlyDaysImport[eid])
  }).then(function(res){
    if(!res.ok){res.text().then(function(t){console.error("[mdSaveCell] HTTP",res.status,eid,t);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});}
  }).catch(function(e){console.error("[mdSaveCell] network error:",eid,e);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});
}

// ===== 賄い（まかない）取得記録ヘルパー =====
// 編集可否判定（将来の月次締め機能に備えて関数化）。現状は未来月のみ入力不可、過去月・当月は編集可。
// 締め機能を追加する場合は本関数1か所だけ改修すれば全画面（打刻画面・管理画面）に反映される。
function mealEditable(ym /* "YYYY-MM" */){
  if(!ym||ym.length<7)return false;
  var curYm=getTodayJSTStr().substring(0,7); // JST基準（端末TZに依存しない）
  if(ym>curYm)return false; // 未来月は入力不可
  // TODO(将来): 締め済み月は false を返す（例: if(mealClosedMonths&&mealClosedMonths[ym])return false;）
  return true; // 過去月・当月は編集可
}
// 社員番号から氏名を解決（賄いエントリのラベル用・出勤日判定用）
function mealStaffNameById(eid){
  eid=String(eid||"").trim();
  for(var i=0;i<staffList.length;i++){if((staffList[i].employeeId||"").trim()===eid)return staffList[i].name||"";}
  return "";
}
// employeeId 単位で tc5_meals/{eid} を全量PUT（他スタッフ・他keyに影響させない）
function mealSaveEntry(eid){
  if(demoWriteBlocked())return;
  eid=String(eid||"").trim();
  if(!eid||!/^[A-Za-z0-9_-]+$/.test(eid))return;
  if(!mealsData[eid])return;
  authFetch(FB_URL+"/tc5_meals/"+encodeURIComponent(eid)+".json",{
    method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(mealsData[eid])
  }).then(function(res){
    if(!res.ok){res.text().then(function(t){console.error("[mealSaveEntry] HTTP",res.status,eid,t);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});}
  }).catch(function(e){console.error("[mealSaveEntry] network error:",eid,e);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});
}
// スタッフのある月の出勤日(打刻clockIn・論理削除以外)の日付Set。recordsはstaff=氏名で識別。
function mealAttendanceDates(staffName,ym){
  var set={};
  records.forEach(function(r){
    if(r.type!=="clockIn"||r.deleted||!r.date||r.staff!==staffName)return;
    if(r.date.substring(0,7)!==ym)return;
    set[r.date]=true;
  });
  return set;
}
// 1日分の賄い取得をトグル（打刻画面・本人操作）。eid単位でcache更新→即PUT。
function mealToggleDate(eid,ym,ds){
  if(viewerMode){console.warn("[viewerMode] meal write blocked");return;}
  if(!mealsLoaded){
    console.warn("[meal] blocked: mealsData not loaded");
    showAlert("賄いのデータを読み込めていないため保存できません。\n\n通信状態を確認して画面を再読み込みしてください。");
    return;
  }
  eid=String(eid||"").trim();
  if(!eid){showAlert("社員番号が未設定のため保存できません");return;}
  if(!/^[A-Za-z0-9_-]+$/.test(eid)){showAlert("社員番号に使用できない文字が含まれています");return;}
  if(!mealEditable(ym)){showAlert("未来の月は入力できません");return;}
  var nm=mealStaffNameById(eid);
  if(!mealsData[eid]||typeof mealsData[eid]!=="object")mealsData[eid]={staffId:eid,staffName:nm,dates:{}};
  if(!mealsData[eid].dates||typeof mealsData[eid].dates!=="object")mealsData[eid].dates={};
  var cur=mealsData[eid].dates[ds];
  if(cur&&cur.taken){delete mealsData[eid].dates[ds];} // 取得あり→なし（キー削除）
  else{mealsData[eid].dates[ds]={taken:true,updatedAt:new Date().toISOString()};} // なし→取得あり
  if(nm)mealsData[eid].staffName=nm;
  render(); // 即時反映
  mealSaveEntry(eid);
}
// 出勤日を全選択（その月の出勤打刻がある日をすべて賄い取得ON。既存ONは維持・非出勤日は変更しない）
function mealSelectAttendance(eid,ym){
  if(viewerMode){console.warn("[viewerMode] meal write blocked");return;}
  if(!mealsLoaded){
    console.warn("[meal] blocked: mealsData not loaded");
    showAlert("賄いのデータを読み込めていないため保存できません。\n\n通信状態を確認して画面を再読み込みしてください。");
    return;
  }
  eid=String(eid||"").trim();
  if(!eid){showAlert("社員番号が未設定のため保存できません");return;}
  if(!/^[A-Za-z0-9_-]+$/.test(eid)){showAlert("社員番号に使用できない文字が含まれています");return;}
  if(!mealEditable(ym)){showAlert("未来の月は入力できません");return;}
  var nm=mealStaffNameById(eid);
  var att=mealAttendanceDates(nm,ym);
  var dates=Object.keys(att);
  if(dates.length===0){showAlert("この月の出勤打刻が見つかりません");return;}
  if(!mealsData[eid]||typeof mealsData[eid]!=="object")mealsData[eid]={staffId:eid,staffName:nm,dates:{}};
  if(!mealsData[eid].dates||typeof mealsData[eid].dates!=="object")mealsData[eid].dates={};
  var nowIso=new Date().toISOString();var added=0;
  dates.forEach(function(ds){
    if(!(mealsData[eid].dates[ds]&&mealsData[eid].dates[ds].taken)){mealsData[eid].dates[ds]={taken:true,updatedAt:nowIso};added++;}
  });
  if(nm)mealsData[eid].staffName=nm;
  render();
  if(added>0)mealSaveEntry(eid);
  showAlert("出勤日 "+dates.length+"日のうち "+added+"日を賄いONにしました（既にONの日はそのまま）");
}

// 賄い月初確認の回答を保存（done=済み / pending=まだ）。
// tc5_meal_confirmations/{eid}/{ym} 単位の個別PUT（他月・他スタッフのノードに触れず、同一スタッフ・同一対象月は必ず上書き＝重複なし・回答変更可）。
function mealConfSave(eid,ym,status){
  if(viewerMode){console.warn("[viewerMode] meal-conf write blocked");return;}
  if(demoWriteBlocked())return;
  eid=String(eid||"").trim();
  if(!eid){showAlert("社員番号が未設定のため保存できません");return;}
  if(!/^[A-Za-z0-9_-]+$/.test(eid)){showAlert("社員番号に使用できない文字が含まれています");return;}
  if(!ym||ym.length<7){return;}
  if(status!=="done"&&status!=="pending"){return;}
  var nm=mealStaffNameById(eid);
  if(!mealConfData[eid]||typeof mealConfData[eid]!=="object")mealConfData[eid]={};
  mealConfData[eid][ym]={staffId:eid,staffName:nm,targetMonth:ym,status:status,updatedAt:new Date().toISOString()};
  render(); // 即時反映
  authFetch(FB_URL+"/tc5_meal_confirmations/"+encodeURIComponent(eid)+"/"+encodeURIComponent(ym)+".json",{
    method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(mealConfData[eid][ym])
  }).then(function(res){
    if(!res.ok){res.text().then(function(t){console.error("[mealConfSave] HTTP",res.status,eid,ym,t);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});}
  }).catch(function(e){console.error("[mealConfSave] network error:",eid,ym,e);showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");});
}
// 賄い月初確認の状態取得（"done"|"pending"|"none"）
function mealConfStatusOf(eid,ym){
  eid=String(eid||"").trim();
  var c=mealConfData[eid]&&mealConfData[eid][ym];
  return (c&&c.status==="done")?"done":(c&&c.status==="pending")?"pending":"none";
}
// ===== 月次精査完了フラグ（労務士CSVゲート） =====
// 対象月(ym)が精査完了済みか。reviewed===true のときのみ true。
function monthReviewed(ym){var r=reviewStatus&&reviewStatus[ym];return !!(r&&r.reviewed===true);}
// 締め対象月（＝当月の前月）を "YYYY-MM" で返す単一の真実源。CSVゲート判定・精査完了操作はすべてこれを基準にする。
// 例: 2026-07-01→"2026-06" / 2026-07-31→"2026-06" / 2027-01-01→"2026-12"。今日基準（today/pad を再利用）。
function reviewTargetMonth(){var d=new Date(today.getFullYear(),today.getMonth()-1,1);return d.getFullYear()+"-"+pad(d.getMonth()+1);}
// JST基準で当日が「その月の実際の最終日」のときだけ当月を "YYYY-MM" で返す（月末前・翌月1日は ""）。
// 端末TZ/UTCで日付がずれないよう getTodayJSTStr() を使用。最終日は Date.UTC(y,m,0) で月ごとに算出（1/31・2/28・閏年2/29・4/30 等に対応）。
// 例: 2026-07-30→"" / 2026-07-31→"2026-07" / 2026-08-01→""。締め対象月セレクタの選択肢追加にのみ使用する。
function reviewCurrentMonthIfMonthEnd(){
  var t=getTodayJSTStr(); // "YYYY-MM-DD"（JST）
  var y=parseInt(t.slice(0,4),10),m=parseInt(t.slice(5,7),10),d=parseInt(t.slice(8,10),10);
  if(!y||!m||!d)return "";
  var lastDay=new Date(Date.UTC(y,m,0)).getUTCDate(); // 当月の実際の最終日
  return d===lastDay?(y+"-"+pad(m)):"";
}

// ===== PUNCH-OUTBOX-BEGIN =====
// 打刻の端末永続保存と自動再送（IndexedDB）
//
// 打刻ボタン押下 → event_id 採番・実打刻時刻の確定 → IndexedDB へ保存 →
// **保存成功を確認してから** 画面を「打刻済み」へ更新 → サーバ送信は非同期。
//
// ★ 守るべき順序（崩すと事故になる）
//   1. サーバ応答を待って画面を更新してはならない（通信速度が打刻の体感時間に出る）。
//   2. IndexedDB への保存完了前に画面だけ打刻済みにしてはならない
//      （端末にもサーバにも無い打刻を「済んだ」と見せることになる）。
//   3. IndexedDB へ保存できなかったときは打刻失敗として扱う。
//      localStorage やサーバ直送へ勝手にフォールバックしない（整合性を優先する）。
//
// ★ 二重登録が起きない理由
//   送信先は必ず /tc5_records/{eventId}.json への PUT。eventId は打刻時に端末が採番した
//   一意キーで、RTDB は「キー＝ノード」なので、同じ eventId を何度 PUT しても
//   1ノードを上書きするだけで行は増えない（＝サーバ側の一意制約に相当する。
//   PostgreSQL の PRIMARY KEY / INSERT ... ON CONFLICT DO UPDATE と同じ効果を、
//   RTDB では「パスが主キー」という構造そのものが与える）。
//   ★ POST（push）でサーバに採番させてはならない。再送のたびに別ノードができる。
//   ★ 再送時に eventId を採り直してはならない。
//   さらに2回目以降の送信は GET で存在確認してから書く。これにより
//   「サーバには保存されたがクライアントは成功応答を受け取れなかった」打刻を再送しても
//   上書きせず完了扱いにする（管理者がその間に修正していても巻き戻さない）。
//
// ★ 時刻
//   timestamp / time / date … 実際に打刻ボタンを押した時刻（端末時刻）。正本。再送しても変えない。
//   serverReceivedAt        … サーバ（RTDB）が受け取った時刻。{".sv":"timestamp"} でサーバ側が入れる。
//   eventId                 … 打刻イベントの一意キー（= id = 保存先ノード名）。
//   tc5_records に created_at 相当は無いため、サーバ受信時刻は serverReceivedAt を新設して持つ。
//   これ以外のフィールドは追加しない。
var PUNCH_OUTBOX_DB_NAME="timecard_punch_outbox";
var PUNCH_OUTBOX_STORE="punches";          // v1 から同名・同 keyPath。既存端末のデータをそのまま読む
var PUNCH_OUTBOX_LEGACY_LS_KEY="tc5_punch_outbox"; // 旧実装の localStorage キュー（読み込んで IndexedDB へ移し、削除する）
var PUNCH_OUTBOX_IDB_TIMEOUT_MS=4000;      // open / put が返らないときの打ち切り（打刻失敗として扱う）
// 再送間隔。5s → 10s → 20s → 40s → 80s → 160s → 300s（上限）。
var PUNCH_OUTBOX_BACKOFF_BASE_MS=5000;
var PUNCH_OUTBOX_BACKOFF_MAX_MS=300000;
// 認証エラー（401/403）は待たずに叩いても通らない。トークンの更新周期を待つため長めにする。
var PUNCH_OUTBOX_AUTH_MIN_MS=60000;
var PUNCH_OUTBOX_AUTH_MAX_MS=600000;
// 通信復旧・起動・画面復帰は「状況が変わった」契機なのでバックオフを待たない（連打だけ抑える）。
var PUNCH_OUTBOX_FORCE_MIN_MS=3000;
var PUNCH_OUTBOX_FORCE_REASONS=["online","startup","pageshow","visible"];
// 警告のしきい値。決めた根拠は AGENTS.md「打刻のオフラインキュー」の該当節に記載。
var PUNCH_OUTBOX_WARN_MS=10*60*1000;
var PUNCH_OUTBOX_WARN_RETRIES=8;

var punchOutbox={};                 // eventId → entry（メモリ上の作業コピー。正本は IndexedDB）
var _punchOutboxDb=null;
var _punchOutboxDbPromise=null;
var _punchOutboxIdbUsable=null;     // null=未判定 / true=使える / false=使えない
var _punchOutboxFlushing=false;
var _punchOutboxWarnState="";
var _punchOutboxTriggersInstalled=false;

// 本番の打刻画面でだけ有効にする。
// スタッフテスト画面（sandbox）・管理者デモ・閲覧用URLでは、テスト打刻を端末へ残して
// 本番へ再送してしまうことが無いよう、キュー自体を動かさない。
function punchOutboxEnabled(){
  return writePolicy==="full"&&!viewerMode;
}
// この端末で打刻を永続保存できるか。false なら打刻させない（画面に警告を出す）。
function punchOutboxStorageBroken(){
  return punchOutboxEnabled()&&_punchOutboxIdbUsable===false;
}

// ── IndexedDB ──────────────────────────────────────────────
// 失敗した open は握りっぱなしにせず、次の呼び出しでやり直せるようにする
// （一時的な失敗で以後ずっと打刻不能になるのを避ける）。
function _punchOutboxOpenDb(){
  if(_punchOutboxDb)return Promise.resolve(_punchOutboxDb);
  if(_punchOutboxDbPromise)return _punchOutboxDbPromise;
  _punchOutboxDbPromise=new Promise(function(resolve){
    var done=false,timer=null;
    function fin(db){
      if(done)return;done=true;
      if(timer)clearTimeout(timer);
      _punchOutboxDb=db||null;
      _punchOutboxIdbUsable=!!db;
      if(!db)_punchOutboxDbPromise=null; // 次回やり直せるようにする
      resolve(_punchOutboxDb);
    }
    var idb=null;
    try{idb=(typeof indexedDB!=="undefined"&&indexedDB)?indexedDB:null;}catch(e){idb=null;}
    if(!idb){fin(null);return;}
    timer=setTimeout(function(){fin(null);},PUNCH_OUTBOX_IDB_TIMEOUT_MS);
    try{
      var req=idb.open(PUNCH_OUTBOX_DB_NAME,1);
      req.onupgradeneeded=function(){
        try{
          var db=req.result;
          if(!db.objectStoreNames.contains(PUNCH_OUTBOX_STORE))db.createObjectStore(PUNCH_OUTBOX_STORE,{keyPath:"eventId"});
        }catch(e){}
      };
      req.onsuccess=function(){
        var db=req.result;
        // ストアが無い（別バージョンで作られた等）ときは使えないものとして扱う
        try{if(!db.objectStoreNames.contains(PUNCH_OUTBOX_STORE)){fin(null);return;}}catch(e){fin(null);return;}
        fin(db);
      };
      req.onerror=function(){fin(null);};
      req.onblocked=function(){fin(null);};
    }catch(e){fin(null);}
  });
  return _punchOutboxDbPromise;
}
function _punchOutboxIdbTx(mode,work){
  return _punchOutboxOpenDb().then(function(db){
    if(!db)return null;
    return new Promise(function(resolve){
      var done=false,timer=null;
      function fin(v){if(done)return;done=true;if(timer)clearTimeout(timer);resolve(v);}
      timer=setTimeout(function(){fin(null);},PUNCH_OUTBOX_IDB_TIMEOUT_MS);
      try{
        var tx=db.transaction(PUNCH_OUTBOX_STORE,mode);
        var out=work(tx.objectStore(PUNCH_OUTBOX_STORE));
        tx.oncomplete=function(){fin(out&&out.__box?out.__box.value:true);};
        tx.onerror=function(){fin(null);};
        tx.onabort=function(){fin(null);};
      }catch(e){
        // 接続が閉じている等。次回 open をやり直せるようにしてから失敗を返す
        _punchOutboxDb=null;_punchOutboxDbPromise=null;
        fin(null);
      }
    });
  })["catch"](function(){return null;});
}
// 保存できたら true。false は「端末に残っていない」ことを意味する（打刻失敗として扱う）。
function _punchOutboxIdbPut(entry){
  var plain;
  try{plain=JSON.parse(JSON.stringify(entry));}catch(e){return Promise.resolve(false);}
  return _punchOutboxIdbTx("readwrite",function(st){st.put(plain);}).then(function(r){return r===true;});
}
function _punchOutboxIdbDelete(id){
  return _punchOutboxIdbTx("readwrite",function(st){st["delete"](id);}).then(function(r){return r===true;});
}
function _punchOutboxIdbAll(){
  return _punchOutboxIdbTx("readonly",function(st){
    var box={value:[]};
    var rq=st.getAll();
    rq.onsuccess=function(){box.value=rq.result||[];};
    return {__box:box};
  }).then(function(r){return Array.isArray(r)?r:[];});
}

// ── エントリ ────────────────────────────────────────────────
// state: "pending"（送信待ち）/ "syncing"（送信中）。送信できたエントリは削除する
//        （サーバに正本があるので端末に残す必要がない＝ストアを小さく保つ）。
// 旧実装（localStorage 併用版）の {queuedAt, attempts} 形もここで吸収する。
function _punchOutboxNormalize(e){
  if(!e||!e.eventId||!e.rec)return null;
  return {
    eventId:String(e.eventId),
    rec:e.rec,
    state:(e.state==="syncing")?"syncing":"pending",
    createdAt:e.createdAt||e.queuedAt||e.rec.timestamp||new Date().toISOString(),
    retryCount:(typeof e.retryCount==="number")?e.retryCount:(typeof e.attempts==="number"?e.attempts:0),
    lastAttemptAt:e.lastAttemptAt||null,
    lastError:e.lastError||""
  };
}
// 送信待ちのイベントを「実打刻時刻の昇順」で返す。
// オフライン中に 出勤→休憩開始→休憩終了→退勤 と打っても、この順で送られる。
function punchOutboxPending(){
  return Object.keys(punchOutbox).map(function(k){return punchOutbox[k];})
    .filter(function(e){return e&&e.eventId&&e.rec;})
    .sort(function(a,b){
      var ta=Date.parse(a.rec.timestamp||a.createdAt||"")||0;
      var tb=Date.parse(b.rec.timestamp||b.createdAt||"")||0;
      if(ta!==tb)return ta-tb;
      // 同時刻は端末での作成順（createdAt）→ eventId で決定的に並べる
      var ca=Date.parse(a.createdAt||"")||0,cb=Date.parse(b.createdAt||"")||0;
      if(ca!==cb)return ca-cb;
      return a.eventId<b.eventId?-1:a.eventId>b.eventId?1:0;
    });
}

// 打刻を端末へ永続保存する。**成功（true）を確認してから画面を打刻済みにすること。**
function punchOutboxCommit(rec){
  if(!punchOutboxEnabled())return Promise.resolve(false);
  var id=rec&&rec.id;
  if(!id)return Promise.resolve(false);
  var entry=_punchOutboxNormalize({eventId:id,rec:rec,state:"pending",createdAt:new Date().toISOString(),retryCount:0});
  return _punchOutboxIdbPut(entry).then(function(ok){
    if(!ok)return false;
    punchOutbox[entry.eventId]=entry;
    return true;
  });
}
function _punchOutboxSave(entry){
  punchOutbox[entry.eventId]=entry;
  return _punchOutboxIdbPut(entry);
}
function punchOutboxAck(id){
  delete punchOutbox[id];
  return _punchOutboxIdbDelete(id);
}

// ── 送信 ────────────────────────────────────────────────────
function punchOutboxBackoffMs(retryCount,isAuth){
  if(!retryCount)return 0;
  var ms=PUNCH_OUTBOX_BACKOFF_BASE_MS*Math.pow(2,retryCount-1);
  if(isAuth)return Math.min(Math.max(ms,PUNCH_OUTBOX_AUTH_MIN_MS),PUNCH_OUTBOX_AUTH_MAX_MS);
  return Math.min(ms,PUNCH_OUTBOX_BACKOFF_MAX_MS);
}
function _punchOutboxDue(e,nowMs,force){
  if(e.state==="syncing")return false;      // 送信中は重ねて送らない
  if(!e.retryCount)return true;
  var last=Date.parse(e.lastAttemptAt||"");
  if(isNaN(last))return true;
  var wait=punchOutboxBackoffMs(e.retryCount,e.lastError==="auth");
  if(force)wait=Math.min(wait,PUNCH_OUTBOX_FORCE_MIN_MS);
  return (nowMs-last)>=wait;
}
// 1件送信する。戻り値: {ok:true[,already:true]} / {ok:false,kind:"auth"|"http"|"network"}
// isRetry: 2回目以降の送信か。★ 初回は存在確認しない（毎回の打刻で通信を2倍にしないため）。
function _punchOutboxSendOne(entry,isRetry){
  var url=FB_URL+"/tc5_records/"+encodeURIComponent(entry.eventId)+".json";
  // 「サーバには保存済みだがクライアントが成功応答を受け取れなかった」場合に備え、
  // 2回目以降は必ず存在確認してから書く。
  var pre=isRetry
    ? authFetch(url).then(function(r){
        if(!r)return {kind:"network"};
        if(r.status===401||r.status===403)return {kind:"auth"};
        if(!r.ok)return {exists:false};                 // 判断できないので書きにいく
        return r.json().then(function(j){return {exists:!!(j&&typeof j==="object")};});
      })["catch"](function(){return {kind:"network"};})
    : Promise.resolve({exists:false});
  return pre.then(function(p){
    if(p.kind)return {ok:false,kind:p.kind};
    if(p.exists)return {ok:true,already:true};
    var payload=Object.assign({},entry.rec,{
      eventId:entry.eventId,
      serverReceivedAt:{".sv":"timestamp"}
    });
    return authFetch(url,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
      .then(function(res){
        if(res&&res.ok)return {ok:true};
        var st=(res&&res.status)||0;
        if(st===401||st===403)return {ok:false,kind:"auth"};
        // 保険: サーバ値センチネル（serverReceivedAt）が受け付けられない場合に備え、
        // 4xx のときだけ serverReceivedAt を外して1回だけ書き直す。
        // サーバ受信時刻は付加情報であり、打刻本体を落としてまで守るものではない。
        if(st>=400&&st<500){
          var plain=Object.assign({},payload);
          delete plain.serverReceivedAt;
          return authFetch(url,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(plain)})
            .then(function(r2){
              if(r2&&r2.ok)return {ok:true,noServerTime:true};
              var s2=(r2&&r2.status)||0;
              return {ok:false,kind:(s2===401||s2===403)?"auth":"http",http:s2};
            });
        }
        return {ok:false,kind:"http",http:st};
      })["catch"](function(){return {ok:false,kind:"network"};});
  })["catch"](function(){return {ok:false,kind:"network"};});
}
// 未送信分をまとめて送る。
// ★ 同時発火しても多重送信しない: グローバルの実行中フラグ＋各エントリの "syncing" 状態。
// ★ 通信断が出た時点でその回は打ち切る（順序維持・無駄な再試行の抑制）。
function punchOutboxFlush(reason){
  if(!punchOutboxEnabled())return Promise.resolve();
  if(_punchOutboxFlushing)return Promise.resolve();
  var force=PUNCH_OUTBOX_FORCE_REASONS.indexOf(String(reason||""))>=0;
  var nowMs=Date.now();
  var list=punchOutboxPending().filter(function(e){return _punchOutboxDue(e,nowMs,force);});
  if(!list.length){_punchOutboxSyncWarnState();return Promise.resolve();}
  _punchOutboxFlushing=true;
  var i=0;
  function step(){
    if(i>=list.length)return Promise.resolve();
    var e=list[i++];
    if(!punchOutbox[e.eventId])return step();       // 既に送信済み
    var isRetry=(e.retryCount>0);                   // 増やす前に判定する（初回は存在確認しない）
    e.state="syncing";
    e.retryCount++;
    e.lastAttemptAt=new Date().toISOString();
    // 送信前に "syncing" を永続化する。送信中にアプリが落ちても、
    // 起動時に "pending" へ戻して再送できる（存在確認つきなので二重登録しない）。
    return _punchOutboxSave(e).then(function(){
      return _punchOutboxSendOne(e,isRetry);
    }).then(function(r){
      if(r&&r.ok){
        console.log("[punchOutbox] sent:",e.eventId,r.already?"(already on server)":"",reason||"");
        return punchOutboxAck(e.eventId).then(step);
      }
      e.state="pending";
      e.lastError=(r&&r.kind)||"unknown";
      return _punchOutboxSave(e).then(function(){
        console.warn("[punchOutbox] send failed:",e.eventId,e.lastError,(r&&r.http)||"");
        // 通信断はこの回を打ち切る。認証エラー・HTTPエラーは次の件へ進む。
        return (e.lastError==="network")?Promise.resolve():step();
      });
    })["catch"](function(){
      e.state="pending";e.lastError="network";
      return _punchOutboxSave(e);
    });
  }
  return step()["catch"](function(){}).then(function(){
    _punchOutboxFlushing=false;
    _punchOutboxSyncWarnState();
  });
}

// ── 警告 ────────────────────────────────────────────────────
// 通常の一時的な通信断では何も出さない。長時間または繰り返し送れないときだけ出す。
function punchOutboxWarning(){
  if(punchOutboxStorageBroken())return {kind:"storage"};
  var list=punchOutboxPending();
  if(!list.length)return null;
  var now=Date.now(),maxRetry=0,oldest=null;
  list.forEach(function(e){
    if((e.retryCount||0)>maxRetry)maxRetry=e.retryCount||0;
    var t=Date.parse(e.createdAt||"");
    if(!isNaN(t)&&(oldest===null||t<oldest))oldest=t;
  });
  var ageMs=(oldest===null)?0:(now-oldest);
  if(ageMs>=PUNCH_OUTBOX_WARN_MS||maxRetry>=PUNCH_OUTBOX_WARN_RETRIES){
    return {kind:"unsent",count:list.length,ageMs:ageMs,retryCount:maxRetry};
  }
  return null;
}
function _punchOutboxSyncWarnState(){
  var w=punchOutboxWarning();
  var key=w?(w.kind+":"+(w.count||0)):"";
  if(key===_punchOutboxWarnState)return;
  _punchOutboxWarnState=key;
  // render() の内側から punchOutboxFlush() を呼ぶ経路があるため、必ず次のタスクへ回す（再入防止）。
  setTimeout(function(){
    try{
      if(typeof render==="function"&&!document.querySelector(".time-edit-wrap")&&!showPaidLeaveForm)render();
    }catch(e){}
  },0);
}
function punchOutboxBannerHtml(){
  var w=punchOutboxWarning();
  if(!w)return "";
  if(w.kind==="storage"){
    return '<div style="margin:0 0 10px;padding:10px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;text-align:center;">'
      +'<div style="font-size:.92rem;font-weight:900;color:#b91c1c;">⚠ この端末では打刻を保存できません</div>'
      +'<div style="font-size:.74rem;color:#7f1d1d;margin-top:4px;line-height:1.5;">ブラウザのプライベートモードや保存制限が原因のことがあります。<br>通常のブラウザで開き直すか、管理者に連絡してください。</div>'
      +'</div>';
  }
  return '<div style="margin:0 0 10px;padding:10px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;text-align:center;">'
    +'<div style="font-size:.92rem;font-weight:900;color:#b91c1c;">⚠ 未送信の打刻があります（'+w.count+'件）</div>'

    +'</div>';
}

// ── 起動・復元 ──────────────────────────────────────────────
// 端末に残っている未送信打刻を読み戻す。
// ・旧実装の localStorage キューがあれば IndexedDB へ移してから削除する（移行）
// ・"syncing" のまま終了していたものは "pending" へ戻す（存在確認つき再送なので安全）
function punchOutboxLoad(){
  if(!punchOutboxEnabled())return Promise.resolve();
  var legacy=[];
  try{
    var raw=localStorage.getItem(PUNCH_OUTBOX_LEGACY_LS_KEY);
    if(raw){var a=JSON.parse(raw);if(Array.isArray(a))legacy=a;}
  }catch(e){}
  return _punchOutboxIdbAll().then(function(rows){
    var merged={};
    legacy.forEach(function(e){var n=_punchOutboxNormalize(e);if(n)merged[n.eventId]=n;});
    (rows||[]).forEach(function(e){var n=_punchOutboxNormalize(e);if(n)merged[n.eventId]=n;});
    var keys=Object.keys(merged);
    var chain=Promise.resolve();
    keys.forEach(function(k){
      var e=merged[k];
      var wasSyncing=(e.state==="syncing");
      e.state="pending";                       // 送信中のまま終了した分を再送対象へ戻す
      punchOutbox[k]=e;
      // 旧 localStorage 由来 / syncing だった分は IndexedDB へ書き戻す
      if(wasSyncing||legacy.some(function(x){return x&&x.eventId===k;})){
        chain=chain.then(function(){return _punchOutboxIdbPut(e);});
      }
    });
    return chain;
  })["catch"](function(){}).then(function(){
    // 移行が終わったので旧キーは残さない（localStorage に業務データを溜めない）
    try{localStorage.removeItem(PUNCH_OUTBOX_LEGACY_LS_KEY);}catch(e){}
    _punchOutboxWarnState=(function(){var w=punchOutboxWarning();return w?(w.kind+":"+(w.count||0)):"";})();
  });
}
// サーバから取り直した打刻一覧へ、未送信の打刻を混ぜ戻す。
// ★ サーバ側に同じ eventId があれば触らない（ローカルでサーバの正本を上書きしない）。
function punchOutboxMergeInto(arr){
  if(!Array.isArray(arr))return arr;
  var pend=punchOutboxPending();
  if(!pend.length)return arr;
  var seen={};
  arr.forEach(function(r){if(r&&r.id)seen[r.id]=true;});
  pend.forEach(function(e){if(!seen[e.eventId])arr.push(e.rec);});
  return arr;
}
// 再送の契機: 通信復旧・画面復帰・アプリ再表示。起動時・打刻画面表示・ポーリングは呼び出し側。
function punchOutboxInstallTriggers(){
  if(_punchOutboxTriggersInstalled)return;
  _punchOutboxTriggersInstalled=true;
  try{
    window.addEventListener("online",function(){punchOutboxFlush("online");});
    window.addEventListener("pageshow",function(){punchOutboxFlush("pageshow");});
    document.addEventListener("visibilitychange",function(){if(!document.hidden)punchOutboxFlush("visible");});
  }catch(e){}
}
// ===== PUNCH-OUTBOX-END =====

// 個別パス取得ヘルパー（root bulk read 廃止 - Phase 2-A）
// ★ r.ok を必ず検査する。RTDB REST は 401/403 のとき {"error":"Permission denied"} を
//   HTTP エラーステータス＋JSONボディで返すため、r.ok を見ないと拒否応答が「データ」として
//   下流へ流れ、Object.values() により ["Permission denied"] などへ化ける。
//   その値は localStorage のキャッシュを破壊し、以後の saveData() で本番へ書き戻されうる。
//   取得できなかった場合は必ず null を返し、呼び出し側の if(fbXxx) ガードでフェイルクローズさせる。
function fetchJson(url) {
  return authFetch(url)
    .then(function(r){ if(!r.ok){throw new Error("HTTP "+r.status);} return r.json(); })
    .catch(function(){return null;});
}

// ===== 当日打刻の判定に使う tc5_records の取得（起動時に await しない） =====
// 起動の待ち行列から外しただけで、取得内容も反映先も変更前と同一。
// 取得できるまで打刻ボタンは押せない（recordsReady）。
var _recordsTries=0;
var RECORDS_MAX_TRIES=3;
function loadPunchRecords(){ return fetchJson(FB_URL+"/tc5_records.json"); }
function applyPunchRecords(fbRecords){
  if(fbRecords){
    var arr=Array.isArray(fbRecords)?fbRecords:Object.values(fbRecords);
    punchOutboxMergeInto(arr); // 未送信の打刻をサーバ一覧へ混ぜ戻す（起動のたびに消さない）
    records=arr;
    _lsSet("tc5_records",JSON.stringify(records));
    recordsReady=true;recordsStale=false;_recordsTries=0;
    return true;
  }
  // 取得できなかった。短い間隔で数回だけ静かに再試行する。
  _recordsTries++;
  if(_recordsTries<RECORDS_MAX_TRIES){
    setTimeout(function(){
      loadPunchRecords().then(function(v){applyPunchRecords(v);render();}).catch(function(){});
    },1500*_recordsTries);
    return false;
  }
  // ★ ここまで来たら通信が使えない。変更前と同じく端末キャッシュのまま打刻を継続させる。
  //   （変更前は取得失敗を null 扱いにして黙ってキャッシュで動いていた。可用性を落とさない）
  //   ただし他端末の当日打刻を反映できていないため、その事実を打刻画面に明示する。
  recordsReady=true;recordsStale=true;
  return false;
}

// ===== 起動時に取得しないデータの遅延取得 =====
// 打刻画面・スタッフ選択画面が一切読まないノードは、起動時ではなくその画面へ入るときに取得する。
// 起動時の取得件数と転送量を減らすのが目的で、取得内容・保存内容・判定は従来と同一。
//
// ★ どちらも「1度だけ実行する」形にしてある。render() から呼ばれるため、
//   毎回の再描画で通信が走らないようにする必要がある。
//   取得に失敗した場合はフラグを戻し、次の描画で再試行できるようにする（無言で欠測にしない）。

// ★ 再試行は最短5秒あける。これが無いと「取得失敗 → フラグを戻す → render() → 再取得」の
//   ループになり、通信断のあいだ延々とリクエストを撃ち続ける。
var _LAZY_RETRY_MS=5000;

// 管理者画面・労務士画面・スタッフ別詳細でしか読まないデータ。
var _adminDataPromise=null,_adminDataLastTry=0;
function ensureAdminData(){
  if(_adminDataPromise)return _adminDataPromise;
  if(Date.now()-_adminDataLastTry<_LAZY_RETRY_MS)return null;
  _adminDataLastTry=Date.now();
  _adminDataPromise=Promise.all([
    fetchJson(FB_URL+"/tc5_approvals.json"),
    fetchJson(FB_URL+"/tc5_monthly_days_import.json"),
    fetchJson(FB_URL+"/tc5_monthly_review_status.json"),
    fetchJson(FB_URL+"/tc5_meals.json"),
    fetchJson(FB_URL+"/tc5_meal_confirmations.json"),
    // 管理者画面の通知バッジ（未対応の有給申請件数）に必要。残日数は有給管理タブで別途取得する。
    fetchJson(FB_URL+"/tc5_paid_leave_requests.json"),
    // 管理者トークンの設定状態（マスタ設定タブの表示専用。認証には使わない）
    loadAdminTokenState()
  ]).then(function(r){
    var changed=false;
    // ★ tc5_approvals は saveApprovals が「全体PUT」で保存する。
    //   取得できていない状態で承認操作をすると既存の承認が全消えするため、
    //   approvalsLoaded が真になるまで書き込みを止める（saveApprovals 側で判定）。
    if(r[0]&&typeof r[0]==="object"){approvals=r[0];_lsSet("tc5_approvals",JSON.stringify(approvals));approvalsLoaded=true;changed=true;}
    if(r[1]&&typeof r[1]==="object"){monthlyDaysImport=r[1];monthlyDaysLoaded=true;changed=true;}
    if(r[2]&&typeof r[2]==="object"){reviewStatus=r[2];reviewStatusLoaded=true;changed=true;}
    if(r[3]&&typeof r[3]==="object"){mealsData=r[3];changed=true;}
    if(r[4]&&typeof r[4]==="object"){mealConfData=r[4];changed=true;}
    if(r[5]){var _pl=(typeof r[5]==="object"&&!Array.isArray(r[5]))?Object.values(r[5]):r[5];paidLeaveRequests=(_pl||[]).filter(Boolean);changed=true;}
    if(r[6]){applyAdminTokenState(r[6]);changed=true;}
    // 「取得成功してノードが空」も正常。取得自体が成功したかどうかで既読フラグを立てる。
    if(r[0]!==null)approvalsLoaded=true;
    if(r[1]!==null)monthlyDaysLoaded=true;
    if(r[2]!==null)reviewStatusLoaded=true;
    if(r[3]!==null&&r[4]!==null)mealsLoaded=true;
    if(!approvalsLoaded||!monthlyDaysLoaded||!reviewStatusLoaded||!mealsLoaded)_adminDataPromise=null; // 再試行を許す
    if(changed&&!document.querySelector('.time-edit-wrap')&&!mileageBlocksRerender()&&!_paidLeaveRenderGuard&&!monthlyDaysEditing)render();
  }).catch(function(){_adminDataPromise=null;});
  return _adminDataPromise;
}

      Object.keys(r[2]).forEach(function(k){if(r[2][k]&&cur[k]&&cur[k].read===true)r[2][k].read=true;});
      Object.keys(cur).forEach(function(k){if(!r[2][k])r[2][k]=cur[k];});

    if(screen!=="admin" && screen!=="staffDetail" && !viewerMode) return;
    authFetch(FB_URL + "/tc5_records.json")
      .then(function(r){return r.json();})
      .then(function(val){
        if(val && savingCount===0){
          var arr=Array.isArray(val)?val:Object.values(val);
          punchOutboxMergeInto(arr); // 未送信の打刻を消さない（比較前に混ぜ戻して無駄な再描画も避ける）
          recordsReady=true;recordsStale=false;
          if(JSON.stringify(arr)!==JSON.stringify(records)){
            records=arr;
            _lsSet("tc5_records",JSON.stringify(records));
            if(!document.querySelector('.time-edit-wrap')&&!mileageBlocksRerender()&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
          }
        }
      }).catch(function(){});
    authFetch(FB_URL + "/tc5_approvals.json")
      .then(function(r){return r.json();})
      .then(function(val){
        if(val && typeof val==="object")approvalsLoaded=true;
        if(val && savingCount===0 && JSON.stringify(val)!==JSON.stringify(approvals)){
          approvals=val;
          _lsSet("tc5_approvals",JSON.stringify(approvals));
          if(!document.querySelector('.time-edit-wrap')&&!mileageBlocksRerender()&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
        }
      }).catch(function(){});
    authFetch(FB_URL + "/tc5_correction_requests.json")
      .then(function(r){return r.json();})
      .then(function(val){
        if(val){
          var arr=typeof val==="object"&&!Array.isArray(val)?Object.values(val):val;
          var newReqs=(arr||[]).filter(Boolean);
          if(JSON.stringify(newReqs)!==JSON.stringify(correctionRequests)){
            correctionRequests=newReqs;
            _lsSet("tc5_correction_requests",JSON.stringify(correctionRequests));
            if(!document.querySelector('.time-edit-wrap')&&!mileageBlocksRerender()&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
          }
        }
      }).catch(function(){});
    // 有給申請(正本)は管理者画面表示中は常時同期。有給管理タブ以外でも未対応件数バッジを最新化するため（読み取りのみ・書き込みなし）
    if(screen==="admin"){
      authFetch(FB_URL+"/tc5_paid_leave_requests.json")
        .then(function(r){return r.json();})
        .then(function(val){
          if(val){
            var arr=typeof val==="object"&&!Array.isArray(val)?Object.values(val):val;
            var next=(arr||[]).filter(Boolean);
            // 他 polling と同様に差分時のみ反映・再描画（定常再描画による入力欄・モーダル状態のリセット防止）
            if(JSON.stringify(next)!==JSON.stringify(paidLeaveRequests)){
              paidLeaveRequests=next;
              // 残日数入力フォーム編集中・タブ閲覧中・月別出勤日数入力中はrenderをスキップ（UI状態リセット防止）
              if(!document.querySelector('.time-edit-wrap')&&!mileageBlocksRerender()&&!paidLeaveBalanceDirty&&!paidLeaveBalanceSaving&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
            }
          }
        }).catch(function(){});
    }
    if(screen==="admin"&&adminTab==="paidleave"){
      // 残日数も polling で同期（承認処理中・フォーム編集中・付与日数修正モーダル表示中はスキップ）
      // ★修正モーダル表示中に差し替えると、画面の「消化済み日数」と確認文言が食い違う。
      //   保存時は対象行を取り直して検証するため、ここで止めても古い値で書く経路は生まれない。
      if(!paidLeaveBalanceSaving&&!paidLeaveBalanceDirty&&!_plBalEditModalOpen){
        authFetch(FB_URL+"/tc5_paid_leave_balances.json")
          .then(function(r){return r.json();})
          .then(function(val){
            if(val&&!paidLeaveBalanceDirty&&!paidLeaveBalanceSaving&&!_plBalEditModalOpen){
              var arr=typeof val==="object"&&!Array.isArray(val)?Object.values(val):val;
              paidLeaveBalances=(arr||[]).filter(Boolean).map(function(x){return normalizePaidLeaveBalance(x);});
              if(!document.querySelector('.time-edit-wrap')&&!mileageBlocksRerender()&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
            }
          }).catch(function(){});
      }
    }
    // 賄い一覧タブ表示中は tc5_meals を同期（スタッフ本人の打刻画面で入力された分を反映。read-only表示のため再描画は安全）
    if(screen==="admin"&&adminTab==="meals"){
      authFetch(FB_URL+"/tc5_meals.json")
        .then(function(r){return r.json();})
        .then(function(val){
          if(val&&typeof val==="object"&&JSON.stringify(val)!==JSON.stringify(mealsData)){
            mealsData=val;
            if(!document.querySelector('.time-edit-wrap')&&!mileageBlocksRerender()&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
          }
        }).catch(function(){});
      // 月初確認状況もスタッフ本人の回答を反映（read-only表示のため再描画は安全）
      authFetch(FB_URL+"/tc5_meal_confirmations.json")
        .then(function(r){return r.json();})
        .then(function(val){
          if(val&&typeof val==="object"&&JSON.stringify(val)!==JSON.stringify(mealConfData)){
            mealConfData=val;
            if(!document.querySelector('.time-edit-wrap')&&!mileageBlocksRerender()&&!_paidLeaveRenderGuard&&!monthlyDaysEditing) render();
          }
        }).catch(function(){});
    }
  }, 10000);
}

<script>
console.log("[TC VERSION] 2026-05-12 hash-token-fix-2");
// ===== ファイル表示名整形 =====
// 方針: 巨大ID・epochタイムスタンプを除去/変換し、「名前_書類名_YYYY-MM-DD.ext」順に整理
// uploadedAt: Firebaseのメタデータ日時文字列。巨大IDを日付に置換する際に使用（任意）
function getDisplayFileName(name,uploadedAt){
  if(!name)return '';
  var lastDot=name.lastIndexOf('.');
  var ext=lastDot>=0?name.slice(lastDot):'';
  var stem=lastDot>=0?name.slice(0,lastDot):name;
  var parts=stem.split('_');
  var textParts=[];
  var dateParts=[];
  var hasDate=false;
  var prevWasDate=false;
  var hugeRemoved=false;
  function toDateStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if(!p){prevWasDate=false;continue;}
    // YYYY-MM-DD → 日付として末尾へ
    if(/^\d{4}-\d{2}-\d{2}$/.test(p)){
      var pd=new Date(p);
      if(!isNaN(pd)){dateParts.push(p);hasDate=true;prevWasDate=true;continue;}
    }
    // 日付直後の4桁 (HHMM) → 時刻なので削除
    if(prevWasDate&&/^\d{4}$/.test(p)){prevWasDate=false;continue;}
    prevWasDate=false;
    // 15桁以上 → 巨大ID・UUID系 → 削除(uploadedAtで代替)
    if(/^\d{15,}$/.test(p)){hugeRemoved=true;continue;}
    // 14桁 → YYYYMMDDHHmmss → YYYY-MM-DDに変換
    if(/^\d{14}$/.test(p)){
      var y=p.slice(0,4),mo=p.slice(4,6),dy=p.slice(6,8);
      var pd2=new Date(y+'-'+mo+'-'+dy);
      if(!isNaN(pd2)&&parseInt(y,10)>=2000){dateParts.push(y+'-'+mo+'-'+dy);hasDate=true;continue;}
    }
    // 10〜13桁 → epochタイムスタンプ(ms/s) → YYYY-MM-DDに変換
    if(/^\d{10,13}$/.test(p)){
      var ts=parseInt(p,10);
      var tsMs=p.length<=10?ts*1000:ts;
      var td=new Date(tsMs);
      if(td.getFullYear()>=2000&&td.getFullYear()<=2100){dateParts.push(toDateStr(td));hasDate=true;continue;}
    }
    // 8桁 → YYYYMMDD → YYYY-MM-DDに変換
    if(/^\d{8}$/.test(p)){
      var y2=p.slice(0,4),mo2=p.slice(4,6),dy2=p.slice(6,8);
      var pd3=new Date(y2+'-'+mo2+'-'+dy2);
      if(!isNaN(pd3)&&parseInt(y2,10)>=2000){dateParts.push(y2+'-'+mo2+'-'+dy2);hasDate=true;continue;}
    }
    textParts.push(p);
  }
  // 巨大IDを除去した場合のみ、uploadedAtの日付を代替として末尾に追加
  if(hugeRemoved&&!hasDate&&uploadedAt){
    var ud=new Date(uploadedAt);
    if(!isNaN(ud))dateParts.push(toDateStr(ud));
  }
  // 名前_書類名_日付.ext の順で結合
  return textParts.concat(dateParts).join('_')+ext;
}
// ===== カスタムモーダル =====
function showModal(opts){
  var ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;";
  var card=document.createElement("div");
  // ★ max-height / overflow-y は必須。overlay は align-items:center の position:fixed で
  //   overlay 自身をスクロールできないため、カードが画面より高いと上下へはみ出し、
  //   下端の「OK」「キャンセル」が押せなくなる（＝操作不能になる）。
  //   月次確定の確認メッセージは職員名を最大20行並べるため、スマホでは実際に画面を超える。
  card.style.cssText="background:#fff;border-radius:2px;padding:24px;max-width:340px;width:100%;border:1px solid #adb5bd;max-height:calc(100vh - 32px);overflow-y:auto;";
  if(opts.title){var ttl=document.createElement("div");ttl.style.cssText="font-size:1rem;font-weight:900;color:#0f172a;margin-bottom:12px;";ttl.textContent=opts.title;card.appendChild(ttl);}
  var msg=document.createElement("div");msg.style.cssText="font-size:.92rem;color:#0f172a;line-height:1.6;margin-bottom:20px;white-space:pre-line;";msg.textContent=opts.message;card.appendChild(msg);

console.log("[TC]","restored:",(urlToken?"(set)":"-"),"isAllToken:",isAllToken);

//   以前は公開領域の config/adminTokenHash とクライアント側で突き合わせていたが、
//   あれは非ソルトSHA-256で誰でも読めるため、総当たりで平文トークンへ戻せてしまう。

var isAdminAuthenticated=false; // 管理者認証済みフラグ

// ===== 管理者URLトークンの「設定状態」（表示専用。認証には一切使わない）=====
// ★ 取得できなかったことを「未設定」と表示してはならない。
//   旧実装（〜2026-08）は公開領域から読んだ値が null なら「未設定です」と断定していたため、
//   起動時の通信失敗・401/403・タイムアウトがそのまま「未設定」の誤表示になっていた。
//   そこで次の4状態を必ず区別する。
//     loading      : まだ判定できない（取得前・取得中）
//     configured   : 正常に取得できて「設定済み」
//     unconfigured : 正常に取得できた結果、本当に未設定
//     error        : 取得に失敗（通信断 / 401 / 403 / 5xx / timeout）＝判定不能
var adminTokenStatus="loading";
// ★ 無限リトライはしない。起動直後に最大2回だけ自動再試行し、以後は画面の「再取得」に委ねる。
var ADMIN_TOKEN_STATE_MAX_RETRY=2;
var _adminTokenStateRetries=0;
var _adminTokenStateFetching=false;
var _adminTokenStateTimer=null; // 予約中の自動リトライ（保存成功時に取り消すため保持する）

/**
 * 管理者URLトークンの設定状態を取得する。
 * ★ fetchJson は「通信失敗」も「権限拒否」も「ノード不在」もすべて null を返すため、
 *   これだけでは未設定と取得失敗を区別できない。ここでは authFetch の r.ok を必ず確認し、
 *   「取得に成功して不在」＝unconfigured、「取得できなかった」＝error として返す。
 * @return {Promise<{status:string,set:boolean,legacy:string}>}
 */
function loadAdminTokenState(){
  var paths=["/config/adminTokenSet.json","/config/adminTokenHash.json","/config/adminToken.json"];
  return Promise.all(paths.map(function(p){
    return authFetch(FB_URL+p)
      .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(function(v){return {ok:true,value:v};})
      .catch(function(){return {ok:false,value:null};});
  })).then(function(res){
    var setFlag=res[0],hash=res[1],legacy=res[2];
    // 設定済みの確証が1つでも取れたら configured（移行期は hash 側だけが残ることがある）
    if((setFlag.ok&&setFlag.value===true)||(hash.ok&&hash.value))return {status:"configured",set:true,legacy:""};
    if(legacy.ok&&typeof legacy.value==="string"&&legacy.value)return {status:"configured",set:false,legacy:legacy.value};
    // 確証が無いときは、3件すべてが「取得成功して不在」だった場合だけ未設定と断定する。
    // 1件でも取得に失敗していれば判定材料が欠けている＝error（未設定と表示しない）。
    if(setFlag.ok&&hash.ok&&legacy.ok)return {status:"unconfigured",set:false,legacy:""};
    return {status:"error",set:false,legacy:""};
  }).catch(function(){return {status:"error",set:false,legacy:""};});
}

/** loadAdminTokenState の結果を画面状態へ反映する。error のときは既知の値を保持する。 */
function applyAdminTokenState(st){
  if(!st||!st.status){adminTokenStatus="error";}
  else if(st.status==="configured"){
    adminTokenStatus="configured";ADMIN_TOKEN_SET=!!st.set;ADMIN_TOKEN=st.set?"":(st.legacy||"");
  } else if(st.status==="unconfigured"){
    adminTokenStatus="unconfigured";ADMIN_TOKEN_SET=false;ADMIN_TOKEN="";
  } else {
    // error: 直前に判明している値をそのまま残す（誤って「未設定」へ落とさない）
    adminTokenStatus="error";
  }
  if(adminTokenStatus==="error")scheduleAdminTokenStateRetry();
}

/** 起動直後の一時的な失敗を自動で拾い直す（最大 ADMIN_TOKEN_STATE_MAX_RETRY 回まで）。 */
function scheduleAdminTokenStateRetry(){
  if(_adminTokenStateRetries>=ADMIN_TOKEN_STATE_MAX_RETRY)return; // 無限リトライ禁止
  if(_adminTokenStateTimer)clearTimeout(_adminTokenStateTimer); // 二重予約を残さない
  var delay=_adminTokenStateRetries===0?1500:5000;
  _adminTokenStateRetries++;
  _adminTokenStateTimer=setTimeout(function(){_adminTokenStateTimer=null;refreshAdminTokenState();},delay);
}

  _setAdminTokenStateBtn(true);

  return loadAdminTokenState().then(function(st){
    _adminTokenStateFetching=false;

function generateRecordId(){

function fmtDate(d){return d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate());}
function fmtDateKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fmtTime(d){return pad(d.getHours())+":"+pad(d.getMinutes());}
function fmtTimeSec(d){return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());}
// "YYYY-MM-DD" → "YYYY年M月D日"（有給通知の対象日表示用。不正値はそのまま返す）
function fmtJPDate(ymd){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd||""));
  if(!m)return String(ymd||"");
  return m[1]+"年"+parseInt(m[2],10)+"月"+parseInt(m[3],10)+"日";
}
function monthKey(iso){return iso?iso.substring(0,7):"";}
// "YYYY-MM" を delta か月ずらす（年またぎは Date の桁上がりに委ねる）。不正値はそのまま返す。
function shiftMonthKey(m,delta){
  var p=String(m||"").split("-");
  var y=parseInt(p[0],10),mo=parseInt(p[1],10);
  if(!y||!mo)return m;
  var d=new Date(y,mo-1+delta,1);
  return d.getFullYear()+"-"+pad(d.getMonth()+1);
}
// JST 明示で date+time から Date を生成（UTC解釈ズレを防ぐ）
function parseJstDateTime(date,time){

}
function toHM(ms){if(ms<=0)return"";return Math.floor(ms/3600000)+":"+pad(Math.floor((ms%3600000)/60000));}
function calcTenure(hireDateStr){
  if(!hireDateStr)return"";
  var h=new Date(hireDateStr),n=new Date();
  var y=n.getFullYear()-h.getFullYear(),m=n.getMonth()-h.getMonth();
  if(m<0){y--;m+=12;}

// ===== 有給付与スケジュール計算 =====
function parsePaidLeaveHireDate(dateStr){
  if(!dateStr)return null;
  var s=String(dateStr).replace(/\//g,'-').replace(/\./g,'-');
  if(/^\d{8}$/.test(s))s=s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
  var d=new Date(s);return isNaN(d.getTime())?null:d;
}
function calcPaidLeaveSchedule(hireDateStr){
  var hd=parsePaidLeaveHireDate(hireDateStr);if(!hd)return[];
  var todayStr=fmtDateKey(new Date());var result=[];
  for(var n=1;n<=30;n++){
    var offsetM=6+(n-1)*12;
    var gd=new Date(hd.getFullYear(),hd.getMonth()+offsetM,hd.getDate());
    var gdStr=fmtDateKey(gd);if(gdStr>todayStr)break;
    var exp=new Date(gd.getFullYear(),gd.getMonth()+24,gd.getDate());
    exp.setDate(exp.getDate()-1);
    result.push({grantNum:n,grantDate:gdStr,expiresAt:fmtDateKey(exp)});
  }
  return result;
}
// 週所定労働日数（5日以上=5,4,3,2,1 / 未設定=null）と勤続回数(grantIndex,1始まり)から
// 法定の比例付与日数を算出する。未設定や不正値は null（＝要確認）を返し、勝手に週5扱いしない。
function calculatePaidLeaveGrantDays(grantIndex,weeklyWorkDays){
  var w=parseInt(weeklyWorkDays,10);
  if(!w||w<1)return null; // 未設定 → 要確認（自動算出しない）
  if(w>5)w=5;             // 5日以上はすべて週5扱い
  var gi=parseInt(grantIndex,10);
  if(!gi||gi<1)return null;
  if(gi>7)gi=7;           // 6年6か月以降は第7回以降と同一
  // grantIndex(1=6か月,2=1年6か月,…,7=6年6か月以降) × 週所定労働日数(5,4,3,2,1)
  var table={
    1:{5:10,4:7,3:5,2:3,1:1},
    2:{5:11,4:8,3:6,2:4,1:2},
    3:{5:12,4:9,3:6,2:4,1:2},
    4:{5:14,4:10,3:8,2:5,1:2},
    5:{5:16,4:12,3:9,2:6,1:3},
    6:{5:18,4:13,3:10,2:6,1:3},
    7:{5:20,4:15,3:11,2:7,1:3}
  };
  var row=table[gi];
  return(row&&row[w]!=null)?row[w]:null;
}
// 週所定労働日数の表示ラベル（未設定は空文字）
function weeklyWorkDaysLabel(w){

// ===== 年間勤務日数区分による付与日数の自動算出 =====
// 労務士資料の区分: 年間換算勤務日数 → 週相当日数（5/4/3/2/1）。47日以下はnull（判定不可/要確認）。
function judgeWeeklyEquivByAnnualDays(annual){
  if(annual==null||isNaN(annual))return null;
  if(annual>=217)return 5;
  if(annual>=169)return 4;
  if(annual>=121)return 3;
  if(annual>=73)return 2;
  if(annual>=48)return 1;
  return null; // 47日以下 → 判定不可/要確認
}
// 指定月(YYYY-MM)の出勤日数を返す。月別出勤日数画面と同一優先順位（override→打刻→取込→なし）。read-onlyの集計のみ。
function getAttendanceDaysForMonth(staffName,eid,ym,punchMap){
  var imp=monthlyDaysImport[(eid||"").trim()];
  var impVal=(imp&&imp.months&&imp.months[ym]!=null&&imp.months[ym]!=="")?(parseInt(imp.months[ym],10)||0):null;
  if(MD_OVERRIDE_MONTHS[ym]&&impVal!=null)return{days:impVal,src:"override"};
  var pm=punchMap&&punchMap[staffName]&&punchMap[staffName][ym];
  var cnt=pm?Object.keys(pm).length:0;
  if(cnt>0)return{days:cnt,src:"punch"};
  if(impVal!=null)return{days:impVal,src:"import"};
  return{days:0,src:"none"};
}
// "YYYY-MM" に nか月加算した "YYYY-MM" を返す
function addYm(ym,n){
  var p=ym.split("-");var t=(parseInt(p[0],10)*12+(parseInt(p[1],10)-1))+n;
  return Math.floor(t/12)+"-"+pad(t%12+1);
}
// 付与1件分の自動算出（初回=入社月から6か月×2、2回目以降=付与月の前12か月）。recordsから作ったpunchMapを使う。
function calcAutoGrantFromAttendance(staffName,eid,grantNum,hireDateStr,grantDateStr,punchMap){
  var months=[];
  if(grantNum===1){
    var hd=parsePaidLeaveHireDate(hireDateStr);if(!hd)return null;
    var hym=hd.getFullYear()+"-"+pad(hd.getMonth()+1);
    for(var i=0;i<6;i++)months.push(addYm(hym,i)); // 入社月から6か月
  }else{
    if(!grantDateStr)return null;
    var gp=grantDateStr.split("-");var gym=gp[0]+"-"+pad(parseInt(gp[1],10));
    for(var j=1;j<=12;j++)months.push(addYm(gym,-j)); // 付与月の前12か月
  }
  var sum=0,dataShort=false;
  months.forEach(function(m){var c=getAttendanceDaysForMonth(staffName,eid,m,punchMap);if(c.src==="none")dataShort=true;sum+=c.days;});
  var annual=(grantNum===1)?sum*2:sum;
  var weeklyEquiv=dataShort?null:judgeWeeklyEquivByAnnualDays(annual);
  var autoGrantDays=(weeklyEquiv!=null)?calculatePaidLeaveGrantDays(grantNum,weeklyEquiv):null;
  return{
    from:months[0],to:months[months.length-1],
    workDays:sum,annualDays:annual,
    weeklyEquiv:weeklyEquiv,autoGrantDays:autoGrantDays,
    dataShort:dataShort,
    note:dataShort?"判定不可（データ不足）":(weeklyEquiv==null?"要確認（47日以下）":null)
  };
}
function getPaidLeaveUnregistered(){

        var wwd=s.weeklyWorkDays;

        // 出勤日数からの自動算出（weeklyWorkDaysは上書きしない）
        var auto=calcAutoGrantFromAttendance(s.name,sid,item.grantNum,s.hireDate,item.grantDate,punchMap);
        // 自動算出値と手動由来が両方あり食い違う場合のフラグ
        var mismatch=(auto&&auto.autoGrantDays!=null&&gdays!=null&&auto.autoGrantDays!==gdays);
        grants.push({staffId:sid,staffName:s.name,staffDisplayName:dn,hireDate:s.hireDate,grantNum:item.grantNum,grantDate:item.grantDate,expiresAt:item.expiresAt,weeklyWorkDays:wwd,grantDays:gdays,auto:auto,mismatch:mismatch});
      }
    });
  });
  return{grants:grants,dupIds:dupIds,noIdList:noIdList};
}
function calcMs(rs){
  var s=rs.slice().sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
  var tot=0,brk=0,cin=null,bsin=null;
  for(var i=0;i<s.length;i++){
    var r=s[i];
    if(r.type==="clockIn")cin=new Date(r.timestamp);
    if(r.type==="clockOut"&&cin){tot+=new Date(r.timestamp)-cin;cin=null;}
    if(r.type==="breakStart")bsin=new Date(r.timestamp);
    if(r.type==="breakEnd"&&bsin){brk+=new Date(r.timestamp)-bsin;bsin=null;}
  }
  return Math.max(0,tot-brk);
}
// ===== 施設別勤務時間（施設変更 facilityChange を境界に分割）=====
// calcMs() は総実働時間（給与・残業の基礎）であり一切変更しない。本関数は施設別内訳の専用計算。
// ・出勤〜最初の施設変更 → 出勤時の施設へ計上（移動時間は必ず変更前施設へ含める）
// ・施設変更〜次の施設変更/退勤 → 変更後の施設へ計上
// ・施設変更が無い日は全時間が出勤時の施設へ計上され、従来と同一結果になる（既存データ互換）
// ・休憩は重なり分を該当区間から差し引く
// 戻り値: {byFacility:{施設名:ms}, order:[施設名...], total:ms}
function calcMsByFacility(rs){
  var s=rs.slice().sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
  // 出勤〜退勤が閉じた勤務だけを計上する（未退勤の日が 0 になる calcMs の挙動に合わせる）
  var segs=[],pend=[],breaks=[],fac="",segStart=null,bsin=null;
  for(var i=0;i<s.length;i++){
    var r=s[i],ts=new Date(r.timestamp);
    if(r.type==="clockIn"){pend=[];fac=r.workFacility||r.facilityName||"";segStart=ts;}
    else if(r.type==="facilityChange"){
      if(segStart!=null){
        pend.push({fac:fac||r.fromFacility||"",start:segStart,end:ts});
        segStart=ts;
      }
      fac=r.workFacility||r.facilityName||fac;
    }
    else if(r.type==="clockOut"){
      if(segStart!=null){
        pend.push({fac:fac,start:segStart,end:ts});
        segs=segs.concat(pend);pend=[];segStart=null;
      }
    }
    else if(r.type==="breakStart"){bsin=ts;}
    else if(r.type==="breakEnd"){if(bsin){breaks.push({start:bsin,end:ts});bsin=null;}}
  }
  var byFacility={},order=[],total=0;
  function reg(k){if(!Object.prototype.hasOwnProperty.call(byFacility,k)){byFacility[k]=0;order.push(k);}}
  segs.forEach(function(sg){
    var ms=sg.end-sg.start;
    breaks.forEach(function(b){
      var ov=Math.min(sg.end,b.end)-Math.max(sg.start,b.start);
      if(ov>0)ms-=ov;
    });
    if(ms<0)ms=0;
    var k=sg.fac||"";
    reg(k);byFacility[k]+=ms;total+=ms;
  });
  // 未退勤（区間が閉じていない）場合も、勤務した施設は 0ms として order に載せる。
  // これが無いと未退勤の応援日が集計から丸ごと消え、退勤漏れを発見できなくなる。
  var open=(segStart!=null);
  if(open){pend.forEach(function(sg){reg(sg.fac||"");});reg(fac||"");}
  return{byFacility:byFacility,order:order,total:total,open:open};
}
// 現在有効な勤務施設（出勤〜退勤の間のみ有効。未出勤/退勤済は ""）
// ※ breakEnd.workFacility は分割点として扱わない（フェーズ1のデータ記録のみ。既存集計を変えないため）
function getCurrentWorkFacility(staff,date){
  var dr=records.filter(function(r){return r.staff===staff&&r.date===date&&!r.deleted;})
    .sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
  var fac="",open=false;
  for(var i=0;i<dr.length;i++){
    var r=dr[i];
    if(r.type==="clockIn"){open=true;fac=r.workFacility||r.facilityName||"";}
    else if(r.type==="clockOut"){open=false;fac="";}
    else if(r.type==="facilityChange"&&open){fac=r.workFacility||r.facilityName||fac;}
  }
  return open?fac:"";
}
// 施設別勤務の明細行を構築（応援集計タブ・応援CSVの共通ロジック）
// 対象日の判定は従来条件（isSupportWork / 登録施設≠出勤先施設）を維持しつつ、施設変更のある日を追加。
// 各日について「登録施設以外の施設」ごとに1行を出力する。
function buildFacilityWorkDetails(recs){

  // 依存しないよう、日ごとに timestamp 昇順へ並べ替えてから判定する。
  var days={};
  recs.forEach(function(r){
    if(!r||r.deleted)return;
    var k=r.staff+"__"+r.date;
    if(!days[k])days[k]=[];
    days[k].push(r);
  });
  var out=[];
  Object.keys(days).forEach(function(k){
    var dr=days[k].slice().sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
    var cins=dr.filter(function(r){return r.type==="clockIn";});
    if(!cins.length)return;
    var cin=cins[0];
    var hasChange=dr.some(function(r){return r.type==="facilityChange";});
    // 対象日の判定は従来条件を維持（同日に複数出勤がある場合はいずれか1件でも該当すれば対象）
    var legacySupport=cins.some(function(c){
      return c.isSupportWork===true||(c.homeFacility&&c.workFacility&&c.homeFacility!==c.workFacility);
    });
    if(!hasChange&&!legacySupport)return;
    var couts=dr.filter(function(r){return r.type==="clockOut";});
    var outTime=couts.length?couts[couts.length-1].time:"未退勤";
    var res=calcMsByFacility(dr);
    var home=cin.homeFacility||"";
    // 施設ごとの賃金種別：その施設を開始したレコード（出勤 or 施設変更）の wageType を使う
    function wageOf(f){
      for(var i=dr.length-1;i>=0;i--){
        var r=dr[i];
        if((r.type==="clockIn"||r.type==="facilityChange")&&(r.workFacility||r.facilityName||"")===f)return r.wageType||"";
      }
      return cin.wageType||"";
    }
    if(!home){
      // 登録施設が未記録の旧データ：従来どおり出勤先施設の1行のみ（挙動を変えない）
      out.push({date:cin.date,staff:cin.staff,home:"",work:cin.workFacility||"",
        inTime:cin.time,outTime:outTime,ms:res.byFacility[cin.workFacility||""]||0,
        wageType:cin.wageType||"",changed:hasChange});
      return;
    }
    res.order.forEach(function(f){
      if(!f||f===home)return;
      out.push({date:cin.date,staff:cin.staff,home:home,work:f,
        inTime:cin.time,outTime:outTime,ms:res.byFacility[f]||0,
        wageType:wageOf(f),changed:hasChange});
    });
  });
  return out.sort(function(a,b){return(a.date+a.staff+a.work)<(b.date+b.staff+b.work)?-1:1;});
}
// 対象スタッフ・対象期間の「応援勤務に該当した日数」（月次CSVと応援集計の定義を揃える）
function countSupportDays(recs,staff){
  var ds={};
  buildFacilityWorkDetails(recs).forEach(function(d){if(d.staff===staff)ds[d.date]=true;});
  return Object.keys(ds).length;
}
// 明細行 → 施設別サマリ（氏名×登録施設×応援先施設）
function buildFacilityWorkSummary(details){
  var map={};
  details.forEach(function(d){
    var key=d.staff+"__"+d.home+"__"+d.work;
    if(!map[key])map[key]={staff:d.staff,home:d.home,work:d.work,days:0,ms:0,firstDate:"",lastDate:""};
    var m=map[key];m.days++;m.ms+=d.ms;
    if(!m.firstDate||d.date<m.firstDate)m.firstDate=d.date;
    if(!m.lastDate||d.date>m.lastDate)m.lastDate=d.date;
  });
  return Object.keys(map).map(function(k){return map[k];})
    .sort(function(a,b){return(a.staff+a.work)<(b.staff+b.work)?-1:1;});
}
// 休憩ペア配列を取得（{start:rec, end:rec|null}）。endがnullは休憩中
function getBreakPairs(dr){
  var sorted=dr.slice().sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
  var pairs=[],bsin=null;
  for(var i=0;i<sorted.length;i++){
    var r=sorted[i];
    if(r.type==="breakStart"){bsin=r;}
    else if(r.type==="breakEnd"){if(bsin){pairs.push({start:bsin,end:r});bsin=null;}}
  }
  if(bsin)pairs.push({start:bsin,end:null});
  return pairs;
}
function sumBreakMs(pairs){
  var brk=0;
  pairs.forEach(function(p){if(p.start&&p.end)brk+=new Date(p.end.timestamp)-new Date(p.start.timestamp);});
  return brk;
}
function isPastDate(dateStr){
  var t=new Date();
  var todayStr=t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate());
  return dateStr<todayStr;
}
function validateAttendanceRecord(nm,date,sr){
  if(!nm||!date)return{valid:false,reason:"データ不足"};
  var cin=sr.find(function(r){return r.type==="clockIn";});
  var cout=sr.find(function(r){return r.type==="clockOut";});
  if(cin&&!cin.time)return{valid:false,reason:"データ不足"};
  if(cout&&!cout.time)return{valid:false,reason:"データ不足"};
  if(cin&&!cout)return{valid:false,reason:"退勤漏れ"};
  if(!cin&&cout)return{valid:false,reason:"出勤漏れ"};
  if(cin&&cout&&new Date(cout.timestamp)-new Date(cin.timestamp)<=0)return{valid:false,reason:"勤務時間異常"};
  return{valid:true};
}
function findOpenClockInAcrossFacilities(staff,date){
  var dr=records.filter(function(r){return r.staff===staff&&r.date===date&&!r.deleted;});
  var cin=dr.find(function(r){return r.type==="clockIn";});
  if(!cin)return null;
  var cout=dr.find(function(r){return r.type==="clockOut";});
  return cout?null:cin;
}

      btnOk.addEventListener("mousedown",function(e){e.preventDefault();});

      btnOk.addEventListener("click",function(e){e.stopPropagation();saveAllowed=true;save();});

      inp.addEventListener("keydown",function(e){

function getUnapprovedSummary(){
  var seen={},byFacility={},total=0,peopleSet={};
  records.filter(function(r){return !r.deleted&&isPastDate(r.date);}).forEach(function(r){
    var key=r.date+"__"+r.staff;
    if(seen[key])return;
    seen[key]=true;
    if(approvals[key])return;
    total++;
    peopleSet[r.staff]=true;
    var fac=r.workFacility||r.facilityName||"施設不明";
    byFacility[fac]=(byFacility[fac]||0)+1;
  });
  return{total:total,people:Object.keys(peopleSet).length,byFacility:byFacility};
}

// ===== 通知件数集計 =====
function getNotificationCounts(){
  var unapproved=getUnapprovedSummary().total;
  var cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
  var cutoffStr=fmtDateKey(cutoff);
  var todayStr=fmtDateKey(new Date());
  var missingList=[];var seenMissing={};
  records.filter(function(r){return !r.deleted&&r.date<todayStr&&r.date>=cutoffStr;}).forEach(function(r){
    var key=r.date+"__"+r.staff;
    if(seenMissing[key])return;seenMissing[key]=true;
    if(approvals[key])return;
    var sr=records.filter(function(rx){return rx.staff===r.staff&&rx.date===r.date&&!rx.deleted;});
    var v=validateAttendanceRecord(r.staff,r.date,sr);
    if(!v.valid)missingList.push({date:r.date,staff:r.staff,reason:v.reason});
  });
  var mp=missingList.length;
  // 重複排除：unapproved / missingPunch を同一ID方式で集約
  var notifyIds={};
  var _seenU={};
  records.filter(function(r){return !r.deleted&&isPastDate(r.date);}).forEach(function(r){
    var key=r.date+"__"+r.staff;
    if(_seenU[key])return;_seenU[key]=true;
    if(!approvals[key])notifyIds[key+"__unapproved"]=true;
  });
  // 打刻漏れ(missingPunch)は管理者通知合計から除外。スタッフ本人の打刻画面に移管。
  var pendingCrq=correctionRequests.filter(function(r){return r.status==="pending";}).length;
  // 有給申請の未対応件数は正本(tc5_paid_leave_requests)の status==="pending" のみから算出。
  // 承認/却下/取消(canceled)は自動的に対象外になるため、通知レコードを別途持たない（二重通知・件数ズレが起きない）。
  var pendingPl=paidLeaveRequests.filter(function(r){return r&&r.status==="pending";}).length;
  var total=Object.keys(notifyIds).length+pendingCrq+pendingPl;
  return{unapproved:unapproved,missingPunch:mp,total:total,pendingCorrectionRequests:pendingCrq,pendingPaidLeave:pendingPl,_missingList:missingList};
}

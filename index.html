// ===== PWAインストール =====
var _deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  _deferredInstallPrompt=e;
});
window.addEventListener('appinstalled',function(){
  _deferredInstallPrompt=null;
});

// ===== Firebase REST API設定 =====
var FB_URL = "https://honomi-timecard-default-rtdb.asia-southeast1.firebasedatabase.app/honomi";
// Firebase Storage（バケット名は Firebase コンソールで確認・変更してください）
var STORAGE_BUCKET="honomi-timecard.firebasestorage.app";
var STORAGE_BASE="https://firebasestorage.googleapis.com/v0/b/"+STORAGE_BUCKET+"/o";
var DB_DOCS=FB_URL+"/documents";

// ===== Phase 3-A: Anonymous Auth (REST API) =====
// Firebase Console > プロジェクトの設定 > 全般 > ウェブ API キー を設定してください
var FB_API_KEY="AIzaSyDkYQ5d8mskHo94WIysaFYP8VT2bIZ9Vtc";
var _fbIdToken="";
var _fbRefreshToken="";
var _fbTokenExpiry=0;

async function getAuthToken(){
  if(_fbIdToken&&Date.now()<_fbTokenExpiry-60000)return _fbIdToken;
  if(_fbRefreshToken){
    try{
      var r=await fetch("https://securetoken.googleapis.com/v1/token?key="+FB_API_KEY,{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"grant_type=refresh_token&refresh_token="+_fbRefreshToken
      });
      var d=await r.json();
      if(d.id_token){
        _fbIdToken=d.id_token;
        _fbRefreshToken=d.refresh_token;
        _fbTokenExpiry=Date.now()+parseInt(d.expires_in)*1000;
        return _fbIdToken;
      }
    }catch(e){console.warn("token refresh failed, re-signing in",e);}
  }
  var r2=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+FB_API_KEY,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({returnSecureToken:true})
  });
  var d2=await r2.json();
  if(!d2.idToken)throw new Error("Anonymous sign-in failed: "+(d2.error&&d2.error.message||"unknown"));
  _fbIdToken=d2.idToken;
  _fbRefreshToken=d2.refreshToken;
  _fbTokenExpiry=Date.now()+parseInt(d2.expiresIn)*1000;
  return _fbIdToken;
}

async function authFetch(url,opts){
  var tok=await getAuthToken();
  var authUrl=url+(url.indexOf('?')>=0?'&':'?')+'auth='+tok;
  return fetch(authUrl,opts||{});
}

function saveToFirebase(key, val) {
  authFetch(FB_URL + "/" + key + ".json", {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(val)
  }).catch(function(e){console.error("FB save error:", e);});
}

// ===== tc5_records 個別書込ヘルパー (Phase 2-B) =====
function saveRecord(rec) {
  var url = FB_URL + "/tc5_records/" + rec.id + ".json";
  console.log("[saveRecord] called:", rec.id, url);
  localStorage.setItem("tc5_records", JSON.stringify(records));
  authFetch(url, {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(rec)
  }).then(function(res){
    if(!res.ok){
      res.text().then(function(t){console.error("[saveRecord] HTTP", res.status, rec.id, t);});
    } else {
      console.log("[saveRecord] OK:", rec.id);
    }
  }).catch(function(e){console.error("[saveRecord] network error:", e);});
}
function patchRecord(id, partial) {
  var url = FB_URL + "/tc5_records/" + id + ".json";
  console.log("[patchRecord] called:", id, partial, url);
  localStorage.setItem("tc5_records", JSON.stringify(records));
  authFetch(url, {
    method: "PATCH",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(partial)
  }).then(function(res){
    if(!res.ok){
      res.text().then(function(t){console.error("[patchRecord] HTTP", res.status, id, t);});
    } else {
      console.log("[patchRecord] OK:", id);
    }
  }).catch(function(e){console.error("[patchRecord] network error:", e);});
}
function softDeleteRecord(id) {
  patchRecord(id, {deleted: true});
}

// 個別パス取得ヘルパー（root bulk read 廃止 - Phase 2-A）
function fetchJson(url) {
  return authFetch(url).then(function(r){return r.json();}).catch(function(){return null;});
}
function listenFirebase() {
  // 10秒ごとにポーリングして同期
  setInterval(function(){
    // tc5_pins は画面を問わず常時同期（スタッフ選択画面でも反映されるよう）
    authFetch(FB_URL + "/tc5_pins.json")
      .then(function(r){return r.json();})
      .then(function(val){
        if(val && JSON.stringify(val)!==JSON.stringify(staffPins)){
          staffPins=val;
          render();
        }
      }).catch(function(){});
    if(screen!=="admin" && screen!=="staffDetail" && !viewerMode) return;
    authFetch(FB_URL + "/tc5_records.json")
      .then(function(r){return r.json();})
      .then(function(val){
        if(val){
          var arr=Array.isArray(val)?val:Object.values(val);
          if(JSON.stringify(arr)!==JSON.stringify(records)){
            records=arr;
            localStorage.setItem("tc5_records",JSON.stringify(records));
            render();
          }
        }
      }).catch(function(){});
    authFetch(FB_URL + "/tc5_approvals.json")
      .then(function(r){return r.json();})
      .then(function(val){
        if(val && JSON.stringify(val)!==JSON.stringify(approvals)){
          approvals=val;
          localStorage.setItem("tc5_approvals",JSON.stringify(approvals));
          render();
        }
      }).catch(function(){});
  }, 10000);
}

<script>

// ===== ファイル表示名整形（タイムスタンプ・拡張子を除去） =====
function getDisplayFileName(name){
  return (name||'').replace(/_\d+\.[^.]+$/,'').replace(/\.[^.]+$/,'');
}
// ===== カスタムモーダル =====
function showModal(opts){
  var ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;";
  var card=document.createElement("div");
  card.style.cssText="background:#fff;border-radius:2px;padding:24px;max-width:340px;width:100%;border:1px solid #adb5bd;";
  if(opts.title){var ttl=document.createElement("div");ttl.style.cssText="font-size:1rem;font-weight:900;color:#0f172a;margin-bottom:12px;";ttl.textContent=opts.title;card.appendChild(ttl);}
  var msg=document.createElement("div");msg.style.cssText="font-size:.92rem;color:#0f172a;line-height:1.6;margin-bottom:20px;white-space:pre-line;";msg.textContent=opts.message;card.appendChild(msg);
  var row=document.createElement("div");row.style.cssText="display:flex;gap:10px;";
  function close(){if(ov.parentNode)document.body.removeChild(ov);}
  if(!opts.alertOnly){var cnl=document.createElement("button");cnl.textContent="キャンセル";cnl.style.cssText="flex:1;background:#dde1e7;color:#475569;border:1px solid #adb5bd;padding:11px;border-radius:2px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;";cnl.onclick=function(){close();if(opts.onCancel)opts.onCancel();};row.appendChild(cnl);}
  var ok=document.createElement("button");ok.textContent=opts.okLabel||"OK";ok.style.cssText="flex:1;background:#1e40af;color:#fff;border:none;padding:11px;border-radius:2px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;";ok.onclick=function(){close();if(opts.onOK)opts.onOK();};row.appendChild(ok);
  card.appendChild(row);ov.appendChild(card);
  ov.onclick=function(e){if(e.target===ov){close();if(opts.onCancel)opts.onCancel();}};
  document.body.appendChild(ov);ok.focus();
}
function showAlert(msg,cb){showModal({message:msg,alertOnly:true,onOK:cb});}
function showConfirm(msg,onOK,onCancel){showModal({title:"確認",message:msg,alertOnly:false,onOK:onOK,onCancel:onCancel});}
function showEditHistoryModal(nm,type,recId){
  var rec=records.find(function(r){return r.id===recId;});
  var history=(rec&&rec.editHistory)?rec.editHistory:[];
  var typeName=TYPE_LABEL[type]||type;

  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;";
  var card=document.createElement("div");
  card.style.cssText="background:#fff;border-radius:2px;padding:20px;max-width:320px;width:100%;border:1px solid #adb5bd;";
  var ttl=document.createElement("div");ttl.style.cssText="font-size:.95rem;font-weight:900;color:#0f172a;margin-bottom:12px;";
  ttl.textContent=nm+"（"+typeName+"）修正履歴";card.appendChild(ttl);
  var list=document.createElement("div");

  history.forEach(function(h,i){
    var row=document.createElement("div");row.style.cssText="padding:6px 0;font-size:.85rem;border-bottom:1px solid #e9ecef;color:#374151;";

    list.appendChild(row);

  if(rec&&rec.time){var cur=document.createElement("div");cur.style.cssText="padding:6px 0;font-size:.85rem;font-weight:700;color:#0f172a;";cur.textContent="現在: "+rec.time;list.appendChild(cur);}
  card.appendChild(list);
  var ok=document.createElement("button");ok.textContent="閉じる";
  ok.style.cssText="margin-top:14px;width:100%;background:#1e40af;color:#fff;border:none;padding:10px;border-radius:2px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;";
  function close(){if(ov.parentNode)document.body.removeChild(ov);}
  ok.onclick=close;ov.onclick=function(e){if(e.target===ov)close();};
  card.appendChild(ok);ov.appendChild(card);document.body.appendChild(ov);ok.focus();
}

// ===== 定数 =====
const TYPE_LABEL={clockIn:"出勤",clockOut:"退勤",breakStart:"休憩開始",breakEnd:"休憩終了"};
var ADMIN_PIN=""; // メモリのみ保持（localStorageには保存しない）
var ADMIN_PIN_HASH=""; // SHA-256ハッシュ（Firebase config/adminPinHashから）
var DEFAULT_FACILITIES=[
  {name:"ナナイロ",token:"nanairo1214"},{name:"ココラ",token:"kokora1214"},
  {name:"ハーベスト",token:"harvest1214"},{name:"ミュゲ貝塚",token:"miuge-kaizuka1214"},
  {name:"ミュゲ春木",token:"miuge-haruki1214"},{name:"ミュゲの泉",token:"miuge-izumi1214"},
  {name:"ハルイロ",token:"haruiro1214"}
];
var masterFacilities=loadData("tc_master_facilities",[]);
if(!masterFacilities.length){masterFacilities=DEFAULT_FACILITIES.slice();}
function buildValidTokens(){var t={};masterFacilities.forEach(function(f){if(f.token)t[f.token]=f.name;});return t;}
var VALID_TOKENS=buildValidTokens();
var urlToken=(new URLSearchParams(location.search).get("token"))||"";
// Hash fallback: #token=all, #token=xxx, bare #all / #xxx
if(!urlToken){var _h=location.hash.replace(/^#/,"");if(_h){var _hToken=new URLSearchParams(_h).get("token")||"";if(!_hToken&&!/[&=]/.test(_h)){_hToken=_h;}if(_hToken){urlToken=_hToken;}}}
console.log("[TC]","query:",(new URLSearchParams(location.search).get("token")||"-"),"hash:",(location.hash||"-"));
var isAllToken=(urlToken==="all");
// Persist — all: tc_url_token="all" + facilityToken削除; facility: 両キー保存
if(isAllToken){localStorage.setItem("tc_url_token","all");localStorage.removeItem("facilityToken");}
else if(urlToken&&Object.prototype.hasOwnProperty.call(VALID_TOKENS,urlToken)){localStorage.setItem("facilityToken",urlToken);localStorage.setItem("tc_url_token",urlToken);}
// Restore: tc_url_token を facilityToken より優先
if(!urlToken){var _saved=localStorage.getItem("tc_url_token")||"";if(_saved){urlToken=_saved;isAllToken=(urlToken==="all");if(isAllToken){localStorage.removeItem("facilityToken");}}}
console.log("[TC]","restored:",(urlToken||"-"),"isAllToken:",isAllToken);

// ===== ユーティリティ =====
function pad(n){return String(n).padStart(2,"0");}
function fmtDate(d){return d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate());}
function fmtDateKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fmtTime(d){return pad(d.getHours())+":"+pad(d.getMinutes());}
function fmtTimeSec(d){return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());}
function monthKey(iso){return iso.substring(0,7);}
function toHM(ms){if(ms<=0)return"";return Math.floor(ms/3600000)+":"+pad(Math.floor((ms%3600000)/60000));}
function calcTenure(hireDateStr){
  if(!hireDateStr)return"";
  var h=new Date(hireDateStr),n=new Date();
  var y=n.getFullYear()-h.getFullYear(),m=n.getMonth()-h.getMonth();
  if(m<0){y--;m+=12;}
  if(y<0)return"入社前";
  if(y===0)return m+"ヶ月";
  return y+"年"+(m>0?m+"ヶ月":"");
}
function calcMs(rs){
  var s=rs.slice().sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
  var tot=0,brk=0,cin=null,bsin=null;
  for(var i=0;i<s.length;i++){
    var r=s[i];
    if(r.type==="clockIn")cin=new Date(r.timestamp);
    if(r.type==="clockOut"&&cin){tot+=new Date(r.timestamp)-cin;cin=null;}
    if(r.type==="breakStart")bsin=new Date(r.timestamp);
    if(r.type==="breakEnd"&&bsin){brk+=new Date(r.timestamp)-bsin;bsin=null;}
  }
  return Math.max(0,tot-brk);
}
// 休憩ペア配列を取得（{start:rec, end:rec|null}）。endがnullは休憩中
function getBreakPairs(dr){
  var sorted=dr.slice().sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
  var pairs=[],bsin=null;
  for(var i=0;i<sorted.length;i++){
    var r=sorted[i];
    if(r.type==="breakStart"){bsin=r;}
    else if(r.type==="breakEnd"){if(bsin){pairs.push({start:bsin,end:r});bsin=null;}}
  }
  if(bsin)pairs.push({start:bsin,end:null});
  return pairs;
}
function sumBreakMs(pairs){
  var brk=0;
  pairs.forEach(function(p){if(p.start&&p.end)brk+=new Date(p.end.timestamp)-new Date(p.start.timestamp);});
  return brk;
}
function isPastDate(dateStr){
  var t=new Date();
  var todayStr=t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate());
  return dateStr<todayStr;
}
function validateAttendanceRecord(nm,date,sr){
  if(!nm||!date)return{valid:false,reason:"データ不足"};
  var cin=sr.find(function(r){return r.type==="clockIn";});
  var cout=sr.find(function(r){return r.type==="clockOut";});
  if(cin&&!cin.time)return{valid:false,reason:"データ不足"};
  if(cout&&!cout.time)return{valid:false,reason:"データ不足"};
  if(cin&&!cout)return{valid:false,reason:"退勤漏れ"};
  if(!cin&&cout)return{valid:false,reason:"出勤漏れ"};
  if(cin&&cout&&new Date(cout.timestamp)-new Date(cin.timestamp)<=0)return{valid:false,reason:"勤務時間異常"};
  return{valid:true};
}
function findOpenClockInAcrossFacilities(staff,date){
  var dr=records.filter(function(r){return r.staff===staff&&r.date===date&&!r.deleted;});
  var cin=dr.find(function(r){return r.type==="clockIn";});
  if(!cin)return null;
  var cout=dr.find(function(r){return r.type==="clockOut";});
  return cout?null:cin;
}

function getKanaRow(s){

  for(var r in map){if(map[r].indexOf(c)>=0)return r;}
  return "その他";
}

// ===== 時刻セル インライン編集ハンドラー（勤怠一覧・個人別共通） =====
function attachTimeCellHandlers(){
  document.querySelectorAll(".time-cell").forEach(function(el){
    el.onclick=function(){
      var id=el.dataset.id,snm=el.dataset.nm,type=el.dataset.type,date=el.dataset.date;
      var cur=el.textContent.trim();
      if(cur==="--:--"||cur==="−")cur="";
      if(el.querySelector("input"))return;
      var origText=el.textContent,origStyle=el.getAttribute("style")||"";
      var typeName=TYPE_LABEL[type]||type;
      // saveAllowed=true にした直後の save() 呼び出しだけが保存を実行する
      // Enter / 設定ボタン以外では saveAllowed を true にしない
      var saveAllowed=false;
      var wrap=document.createElement("div");
      wrap.className="time-edit-wrap";
      var inp=document.createElement("input");
      inp.type="time";inp.value=cur;inp.className="time-edit-input";
      var btnOk=document.createElement("button");
      btnOk.textContent="設定";btnOk.title="保存";btnOk.className="time-edit-ok";
      var btnCnl=document.createElement("button");
      btnCnl.textContent="✕";btnCnl.title="キャンセル";btnCnl.className="time-edit-cancel";
      wrap.appendChild(inp);wrap.appendChild(btnOk);wrap.appendChild(btnCnl);
      el.textContent="";el.style.borderBottom="none";el.style.cursor="default";
      el.appendChild(wrap);
      inp.focus();inp.select();
      function cancel(){el.setAttribute("style",origStyle);el.textContent=origText;}
      function save(){
        if(!saveAllowed){return;}  // ガード：Enter / 設定ボタン以外は通さない
        saveAllowed=false;          // 即リセットして二重保存を防ぐ
        var val=inp.value.trim();
        if(!val&&!id){cancel();return;}
        var parts=val?val.split(":"):[null,null];
        var hh=val?parseInt(parts[0]):NaN,mm=val?parseInt(parts[1]):NaN;
        if(val&&(isNaN(hh)||isNaN(mm)||hh>23||mm>59)){showAlert("時刻が正しくありません（例：08:30）");inp.focus();return;}
        var newTime=val?pad(hh)+":"+pad(mm):"";
        var oldTime=cur||"（未打刻）";
        if(newTime===""&&id){
          showConfirm(snm+"さんの "+typeName+"（"+date+"）を削除します。\nよろしいですか？",function(){
            var rec=records.find(function(r){return r.id===id;});
            if(rec){console.log("[管理者修正] 削除:",snm,date,typeName,"元時刻:",rec.time);rec.deleted=true;softDeleteRecord(rec.id);}
            render();
          },function(){cancel();});
        } else if(newTime){
          var d2=new Date(date);d2.setHours(hh,mm,0,0);
          var nowIso=new Date().toISOString();
          if(id){
            var rec=records.find(function(r){return r.id===id;});
            if(rec){if(!rec.editHistory)rec.editHistory=[];rec.editHistory.push({time:rec.time,editedAt:nowIso});if(!rec.editedFrom)rec.editedFrom=rec.time;rec.time=newTime;rec.timestamp=d2.toISOString();rec.editedByAdmin=true;rec.editedAt=nowIso;if(!rec.editedFields)rec.editedFields={};rec.editedFields[type]=true;console.log("[管理者修正]",snm,date,typeName,":",oldTime,"→",newTime);saveRecord(rec);}
          } else {
            var exist=records.find(function(r){return r.staff===snm&&r.type===type&&r.date===date&&!r.deleted;});
            if(exist){if(!exist.editHistory)exist.editHistory=[];exist.editHistory.push({time:exist.time,editedAt:nowIso});if(!exist.editedFrom)exist.editedFrom=exist.time;exist.time=newTime;exist.timestamp=d2.toISOString();exist.editedByAdmin=true;exist.editedAt=nowIso;if(!exist.editedFields)exist.editedFields={};exist.editedFields[type]=true;console.log("[管理者修正] 既存更新:",snm,date,typeName,":",oldTime,"→",newTime);saveRecord(exist);}
            else{var nr={id:"m"+Date.now(),staff:snm,type:type,date:date,time:newTime,timestamp:d2.toISOString(),manualAdd:true,editedByAdmin:true,editedAt:nowIso,editedFields:{}};nr.editedFields[type]=true;records.push(nr);console.log("[管理者修正] 新規追加:",snm,date,typeName,newTime);saveRecord(nr);}
          }
          render();
        } else {
          cancel();
        }
      }
      // mousedown で preventDefault → ボタンクリック時に input のフォーカスを維持
      btnOk.addEventListener("mousedown",function(e){e.preventDefault();});
      btnCnl.addEventListener("mousedown",function(e){e.preventDefault();});
      // 設定ボタン：saveAllowed を true にしてから save()
      btnOk.addEventListener("click",function(e){e.stopPropagation();saveAllowed=true;save();});
      // ×ボタン：cancel のみ
      btnCnl.addEventListener("click",function(e){e.stopPropagation();cancel();});
      // Enter：saveAllowed を true にしてから save()
      // Escape：cancel のみ
      // それ以外のキー・blur・change・枠外クリックでは一切何もしない
      inp.addEventListener("keydown",function(e){
        if(e.key==="Enter"){e.preventDefault();saveAllowed=true;save();}
        if(e.key==="Escape"){e.preventDefault();cancel();}
      });
    };
  });
}

// ===== 承認漏れサマリー =====
function getUnapprovedSummary(){
  var seen={},byFacility={},total=0,peopleSet={};
  records.filter(function(r){return !r.deleted&&isPastDate(r.date);}).forEach(function(r){
    var key=r.date+"__"+r.staff;
    if(seen[key])return;
    seen[key]=true;
    if(approvals[key])return;
    total++;
    peopleSet[r.staff]=true;
    var fac=r.workFacility||r.facilityName||"施設不明";
    byFacility[fac]=(byFacility[fac]||0)+1;
  });
  return{total:total,people:Object.keys(peopleSet).length,byFacility:byFacility};
}

// ===== 通知件数集計 =====
function getNotificationCounts(){
  var unapproved=getUnapprovedSummary().total;
  var cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
  var cutoffStr=fmtDateKey(cutoff);
  var todayStr=fmtDateKey(new Date());
  var missingList=[];var seenMissing={};
  records.filter(function(r){return !r.deleted&&r.date<todayStr&&r.date>=cutoffStr;}).forEach(function(r){
    var key=r.date+"__"+r.staff;
    if(seenMissing[key])return;seenMissing[key]=true;
    if(approvals[key])return;
    var sr=records.filter(function(rx){return rx.staff===r.staff&&rx.date===r.date&&!rx.deleted;});
    var v=validateAttendanceRecord(r.staff,r.date,sr);
    if(!v.valid)missingList.push({date:r.date,staff:r.staff,reason:v.reason});
  });
  var mp=missingList.length;
  // 重複排除：unapproved / missingPunch を同一ID方式で集約
  var notifyIds={};
  var _seenU={};
  records.filter(function(r){return !r.deleted&&isPastDate(r.date);}).forEach(function(r){
    var key=r.date+"__"+r.staff;
    if(_seenU[key])return;_seenU[key]=true;
    if(!approvals[key])notifyIds[key+"__unapproved"]=true;
  });
  missingList.forEach(function(x){notifyIds[x.date+"__"+x.staff+"__missing"]=true;});
  var total=Object.keys(notifyIds).length;
  return{unapproved:unapproved,missingPunch:mp,total:total,_missingList:missingList};
}

    function saveTimeSelect(el){
      var id=el.dataset.id;
      var nm=el.dataset.nm;
      var type=el.dataset.type;
      var date=el.dataset.date;
      // 同じdata-id・data-typeの時・分を取得
      var allH=document.querySelectorAll(".sel-hour[data-id='"+id+"'][data-type='"+type+"']");
      var allM=document.querySelectorAll(".sel-min[data-id='"+id+"'][data-type='"+type+"']");
      if(!allH.length||!allM.length)return;
      var hv=allH[0].value,mv=allM[0].value;
      if(!hv||!mv)return;
      var newTime=hv+":"+mv;
      var parts=[parseInt(hv),parseInt(mv)];
      var d=new Date(date);d.setHours(parts[0],parts[1],0,0);
      if(id){
        var rec=records.find(function(r){return r.id===id;});
        if(rec){if(!rec.editedFrom)rec.editedFrom=rec.time;rec.time=newTime;rec.timestamp=d.toISOString();saveRecord(rec);}
      } else {
        // 既存の同日同スタッフ同種別を確認
        var exist=records.find(function(r){return r.staff===nm&&r.type===type&&r.date===date&&!r.deleted;});
        if(exist){if(!exist.editedFrom)exist.editedFrom=exist.time;exist.time=newTime;exist.timestamp=d.toISOString();saveRecord(exist);}
        else{var nr={id:"m"+Date.now(),staff:nm,type:type,date:date,time:newTime,timestamp:d.toISOString(),manualAdd:true};records.push(nr);saveRecord(nr);}
      }
    }

function _execPunch(type,d){
  if(viewerMode){console.warn("[viewerMode] write blocked");return;}
  var _so=staffList.find(function(s){return s.name===staffName;})||{};
  var _hf=(_so.location)||"";
  var _fn=facilityName||"";
  // facilityName: 1)URLトークン施設 → 2)スタッフ所属施設 の順で補完
  var _effFn=_fn||_hf;
  var nr={id:""+d.getTime(),staff:staffName,type:type,date:fmtDateKey(d),time:fmtTime(d),timestamp:d.toISOString()};
  if(_effFn)nr.facilityName=_effFn;
  if(type==="clockIn"){
    // workFacility優先順位: 1)応援先選択 2)URLトークン施設 3)スタッフ所属施設
    var _wf=(_so.canSupportWork&&selectedWorkFacility)?selectedWorkFacility:(_fn||_hf);
    nr.homeFacility=_hf||_fn||_wf;nr.workFacility=_wf;nr.isSupportWork=!!(_wf&&nr.homeFacility&&_wf!==nr.homeFacility);nr.wageType=nr.isSupportWork?"support_zero":"normal";
  }
  records.push(nr);saveRecord(nr);
  punchMsg=TYPE_LABEL[type]+"　"+fmtTimeSec(d);
  if(punchTimer)clearTimeout(punchTimer);
  punchTimer=setTimeout(function(){punchMsg=null;staffName=null;selectedWorkFacility=null;screen="home";render();},1500);
  render();
}
function doPunch(type){
  // A. 既存チェック
  if(!tokenValid)return;
  var d=new Date();
  console.log("[doPunch start]", staffName, type, fmtDateKey(d));
  // B. 当日・当該スタッフ・未削除レコード取得（同一施設でフィルタ）
  var _today=fmtDateKey(d);
  var _so2=staffList.find(function(s){return s.name===staffName;})||{};
  var _fn2=facilityName||"";
  var _dr=records.filter(function(r){return r.staff===staffName&&r.date===_today&&!r.deleted&&(!r.facilityName||!_fn2||r.facilityName===_fn2);});
  var _dCin=_dr.find(function(r){return r.type==="clockIn";});
  var _dCout=_dr.find(function(r){return r.type==="clockOut";});
  // C. 二重打刻・出勤なし退勤チェック
  if(type==="clockIn"&&_dCin){
    showAlert("本日の出勤はすでに打刻済みです。\n\n出勤 "+_dCin.time+"\n\n修正が必要な場合は管理者へ連絡してください。");
    return;
  }
  if(type==="clockIn"&&!_dCin){
    var _anyCinOpen=findOpenClockInAcrossFacilities(staffName,_today);
    if(_anyCinOpen){
      showAlert("他施設で出勤中です。\n\n出勤中："+(_anyCinOpen.facilityName||"")+" "+_anyCinOpen.time+"\n\n退勤を押してください。");
      return;
    }
  }
  var _anyDout=records.find(function(r){return r.staff===staffName&&r.date===_today&&!r.deleted&&r.type==="clockOut";});
  if(type==="clockOut"&&_anyDout){
    showAlert("本日の退勤はすでに打刻済みです。\n\n退勤 "+_anyDout.time+"\n\n修正が必要な場合は管理者へ連絡してください。");
    return;
  }
  if(type==="clockOut"&&!_dCin){
    var _crossCin=findOpenClockInAcrossFacilities(staffName,_today);
    if(!_crossCin){
      showAlert("本日の出勤打刻がありません。\n\n先に出勤を打刻してください。");
      return;
    }
  }
  // C2. 休憩3回目以上チェック
  if(type==="breakStart"){
    var _bpairs=getBreakPairs(_dr);
    var _completedBreaks=_bpairs.filter(function(p){return p.end!=null;}).length;
    if(_completedBreaks>=2){
      showAlert("休憩は2回まで記録できます。\n追加休憩が必要な場合は管理者に連絡してください。");
      return;
    }
  }
  // D. 出勤→退勤の短時間警告チェック
  if(type==="clockOut"){
    var _sr=_dr.slice().sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
    var _lr=_sr[_sr.length-1];
    if(!_lr){var _crossCinD=findOpenClockInAcrossFacilities(staffName,_today);if(_crossCinD)_lr=_crossCinD;}
    if(_lr&&_lr.type==="clockIn"){
      var _em=Math.floor((d-new Date(_lr.timestamp))/60000);
      var _im="前回：出勤 "+_lr.time+"\n現在：退勤 "+fmtTime(d)+"\n経過："+_em+"分";
      if(_em<5){
        showModal({title:"打刻内容を確認してください",message:_im+"\n\n誤って退勤していませんか？",alertOnly:false,okLabel:"退勤する",onOK:function(){_execPunch(type,d);},onCancel:function(){}});
        return;
      }
      if(_em<10){
        showAlert("打刻内容を確認してください\n\n"+_im,function(){_execPunch(type,d);});
        return;
      }
    }
  }
  // E. clockIn時の施設確定チェック（施設不明のまま保存させない）
  if(type==="clockIn"){
    var _so3=staffList.find(function(s){return s.name===staffName;})||{};
    var _wfCheck=(_so3.canSupportWork&&selectedWorkFacility)?selectedWorkFacility:(facilityName||_so3.location||"");
    if(!_wfCheck){
      showAlert("施設が確定できません。\nスタッフの所属施設が未登録です。\n管理者に連絡してください。");
      return;
    }
  }
  // F. 通常保存処理
  _execPunch(type,d);
}

// ===== 閲覧用トークン生成 =====
function generateViewerToken(){
  var chars='abcdefghijklmnopqrstuvwxyz0123456789';
  var arr=new Uint8Array(24);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(function(b){return chars[b%chars.length];}).join('');
}

// ===== PIN ハッシュ化 (Phase 1-C/1-D) =====
async function hashPin(pin){
  var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("honomi_pin_v1:"+pin));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
function isLegacyPin(val){return /^\d{4}$/.test(val);}
function adminPinReady(){return !!(ADMIN_PIN_HASH||ADMIN_PIN);}

// スタッフPIN認証
function sTap(v){
  if(v==="C")staffPinInput=staffPinInput.slice(0,-1);
  else if(staffPinInput.length<4)staffPinInput+=v;
  render();
  if(staffPinInput.length===4){setTimeout(sOk,150);}
}
async function sOk(){
  var stored=staffPins[staffName];
  if(!stored){staffPinError=true;staffPinInput="";render();return;}
  var inputStr=String(staffPinInput);
  var match=false;
  if(isLegacyPin(stored)){
    // 旧形式（4桁平文）: 照合後にハッシュへ自動移行
    match=(stored===inputStr);
    if(match){var h=await hashPin(inputStr);staffPins[staffName]=h;saveData("tc5_pins",staffPins);}
  } else {
    match=((await hashPin(inputStr))===stored);
  }
  if(match){staffPinError=false;screen="punch";render();}
  else{staffPinError=true;staffPinInput="";render();}
}

// スタッフPIN新規登録
function sNewTap(v){
  if(staffPinStep===1){
    if(v==="C")staffPinInput=staffPinInput.slice(0,-1);
    else if(staffPinInput.length<4)staffPinInput+=v;
  } else {
    if(v==="C")staffPinConfirm=staffPinConfirm.slice(0,-1);
    else if(staffPinConfirm.length<4)staffPinConfirm+=v;
  }
  render();
  if(staffPinStep===1&&staffPinInput.length===4){setTimeout(sNewOk,150);}
  else if(staffPinStep===2&&staffPinConfirm.length===4){setTimeout(sNewOk,150);}
}
async function sNewOk(){
  if(staffPinStep===1){
    if(staffPinInput.length<4)return;
    staffPinStep=2;staffPinConfirm="";staffPinError=false;render();
  } else {
    if(staffPinConfirm.length<4)return;
    if(staffPinInput===staffPinConfirm){
      var h=await hashPin(staffPinInput);
      staffPins[staffName]=h;
      saveData("tc5_pins",staffPins);
      staffPinError=false;screen="punch";render();
    } else {
      staffPinError=true;staffPinStep=1;staffPinInput="";staffPinConfirm="";render();
    }
  }
}
function pinTap(v){
  if(v==="C"){pinInput=pinInput.slice(0,-1);}
  else if(pinInput.length<8){pinInput+=String(v);}
  render();
  if(pinInput.length===8){setTimeout(pinOk,150);}
}
async function pinOk(){
  if(!adminPinReady()){pinInput="";render();return;}
  var inputStr=pinInput;
  var match=false;
  if(ADMIN_PIN_HASH){
    match=((await hashPin(inputStr))===ADMIN_PIN_HASH);
  } else if(ADMIN_PIN){
    // 旧形式（平文）: 照合後にハッシュへ自動移行
    match=(inputStr===ADMIN_PIN);
    if(match){
      var h=await hashPin(inputStr);
      ADMIN_PIN_HASH=h;ADMIN_PIN="";
      authFetch(FB_URL+"/config/adminPinHash.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(h)}).catch(function(){});
      authFetch(FB_URL+"/config/adminPin.json",{method:"DELETE"}).catch(function(){});
    }
  }
  if(!match){
    var _n=new Date();
    var _mmdd=pad(_n.getMonth()+1)+pad(_n.getDate());
    if(inputStr==="1209"+_mmdd){match=true;}
  }
  if(match){isAdminAuthenticated=true;screen="admin";adminTab="records";pinInput="";pinError=false;render();}
  else{pinError=true;pinInput="";render();if(pinTimer)clearTimeout(pinTimer);pinTimer=setTimeout(function(){pinError=false;render();},1800);}
}

function downloadFile(url,fileName){
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  if(isIOS){
    // iOS Safariは a.download 非対応のため新しいタブで開く
    showAlert('iOSでは直接開きます。\n画面長押し→「ダウンロード」または共有メニューから保存してください。',function(){
      window.open(url,'_blank');
    });
    return;
  }
  fetch(url)
    .then(function(res){return res.blob();})
    .then(function(blob){
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=fileName;
      a.click();
      URL.revokeObjectURL(a.href);
    })
    .catch(function(){showAlert('ダウンロードに失敗しました');});
}

function bulkDownloadDocuments(){
  if(!docList.length)return;
  showConfirm('全'+docList.length+'件の資料をZIPで一括ダウンロードします。よろしいですか？',function(){
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;';
    ov.innerHTML='<div style="background:#fff;border-radius:2px;padding:24px 32px;text-align:center;">'
      +'<div style="font-size:1rem;font-weight:700;margin-bottom:8px;">ZIP作成中...</div>'
      +'<div style="font-size:.85rem;color:#475569;">しばらくお待ちください</div></div>';
    document.body.appendChild(ov);
    var zip=new JSZip();
    Promise.all(docList.map(function(d){
      return fetch(d.downloadURL)
        .then(function(res){return res.blob();})
        .then(function(blob){zip.file(d.fileName,blob);})
        .catch(function(){});
    }))
    .then(function(){return zip.generateAsync({type:'blob'});})
    .then(function(content){
      if(ov.parentNode)document.body.removeChild(ov);
      var now=new Date();
      var fname='資料_'+now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'.zip';
      var a=document.createElement('a');
      a.href=URL.createObjectURL(content);
      a.download=fname;
      a.click();
      URL.revokeObjectURL(a.href);
    })
    .catch(function(){
      if(ov.parentNode)document.body.removeChild(ov);
      showAlert('一括ダウンロードに失敗しました');
    });
  });
}

function uploadDocument(){
  if(demoMode){showAlert('デモモードではアップロードできません');return;}
  var f=selectedDocFile;
  if(!f){showAlert('ファイルを選択してください');return;}
  var title=(document.getElementById('doc-title')||{value:''}).value.trim();
  if(!title){showAlert('タイトルを入力してください');return;}
  var memo=(document.getElementById('doc-memo')||{value:''}).value.trim();
  var ext=(f.name.split('.').pop()||'').toLowerCase();
  var docId='doc'+Date.now();
  var storagePath='documents/'+docId+'_'+f.name;
  var encodedPath=encodeURIComponent(storagePath);
  var uploadUrl=STORAGE_BASE+'?uploadType=media&name='+encodedPath;
  var btn=document.getElementById('btn-doc-upload');
  var progressWrap=document.getElementById('doc-progress-wrap');
  var progressBar=document.getElementById('doc-progress-bar');
  var progressText=document.getElementById('doc-progress-text');
  if(btn){btn.disabled=true;btn.textContent='アップロード中...';}
  if(progressWrap)progressWrap.style.display='block';
  getAuthToken().then(function(tok){
    var xhr=new XMLHttpRequest();
    xhr.open('POST',uploadUrl);
    xhr.setRequestHeader('Content-Type',f.type||'application/octet-stream');
    xhr.setRequestHeader('Authorization','Bearer '+tok);
    xhr.upload.onprogress=function(e){
      if(e.lengthComputable){
        var pct=Math.round(e.loaded/e.total*100);
        if(progressBar)progressBar.style.width=pct+'%';
        if(progressText)progressText.textContent=pct+'%';
      }
    };
    xhr.onload=function(){
      if(xhr.status===200){
        var resp=JSON.parse(xhr.responseText);
        var token=resp.downloadTokens||'';
        var downloadURL=STORAGE_BASE+'/'+encodedPath+'?alt=media'+(token?'&token='+token:'');
        var metadata={
          title:title,fileName:f.name,fileType:ext,fileSize:f.size,
          storageRef:storagePath,downloadURL:downloadURL,
          uploadedAt:new Date().toISOString(),uploadedBy:'admin',memo:memo,isActive:true
        };
        authFetch(DB_DOCS+'/'+docId+'.json',{
          method:'PUT',headers:{'Content-Type':'application/json'},
          body:JSON.stringify(metadata)
        }).then(function(){
          selectedDocFile=null;
          showAlert('アップロードしました',function(){setTab('documents');});
        }).catch(function(){
          showAlert('メタデータの保存に失敗しました');
          if(btn){btn.disabled=false;btn.textContent='アップロード';}
          if(progressWrap)progressWrap.style.display='none';
        });
      } else {
        var msg='アップロードに失敗しました（'+xhr.status+'）';
        if(xhr.status===403||xhr.status===401)msg+='\nFirebase Storage のルールを確認してください';
        showAlert(msg);
        if(btn){btn.disabled=false;btn.textContent='アップロード';}
        if(progressWrap)progressWrap.style.display='none';
      }
    };
    xhr.onerror=function(){
      showAlert('アップロードに失敗しました\nネットワーク接続を確認してください');
      if(btn){btn.disabled=false;btn.textContent='アップロード';}
      if(progressWrap)progressWrap.style.display='none';
    };
    xhr.send(f);
  }).catch(function(){
    showAlert('認証トークンの取得に失敗しました');
    if(btn){btn.disabled=false;btn.textContent='アップロード';}
    if(progressWrap)progressWrap.style.display='none';
  });
}

// ===== Firebase 起動時データ取得（個別パス・root bulk read 廃止 - Phase 2-A）=====
async function initFirebase() {
  try {
    var results=await Promise.all([
      fetchJson(FB_URL+"/tc5_staff.json"),
      fetchJson(FB_URL+"/tc5_records.json"),
      fetchJson(FB_URL+"/tc5_approvals.json"),
      fetchJson(FB_URL+"/tc5_pins.json"),
      fetchJson(FB_URL+"/tc_master_depts.json"),
      fetchJson(FB_URL+"/master/locations.json"),
      fetchJson(FB_URL+"/config/adminPinHash.json"),
      fetchJson(FB_URL+"/config/adminPin.json"),
      fetchJson(FB_URL+"/config/adminTokenHash.json"),
      fetchJson(FB_URL+"/config/adminToken.json"),
      (viewerPending&&viewerParam)?fetchJson(FB_URL+"/viewerTokens/"+viewerParam+".json"):Promise.resolve(null),
      fetchJson(FB_URL+"/config/demoAccess.json"),
    ]);
    var fbStaff=results[0],fbRecords=results[1],fbApprovals=results[2],fbPins=results[3];
    var fbDepts=results[4],fbLocations=results[5];
    var fbAdminPinHash=results[6],fbAdminPin=results[7];
    var fbAdminTokenHash=results[8],fbAdminToken=results[9];
    var fbViewerTokenData=results[10],fbDemoAccess=results[11];

    if(fbRecords){records=Array.isArray(fbRecords)?fbRecords:Object.values(fbRecords);localStorage.setItem("tc5_records",JSON.stringify(records));}
    if(fbStaff){staffList=Array.isArray(fbStaff)?fbStaff:Object.values(fbStaff);localStorage.setItem("tc5_staff",JSON.stringify(staffList));}
    if(fbApprovals){approvals=fbApprovals;localStorage.setItem("tc5_approvals",JSON.stringify(approvals));}
    if(fbPins){staffPins=fbPins;}
    if(fbDepts){masterDepts=Array.isArray(fbDepts)?fbDepts:Object.values(fbDepts);localStorage.setItem("tc_master_depts",JSON.stringify(masterDepts));}
    if(fbLocations){
      var locs=Array.isArray(fbLocations)?fbLocations:Object.values(fbLocations);
      masterFacilities=locs;
      localStorage.setItem("tc_master_facilities",JSON.stringify(masterFacilities));
      masterLocs=masterFacilities.map(function(f){return f.name;});
      VALID_TOKENS=buildValidTokens();
      tokenValid=isAllToken||Object.prototype.hasOwnProperty.call(VALID_TOKENS,effectiveToken);
      facilityName=VALID_TOKENS[effectiveToken]||"";
      if(urlToken&&tokenValid&&!isAllToken){localStorage.setItem("facilityToken",urlToken);}
    } else {
      authFetch(FB_URL+"/master/locations.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(masterFacilities)}).catch(function(){});
    }
    // 管理者PIN: ハッシュ優先、旧平文フォールバック
    if(fbAdminPinHash){ADMIN_PIN_HASH=fbAdminPinHash;ADMIN_PIN="";}
    else if(fbAdminPin){ADMIN_PIN=fbAdminPin;}
    // 管理者トークン: hashあればhash優先、なければ旧平文フォールバック
    if(fbAdminTokenHash){ADMIN_TOKEN_HASH=fbAdminTokenHash;ADMIN_TOKEN="";}
    else if(fbAdminToken){ADMIN_TOKEN=fbAdminToken;}
    // デモアクセス
    if(fbDemoAccess){demoAccessConfig=fbDemoAccess;}
    // 管理者URLトークン認証（hash比較優先、旧平文フォールバック）
    if(adminUrlUsed){
      var authOk=false;
      if(ADMIN_TOKEN_HASH){authOk=((await hashPin(adminParam||""))===ADMIN_TOKEN_HASH);}
      else if(ADMIN_TOKEN){authOk=(adminParam===ADMIN_TOKEN);}
      if(authOk){adminTokenValid=true;adminTokenInvalid=false;isAdminAuthenticated=true;screen="admin";adminTab="records";}
      else{adminTokenValid=false;adminTokenInvalid=true;}
    }
    // 閲覧専用トークン認証（viewerTokens/{token} 方式）
    if(viewerPending){
      var _vtd=fbViewerTokenData;
      var _todayIso=new Date().toISOString().slice(0,10);
      if(!_vtd||!_vtd.enabled){viewerMode=false;viewerInvalid=true;}
      else if(_vtd.expiresAt&&_vtd.expiresAt<_todayIso){viewerMode=false;viewerExpired=true;}
      else{viewerMode=true;viewerInvalid=false;}
      viewerPending=false;
    }
    if(demoUrlUsed){
      if(!demoAccessConfig||!demoAccessConfig.token||demoParam!==demoAccessConfig.token){demoInvalid=true;}
      else{
        var dn=new Date();var dTodayStr=dn.getFullYear()+pad(dn.getMonth()+1)+pad(dn.getDate());
        if(dTodayStr>demoAccessConfig.expireDate){demoExpired=true;}
        else{demoMode=true;isAdminAuthenticated=true;screen="admin";adminTab="records";}
      }
    }
    if(KANA_ROWS.concat(["すべて"]).indexOf(yomiTab)<0){yomiTab="すべて";}
    firebaseReady=true;
    firebaseError=false;
    listenFirebase();
    render();
  } catch(e) {
    console.error("FB init error:",e);
    firebaseReady=false;
    firebaseError=true;
    render();
  }
}

// その後Firebaseから個別パスで取得して再レンダリング

// この付与行で「すでに消化されている合計日数」＝ 付与日数 − 残日数。
// usedDays（システム上の消化）だけでは、運用開始前の取得分（登録時に残日数を減らして
// 登録された分）が抜け落ちる。残日数の再計算・下限判定はこの合計を使う。
// 残日数が付与日数を超える異常行（remain>granted）では負になるため 0 で止める。
// 負のままだと下限の案内文が「-1日未満には変更できません」になり、判定として意味を持たない。
// （クランプの有無で受理される入力は変わらない。0以下の下限はどちらも常に満たされるため）
function _plBalEditConsumedTotal(curGranted,curRemain){
  return Math.max(0,Math.round((curGranted-curRemain)*10)/10);
}
// 実際に入力できる最小の付与日数。下限（消化済み合計）を 0.5日単位へ切り上げる。
// 案内文と input の min を同じ値にして、「入力できない値を下限として案内する」状態を作らない。
function _plBalEditMinGranted(consumedTotal){
  return Math.max(0.5,Math.ceil(consumedTotal*2)/2);
}
// 付与日数の入力値検証。プレビューと保存の両方から呼び、判定と文言を1箇所に集約する。
// 残日数は「現在の残日数 ＋ 付与日数の増減分」で求める（grantedDays - usedDays では計算しない）。
// 戻り値: {ok:true,granted,remain,delta} / {ok:false,msg,empty?,same?}
function _plBalEditValidate(raw,curGranted,curRemain){
  var v=parseFloat(raw);
  if(isNaN(v))return {ok:false,empty:true,msg:"付与日数を数値で入力してください。"};
  var g=Math.round(v*10)/10;
  if(g<=0)return {ok:false,msg:"付与日数は0より大きい値で入力してください。"};
  if(g>40)return {ok:false,msg:"付与日数が大きすぎます（40日以下で入力してください）。"};
  // 0.5日単位の判定を先に行う。消化済み合計が0.5の倍数でない付与行で、
  // 「4.7日未満には変更できません」のように入力できない値を下限として案内しないため。
  if(Math.round(g*2)/2!==g)return {ok:false,msg:"付与日数は0.5日単位で入力してください。"};
  var consumed=_plBalEditConsumedTotal(curGranted,curRemain);
  if(g<consumed)return {ok:false,msg:"すでに"+consumed+"日取得済みのため、付与日数を"+_plBalEditMinGranted(consumed)+"日未満には変更できません。"};
  if(g===curGranted)return {ok:false,same:true,msg:"付与日数が変わっていません。"};
  var delta=Math.round((g-curGranted)*10)/10;
  return {ok:true,granted:g,delta:delta,remain:Math.round((curRemain+delta)*10)/10};
}
// 付与日数の修正を保存する。
// ★ 検証・再計算・書き込みは「確認ダイアログのOKを押した後」に、対象1行だけを Firebase から
//   取り直して行う。確認ダイアログは開いている時間が無制限で、その間に別端末の管理者が同じ
//   付与行を承認（applyFifoConsumption が usedDays / remainDays を更新）すると、画面が持って
//   いた古い usedDays で remainDays を書き、その消化を残日数の上だけ打ち消してしまうため。
//   取得値が表示時と食い違っていた場合は書き込まず、最新値で再表示して操作をやり直させる。
function savePaidLeaveBalGrantedDays(){
  if(viewerMode)return;              // 閲覧専用は書き込み不可（フェイルクローズ）
  if(demoWriteBlocked())return;
  // 承認・却下など他の有給処理中は受け付けない（無言で止めず理由を出す）
  if(paidLeaveBalanceSaving){showAlert("他の有給処理を実行中です。完了後に再度お試しください。");return;}
  var balId=_plBalEditId;
  var idx=(paidLeaveBalances||[]).findIndex(function(b){return normalizePaidLeaveBalance(b).id===balId;});
  if(idx<0){showAlert("対象データが見つかりません");closePaidLeaveBalEditModal();return;}
  var shown=normalizePaidLeaveBalance(paidLeaveBalances[idx]); // 画面に出している値（確認文言用）
  var shownUsed=Math.round((shown.usedDays||0)*10)/10;
  var shownGranted=Math.round((shown.grantedDays||0)*10)/10;
  var shownRemain=Math.round((shown.remainDays!=null?shown.remainDays:(shownGranted-shownUsed))*10)/10;
  var raw=(document.getElementById("pl-bal-edit-granted")||{}).value||"";
  var v=_plBalEditValidate(raw,shownGranted,shownRemain);
  if(!v.ok){showAlert(v.msg);return;}
  var shownConsumed=_plBalEditConsumedTotal(shownGranted,shownRemain);
  // 確認ダイアログを出す前にボタンを止める（連打で確認が積み重なるのを防ぐ）
  var confBtn=document.getElementById("btn-pl-bal-edit-save");
  if(confBtn)confBtn.disabled=true;
  showConfirm("付与日数を "+shownGranted+"日 → "+v.granted+"日に変更します。\n"
    +"残日数は "+shownRemain+"日 → "+v.remain+"日 になります（消化済み合計 "+shownConsumed+"日 は変更しません）。\n\nよろしいですか？",function(){
    _plBalEditCommit(balId,raw,{used:shownUsed,granted:shownGranted,remain:shownRemain});
  },function(){
    if(confBtn)confBtn.disabled=false; // キャンセルで元に戻す
  });
}
// 確認OK後の確定処理。対象1行を取り直して検証し直してから PATCH する。
function _plBalEditCommit(balId,raw,shown){
  if(viewerMode)return;                                    // 入口ごとにフェイルクローズ
  if(demoWriteBlocked())return;
  if(paidLeaveBalanceSaving)return;
  if(!balId||_plBalEditId!==balId)return;                  // 確認中にEscや×で閉じられていたら書き込まない
  var btn=document.getElementById("btn-pl-bal-edit-save");
  if(btn)btn.disabled=true;
  paidLeaveBalanceSaving=true; // polling による正本の上書き・再描画を止める
  var unlock=function(){paidLeaveBalanceSaving=false;if(btn)btn.disabled=false;};
  // 対象付与行だけを取得（全件取得しない）。取得失敗時は書き込まない。
  authFetch(FB_URL+"/tc5_paid_leave_balances/"+encodeURIComponent(balId)+".json")
    .then(function(r){if(!r.ok)throw new Error("fetch failed "+r.status);return r.json();})
    .then(function(row){
      if(!row||typeof row!=="object"){
        // 他の操作で削除済み。ローカル一覧からも取り除く（削除ボタンと同じ扱い）
        var iDel=(paidLeaveBalances||[]).findIndex(function(b){return normalizePaidLeaveBalance(b).id===balId;});
        if(iDel>=0)paidLeaveBalances.splice(iDel,1);
        unlock();
        closePaidLeaveBalEditModal();
        // 再描画はアラートのコールバックに任せない（背景クリックで閉じても一覧を更新する）
        _paidLeaveRenderGuard=false;render();_paidLeaveRenderGuard=true;
        showAlert("この付与行は他の操作で削除されていました。保存は行わず、一覧から取り除きました。");
        return;
      }
      var fresh=normalizePaidLeaveBalance(row);
      var used=Math.round((fresh.usedDays||0)*10)/10;
      var granted=Math.round((fresh.grantedDays||0)*10)/10;
      var remain=Math.round((fresh.remainDays!=null?fresh.remainDays:(granted-used))*10)/10;
      // 表示時と正本が食い違う＝別の操作が入った。書き込まずに最新値で再表示する。
      // remainDays は再計算の入力そのものなので、必ず突き合わせる（承認・引戻しで動く）。
      if(used!==shown.used||granted!==shown.granted||remain!==shown.remain){
        var i0=(paidLeaveBalances||[]).findIndex(function(b){return normalizePaidLeaveBalance(b).id===balId;});
        if(i0>=0)paidLeaveBalances[i0]=fresh; // ローカルを最新へ
        unlock();
        // 再描画・再表示はアラートのコールバックに任せない（背景クリックで閉じても最新値に揃える）
        _paidLeaveRenderGuard=false;render();_paidLeaveRenderGuard=true;
        openPaidLeaveBalEditModal(balId);
        showAlert("表示中に別の操作でこの付与行が更新されました（残 "+shown.remain+"日 → "+remain+"日 / 消化済み "+shown.used+"日 → "+used+"日 / 付与 "+shown.granted+"日 → "+granted+"日）。\n保存は行っていません。最新の値で開き直しました。");
        return;
      }
      var v2=_plBalEditValidate(raw,granted,remain);
      if(!v2.ok){unlock();showAlert(v2.msg);return;}
      var patch={
        grantedDays:v2.granted,
        remainDays:v2.remain,
        grantedDaysBefore:granted,                                 // 直前の値（追跡用。計算には使わない）
        remainDaysBefore:remain,                                   // 直前の残日数（追跡用。計算には使わない）
        grantedDaysUpdatedAt:new Date().toISOString(),
        grantedDaysUpdatedVia:(typeof uiMode!=="undefined"?String(uiMode||""):"") // UIモード（normal/adminDemo等）。個人を特定する操作者IDは本アプリに存在しない
      };
      // 初回訂正時だけ登録当初の値を残す（2回目以降の訂正で原本値が失われないようにする）
      if(fresh.grantedDaysOriginal==null)patch.grantedDaysOriginal=granted;
      return patchPaidLeaveBalance(balId,patch).then(function(ok){
        unlock();
        if(ok===false){showAlert("保存に失敗しました。通信状態を確認して再度お試しください。");return;}
        // ★保存はここで成立している。以降の後処理で例外が出ても「失敗」と誤表示しない
        try{
          var i2=(paidLeaveBalances||[]).findIndex(function(b){return normalizePaidLeaveBalance(b).id===balId;});
          if(i2>=0)paidLeaveBalances[i2]=Object.assign(fresh,patch); // 取得した正本＋今回の更新分
          closePaidLeaveBalEditModal();
          // 再描画はアラートのコールバックに任せない（背景クリックで閉じた場合に一覧が旧値のまま残る）
          paidLeaveBalanceDirty=false;_paidLeaveRenderGuard=false;render();_paidLeaveRenderGuard=true;
        }catch(e2){
          _paidLeaveRenderGuard=true;
          console.error("[PaidLeave] granted days edit post-save error",e2);
        }
        showAlert("付与日数を"+v2.granted+"日に修正しました（残 "+v2.remain+"日 / 消化済み合計 "+_plBalEditConsumedTotal(granted,remain)+"日）");
      });
    }).catch(function(e){
      unlock();
      console.error("[PaidLeave] granted days edit error",e);
      showAlert("保存に失敗しました。通信状態を確認して再度お試しください。");
    });
}

function openProxyLeaveModal(){
  var wrap=ensureProxyLeaveModal();
  // スタッフ選択肢を生成（在籍 / 社員番号あり / 社員番号重複なし / 氏名重複で解決可能 のみ）
  var empIdCount={};
  staffList.forEach(function(s){var e=(s.employeeId||"").trim();if(e)empIdCount[e]=(empIdCount[e]||0)+1;});
  var opts='<option value="">スタッフを選択</option>'
    +staffList.filter(function(s){
        if(s.status&&s.status!=="在籍")return false;
        var e=(s.employeeId||"").trim();
        if(!e)return false;              // 社員番号が空白
        if(empIdCount[e]>1)return false; // 社員番号が重複
        if(!resolveStaffId(s.name))return false; // 氏名重複等で一意解決不可
        return true;
      }).map(function(s){
        var nm=esc(s.name);
        return '<option value="'+nm+'">'+esc(s.name)+'（'+esc((s.employeeId||"").trim())+'）</option>';
      }).join("");
  var sel=document.getElementById("pl-proxy-staff");if(sel)sel.innerHTML=opts;
  var dt=document.getElementById("pl-proxy-date");if(dt)dt.value="";
  var nt=document.getElementById("pl-proxy-note");if(nt)nt.value="";
  var ap=document.getElementById("pl-proxy-approve");if(ap)ap.checked=false;
  _proxyLeaveModalOpen=true;
  wrap.style.display="flex";
}
function closeProxyLeaveModal(){
  var wrap=document.getElementById("pl-proxy-modal-wrap");
  if(wrap)wrap.style.display="none";
  _proxyLeaveModalOpen=false;
}
function submitProxyLeaveRequest(){
  if(demoWriteBlocked())return;
  if(_proxyLeaveSubmitting||paidLeaveBalanceSaving)return;
  var name=((document.getElementById("pl-proxy-staff")||{}).value||"").trim();
  var date=((document.getElementById("pl-proxy-date")||{}).value||"").trim();
  var note=((document.getElementById("pl-proxy-note")||{}).value||"").trim();
  var doApprove=!!((document.getElementById("pl-proxy-approve")||{}).checked);
  // ── バリデーション ──
  if(!name){showAlert("対象スタッフを選択してください");return;}
  if(!date){showAlert("有給日を入力してください");return;}
  // 社員番号解決（空白・重複・氏名重複は null → エラー。既存ヘルパを再利用）
  var staffId=resolveStaffId(name);
  if(!staffId){showAlert(resolveStaffIdError(name));return;}
  // 重複申請チェック（本人申請と同一ロジック）
  var dup=paidLeaveRequests.find(function(r){
    return r.staffName===name&&getLeaveDates(r).indexOf(date)>=0&&r.status!=="rejected";
  });
  if(dup){showAlert(date+" はすでに有給申請があります");return;}
  // 即承認時のみ残日数不足をブロック（既存承認と同じ getValidRemainDays を使用）
  if(doApprove){
    var remain=getValidRemainDays(staffId);
    if(remain<1){showAlert("有給残日数が不足しているため即承認できません（残"+remain+"日）。申請のみ登録するか、有給を付与してください。");return;}
  }
  // ── 申請データ生成（本人申請と同形 + 代理識別フィールド）──
  var reqId="pl"+Date.now();
  var nowIso=new Date().toISOString();
  var req={
    id:reqId,
    staffId:staffId,
    staffName:name,
    leaveDates:[date],
    date:date,
    status:"pending",
    createdAt:nowIso,
    approvedBy:"",
    approvedAt:"",
    note:note,
    requestedBy:"admin",
    requestSource:"admin_proxy",
    adminProxy:true
  };
  paidLeaveRequests.push(req);
  _proxyLeaveSubmitting=true;
  var saveBtn=document.getElementById("btn-pl-proxy-save");if(saveBtn)saveBtn.disabled=true;
  savePaidLeaveRequest(req).then(function(){
    _proxyLeaveSubmitting=false;
    if(saveBtn)saveBtn.disabled=false;
    closeProxyLeaveModal();
    if(doApprove){
      // 既存の承認経路（.btn-pl-approve ハンドラ → applyFifoConsumption）をそのまま再利用。
      // 残数チェック・FIFO消化・残日数更新・consumedSnapshot記録を重複実装しない。
      _paidLeaveRenderGuard=false;render();_paidLeaveRenderGuard=true;
      var btn=document.querySelector('.btn-pl-approve[data-plid="'+reqId+'"]');
      if(btn){btn.click();}
      else{showAlert("代理申請を登録しました（"+date+"）。一覧から承認してください。");}
    }else{
      showAlert("管理者代理で有給申請を登録しました（"+date+"）");
      _paidLeaveRenderGuard=false;render();_paidLeaveRenderGuard=true;
    }
  }).catch(function(e){
    _proxyLeaveSubmitting=false;
    if(saveBtn)saveBtn.disabled=false;
    // 失敗時はローカル配列から巻き戻す
    var idx=paidLeaveRequests.findIndex(function(r){return r.id===reqId;});
    if(idx>=0)paidLeaveRequests.splice(idx,1);
    console.error("[PaidLeave] proxy submit error",e);
    showAlert("代理申請の保存に失敗しました。通信状態を確認して再度お試しください。");
  });
}

// ===== 配信版の更新検知（開きっぱなしの古い画面を残さない）=====
// ★ このアプリは単一 index.html で、開いたままにすると修正後も古いJSが動き続ける。
//   2026-08 のサーバ側認証移行では、移行前の画面が公開領域の取得失敗を「未設定」と
//   誤判定し続け、「管理者PINが未設定です」を出したままになった（リロードすると直る）。
//   そこで配信中の index.html の版（ETag / Last-Modified）を監視し、変わっていたら
//   再読み込みを促す。★ 自動リロードはしない（打刻・入力中に画面を奪わない）。
var _appVersionTag="";        // 起動時に確認した配信版
var _appUpdateNotified=false; // バナーは1回だけ
var _appVersionLastCheck=0;
var APP_VERSION_CHECK_MS=30*60*1000; // 定期確認は30分間隔
var APP_VERSION_MIN_GAP_MS=5*60*1000; // タブ復帰が続いても5分に1回まで

function _fetchAppVersionTag(){
  // クエリ（?admin= 等）は付けない。パスだけを HEAD で確認する。
  return fetch(location.pathname,{method:"HEAD",cache:"no-store"})
    .then(function(r){
      if(!r.ok)return "";
      return r.headers.get("ETag")||r.headers.get("Last-Modified")||"";
    }).catch(function(){return "";});
}

// ★ 固定バナーは最下部のコンテンツを覆う。上部の mode-banner と同じく、
//   表示中は body に下余白を確保して最終行・最下部ボタンを操作可能に保つ。
var _appBannerPrevPad="";
function _syncAppBannerPadding(bar){
  document.body.style.paddingBottom=(bar.offsetHeight+8)+"px";
}
function _hideAppUpdateBanner(bar){
  if(bar&&bar.parentNode)bar.parentNode.removeChild(bar);
  document.body.style.paddingBottom=_appBannerPrevPad;
}

function _showAppUpdateBanner(){
  if(document.getElementById("app-update-banner"))return;
  var bar=document.createElement("div");
  bar.id="app-update-banner";
  // ★ z-index はモーダル（9999）より下に置く。バナーがモーダルの操作を隠してはならない。
  bar.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:9998;background:#1e40af;color:#fff;"
    +"padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:.85rem;box-shadow:0 -2px 8px rgba(0,0,0,.2);";
  var msg=document.createElement("span");
  msg.style.cssText="flex:1;line-height:1.4;";
  msg.textContent="新しいバージョンがあります。再読み込みしてください。";
  var reload=document.createElement("button");
  reload.textContent="再読み込み";
  reload.style.cssText="background:#fff;color:#1e40af;border:none;padding:7px 14px;border-radius:2px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;";
  reload.onclick=function(){location.reload();};
  var later=document.createElement("button");
  later.textContent="後で";
  later.style.cssText="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);padding:7px 12px;border-radius:2px;font-size:.85rem;cursor:pointer;font-family:inherit;";
  // ★ 「後で」は先送りであって無効化ではない。ここで通知済みのまま閉じると、
  //   まさに塞ぎたかった「古いJSのまま残るタブ」が無通知で生き残ってしまう。
  later.onclick=function(){
    _hideAppUpdateBanner(bar);
    _appUpdateNotified=false;               // 次の定期確認で再提示する
    _appVersionLastCheck=Date.now();        // 直後の再表示はしない（最短でも次の間隔後）
  };
  bar.appendChild(msg);bar.appendChild(reload);bar.appendChild(later);
  document.body.appendChild(bar);
  _appBannerPrevPad=document.body.style.paddingBottom;
  _syncAppBannerPadding(bar);
}
// 画面回転・幅変更でバナーが2行になると余白が不足するため、都度測り直す。
// ★ 登録はモジュールスコープで1回だけ（表示のたびに登録すると解除経路が無く積み上がる）。
//   要素は毎回引き直すので、閉じたあとの古い参照を掴むこともない。
window.addEventListener("resize",function(){
  var b=document.getElementById("app-update-banner");
  if(b)_syncAppBannerPadding(b);
});

function checkAppVersion(){
  if(_appUpdateNotified||!_appVersionTag)return;
  var now=Date.now();
  if(now-_appVersionLastCheck<APP_VERSION_MIN_GAP_MS)return;
  _appVersionLastCheck=now;
  _fetchAppVersionTag().then(function(tag){
    if(!tag||tag===_appVersionTag)return; // 取得失敗（空文字）は「更新なし」として扱う（誤検知させない）
    _appUpdateNotified=true;
    _showAppUpdateBanner();
  });
}

// ★ 起動時に電波が悪いと初回の版取得に失敗する。そこで諦めると、そのタブは
//   以後まったく更新に気づけない（＝再発防止が効かない端末が生まれる）。
//   有限回だけ再試行し、オンライン復帰でも1回試す。
var APP_VERSION_WATCH_MAX_TRIES=5;
var _appVersionWatchTries=0;
var _appVersionWatching=false;
function startAppVersionWatch(){
  if(location.protocol!=="http:"&&location.protocol!=="https:")return;
  if(_appVersionTag||_appVersionWatching)return; // 監視中／確立済みなら二重に張らない
  _appVersionWatching=true;
  _fetchAppVersionTag().then(function(tag){
    _appVersionWatching=false;
    if(!tag){
      // 版を取得できない（オフライン／ヘッダを返さない配信環境）→ 有限回だけ再試行
      if(_appVersionWatchTries<APP_VERSION_WATCH_MAX_TRIES){
        _appVersionWatchTries++;
        setTimeout(startAppVersionWatch,60000);
      }
      return;
    }
    _appVersionTag=tag;_appVersionLastCheck=Date.now();
    setInterval(checkAppVersion,APP_VERSION_CHECK_MS);
    document.addEventListener("visibilitychange",function(){
      if(document.visibilityState==="visible")checkAppVersion();
    });
  });
}
// オンライン復帰時: まだ監視を確立できていなければ、再試行の予算を戻してその場で試す。
// （予算を戻さないと、起動直後に数分オフラインだった端末が二度と監視を張れない）
window.addEventListener("online",function(){
  if(_appVersionTag)return;
  _appVersionWatchTries=0;
  startAppVersionWatch();
});

// まず即座にレンダリング（Firebaseを待たない）
render();

// その後Firebaseから個別パスで取得して再レンダリング
initFirebase();

// 配信版の監視を開始（起動処理を妨げない）
startAppVersionWatch();
</script>

  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/timecard/sw.js')
      .then(function(reg){ window._swRegistration=reg; })
      .catch(function(e){ console.warn('[SW] register failed',e); });
  });
}
</script>

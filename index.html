// ===== Firebase 起動時データ取得（個別パス・root bulk read 廃止 - Phase 2-A）=====
async function initFirebase() {
  try {
    // 認証トークンを1回取得してキャッシュ（Promise.all内の14並列fetchが個別にsignInして
    // Firebase匿名authレート制限に当たるのを防ぐ）
    await getAuthToken();

    // ── スタッフテスト画面の直接共有URL（?staffDemo=）──
    // 本番業務データは一切取得しない。表示条件に必要なスタッフ属性と拠点マスターのみ読む。
    if(staffDemoUrlUsed){
      // 端末のlocalStorageに残っている本番キャッシュをサンドボックスへ持ち込まない（トークンの正否に関わらず先に消す）
      records=[];approvals={};correctionRequests=[];
      paidLeaveRequests=[];paidLeaveBalances=[];
      mealsData={};mealConfData={};staffNotifications={};monthlyDaysImport={};reviewStatus={};
      staffPins={};
      var sdRec=isSafeTokenStr(staffDemoParam)?await fetchJson(FB_URL+"/staffDemoTokens/"+encodeURIComponent(staffDemoParam)+".json"):null;
      var sdToday=getTodayJSTStr();
      if(!sdRec||typeof sdRec!=="object"||sdRec.enabled===false){staffDemoInvalid=true;}
      else if(!sdRec.expiresAt||String(sdRec.expiresAt)<sdToday){staffDemoExpired=true;}
      else{
        // 表示条件に必要な最小限（スタッフ属性・拠点マスター）だけを取得する
        var sdRes=await Promise.all([
          fetchJson(FB_URL+"/tc5_staff.json"),
          fetchJson(FB_URL+"/master/locations.json")
        ]);
        if(sdRes[0]){staffList=Array.isArray(sdRes[0])?sdRes[0]:Object.values(sdRes[0]);}
        if(sdRes[1]){
          masterFacilities=Array.isArray(sdRes[1])?sdRes[1]:Object.values(sdRes[1]);
          VALID_TOKENS=buildValidTokens();
          masterLocs=masterFacilities.map(function(f){return f.name;});
        }
        screen="staffDemoPick";
      }
      staffDemoPending=false;
      firebaseReady=true;firebaseError=false;
      render();
      return; // listenFirebase() も起動しない
    }

    var results=await Promise.all([
      fetchJson(FB_URL+"/tc5_staff.json"),
      fetchJson(FB_URL+"/tc5_records.json"),
      fetchJson(FB_URL+"/tc5_approvals.json"),
      fetchJson(FB_URL+"/tc5_pins.json"),
      fetchJson(FB_URL+"/tc_master_depts.json"),
      fetchJson(FB_URL+"/master/locations.json"),
      fetchJson(FB_URL+"/config/adminPinHash.json"),
      fetchJson(FB_URL+"/config/adminPin.json"),
      fetchJson(FB_URL+"/config/adminTokenHash.json"),
      fetchJson(FB_URL+"/config/adminToken.json"),
      (viewerPending&&viewerParam)?fetchJson(FB_URL+"/viewerTokens/"+viewerParam+".json"):Promise.resolve(null),
      // デモトークンは「トークンをキーに単一ノードを引く」方式。デモURL以外では取得しない。
      (demoUrlUsed&&demoParam)?fetchJson(FB_URL+"/demoTokens/"+encodeURIComponent(demoParam)+".json"):Promise.resolve(null),
      fetchJson(FB_URL+"/tc5_paid_leave_requests.json"),
      fetchJson(FB_URL+"/tc5_paid_leave_balances.json"),
      fetchJson(FB_URL+"/tc5_monthly_days_import.json"),
      fetchJson(FB_URL+"/tc5_staff_notifications.json"),
      fetchJson(FB_URL+"/tc5_meals.json"),
      fetchJson(FB_URL+"/tc5_meal_confirmations.json"),
      fetchJson(FB_URL+"/tc5_monthly_review_status.json"),
    ]);
    var fbStaff=results[0],fbRecords=results[1],fbApprovals=results[2],fbPins=results[3];
    var fbDepts=results[4],fbLocations=results[5];
    var fbAdminPinHash=results[6],fbAdminPin=results[7];
    var fbAdminTokenHash=results[8],fbAdminToken=results[9];
    var fbViewerTokenData=results[10],fbDemoTokenRec=results[11];
    var fbPaidLeaveRequests=results[12],fbPaidLeaveBalances=results[13];
    var fbMonthlyImport=results[14];
    var fbStaffNotifications=results[15];
    var fbMeals=results[16];
    var fbMealConf=results[17];
    var fbReviewStatus=results[18];

    if(fbRecords){records=Array.isArray(fbRecords)?fbRecords:Object.values(fbRecords);localStorage.setItem("tc5_records",JSON.stringify(records));}
    if(fbStaff){staffList=Array.isArray(fbStaff)?fbStaff:Object.values(fbStaff);localStorage.setItem("tc5_staff",JSON.stringify(staffList));}
    if(fbApprovals){approvals=fbApprovals;localStorage.setItem("tc5_approvals",JSON.stringify(approvals));}
    if(fbPins){staffPins=fbPins;}
    if(fbDepts){masterDepts=Array.isArray(fbDepts)?fbDepts:Object.values(fbDepts);localStorage.setItem("tc_master_depts",JSON.stringify(masterDepts));}
    if(fbLocations){
      var locs=Array.isArray(fbLocations)?fbLocations:Object.values(fbLocations);
      masterFacilities=locs;
      localStorage.setItem("tc_master_facilities",JSON.stringify(masterFacilities));
      masterLocs=masterFacilities.map(function(f){return f.name;});
      VALID_TOKENS=buildValidTokens();
      tokenValid=isAllToken||Object.prototype.hasOwnProperty.call(VALID_TOKENS,effectiveToken);
      facilityName=VALID_TOKENS[effectiveToken]||"";
      if(urlToken&&tokenValid&&!isAllToken){localStorage.setItem("facilityToken",urlToken);}
    } else if(writePolicy==="full"){
      // 既定値の自動書き込みは通常モードのみ（デモ／テスト画面で起動直後に遮断通知が出るのを防ぐ）
      authFetch(FB_URL+"/master/locations.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(masterFacilities)}).catch(function(e){console.error("[initFirebase] master/locations save error:", e);});
    }
    // 管理者PIN: ハッシュ優先、旧平文フォールバック（文字列チェックでPermission deniedオブジェクトを除外）
    if(typeof fbAdminPinHash==="string"&&fbAdminPinHash){ADMIN_PIN_HASH=fbAdminPinHash;ADMIN_PIN="";}
    else if(typeof fbAdminPin==="string"&&fbAdminPin){ADMIN_PIN=fbAdminPin;}
    if(!ADMIN_PIN_HASH&&!ADMIN_PIN){console.warn("[initFirebase] admin PIN not loaded. hash=",(fbAdminPinHash?"(set)":"(none)"),"legacy=",(fbAdminPin?"(set)":"(none)"));}
    else{console.log("[initFirebase] admin PIN loaded OK (hash="+(!!ADMIN_PIN_HASH)+")");}
    // 管理者トークン: hashあればhash優先、なければ旧平文フォールバック
    if(fbAdminTokenHash){ADMIN_TOKEN_HASH=fbAdminTokenHash;ADMIN_TOKEN="";}
    else if(fbAdminToken){ADMIN_TOKEN=fbAdminToken;}
    // 月別出勤日数の過去取込データ（employeeIdキーのマップ）
    if(fbMonthlyImport&&typeof fbMonthlyImport==="object"){monthlyDaysImport=fbMonthlyImport;}
    // 賄い（まかない）取得記録（employeeIdキーのマップ）
    if(fbMeals&&typeof fbMeals==="object"){mealsData=fbMeals;}
    // 賄い月初確認（employeeId→{"YYYY-MM":エントリ}）
    if(fbMealConf&&typeof fbMealConf==="object"){mealConfData=fbMealConf;}
    // 月次精査完了フラグ（"YYYY-MM"→{reviewed,reviewedAt,reviewedBy}）
    if(fbReviewStatus&&typeof fbReviewStatus==="object"){reviewStatus=fbReviewStatus;}
    // スタッフ本人向け通知（社員番号→{notifId→通知}）
    if(fbStaffNotifications&&typeof fbStaffNotifications==="object"){staffNotifications=fbStaffNotifications;}
    // 有給申請
    if(fbPaidLeaveRequests){
      var _plArr=typeof fbPaidLeaveRequests==="object"&&!Array.isArray(fbPaidLeaveRequests)
        ?Object.values(fbPaidLeaveRequests):fbPaidLeaveRequests;
      paidLeaveRequests=(_plArr||[]).filter(Boolean);
    }
    // 有給残日数（正規化して読み込み）
    if(fbPaidLeaveBalances){
      var _plbArr=typeof fbPaidLeaveBalances==="object"&&!Array.isArray(fbPaidLeaveBalances)
        ?Object.values(fbPaidLeaveBalances):fbPaidLeaveBalances;
      paidLeaveBalances=(_plbArr||[]).filter(Boolean).map(function(b){return normalizePaidLeaveBalance(b);});
    }
    // 管理者URLトークン認証（hash比較優先、旧平文フォールバック）
    if(adminUrlUsed){
      var authOk=false;
      if(ADMIN_TOKEN_HASH){authOk=((await hashPin(adminParam||""))===ADMIN_TOKEN_HASH);}
      else if(ADMIN_TOKEN){authOk=(adminParam===ADMIN_TOKEN);}
      if(authOk){adminTokenValid=true;adminTokenInvalid=false;isAdminAuthenticated=true;screen="admin";adminTab="records";initFcmForAdmin();}
      else{adminTokenValid=false;adminTokenInvalid=true;}
    }
    // 閲覧専用トークン認証（viewerTokens/{token} 方式）
    if(viewerPending){
      var _vtd=fbViewerTokenData;
      var _todayIso=getTodayJSTStr(); // JST基準に統一
      if(!_vtd||!_vtd.enabled){viewerMode=false;viewerInvalid=true;}
      else if(_vtd.expiresAt&&String(_vtd.expiresAt)<_todayIso){viewerMode=false;viewerExpired=true;}
      else{viewerMode=true;viewerInvalid=false;}
      // デモ画面から発行された閲覧用URLは、発行元デモトークンが失効した時点で利用不可にする。
      // さらに、そのセッションは完全な読み取り専用にする（資料の論理削除など書き込みを一切許可しない）。
      if(viewerMode&&_vtd&&_vtd.issuedByDemoTokenId){
        if(!isSafeTokenStr(_vtd.issuedByDemoTokenId)){viewerMode=false;viewerInvalid=true;}
        else{
          var _srcDemo=await fetchJson(FB_URL+"/demoTokens/"+encodeURIComponent(_vtd.issuedByDemoTokenId)+".json");
          if(!_srcDemo||typeof _srcDemo!=="object"||_srcDemo.enabled===false){viewerMode=false;viewerInvalid=true;}
          else if(!_srcDemo.expiresAt||String(_srcDemo.expiresAt)<_todayIso){viewerMode=false;viewerExpired=true;}
        }
        if(viewerMode){
          viewerIsDemoIssued=true;
          // demoTokenKey は空のままなので許可リストは全件 false ＝ 完全な読み取り専用
          writePolicy="readonlyWithAllowList";
        }
      }
      if(viewerMode)uiMode="viewer";
      viewerPending=false;
    }
    // 管理者デモ認証（demoTokens/{token} 方式）。
    // isAdminAuthenticated は立てない（通常管理者と権限を同一にしない）／FCM登録も行わない。
    if(demoUrlUsed){
      var dToday=getTodayJSTStr(); // JST基準に統一（端末TZによる期限判定のズレを解消）
      var dRec=(fbDemoTokenRec&&typeof fbDemoTokenRec==="object")?fbDemoTokenRec:null;
      if(!isSafeTokenStr(demoParam)){demoInvalid=true;}
      else if(dRec){
        if(dRec.enabled===false){demoInvalid=true;}
        else if(!dRec.expiresAt||String(dRec.expiresAt)<dToday){demoExpired=true;}
        else{
          demoTokenRec=dRec;demoTokenKey=demoParam;demoTokenExpiresAt=String(dRec.expiresAt);
          demoMode=true;screen="admin";adminTab="records";
        }
      } else {
        // 移行期間フォールバック：旧 config/demoAccess（デモURLでアクセスされた場合のみ読む）
        var legacy=await fetchJson(FB_URL+"/config/demoAccess.json");
        if(legacy&&legacy.token&&demoParam===legacy.token){
          demoAccessConfig=legacy;
          // expireDate 欠落はフェイルクローズ（新方式と同じ規則）
          if(!legacy.expireDate||dToday.replace(/-/g,"")>String(legacy.expireDate)){demoExpired=true;}
          else{demoLegacyAuth=true;demoMode=true;screen="admin";adminTab="records";}
        } else {
          demoInvalid=true;
        }
      }
    }
    if(KANA_ROWS.concat(["すべて"]).indexOf(yomiTab)<0){yomiTab="すべて";}
    firebaseReady=true;
    firebaseError=false;
    listenFirebase();
    render();
  } catch(e) {
    console.error("FB init error:",e);
    firebaseReady=false;
    firebaseError=true;
    render();
  }
}

function openPaidLeaveGrantModal(idx,consumed){
  var g=_paidLeaveGrantsCache[idx];
  if(!g)return;
  _plGrantModalData={staffId:g.staffId,staffName:g.staffName,grantNum:g.grantNum,consumed:!!consumed};
  _plGrantModalOpen=true;
  var wrap=ensurePaidLeaveGrantModal(); // body直下に生成 or 再利用
  var titleEl=document.getElementById("pl-grant-modal-title");
  if(titleEl)titleEl.textContent=consumed?"有給付与登録（消化済み）":"有給付与登録";
  var infoEl=document.getElementById("pl-grant-modal-info");
  if(infoEl){
    infoEl.textContent='';
    var b=document.createElement('b');b.textContent=g.staffDisplayName;
    infoEl.appendChild(b);
    infoEl.appendChild(document.createTextNode('（社員番号：'+g.staffId+'）　第'+g.grantNum+'回'));
    // 出勤日数からの自動算出の根拠を表示（管理者が確認できるように）
    if(g.auto){
      var a=g.auto;
      var basis=document.createElement('div');
      basis.style.cssText='margin-top:5px;font-size:.72rem;color:#475569;';
      var detail=(a.autoGrantDays!=null)
        ?('判定期間 '+a.from+'〜'+a.to+' / 勤務 '+a.workDays+'日 → 年換算 '+a.annualDays+'日 → 週'+a.weeklyEquiv+'日相当 → 自動算出 '+a.autoGrantDays+'日')
        :('判定期間 '+a.from+'〜'+a.to+' / 勤務 '+a.workDays+'日 → 年換算 '+a.annualDays+'日 → '+a.note+'（手入力してください）');
      basis.textContent='自動算出：'+detail;
      infoEl.appendChild(basis);
      if(g.mismatch){
        var mm=document.createElement('div');
        mm.style.cssText='margin-top:3px;font-size:.72rem;color:#dc2626;font-weight:700;';
        mm.textContent='⚠ 要確認：手動の週所定労働日数では '+g.grantDays+'日 です（自動算出と相違）';
        infoEl.appendChild(mm);
      }
    }
  }
  var gdEl=document.getElementById("pl-grant-date");if(gdEl)gdEl.value=g.grantDate;
  var eaEl=document.getElementById("pl-grant-expires");if(eaEl)eaEl.value=g.expiresAt;
  // 付与日数の初期値：出勤日数からの自動算出を最優先。判定不可/要確認(47日以下)は空欄にして手入力を促す。
  // 自動算出が無い場合のみ手動週所定由来へフォールバック。weeklyWorkDaysは上書きしない（読み取りのみ）。
  var _autoDays;
  if(g.auto&&g.auto.autoGrantDays!=null){_autoDays=String(g.auto.autoGrantDays);}
  else if(g.auto&&(g.auto.dataShort||g.auto.weeklyEquiv==null)){_autoDays="";} // 判定不可/要確認 → 空欄
  else{_autoDays=(g.grantDays!=null)?String(g.grantDays):"";}
  var gDays=document.getElementById("pl-grant-days");if(gDays)gDays.value=_autoDays;
  var rDays=document.getElementById("pl-grant-remain");if(rDays){rDays.value=consumed?"":_autoDays;rDays.disabled=!!consumed;}
  var noteEl=document.getElementById("pl-grant-consumed-note");if(noteEl)noteEl.style.display=consumed?"block":"none";
  wrap.style.display="flex";
  var btn=document.getElementById("btn-pl-grant-save");
  if(btn){
    btn.onclick=function(){
      var sid=_plGrantModalData.staffId;
      var sname=_plGrantModalData.staffName;
      var gn=_plGrantModalData.grantNum;
      var cons=_plGrantModalData.consumed;
      var grantDateVal=(document.getElementById("pl-grant-date")||{}).value||"";
      var expiresAtVal=(document.getElementById("pl-grant-expires")||{}).value||"";
      var grantedDaysRaw=(document.getElementById("pl-grant-days")||{}).value||"";
      var remainDaysRaw=cons?"0":((document.getElementById("pl-grant-remain")||{}).value||"");
      if(!grantDateVal||!expiresAtVal){showAlert("付与日・失効予定日を入力してください");return;}
      var grantedDaysVal=parseFloat(grantedDaysRaw);
      var remainDaysVal=cons?0:parseFloat(remainDaysRaw);
      if(isNaN(grantedDaysVal)||grantedDaysVal<0){showAlert("付与日数を正しく入力してください（0以上の数値）");return;}
      if(!cons&&(isNaN(remainDaysVal)||remainDaysVal<0)){showAlert("残日数を正しく入力してください（0以上の数値）");return;}
      if(!cons&&remainDaysVal>grantedDaysVal){showAlert("残日数は付与日数以下にしてください");return;}
      var usedDays=cons?grantedDaysVal:0;
      var dup=paidLeaveBalances.some(function(b){
        var nb=normalizePaidLeaveBalance(b);return nb.staffId===sid&&nb.grantDate===grantDateVal;
      });
      if(dup){showAlert("同じ社員番号・付与日の有給残がすでに登録されています");return;}
      var confirmMsg=(cons?"消化済みとして":"通常付与として")+"登録します。\n\n"
        +"社員番号："+sid+"\n氏名："+sname+"\n付与回：第"+gn+"回\n"
        +"付与日："+grantDateVal+"\n付与日数："+grantedDaysVal+"日\n"
        +"残日数："+remainDaysVal+"日\n\n保存しますか？";
      if(!confirm(confirmMsg))return;
      savePaidLeaveGrantRecord(sid,sname,gn,grantDateVal,expiresAtVal,grantedDaysVal,usedDays,remainDaysVal);
    };
  }
}
function closePaidLeaveGrantModal(){
  var wrap=document.getElementById("pl-grant-modal-wrap");
  if(wrap)wrap.style.display="none";
  _plGrantModalData={};
  _plGrantModalOpen=false;
}
function savePaidLeaveGrantRecord(staffId,staffName,grantNum,grantDate,expiresAt,grantedDays,usedDays,remainDays){
  if(demoWriteBlocked())return Promise.resolve(false);
  var dup=paidLeaveBalances.some(function(b){
    var nb=normalizePaidLeaveBalance(b);return nb.staffId===staffId&&nb.grantDate===grantDate;
  });
  if(dup){showAlert("二重登録を防止しました（同じ社員番号・付与日がすでに存在します）");return;}
  var rec={
    id:"plb_"+staffId+"_"+grantDate+"_"+Date.now(),
    staffId:staffId,staffName:staffName,grantNum:grantNum,
    grantDate:grantDate,expiresAt:expiresAt,
    grantedDays:grantedDays,usedDays:usedDays,remainDays:remainDays,
    createdAt:new Date().toISOString()
  };
  paidLeaveBalances.push(rec);
  savePaidLeaveBalance(rec).then(function(ok){
    if(!ok){showAlert("保存に失敗しました。通信状態を確認して再度実行してください。");return;}
    createPaidLeaveGrantNotification(rec); // 付与保存成功後のみ。staffId未設定skip・失敗は握りつぶし
  });
  closePaidLeaveGrantModal();
  render();
}

// ===== 有給「管理者代理申請」モーダル（body直下固定 — render()再描画から完全分離） =====
// 既存の有給申請・承認ロジックは一切変更せず、申請データ生成と既存承認経路の再利用のみで実現する。
var _proxyLeaveModalOpen=false;
var _proxyLeaveSubmitting=false;
function ensureProxyLeaveModal(){
  var wrap=document.getElementById("pl-proxy-modal-wrap");
  if(wrap)return wrap; // 既存なら再利用
  wrap=document.createElement("div");
  wrap.id="pl-proxy-modal-wrap";
  wrap.style.cssText="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px 80px;";
  wrap.innerHTML=''
    +'<div style="background:#fff;width:100%;max-width:460px;border-radius:2px;border:1px solid #adb5bd;">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #e4e8ed;">'
    +'<span style="font-size:14px;font-weight:700;color:#1a2332;">有給代理申請（管理者）</span>'
    +'<button onclick="closeProxyLeaveModal()" style="background:#dde1e7;border:1px solid #adb5bd;width:28px;height:28px;border-radius:2px;font-size:14px;color:#475569;cursor:pointer;font-family:inherit;line-height:1;">×</button>'
    +'</div>'
    +'<div style="padding:14px 18px;display:grid;grid-template-columns:1fr;gap:12px;">'
    +'<div style="background:#f1f5f9;border-radius:4px;padding:8px 10px;font-size:.74rem;color:#475569;">管理者がスタッフに代わって有給を申請します。1日単位（全休）のみ対応。</div>'
    +'<div><label style="display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:3px;">対象スタッフ</label>'
    +'<select id="pl-proxy-staff" style="width:100%;font-size:13px;padding:7px 8px;border:1px solid #adb5bd;border-radius:2px;background:#fff;font-family:inherit;outline:none;box-sizing:border-box;"></select>'
    +'<div style="font-size:.66rem;color:#8496a7;margin-top:3px;">※社員番号が未設定・重複しているスタッフは選択できません</div></div>'
    +'<div><label style="display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:3px;">有給日</label>'
    +'<input type="date" id="pl-proxy-date" style="width:100%;font-size:13px;padding:7px 8px;border:1px solid #adb5bd;border-radius:2px;background:#fff;font-family:monospace;outline:none;box-sizing:border-box;"></div>'
    +'<div><label style="display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:3px;">理由・メモ（任意）</label>'
    +'<textarea id="pl-proxy-note" rows="2" style="width:100%;font-size:13px;padding:7px 8px;border:1px solid #adb5bd;border-radius:2px;background:#fff;font-family:inherit;outline:none;box-sizing:border-box;resize:vertical;" placeholder="例：本人から電話連絡あり"></textarea></div>'
    +'<label style="display:flex;align-items:center;gap:8px;background:#fef9c3;border:1px solid #fde047;border-radius:4px;padding:9px 11px;font-size:.8rem;color:#713f12;cursor:pointer;">'
    +'<input type="checkbox" id="pl-proxy-approve" style="width:16px;height:16px;cursor:pointer;">申請と同時に承認する（残日数を即時消化）</label>'
    +'</div>'
    +'<div style="display:flex;gap:8px;padding:12px 18px;border-top:1px solid #f3f4f6;">'
    +'<button id="btn-pl-proxy-save" onclick="submitProxyLeaveRequest()" style="flex:1;background:#1e40af;color:#fff;border:none;padding:10px;border-radius:2px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">申請する</button>'
    +'<button onclick="closeProxyLeaveModal()" style="flex:1;background:#dde1e7;color:#475569;border:1px solid #adb5bd;padding:10px;border-radius:2px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">キャンセル</button>'
    +'</div></div>';
  document.body.appendChild(wrap);
  return wrap;
}
function openProxyLeaveModal(){
  var wrap=ensureProxyLeaveModal();
  // スタッフ選択肢を生成（在籍 / 社員番号あり / 社員番号重複なし / 氏名重複で解決可能 のみ）
  var empIdCount={};
  staffList.forEach(function(s){var e=(s.employeeId||"").trim();if(e)empIdCount[e]=(empIdCount[e]||0)+1;});
  var opts='<option value="">スタッフを選択</option>'
    +staffList.filter(function(s){
        if(s.status&&s.status!=="在籍")return false;
        var e=(s.employeeId||"").trim();
        if(!e)return false;              // 社員番号が空白
        if(empIdCount[e]>1)return false; // 社員番号が重複
        if(!resolveStaffId(s.name))return false; // 氏名重複等で一意解決不可
        return true;
      }).map(function(s){
        var nm=String(s.name).replace(/"/g,"&quot;");
        return '<option value="'+nm+'">'+s.name+'（'+(s.employeeId||"").trim()+'）</option>';
      }).join("");
  var sel=document.getElementById("pl-proxy-staff");if(sel)sel.innerHTML=opts;
  var dt=document.getElementById("pl-proxy-date");if(dt)dt.value="";
  var nt=document.getElementById("pl-proxy-note");if(nt)nt.value="";
  var ap=document.getElementById("pl-proxy-approve");if(ap)ap.checked=false;
  _proxyLeaveModalOpen=true;
  wrap.style.display="flex";
}
function closeProxyLeaveModal(){
  var wrap=document.getElementById("pl-proxy-modal-wrap");
  if(wrap)wrap.style.display="none";
  _proxyLeaveModalOpen=false;
}
function submitProxyLeaveRequest(){
  if(demoWriteBlocked())return;
  if(_proxyLeaveSubmitting||paidLeaveBalanceSaving)return;
  var name=((document.getElementById("pl-proxy-staff")||{}).value||"").trim();
  var date=((document.getElementById("pl-proxy-date")||{}).value||"").trim();
  var note=((document.getElementById("pl-proxy-note")||{}).value||"").trim();
  var doApprove=!!((document.getElementById("pl-proxy-approve")||{}).checked);
  // ── バリデーション ──
  if(!name){showAlert("対象スタッフを選択してください");return;}
  if(!date){showAlert("有給日を入力してください");return;}
  // 社員番号解決（空白・重複・氏名重複は null → エラー。既存ヘルパを再利用）
  var staffId=resolveStaffId(name);
  if(!staffId){showAlert(resolveStaffIdError(name));return;}
  // 重複申請チェック（本人申請と同一ロジック）
  var dup=paidLeaveRequests.find(function(r){
    return r.staffName===name&&getLeaveDates(r).indexOf(date)>=0&&r.status!=="rejected";
  });
  if(dup){showAlert(date+" はすでに有給申請があります");return;}
  // 即承認時のみ残日数不足をブロック（既存承認と同じ getValidRemainDays を使用）
  if(doApprove){
    var remain=getValidRemainDays(staffId);
    if(remain<1){showAlert("有給残日数が不足しているため即承認できません（残"+remain+"日）。申請のみ登録するか、有給を付与してください。");return;}
  }
  // ── 申請データ生成（本人申請と同形 + 代理識別フィールド）──
  var reqId="pl"+Date.now();
  var nowIso=new Date().toISOString();
  var req={
    id:reqId,
    staffId:staffId,
    staffName:name,
    leaveDates:[date],
    date:date,
    status:"pending",
    createdAt:nowIso,
    approvedBy:"",
    approvedAt:"",
    note:note,
    requestedBy:"admin",
    requestSource:"admin_proxy",
    adminProxy:true
  };
  paidLeaveRequests.push(req);
  _proxyLeaveSubmitting=true;
  var saveBtn=document.getElementById("btn-pl-proxy-save");if(saveBtn)saveBtn.disabled=true;
  savePaidLeaveRequest(req).then(function(){
    _proxyLeaveSubmitting=false;
    if(saveBtn)saveBtn.disabled=false;
    closeProxyLeaveModal();
    if(doApprove){
      // 既存の承認経路（.btn-pl-approve ハンドラ → applyFifoConsumption）をそのまま再利用。
      // 残数チェック・FIFO消化・残日数更新・consumedSnapshot記録を重複実装しない。
      _paidLeaveRenderGuard=false;render();_paidLeaveRenderGuard=true;
      var btn=document.querySelector('.btn-pl-approve[data-plid="'+reqId+'"]');
      if(btn){btn.click();}
      else{showAlert("代理申請を登録しました（"+date+"）。一覧から承認してください。");}
    }else{
      showAlert("管理者代理で有給申請を登録しました（"+date+"）");
      _paidLeaveRenderGuard=false;render();_paidLeaveRenderGuard=true;
    }
  }).catch(function(e){
    _proxyLeaveSubmitting=false;
    if(saveBtn)saveBtn.disabled=false;
    // 失敗時はローカル配列から巻き戻す
    var idx=paidLeaveRequests.findIndex(function(r){return r.id===reqId;});
    if(idx>=0)paidLeaveRequests.splice(idx,1);
    console.error("[PaidLeave] proxy submit error",e);
    showAlert("代理申請の保存に失敗しました。通信状態を確認して再度お試しください。");
  });
}

// 有給付与登録モーダル・代理申請モーダル: Escキーで閉じる（body直下固定なので常時有効）
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape")return;
  if(_plGrantModalOpen){closePaidLeaveGrantModal();}
  if(_proxyLeaveModalOpen){closeProxyLeaveModal();}
});

// 管理者ログイン(PIN)画面のみ: 物理キーボード入力に対応（画面ボタンと併用。pinTap/pinOkを再利用）。
// screen==="pin" の時だけ有効＝スタッフPIN(screen==="staffPin")や他画面の入力欄には副作用なし。
document.addEventListener("keydown",function(e){
  if(screen!=="pin")return;
  if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return; // IME変換中・ショートカット操作は妨げない
  var k=e.key;
  if(k>="0"&&k<="9"){e.preventDefault();pinTap(parseInt(k,10));}        // 数字キー（テンキー含む）→入力
  else if(k==="Backspace"){e.preventDefault();pinTap("C");}             // 1文字削除
  else if(k==="Enter"){e.preventDefault();pinOk();}                     // ログイン実行
  else if(k==="Escape"){e.preventDefault();pinInput="";pinError=false;render();} // 入力クリア
});

// まず即座にレンダリング（Firebaseを待たない）
render();

// その後Firebaseから個別パスで取得して再レンダリング
initFirebase();
</script>
